Screens:
  Profile:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - con_shell_profile:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cpt_header_profile:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - con_body_profile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - conProfileCol:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0,0,0,0)
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Min(Parent.Width, 640)
                      Children:
                        - conProfileIdentity:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =20
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =120
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =24
                              RadiusBottomLeft: =2
                              RadiusBottomRight: =2
                              RadiusTopLeft: =2
                              RadiusTopRight: =2
                            Children:
                              - conProfileAvatarSlot:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =64
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - con_ProfileAvatarCircle:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =ColorValue(AppTheme.Primary)
                                          FillPortions: =0
                                          Height: =64
                                          RadiusBottomLeft: =32
                                          RadiusBottomRight: =32
                                          RadiusTopLeft: =32
                                          RadiusTopRight: =32
                                          Width: =64
                                        Children:
                                          - lbl_ProfileAvatarInitials:
                                              Control: Label
                                              Properties:
                                                Align: =Align.Center
                                                Color: =AppTheme.HeaderNavItemText
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Semibold
                                                Height: =64
                                                Size: =20
                                                Text: =gblUserInitials
                                                Width: =64
                                                Wrap: =false
                                    - htxProfileIdentity:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          FillPortions: =1
                                          HtmlText: |-
                                            =/* Old layout was two FillPortions:1 labels side by side in the
                                               horizontal avatar slot - the flex row reproduces that split. */
                                            "<div style=""display: flex; align-items: center;"">" &
                                            "<span style=""flex: 1; " & CarbonHtmlType.Heading03 & " color: " & AppThemeHex.TextPrimary & ";"">" &
                                            fnHtmlEscape(User().FullName) &
                                            "</span>" &
                                            "<span style=""flex: 1; " & CarbonHtmlType.Label01 & " color: " & AppThemeHex.TextMuted & ";"">" &
                                            fnHtmlEscape(User().Email) &
                                            "</span>" &
                                            "</div>"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                        - conProfileNotifications:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =24
                              RadiusBottomLeft: =2
                              RadiusBottomRight: =2
                              RadiusTopLeft: =2
                              RadiusTopRight: =2
                            Children:
                              - htxNotifTitle:
                                  Control: HtmlViewer
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: =CarbonText(CarbonHtmlType.Heading02, "Notifications")
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                              - conSetRow_NotifyConfirm:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblSetNotifyConfirm:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          DisplayMode: =DisplayMode.Disabled
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Booking confirmation email"
                                          Wrap: =false
                                    - tglSetNotifyConfirm:
                                        Control: Toggle
                                        Properties:
                                          Checked: =gblUserSettings.NotifyConfirm
                                          Label: =
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnCheck: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {NotifyConfirm: true}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                                          OnUncheck: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {NotifyConfirm: false}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                              - conSetRow_NotifyCancel:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblSetNotifyCancel:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          DisplayMode: =DisplayMode.Disabled
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Cancellation notice"
                                          Wrap: =false
                                    - tglSetNotifyCancel:
                                        Control: Toggle
                                        Properties:
                                          Checked: =gblUserSettings.NotifyCancel
                                          Label: =
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnCheck: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {NotifyCancel: true}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                                          OnUncheck: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {NotifyCancel: false}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                              - conSetRow_NotifyReminder:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblSetNotifyReminder:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          DisplayMode: =DisplayMode.Disabled
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Reminder before a booking"
                                          Wrap: =false
                                    - tglSetNotifyReminder:
                                        Control: Toggle
                                        Properties:
                                          Checked: =gblUserSettings.NotifyReminder
                                          Label: =
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnCheck: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {NotifyReminder: true}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                                          OnUncheck: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {NotifyReminder: false}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                              - conSetRow_ReminderMins:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =tglSetNotifyReminder.Checked
                                  Children:
                                    - lblSetReminderMins:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextMuted
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Minutes before"
                                          Wrap: =false
                                    - drpReminderMinutes:
                                        Control: Classic/DropDown
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =0
                                          ChevronBackground: =AppTheme.HeaderBackground
                                          ChevronFill: =AppTheme.HeaderAccent
                                          Color: =AppTheme.SideNavText
                                          Default: =gblUserSettings.ReminderMinutes
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Items: =[5, 10, 15, 30, 60]
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {ReminderMinutes: Value(Self.Selected.Value)}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                                          Size: =11
                                          Width: =96
                              - pfConRowInvite:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - pfLblInvite:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Attach a calendar invite to my confirmations"
                                          Wrap: =false
                                    - pfTglInvite:
                                        Control: Toggle
                                        Properties:
                                          Checked: =gblUserSettings.CalendarInvite
                                          Label: =
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnCheck: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {CalendarInvite: true}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                                          OnUncheck: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {CalendarInvite: false}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                        - pfConBooking:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =24
                              RadiusBottomLeft: =2
                              RadiusBottomRight: =2
                              RadiusTopLeft: =2
                              RadiusTopRight: =2
                            Children:
                              - pfLblBooking:
                                  Control: HtmlViewer
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =CarbonText(CarbonHtmlType.Heading02, "Booking") &
                                      CarbonTextColored(CarbonHtmlType.Label01, "Where the booking wizard starts, and what it fills in for you.", AppThemeHex.TextMuted)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                              - pfLblRouteCaption:
                                  Control: Label
                                  Properties:
                                    Color: =AppTheme.TextPrimary
                                    DisplayMode: =DisplayMode.Disabled
                                    Font: ="IBM Plex Sans"
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: ="Default route"
                                    Wrap: =false
                              - pfConRouteSegment:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =36
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - pfBtnRouteRoom:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: |-
                                            =If(
                                                DefaultBookRoute = "room",
                                                ColorValue(AppTheme.PrimaryText),
                                                AppTheme.TextPrimary
                                            )
                                          Fill: |-
                                            =If(
                                                DefaultBookRoute = "room",
                                                ColorValue(AppTheme.ButtonPrimary),
                                                AppTheme.layer01Bg
                                            )
                                          FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {BookingRoute: {Value: "room"}}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID));
                                            Set(gblBookRoute, "room")
                                          RadiusBottomLeft: =2
                                          RadiusBottomRight: =2
                                          RadiusTopLeft: =2
                                          RadiusTopRight: =2
                                          Size: =11
                                          Text: ="Room first"
                                          Width: =140
                                    - pfBtnRouteTime:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: |-
                                            =If(
                                                DefaultBookRoute = "time",
                                                ColorValue(AppTheme.PrimaryText),
                                                AppTheme.TextPrimary
                                            )
                                          Fill: |-
                                            =If(
                                                DefaultBookRoute = "time",
                                                ColorValue(AppTheme.ButtonPrimary),
                                                AppTheme.layer01Bg
                                            )
                                          FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {BookingRoute: {Value: "time"}}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID));
                                            Set(gblBookRoute, "time")
                                          RadiusBottomLeft: =2
                                          RadiusBottomRight: =2
                                          RadiusTopLeft: =2
                                          RadiusTopRight: =2
                                          Size: =11
                                          Text: ="Time first"
                                          Width: =140
                              - pfConRowDuration:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - pfLblDefaultDuration:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          DisplayMode: =DisplayMode.Disabled
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Default length (minutes)"
                                          Wrap: =false
                                    - pfDrpDefaultDuration:
                                        Control: Classic/DropDown
                                        Properties:
                                          AccessibleLabel: ="Default booking length in minutes"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: =Text(WizardDefaultDurationMin, "[$-en-US]0")
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Items: =["15","30","45","60","90","120"]
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {DefaultDurationMin: Value(Self.Selected.Value)}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                                          Size: =11
                                          Width: =140
                              - pfConRowStartHour:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - pfLblDefaultStartHour:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          DisplayMode: =DisplayMode.Disabled
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Earliest start hour"
                                          Wrap: =false
                                    - pfDrpDefaultStartHour:
                                        Control: Classic/DropDown
                                        Properties:
                                          AccessibleLabel: ="Default earliest start hour"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: =Text(WizardDefaultStartHour, "[$-en-US]0")
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Items: |-
                                            =ForAll(
                                                Sequence(DayEndHour - DayStartHour, DayStartHour) As _h,
                                                {Value: Text(_h.Value, "[$-en-US]0")}
                                            )
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =IfError(
                                                Patch(Book_UserSettings, gblUserSettings, {DefaultStartHour: Value(Self.Selected.Value)}),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                                          Size: =11
                                          Width: =140
                              - pfConRowDefaultRoom:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - pfLblDefaultRoom:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          DisplayMode: =DisplayMode.Disabled
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Default room"
                                          Wrap: =false
                                    - pfDrpDefaultRoom:
                                        Control: Classic/DropDown
                                        Properties:
                                          AccessibleLabel: ="Default room"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: =LookUp(colRooms, ID = WizardDefaultRoomId).Title
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Items: |-
                                            =ForAll(Sort(colRooms, Title) As _room, {Value: _room.Title})
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =IfError(
                                                Patch(
                                                    Book_UserSettings,
