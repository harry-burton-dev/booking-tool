Screens:
  AdminSettings:
    Properties:
      Fill: =AppTheme.Background
      LoadingSpinnerColor: =ColorValue(AppTheme.Primary)
      OnVisible: |-
        =/* Navigate() is illegal in OnVisible - non-admins are gated by asConPage.Visible
           plus the IsAdmin-hidden Settings tab on Admin instead. */
        IfError(
            ClearCollect(colAppSettings, Book_AppSettings),
            Notify("Couldn't refresh settings — showing the last snapshot", NotificationType.Warning)
        );
        /* Re-seed every input from the freshly pulled settings on each entry. */
        UpdateContext({asWeekend: WeekendPolicy});
        /* T-11: the migration dry run never survives a screen entry - re-scan is mandatory */
        UpdateContext({asMigScanned: false});
        UpdateContext({asMigConfirm: false});
        Clear(colLegacyPlan);
        Clear(colLegacyRows);
        Reset(asInpSiteName);
        Reset(asDrpDayStart);
        Reset(asDrpDayEnd);
        Reset(asDrpSlot);
        Reset(asDteWhatsNew);
        Reset(asInpWhatsNewText);
        Reset(adSetInpAdminEmail)
    Children:
      - asConShell:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - asCptHeader:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - asConBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - asHtxNoAccess:
                      Control: HtmlViewer
                      Properties:
                        AutoHeight: =true
                        DisplayMode: =DisplayMode.View
                        HtmlText: =CarbonTextSecondary(CarbonHtmlType.Body01, "You need administrator access to view this page.")
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Visible: =!IsAdmin
                        Width: =Parent.Width - 64
                  - asConPage:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =IsAdmin
                        Width: =Parent.Width
                      Children:
                        - asConPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - asConTitleStack:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - asConBreadcrumb:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =16
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - asHtxBreadcrumb:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                DisplayMode: =DisplayMode.View
                                                Height: =16
                                                HtmlText: |-
                                                  ="<div style=""display: flex; align-items: center; gap: 4px;"">" &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Home", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "/", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Admin", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "/", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Settings", AppThemeHex.TextSecondary) &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Width: =240
                                    - asHtxPageTitle:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: =CarbonText(CarbonHtmlType.Heading04, "Settings")
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                              - asBtnBack:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Fill: =Color.Transparent
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =AppTheme.TextPrimary
                                    HoverFill: =AppTheme.Border
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Navigate(Admin, ScreenTransition.None)
                                    PressedColor: =AppTheme.TextPrimary
                                    PressedFill: =AppTheme.Border
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =12
                                    Text: ="Back to Admin"
                                    Width: =140
                        - asConForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - asHtxFormHead:
                                  Control: HtmlViewer
                                  Properties:
                                    DisplayMode: =DisplayMode.View
                                    Height: =24
                                    HtmlText: =CarbonText(CarbonHtmlType.Heading02, "App settings")
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Width: =Parent.Width
                              - asHtxFormIntro:
                                  Control: HtmlViewer
                                  Properties:
                                    DisplayMode: =DisplayMode.View
                                    Height: =20
                                    HtmlText: =CarbonTextSecondary(CarbonHtmlType.BodyCompact01, "These apply to everyone. Changes take effect the next time a screen is opened.")
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Width: =Parent.Width
                              - asConRowSite:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - asLblSiteName:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="Site name"
                                          Width: =180
                                          Wrap: =false
                                    - asInpSiteName:
                                        Control: Classic/TextInput
                                        Properties:
                                          AccessibleLabel: ="Site name shown in the header"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =AppTheme.TextPrimary
                                          Default: =SiteName
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          HintText: ="MOC"
                                          HoverBorderColor: =AppTheme.TextSecondary
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Width: =240
                              - asConRowHours:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - asLblHours:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="Opening hours"
                                          Width: =180
                                          Wrap: =false
                                    - asDrpDayStart:
                                        Control: Classic/DropDown
                                        Properties:
                                          AccessibleLabel: ="First bookable hour"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: =Text(DayStartHour)
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          Items: |-
                                            =ForAll(Sequence(17, 6), {Value: Text(Value)})
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Width: =90
                                    - asLblHoursTo:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextSecondary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="to"
                                          Width: =24
                                          Wrap: =false
                                    - asDrpDayEnd:
                                        Control: Classic/DropDown
                                        Properties:
                                          AccessibleLabel: ="Last bookable hour"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: =Text(DayEndHour)
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          Items: |-
                                            =ForAll(Sequence(17, 6), {Value: Text(Value)})
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Width: =90
                                    - asLblHoursError:
                                        Control: Label
                                        Properties:
                                          Color: =ColorValue(AppTheme.ButtonDangerPrimary)
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="Closing hour must be after opening hour."
                                          Visible: =Value(asDrpDayEnd.Selected.Value) <= Value(asDrpDayStart.Selected.Value)
                                          Width: =280
                                          Wrap: =false
                              - asConRowSlot:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - asLblSlot:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="Slot size (minutes)"
                                          Width: =180
                                          Wrap: =false
                                    - asDrpSlot:
                                        Control: Classic/DropDown
                                        Properties:
                                          AccessibleLabel: ="Slot size in minutes"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: =Text(SlotMinutes)
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          Items: |-
                                            =Table({Value: "5"}, {Value: "10"}, {Value: "15"}, {Value: "30"})
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Width: =90
                              - asConRowWeekend:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - asLblWeekend:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="Weekend bookings"
                                          Width: =180
                                          Wrap: =false
                                    - asBtnWeekendAllow:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =If(asWeekend = "allow", ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                          Fill: =If(asWeekend = "allow", ColorValue(AppTheme.ButtonPrimary), Color.Transparent)
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          HoverColor: =AppTheme.TextPrimary
                                          HoverFill: =AppTheme.Border
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({asWeekend: "allow"})
                                          PressedColor: =AppTheme.TextPrimary
                                          PressedFill: =AppTheme.Border
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =11
                                          Text: ="Allow"
                                          Width: =110
                                    - asBtnWeekendBlock:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =If(asWeekend <> "allow", ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                          Fill: =If(asWeekend <> "allow", ColorValue(AppTheme.ButtonPrimary), Color.Transparent)
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          HoverColor: =AppTheme.TextPrimary
                                          HoverFill: =AppTheme.Border
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({asWeekend: "block"})
                                          PressedColor: =AppTheme.TextPrimary
                                          PressedFill: =AppTheme.Border
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =11
                                          Text: ="Block"
                                          Width: =110
                              - asConRowWhatsNewDate:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - asLblWhatsNewDate:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="What's new date"
                                          Width: =180
                                          Wrap: =false
                                    - asDteWhatsNew:
                                        Control: Classic/DatePicker
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =AppTheme.TextPrimary
                                          DefaultDate: |-
                                            =/* Stored as yyyy-mm-dd text; rebuilt numerically so no locale parse is involved. */
                                            If(
                                                Len(WhatsNewDate) = 10,
                                                Date(Value(Left(WhatsNewDate, 4)), Value(Mid(WhatsNewDate, 6, 2)), Value(Mid(WhatsNewDate, 9, 2))),
                                                Today()
                                            )
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          IconBackground: =AppTheme.HeaderBackground
                                          IconFill: =AppTheme.HeaderAccent
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Width: =160
                                    - asLblWhatsNewHint:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextMuted
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="Changing this shows the dialog once to every user."
                                          Width: =320
                                          Wrap: =false
                              - asLblWhatsNewText:
                                  Control: Label
                                  Properties:
                                    Color: =AppTheme.TextPrimary
                                    Font: ="IBM Plex Sans"
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: ="What's new text (one bullet per line)"
                                    Width: =Parent.Width
                                    Wrap: =false
                              - asInpWhatsNewText:
                                  Control: Classic/TextInput
                                  Properties:
                                    AccessibleLabel: ="What's new bullets, one per line"
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Default: =Coalesce(SettingText("WhatsNewText"), "")
                                    Fill: =AppTheme.layer01Bg
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =140
                                    HintText: ="One bullet per line"
                                    HoverBorderColor: =AppTheme.TextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Mode: =TextMode.MultiLine
                                    Size: =11
                                    Width: =Parent.Width
                              - asBtnSave:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    DisabledColor: =AppTheme.TextMuted
                                    DisabledFill: =AppTheme.SurfaceAlt
                                    DisplayMode: =If(Value(asDrpDayEnd.Selected.Value) > Value(asDrpDayStart.Selected.Value), DisplayMode.Edit, DisplayMode.Disabled)
                                    Fill: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    Height: =48
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =/* One upsert per key: match on Title (a delegable literal predicate),
                                         create the row when the key has never been written. */
                                      IfError(
                                          With({_r: LookUp(Book_AppSettings, Title = "SiteName")},
                                              If(IsBlank(_r),
                                                  Patch(Book_AppSettings, Defaults(Book_AppSettings), {Title: "SiteName", Value: Trim(asInpSiteName.Text)}),
                                                  Patch(Book_AppSettings, _r, {Value: Trim(asInpSiteName.Text)})));
                                          With({_r: LookUp(Book_AppSettings, Title = "DayStartHour")},
                                              If(IsBlank(_r),
                                                  Patch(Book_AppSettings, Defaults(Book_AppSettings), {Title: "DayStartHour", Value: asDrpDayStart.Selected.Value}),
                                                  Patch(Book_AppSettings, _r, {Value: asDrpDayStart.Selected.Value})));
                                          With({_r: LookUp(Book_AppSettings, Title = "DayEndHour")},
                                              If(IsBlank(_r),
                                                  Patch(Book_AppSettings, Defaults(Book_AppSettings), {Title: "DayEndHour", Value: asDrpDayEnd.Selected.Value}),
                                                  Patch(Book_AppSettings, _r, {Value: asDrpDayEnd.Selected.Value})));
                                          With({_r: LookUp(Book_AppSettings, Title = "SlotMinutes")},
                                              If(IsBlank(_r),
                                                  Patch(Book_AppSettings, Defaults(Book_AppSettings), {Title: "SlotMinutes", Value: asDrpSlot.Selected.Value}),
                                                  Patch(Book_AppSettings, _r, {Value: asDrpSlot.Selected.Value})));
                                          With({_r: LookUp(Book_AppSettings, Title = "WeekendPolicy")},
                                              If(IsBlank(_r),
                                                  Patch(Book_AppSettings, Defaults(Book_AppSettings), {Title: "WeekendPolicy", Value: If(asWeekend = "allow", "allow", "block")}),
                                                  Patch(Book_AppSettings, _r, {Value: If(asWeekend = "allow", "allow", "block")})));
                                          With({_r: LookUp(Book_AppSettings, Title = "WhatsNewDate")},
                                              If(IsBlank(_r),
                                                  Patch(Book_AppSettings, Defaults(Book_AppSettings), {Title: "WhatsNewDate", Value: Text(asDteWhatsNew.SelectedDate, "yyyy-mm-dd")}),
                                                  Patch(Book_AppSettings, _r, {Value: Text(asDteWhatsNew.SelectedDate, "yyyy-mm-dd")})));
                                          With({_r: LookUp(Book_AppSettings, Title = "WhatsNewText")},
                                              If(IsBlank(_r),
                                                  Patch(Book_AppSettings, Defaults(Book_AppSettings), {Title: "WhatsNewText", Value: asInpWhatsNewText.Text}),
                                                  Patch(Book_AppSettings, _r, {Value: asInpWhatsNewText.Text})));
                                          ClearCollect(colAppSettings, Book_AppSettings);
                                          Notify("Settings saved.", NotificationType.Success),
                                          Notify("Couldn't save settings.", NotificationType.Error)
                                      )
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =12
                                    Text: ="Save settings"
                        - adSetConPane:
