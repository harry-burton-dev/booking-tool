                              - asMigConBtnRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - asMigBtnScan:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =ColorValue(AppTheme.ButtonTertiary)
                                          BorderThickness: =1
                                          Color: =ColorValue(AppTheme.ButtonTertiary)
                                          DisplayMode: =If(asMigConfirm, DisplayMode.Disabled, DisplayMode.Edit)
                                          Fill: =Color.Transparent
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          HoverBorderColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          HoverColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          HoverFill: =AppTheme.SurfaceAlt
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =IfError(
                                                /* 1. Legacy candidates. The three "=" tests OR'd together stay delegable
                                                   on SharePoint; the rest of the exclusions run on the local copy. */
                                                ClearCollect(
                                                    colLegacyRows,
                                                    Filter(
                                                        Book_Bookings,
                                                        RecurrenceType = "Weekly" || RecurrenceType = "BiWeekly" || RecurrenceType = "Monthly"
                                                    )
                                                );
                                                RemoveIf(colLegacyRows, Status = "Migrated" || Coalesce(IsException, false) || IsBlank(SeriesID));
                                                /* F1: 500 is the assumed data-row limit - at or past it the scan has already
                                                   lost rows, so any plan built from this collection would be wrong. */
                                                If(
                                                    CountRows(colLegacyRows) >= 500,
                                                    Notify("Too many legacy rows to scan safely (500+). Migration needs to run in smaller batches — contact the developer.", NotificationType.Error);
                                                    Clear(colLegacyRows);
                                                    Clear(colLegacyPlan);
                                                    UpdateContext({asMigScanned: false}),
                                                    /* 2. One plan row per SeriesID. Distinct + Filter instead of GroupBy so the
                                                       person/lookup columns never have to survive a nested-table regroup. */
                                                    ClearCollect(
                                                        colLegacyPlan,
                                                        ForAll(
                                                            Distinct(colLegacyRows, SeriesID) As _s,
                                                            With(
                                                                {_rows: Filter(colLegacyRows As _lr, _lr.SeriesID = _s.Value)},
                                                                With(
                                                                    {_first: First(Sort(_rows, StartDateTime, SortOrder.Ascending))},
                                                                    With(
                                                                        {
                                                                            _anchor: _first.StartDateTime,
                                                                            _dur: DateDiff(_first.StartDateTime, _first.EndDateTime, TimeUnit.Minutes),
                                                                            _rowCount: CountRows(_rows),
                                                                            _rooms: CountRows(Distinct(_rows, RoomID.Id)),
                                                                            _titles: CountRows(Distinct(_rows, Title)),
                                                                            _cancelled: CountRows(Filter(_rows, Status = "Cancelled")),
                                                                            _clash: CountRows(Filter(_rows, Status = "Clash")),
                                                                            _hasMaster: !IsBlank(LookUp(colBRMasters, SeriesID = _s.Value))
                                                                        },
                                                                        /* _base carries no C= yet - fnBROccIndex only reads F and I,
                                                                           so k can be measured before N is known. */
                                                                        With(
                                                                            {
                                                                                _base: Switch(
                                                                                    _first.RecurrenceType,
                                                                                    "Weekly", "BR-RULE;F=W;I=1",
                                                                                    "BiWeekly", "BR-RULE;F=W;I=2",
                                                                                    "BR-RULE;F=M;I=1;BM=" & Day(_first.StartDateTime)
                                                                                )
                                                                            },
                                                                            With(
                                                                                {
                                                                                    _ks: ForAll(
                                                                                        _rows As _r,
                                                                                        With(
                                                                                            {_k: fnBROccIndex(_anchor, _base, _r.StartDateTime)},
                                                                                            {
                                                                                                K: _k,
                                                                                                Dev: fnOccStart(_anchor, _base, _k) <> _r.StartDateTime
                                                                                                     || DateDiff(_r.StartDateTime, _r.EndDateTime, TimeUnit.Minutes) <> _dur
                                                                                            }
                                                                                        )
                                                                                    )
                                                                                },
                                                                                With(
                                                                                    {
                                                                                        _n: Max(_ks, K) + 1,
                                                                                        _dev: CountRows(Filter(_ks, Dev)),
                                                                                        _dupe: CountRows(_ks) <> CountRows(Distinct(_ks, K))
                                                                                    },
                                                                                    {
                                                                                        SeriesID: _s.Value,
                                                                                        Title: _first.Title,
                                                                                        RoomIdNumber: _first.RoomID.Id,
                                                                                        RoomIdText: _first.RoomID.Value,
                                                                                        RoomTitle: Coalesce(LookUp(colRooms, ID = _first.RoomID.Id).Title, _first.RoomID.Value),
                                                                                        OwnerEmail: Coalesce(_first.BookedByEmail, ""),
                                                                                        FirstRowId: _first.ID,
                                                                                        IsPrivate: Coalesce(_first.IsPrivate, false),
                                                                                        Cadence: Switch(_first.RecurrenceType, "Weekly", "Weekly", "BiWeekly", "Every 2 weeks", "Monthly"),
                                                                                        Rule: _base & ";C=" & _n,
                                                                                        Anchor: _anchor,
                                                                                        DurationMin: _dur,
                                                                                        N: _n,
                                                                                        RowCount: _rowCount,
                                                                                        Deviations: _dev,
                                                                                        CancelledCount: _cancelled,
                                                                                        ClashCount: _clash,
                                                                                        Verdict: If(
                                                                                            _rooms > 1, "Skip: mixed rooms",
                                                                                            _titles > 1, "Skip: mixed titles",
                                                                                            _rowCount > 52, "Skip: more than 52 rows",
                                                                                            _dupe, "Skip: duplicate slot",
                                                                                            _hasMaster, "Skip: master already exists",
                                                                                            "OK"
                                                                                        )
                                                                                    }
                                                                                )
                                                                            )
                                                                        )
                                                                    )
                                                                )
                                                            )
                                                        )
                                                    );
                                                    UpdateContext({asMigScanned: true});
                                                    UpdateContext({asMigConfirm: false})
                                                ),
                                                Notify("Couldn't scan legacy series.", NotificationType.Error)
                                            )
                                          PressedBorderColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          PressedColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          PressedFill: =AppTheme.SurfaceAlt
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =12
                                          Text: ="Scan legacy series"
                                          Width: =180
                                    - asMigBtnRun:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                          BorderThickness: =0
                                          Color: =ColorValue(AppTheme.PrimaryText)
                                          DisabledColor: =AppTheme.TextMuted
                                          DisabledFill: =AppTheme.SurfaceAlt
                                          DisplayMode: =If(asMigScanned && CountRows(Filter(colLegacyPlan, Verdict = "OK")) > 0, DisplayMode.Edit, DisplayMode.Disabled)
                                          Fill: =ColorValue(AppTheme.ButtonPrimary)
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          HoverColor: =ColorValue(AppTheme.PrimaryText)
                                          HoverFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({asMigConfirm: true})
                                          PressedColor: =ColorValue(AppTheme.PrimaryText)
                                          PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =12
                                          Text: ="Migrate " & CountRows(Filter(colLegacyPlan, Verdict = "OK")) & " series"
                                          Visible: =!asMigConfirm
                                          Width: =180
                              - asMigHtxSummary:
                                  Control: HtmlViewer
                                  Properties:
                                    DisplayMode: =DisplayMode.View
                                    Height: =20
                                    HtmlText: |-
                                      =CarbonTextSecondary(
                                          CarbonHtmlType.BodyCompact01,
                                          If(
                                              !asMigScanned, "Not scanned yet.",
                                              IsEmpty(colLegacyPlan), "No legacy series found.",
                                              CountRows(colLegacyPlan) & " series found &nbsp;&middot;&nbsp; " &
                                              CountRows(Filter(colLegacyPlan, Verdict = "OK")) & " will migrate &nbsp;&middot;&nbsp; " &
                                              CountRows(Filter(colLegacyPlan, Verdict <> "OK")) & " skipped"
                                          )
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Width: =Parent.Width
                              - asMigGalPlan:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    Fill: =AppTheme.Background
                                    FillPortions: =0
                                    Height: =240
                                    Items: =SortByColumns(colLegacyPlan, "Title", SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    TemplatePadding: =0
                                    TemplateSize: =48
                                    Visible: =asMigScanned && !IsEmpty(colLegacyPlan)
                                    Width: =Parent.Width
                                  Children:
                                    - asMigRectRowBg:
                                        Control: Rectangle
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          Fill: =AppTheme.Surface
                                          Height: =Parent.TemplateHeight
                                          Width: =Parent.TemplateWidth
                                    - asMigLblRowVerdict:
                                        Control: Label
                                        Properties:
                                          Color: =If(ThisItem.Verdict = "OK", AppTheme.TextPrimary, AppTheme.StatusWarnText)
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =11
                                          Text: =ThisItem.Verdict
                                          Width: =(Parent.TemplateWidth - 48) * 0.12 - 8 - 116
                                          Wrap: =false
                                          X: =32 + (Parent.TemplateWidth - 48) * 0.88
                                          Y: =14
                                    - asMigBtnRowOne:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =ColorValue(AppTheme.ButtonTertiary)
                                          BorderThickness: =1
                                          Color: =ColorValue(AppTheme.ButtonTertiary)
                                          DisplayMode: =If(asMigConfirm, DisplayMode.Disabled, DisplayMode.Edit)
                                          Fill: =Color.Transparent
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          Height: =28
                                          HoverBorderColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          HoverColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          HoverFill: =AppTheme.SurfaceAlt
                                          OnSelect: |-
                                            =With(
                                                {_sid: ThisItem.SeriesID},
                                                IfError(
                                                    With(
                                                        {_ok: Filter(colLegacyPlan, Verdict = "OK", SeriesID = _sid)},
                                                        /* c. Retire the legacy rows FIRST. Reversible - the rows are kept and only
                                                           their Status changes, so nothing here is a Remove(). Retiring before the
                                                           creates means a part-way failure leaves rows marked Migrated with no master
                                                           (recoverable) rather than a live legacy series shadowed by a new master. */
                                                        Patch(
                                                            Book_Bookings,
                                                            ForAll(
                                                                Filter(colLegacyRows As _lz, !IsBlank(LookUp(_ok As _o2, _o2.SeriesID = _lz.SeriesID))) As _z,
                                                                {ID: _z.ID, Status: "Migrated"}
                                                            )
                                                        );
                                                        /* a. One batched create per master. Records carry no ID, so the
                                                           two-argument Patch(ds, table) form creates rather than updates. */
                                                        Patch(
                                                            Book_Bookings,
                                                            ForAll(
                                                                _ok As _p,
                                                                {
                                                                    Title: _p.Title,
                                                                    RoomID: {Id: _p.RoomIdNumber, Value: _p.RoomIdText},
                                                                    StartDateTime: _p.Anchor,
                                                                    EndDateTime: DateAdd(_p.Anchor, _p.DurationMin, TimeUnit.Minutes),
                                                                    BookedBy: LookUp(colLegacyRows, ID = _p.FirstRowId).BookedBy,
                                                                    BookedByEmail: _p.OwnerEmail,
                                                                    IsPrivate: _p.IsPrivate,
                                                                    Status: "Active",
                                                                    SeriesID: _p.SeriesID,
                                                                    RecurrenceType: _p.Rule,
                                                                    OccIndex: 0,
                                                                    IsException: false,
                                                                    WantsInvite: false,
                                                                    RecurrenceLabel: fnRuleLabel(_p.Rule, _p.Anchor),
                                                                    NextOccurrence: Coalesce(
                                                                        First(
                                                                            Filter(
                                                                                ForAll(
                                                                                    Sequence(8, Max(0, fnBROccIndex(_p.Anchor, _p.Rule, Now()))) As _q,
                                                                                    {K: _q.Value, S: fnOccStart(_p.Anchor, _p.Rule, _q.Value)}
                                                                                ),
                                                                                !IsBlank(S) && S >= Now() && K < _p.N
                                                                            )
                                                                        ).S,
                                                                        _p.Anchor
                                                                    )
                                                                }
                                                            )
                                                        );
                                                        /* b. One batched create for every occurrence the rule cannot
                                                           reproduce: cancelled, clashed, or moved/re-timed. */
                                                        Patch(
                                                            Book_Bookings,
                                                            ForAll(
                                                                Filter(
                                                                    ForAll(
                                                                        Filter(colLegacyRows As _r0, !IsBlank(LookUp(_ok As _o0, _o0.SeriesID = _r0.SeriesID))) As _r,
                                                                        With(
                                                                            {_pl: LookUp(_ok As _o, _o.SeriesID = _r.SeriesID)},
                                                                            With(
                                                                                {_k: fnBROccIndex(_pl.Anchor, _pl.Rule, _r.StartDateTime)},
                                                                                {
                                                                                    Ok: !IsBlank(_pl),
                                                                                    K: _k,
                                                                                    Dev: fnOccStart(_pl.Anchor, _pl.Rule, _k) <> _r.StartDateTime
                                                                                         || DateDiff(_r.StartDateTime, _r.EndDateTime, TimeUnit.Minutes) <> _pl.DurationMin,
                                                                                    RTitle: _r.Title,
                                                                                    RRoomId: _r.RoomID.Id,
                                                                                    RRoomText: _r.RoomID.Value,
                                                                                    RId: _r.ID,
                                                                                    REmail: Coalesce(_r.BookedByEmail, ""),
                                                                                    RPrivate: Coalesce(_r.IsPrivate, false),
                                                                                    RStart: _r.StartDateTime,
                                                                                    REnd: _r.EndDateTime,
                                                                                    RStatus: _r.Status,
                                                                                    RSeries: _r.SeriesID
                                                                                }
                                                                            )
                                                                        )
                                                                    ),
                                                                    Ok,
                                                                    RStatus = "Cancelled" || RStatus = "Clash" || Dev
                                                                ) As _x,
                                                                {
                                                                    Title: _x.RTitle,
                                                                    RoomID: {Id: _x.RRoomId, Value: _x.RRoomText},
                                                                    StartDateTime: _x.RStart,
                                                                    EndDateTime: _x.REnd,
                                                                    BookedBy: LookUp(colLegacyRows, ID = _x.RId).BookedBy,
                                                                    BookedByEmail: _x.REmail,
                                                                    IsPrivate: _x.RPrivate,
                                                                    Status: _x.RStatus,
                                                                    SeriesID: _x.RSeries,
                                                                    RecurrenceType: "BR-Exception",
                                                                    OccIndex: _x.K,
                                                                    IsException: true
                                                                }
                                                            )
                                                        );
                                                        /* MIRROR: masters live in colBRMasters, exceptions in colBookings */
                                                        ClearCollect(colBRMasters, Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active"));
                                                        ClearCollect(colBookings, BookingsWindow);
                                                        /* Row-scoped: drop only this series from the plan/scan, keep the rest for review */
                                                        RemoveIf(colLegacyPlan, SeriesID = _sid);
                                                        RemoveIf(colLegacyRows, SeriesID = _sid);
                                                        If(IsEmpty(colLegacyPlan), UpdateContext({asMigScanned: false}));
                                                        Notify("Migrated 1 series.", NotificationType.Success)
                                                    ),
                                                    Notify("Migration stopped part-way. Re-run the scan: series that already have a master are skipped; rows marked Migrated without a master need the developer.", NotificationType.Error)
                                                )
                                            )
                                          PressedBorderColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          PressedColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          PressedFill: =AppTheme.SurfaceAlt
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =11
                                          Text: ="Migrate this one"
                                          Visible: =ThisItem.Verdict = "OK"
                                          Width: =100
                                          X: =Parent.TemplateWidth - 100 - 16
                                          Y: =10
                                    - asMigRectRowDivider:
                                        Control: Rectangle
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          Fill: =AppTheme.Border
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                                    - asMigLblRowTitle:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =ThisItem.Title
                                          Width: =(Parent.TemplateWidth - 48) * 0.28 - 8
                                          Wrap: =false
                                          X: =32
                                          Y: =14
                                    - asMigLblRowRoom:
                                        Control: Label
                                        Properties:
                                          Color: =ColorValue(AppTheme.Primary)
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =ThisItem.RoomTitle
                                          Width: =(Parent.TemplateWidth - 48) * 0.14 - 8
                                          Wrap: =false
                                          X: =32 + (Parent.TemplateWidth - 48) * 0.28
                                          Y: =14
                                    - asMigLblRowOwner:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextSecondary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =ThisItem.OwnerEmail
                                          Width: =(Parent.TemplateWidth - 48) * 0.20 - 8
                                          Wrap: =false
                                          X: =32 + (Parent.TemplateWidth - 48) * 0.42
                                          Y: =14
                                    - asMigLblRowCadence:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =ThisItem.Cadence
                                          Width: =(Parent.TemplateWidth - 48) * 0.12 - 8
                                          Wrap: =false
                                          X: =32 + (Parent.TemplateWidth - 48) * 0.62
                                          Y: =14
                                    - asMigLblRowCounts:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextSecondary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =11
                                          Text: =ThisItem.RowCount & " rows, " & ThisItem.Deviations & " deviations, " & ThisItem.CancelledCount & " cancelled"
                                          Width: =(Parent.TemplateWidth - 48) * 0.14 - 8
                                          Wrap: =false
                                          X: =32 + (Parent.TemplateWidth - 48) * 0.74
                                          Y: =14
                              - asMigConConfirm:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.SurfaceAlt
                                    FillPortions: =0
                                    Height: =64
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =12
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =12
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =asMigConfirm
                                    Width: =Parent.Width
                                  Children:
                                    - asMigLblConfirm:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          FillPortions: =1
                                          Font: ="IBM Plex Sans"
                                          Height: =24
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =0
                                          Size: =12
                                          Text: ="This rewrites " & CountRows(Filter(colLegacyPlan, Verdict = "OK")) & " series. Continue?"
                                          Wrap: =false
                                    - asMigBtnConfirmNo:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =AppTheme.TextPrimary
                                          Fill: =Color.Transparent
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          HoverBorderColor: =AppTheme.TextSecondary
                                          HoverColor: =AppTheme.TextPrimary
                                          HoverFill: =AppTheme.Surface
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({asMigConfirm: false})
                                          PressedBorderColor: =AppTheme.TextSecondary
                                          PressedColor: =AppTheme.TextPrimary
                                          PressedFill: =AppTheme.Surface
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =12
                                          Text: ="Cancel"
                                          Width: =100
                                    - asMigBtnConfirmYes:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                          BorderThickness: =0
                                          Color: =ColorValue(AppTheme.PrimaryText)
                                          Fill: =ColorValue(AppTheme.ButtonPrimary)
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          HoverColor: =ColorValue(AppTheme.PrimaryText)
                                          HoverFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =IfError(
                                                With(
                                                    {_ok: Filter(colLegacyPlan, Verdict = "OK")},
                                                    With(
                                                        {_cnt: CountRows(Filter(colLegacyPlan, Verdict = "OK"))},
                                                        /* c. Retire the legacy rows FIRST. Reversible - the rows are kept and only
                                                           their Status changes, so nothing here is a Remove(). Retiring before the
                                                           creates means a part-way failure leaves rows marked Migrated with no master
                                                           (recoverable) rather than a live legacy series shadowed by a new master. */
                                                        Patch(
                                                            Book_Bookings,
                                                            ForAll(
                                                                Filter(colLegacyRows As _lz, !IsBlank(LookUp(_ok As _o2, _o2.SeriesID = _lz.SeriesID))) As _z,
                                                                {ID: _z.ID, Status: "Migrated"}
                                                            )
                                                        );
                                                        /* a. One batched create per master. Records carry no ID, so the
                                                           two-argument Patch(ds, table) form creates rather than updates. */
                                                        Patch(
                                                            Book_Bookings,
                                                            ForAll(
                                                                _ok As _p,
                                                                {
                                                                    Title: _p.Title,
                                                                    RoomID: {Id: _p.RoomIdNumber, Value: _p.RoomIdText},
                                                                    StartDateTime: _p.Anchor,
                                                                    EndDateTime: DateAdd(_p.Anchor, _p.DurationMin, TimeUnit.Minutes),
                                                                    BookedBy: LookUp(colLegacyRows, ID = _p.FirstRowId).BookedBy,
                                                                    BookedByEmail: _p.OwnerEmail,
                                                                    IsPrivate: _p.IsPrivate,
                                                                    Status: "Active",
                                                                    SeriesID: _p.SeriesID,
                                                                    RecurrenceType: _p.Rule,
                                                                    OccIndex: 0,
                                                                    IsException: false,
                                                                    WantsInvite: false,
                                                                    RecurrenceLabel: fnRuleLabel(_p.Rule, _p.Anchor),
                                                                    NextOccurrence: Coalesce(
                                                                        First(
                                                                            Filter(
                                                                                ForAll(
                                                                                    Sequence(8, Max(0, fnBROccIndex(_p.Anchor, _p.Rule, Now()))) As _q,
                                                                                    {K: _q.Value, S: fnOccStart(_p.Anchor, _p.Rule, _q.Value)}
                                                                                ),
                                                                                !IsBlank(S) && S >= Now() && K < _p.N
                                                                            )
                                                                        ).S,
                                                                        _p.Anchor
                                                                    )
                                                                }
                                                            )
                                                        );
                                                        /* b. One batched create for every occurrence the rule cannot
                                                           reproduce: cancelled, clashed, or moved/re-timed. */
                                                        Patch(
                                                            Book_Bookings,
                                                            ForAll(
                                                                Filter(
                                                                    ForAll(
                                                                        Filter(colLegacyRows As _r0, !IsBlank(LookUp(_ok As _o0, _o0.SeriesID = _r0.SeriesID))) As _r,
                                                                        With(
                                                                            {_pl: LookUp(_ok As _o, _o.SeriesID = _r.SeriesID)},
                                                                            With(
                                                                                {_k: fnBROccIndex(_pl.Anchor, _pl.Rule, _r.StartDateTime)},
                                                                                {
                                                                                    Ok: !IsBlank(_pl),
                                                                                    K: _k,
                                                                                    Dev: fnOccStart(_pl.Anchor, _pl.Rule, _k) <> _r.StartDateTime
                                                                                         || DateDiff(_r.StartDateTime, _r.EndDateTime, TimeUnit.Minutes) <> _pl.DurationMin,
                                                                                    RTitle: _r.Title,
                                                                                    RRoomId: _r.RoomID.Id,
                                                                                    RRoomText: _r.RoomID.Value,
                                                                                    RId: _r.ID,
                                                                                    REmail: Coalesce(_r.BookedByEmail, ""),
                                                                                    RPrivate: Coalesce(_r.IsPrivate, false),
                                                                                    RStart: _r.StartDateTime,
                                                                                    REnd: _r.EndDateTime,
                                                                                    RStatus: _r.Status,
                                                                                    RSeries: _r.SeriesID
                                                                                }
                                                                            )
                                                                        )
                                                                    ),
                                                                    Ok,
                                                                    RStatus = "Cancelled" || RStatus = "Clash" || Dev
                                                                ) As _x,
                                                                {
                                                                    Title: _x.RTitle,
                                                                    RoomID: {Id: _x.RRoomId, Value: _x.RRoomText},
                                                                    StartDateTime: _x.RStart,
                                                                    EndDateTime: _x.REnd,
                                                                    BookedBy: LookUp(colLegacyRows, ID = _x.RId).BookedBy,
                                                                    BookedByEmail: _x.REmail,
                                                                    IsPrivate: _x.RPrivate,
                                                                    Status: _x.RStatus,
                                                                    SeriesID: _x.RSeries,
                                                                    RecurrenceType: "BR-Exception",
                                                                    OccIndex: _x.K,
                                                                    IsException: true
                                                                }
                                                            )
                                                        );
                                                        /* MIRROR: masters live in colBRMasters, exceptions in colBookings */
                                                        ClearCollect(colBRMasters, Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active"));
                                                        ClearCollect(colBookings, BookingsWindow);
                                                        Clear(colLegacyPlan);
                                                        Clear(colLegacyRows);
                                                        UpdateContext({asMigScanned: false});
                                                        UpdateContext({asMigConfirm: false});
                                                        Notify("Migrated " & _cnt & " series.", NotificationType.Success)
                                                    )
                                                ),
                                                UpdateContext({asMigConfirm: false});
                                                Notify("Migration stopped part-way. Re-run the scan: series that already have a master are skipped; rows marked Migrated without a master need the developer.", NotificationType.Error)
                                            )
                                          PressedColor: =ColorValue(AppTheme.PrimaryText)
                                          PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =12
                                          Text: ="Yes, migrate"
                                          Width: =140
