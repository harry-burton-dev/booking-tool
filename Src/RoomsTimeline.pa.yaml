                                                Size: =12
                                                Text: =If(IsBlank(tlSelStart), "Select a time", "Book " & Text(tlSelStart, "HH:mm") & " – " & Text(DateAdd(tlSelStart, tlSelMinutes, TimeUnit.Minutes), "HH:mm"))
                        - tl2BtnLoadTimeline:
                            Control: Classic/Button
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =Color.Transparent
                              BorderStyle: =BorderStyle.None
                              Color: =ColorValue(AppTheme.PrimaryText)
                              DisabledBorderColor: =Color.Transparent
                              DisabledColor: =AppTheme.TextMuted
                              DisabledFill: =Color.Transparent
                              Fill: =ColorValue(AppTheme.Primary)
                              Font: ="IBM Plex Sans"
                              HoverBorderColor: =Color.Transparent
                              HoverColor: =ColorValue(AppTheme.PrimaryText)
                              HoverFill: =ColorValue(AppTheme.Primary)
                              OnSelect: |-
                                =ClearCollect(colRoomBookings,
                                    Filter(
                                        AllBookings,
                                        Status = "Active",
                                        fnOverlaps(StartDateTime, EndDateTime, Timeline_DayStart, Timeline_DayEnd),
                                        RoomID.Id = varSelectedRoom.ID
                                    )
                                );
                                UpdateIf(colRoomBookings, StartDateTime < Timeline_DayStart, {StartDateTime: Timeline_DayStart});
                                UpdateIf(colRoomBookings, EndDateTime > Timeline_DayEnd, {EndDateTime: Timeline_DayEnd});
                                ClearCollect(colRoomBookings, Sort(colRoomBookings, StartDateTime, SortOrder.Ascending));
                                Clear(colTimelineRows);
                                Collect(
                                    colTimelineRows,
                                    ForAll(
                                        colRoomBookings As booking,
                                        {
                                            RowType: "booked",
                                            RowStart: booking.StartDateTime,
                                            RowEnd: booking.EndDateTime,
                                            RowHeight: DateDiff(booking.StartDateTime, booking.EndDateTime, TimeUnit.Minutes) * 2,
                                            RowMinutes: DateDiff(booking.StartDateTime, booking.EndDateTime, TimeUnit.Minutes),
                                            Title: If(booking.IsPrivate && booking.BookedByEmail <> Lower(User().Email), "Busy", booking.Title),
                                            BookedBy: If(booking.IsPrivate && booking.BookedByEmail <> Lower(User().Email), "", booking.BookedBy.DisplayName),
                                            IsMine: booking.BookedBy.Email = User().Email,
                                            IsBR: StartsWith(Coalesce(booking.RecurrenceType, ""), "BR-"),
                                            BookingID: booking.ID,
                                            IsMasked: booking.IsPrivate && booking.BookedByEmail <> Lower(User().Email)
                                        }
                                    )
                                );
                                // PERF-5-SKIP[conditional-cardinality] do not batch — multi-branch conditional Collects, 0-2 rows per iteration
                                ForAll(
                                    Sequence(DayEndHour - DayStartHour) As hr,
                                    With(
                                        {
                                            cellStart: DateAdd(Timeline_DayStart, (hr.Value - 1) * 60, TimeUnit.Minutes),
                                            cellEnd: DateAdd(Timeline_DayStart, hr.Value * 60, TimeUnit.Minutes)
                                        },
                                        With(
                                            { overl: SortByColumns(Filter(colRoomBookings, fnOverlaps(StartDateTime, EndDateTime, cellStart, cellEnd)), "StartDateTime", SortOrder.Ascending) },
                                            If(
                                                IsEmpty(overl),
                                                Collect(colTimelineRows, {
                                                    RowType: "free",
                                                    RowStart: cellStart,
                                                    RowEnd: cellEnd,
                                                    RowHeight: DateDiff(cellStart, cellEnd, TimeUnit.Minutes) * 2,
                                                    RowMinutes: DateDiff(cellStart, cellEnd, TimeUnit.Minutes),
                                                    Title: "",
                                                    BookedBy: "",
                                                    IsMine: false,
                                                    IsBR: false,
                                                    BookingID: 0,
                                                    IsMasked: false
                                                }),
                                                If(
                                                    First(overl).StartDateTime > cellStart,
                                                    Collect(colTimelineRows, {
                                                        RowType: "free",
                                                        RowStart: cellStart,
                                                        RowEnd: First(overl).StartDateTime,
                                                        RowHeight: DateDiff(cellStart, First(overl).StartDateTime, TimeUnit.Minutes) * 2,
                                                        RowMinutes: DateDiff(cellStart, First(overl).StartDateTime, TimeUnit.Minutes),
                                                        Title: "",
                                                        BookedBy: "",
                                                        IsMine: false,
                                                        IsBR: false,
                                                        BookingID: 0,
                                                        IsMasked: false
                                                    })
                                                );
                                                ForAll(
                                                    overl As b,
                                                    With(
                                                        { segStart: If(b.EndDateTime > cellStart, b.EndDateTime, cellStart) },
                                                        With(
                                                            {
                                                                nb: LookUp(
                                                                    SortByColumns(Filter(colRoomBookings, StartDateTime >= b.EndDateTime), "StartDateTime", SortOrder.Ascending),
                                                                    StartDateTime < cellEnd,
                                                                    StartDateTime
                                                                )
                                                            },
                                                            With(
                                                                { segEnd: If(IsBlank(nb), cellEnd, If(nb < cellEnd, nb, cellEnd)) },
                                                                If(
                                                                    segStart < segEnd &&
                                                                        segStart >= cellStart &&
                                                                        segEnd <= cellEnd &&
                                                                        CountRows(Filter(overl, EndDateTime = b.EndDateTime, StartDateTime < b.StartDateTime)) = 0 &&
                                                                        /* BUG-6: never emit a free row over any booking still covering this segment */
                                                                        IsEmpty(Filter(colRoomBookings, StartDateTime < segEnd, EndDateTime > segStart)),
                                                                    Collect(colTimelineRows, {
                                                                        RowType: "free",
                                                                        RowStart: segStart,
                                                                        RowEnd: segEnd,
                                                                        RowHeight: DateDiff(segStart, segEnd, TimeUnit.Minutes) * 2,
                                                                        RowMinutes: DateDiff(segStart, segEnd, TimeUnit.Minutes),
                                                                        Title: "",
                                                                        BookedBy: "",
                                                                        IsMine: false,
                                                                        IsBR: false,
                                                                        BookingID: 0,
                                                                        IsMasked: false
                                                                    })
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    )
                                );
                                ClearCollect(colTimelineRows, Sort(colTimelineRows, RowStart, SortOrder.Ascending))
                              PressedBorderColor: =Color.Transparent
                              PressedColor: =ColorValue(AppTheme.PrimaryText)
                              PressedFill: =ColorValue(AppTheme.Primary)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =false
                              X: =40
                              Y: =40
      - cpt_Modal__book_tl2:
          Control: CanvasComponent
          ComponentName: cpt_Modal_
          Properties:
            Height: =App.Height
            ModalTitleText: =
            OnSubmit: |-
              =If(cpt_Modal__book_tl2.ValidPayload,
                  ClearCollect(colPayloadSnapshot, cpt_Modal__book_tl2.PatchPayload);
                  Clear(colFailedBookings);
                  /* BUG-1: fresh per-occurrence server reads, materialized before the main loop.
                     Each slot-sized query is fully delegable; RoomID.Id (not delegable on
                     SharePoint) and exact-overlap narrowing happen client-side on the collection.
                     ClearCollect/Clear are illegal inside ForAll, hence the two-pass shape. */
                  Clear(colOccOverlap);
                  // PERF-5-SKIP[table-ingest] do not batch — each iteration Collects a Filter sub-table, not a record
                  ForAll(
                      colPayloadSnapshot As _w,
                      Collect(
                          colOccOverlap,
                          Filter(
                              Book_Bookings,
                              Status = "Active",
                              StartDateTime < _w.EndDateTime,
                              EndDateTime > _w.StartDateTime
                          )
                      )
                  );
                  /* BR-aware clash inputs: master anchor rows must not block (only their expansion
                     does) - drop them; virtual BR occurrences are checked via BRVirtual in _hasClash. */
                  RemoveIf(colOccOverlap, StartsWith(Coalesce(RecurrenceType, ""), "BR-") && !IsException);
                  Set(varNewSeriesID, If(First(colPayloadSnapshot).RecurrenceType <> "", GUID(), Blank()));

                  /* Loop through all snapshot occurrences */
                  ForAll(
                      colPayloadSnapshot As _occ,
                      With(
                          {
                              _isWeekend: Weekday(_occ.StartDateTime, StartOfWeek.Sunday) = 1 || Weekday(_occ.StartDateTime, StartOfWeek.Sunday) = 7,
                              _hasClash: !IsBlank(
                                  LookUp(
                                      Filter(colOccOverlap, fnOverlaps(StartDateTime, EndDateTime, _occ.StartDateTime, _occ.EndDateTime)),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              ) || !IsBlank(
                                  LookUp(
                                      Filter(BRVirtual, fnOverlaps(StartDateTime, EndDateTime, _occ.StartDateTime, _occ.EndDateTime)),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              )
                          },
                          With(
                              {
                                  /* Create booking; on success Collect() mirrors the row Patch
                                     returns (server-assigned ID included) into colBookings;
                                     record a write failure if it errors */
                                  _patchOk: IfError(
                                      Collect(colBookings, Patch(
                                          Book_Bookings,
                                          Defaults(Book_Bookings),
                                          {
                                              Title: _occ.Title,
                                              BookedByEmail: _occ.BookedByEmail,
                                              RoomID: {
                                                  Id: _occ.RoomIdNumber,
                                                  Value: _occ.RoomIdText
                                              },
                                              StartDateTime: _occ.StartDateTime,
                                              EndDateTime: _occ.EndDateTime,
                                              IsPrivate: _occ.IsPrivate,
                                              // PROD-REVERT[booked-by-actor] person = actor; mock claims don't resolve
                                              BookedBy: {
                                                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                  Claims: $"i:0#.f|membership|{Lower(User().Email)}",
                                                  DisplayName: User().FullName,
                                                  Email: Lower(User().Email),
                                                  Department: "",
                                                  JobTitle: "",
                                                  Picture: ""
                                              },
                                              Status: If(_isWeekend || _hasClash, "Clash", "Active"),
                                              SeriesID: If(IsBlank(varNewSeriesID), Blank(), Text(varNewSeriesID)),
                                              RecurrenceType: _occ.RecurrenceType,
                                              OccIndex: _occ.OccIndex,
                                              IsException: false
                                          }
                                      ));
                                      true,
                                      Collect(
                                          colFailedBookings,
                                          {
                                              BookingDate: Text(_occ.StartDateTime, "dd mmm yyyy"),
                                              Reason: "error"
                                          }
                                      );
                                      false
                                  )
                              },

                              /* Slot already occupied or the occurrence lands on a weekend —
                                 the row is still written, just as Clash instead of Active */
                              If(
                                  _patchOk && (_isWeekend || _hasClash),
                                  Collect(
                                      colFailedBookings,
                                      {
                                          BookingDate: Text(_occ.StartDateTime, "dd mmm yyyy"),
                                          Reason: "clash"
                                      }
                                  )
                              )
                          )
                      )
                  );

                  // PROD-REVERT[booking-create-roomsTimeline] SharePoint round-trip after series create
                  // (created rows are mirrored into colBookings per-occurrence above; failed rows have no server row to mirror)
                  Refresh(Book_Bookings);

                  Set(varBookingError, !IsEmpty(Filter(colFailedBookings, Reason = "error")));

                  /* Report the outcome back to the wizard */
                  Set(
                      gbl_Book_SubmitResult,
                      If(varBookingError, "error", "success")
                  );

                  /* Tell user what happened; close the modal on all branches */
                  If(
                      varBookingError,
                      Notify(
                          "Some bookings failed to save. Please try again. Not created: " &
                          Concat(Filter(colFailedBookings, Reason = "error"), BookingDate, ", "),
                          NotificationType.Error,
                          10000
                      ),
                      CountRows(Filter(colFailedBookings, Reason = "clash")) > 0,
                      Notify(
                          $"Created {CountRows(colPayloadSnapshot)} bookings — {CountRows(Filter(colFailedBookings, Reason = "clash"))} clash and need rescheduling. See My Bookings → Series.",
                          NotificationType.Warning,
                          10000
                      ),
                      Notify(
                          "Booking(s) created successfully",
                          NotificationType.Success
                      )
                  );
                  Set(gbl_UI_Book_Modal, false);

                  /* Stay on RoomsTimeline — rebuild the timeline so the new booking(s) show up.
                     (Home navigates back to Home here instead.) */
                  UpdateContext({tlSelStart: Blank()});
                  Select(tl2BtnLoadTimeline)
              )
            OnSubmitEdit: ="Text"
            OptionalLabelText: =" "
            Visible: =gbl_UI_Book_Modal = true
            Width: =App.Width
