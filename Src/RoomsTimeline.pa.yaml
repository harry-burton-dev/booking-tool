Screens:
  RoomsTimeline:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =/* Stage-2 navigation contract (T8a PERF-3): callers must, BEFORE Navigate(RoomsTimeline, ...):
             Set(varSelectedRoom, <room record from colRooms>)  - the room whose day is shown
             Set(glbSelectedDate, <date>)                        - the old Rooms open-path set Today()
           Selection state is screen-local (tlSel*, replaces Rooms' varTLSel*) and reset here.
           varShowTimeline died with the split - navigation replaces it. */
        UpdateContext({tlSelStart: Blank(), tlSelRunStart: Blank(), tlSelRunEnd: Blank(), tlSelMinutes: Blank()});
        Set(varNowTick, Now());
        /* No entry pull here (unlike the other booking screens): the only caller is Rooms,
           whose own OnVisible ran the identical Refresh + ClearCollect(colBookings,
           BookingsWindow) moments before drill-in - the old flag-flip path never re-pulled,
           so re-pulling would double the fetch and block the timeline build on a server
           round-trip. Staleness for writes is covered by the T2 mirror convention plus the
           wizard's confirm-gate fresh server reads. */
        /* The old open path chained Select(btn_LoadTimeline) after flipping varShowTimeline;
           on a dedicated screen the initial row build belongs to OnVisible. */
        Select(tl2BtnLoadTimeline)
    Children:
      - tl2ConShell:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - tl2CptHeader:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - tl2ConBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =AppTheme.layer01Bg
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =28
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - tl2ConTimeline:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - tl2ConPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =76
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - tl2BtnBack:
                                  Control: Classic/Button
                                  Properties:
                                    Align: =Align.Left
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.Primary)
                                    Fill: =Color.Transparent
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    Height: =24
                                    HoverColor: =ColorValue(AppTheme.Primary)
                                    HoverFill: =Color.Transparent
                                    OnSelect: |-
                                      =/* Old btnTLBack flipped varShowTimeline false (staying on Rooms with the
                                         room still selected); with navigation, Back() lands on Rooms whose
                                         OnVisible blanks varSelectedRoom - delta ACCEPTED per Rooms'
                                         reset-on-entry policy (STATE-3); Phase 3 revisit-policy scope. */
                                      Set(varNowTick, Now());
                                      UpdateContext({tlSelStart: Blank()});
                                      Back(ScreenTransition.Fade)
                                    PressedColor: =ColorValue(AppTheme.Primary)
                                    PressedFill: =Color.Transparent
                                    Size: =11
                                    Text: ="← All rooms"
                                    Width: =140
                              - tl2HtxTitleRow:
                                  Control: HtmlViewer
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =/* T5 consolidation: lblTLTitle (24pt semibold) + lblTLStat (right meta)
                                         collapsed into one flex row. */
                                      CarbonFlexBetween(
                                          CarbonSpan(
                                              CarbonHtmlType.Heading04 & " font-weight: 600;",
                                              fnHtmlEscape("Pick a time in " & varSelectedRoom.Title),
                                              AppThemeHex.TextPrimary
                                          ) &
                                          CarbonSpan(
                                              CarbonHtmlType.Label01,
                                              fnHtmlEscape(
                                                  With(
                                                      {freeMin: WorkingDayMinutes - Sum(colRoomBookings, DateDiff(StartDateTime, EndDateTime, TimeUnit.Minutes))},
                                                      If(
                                                          freeMin <= 0,
                                                          "fully booked",
                                                          If(freeMin >= 60, Text(RoundDown(freeMin / 60, 0)) & "h ", "") & If(Mod(freeMin, 60) > 0, Text(Mod(freeMin, 60)) & "m ", "") & "free"
                                                      )
                                                  ) & " · " & CountRows(colRoomBookings) & " booked"
                                              ),
                                              AppThemeHex.TextMuted
                                          )
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                        - tl2ConTimelineBody:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =If(App.Width < 1024, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =2
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =2
                            Children:
                              - tl2ConCard:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.Surface
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - tl2ConCardHeader:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =56
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =16
                                          PaddingRight: =16
                                        Children:
                                          - tl2LblDate:
                                              Control: Label
                                              Properties:
                                                Color: =AppTheme.TextPrimary
                                                FillPortions: =1
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMaxWidth: =148
                                                LayoutMinWidth: =96
                                                Text: =Text(glbSelectedDate, "ddd dd mmmm")
                                                Width: =96
                                          - tl2ImgPrev:
                                              Control: Image
                                              Properties:
                                                AccessibleLabel: ="Previous day"
                                                AlignInContainer: =AlignInContainer.Center
                                                Height: =24
                                                Image: ="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHBhdGggZD0nTTIwIDI0TDEyIDE2IDIwIDgnIHN0cm9rZT0nIzUyNTI1Micgc3Ryb2tlLXdpZHRoPScyJyBmaWxsPSdub25lJyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnLz48L3N2Zz4="
                                                OnSelect: |-
                                                  =Set(glbSelectedDate, DateAdd(glbSelectedDate, -1, TimeUnit.Days));
                                                  UpdateContext({tlSelStart: Blank()});
                                                  Select(tl2BtnLoadTimeline)
                                                TabIndex: =0
                                                Width: =24
                                          - tl2ImgNext:
                                              Control: Image
                                              Properties:
                                                AccessibleLabel: ="Next day"
                                                AlignInContainer: =AlignInContainer.Center
                                                Height: =24
                                                Image: ="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHBhdGggZD0nTTEyIDI0TDIwIDE2IDEyIDgnIHN0cm9rZT0nIzUyNTI1Micgc3Ryb2tlLXdpZHRoPScyJyBmaWxsPSdub25lJyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnLz48L3N2Zz4="
                                                OnSelect: |-
                                                  =Set(glbSelectedDate, DateAdd(glbSelectedDate, 1, TimeUnit.Days));
                                                  UpdateContext({tlSelStart: Blank()});
                                                  Select(tl2BtnLoadTimeline)
                                                TabIndex: =0
                                                Width: =24
                                          - tl2BtnToday:
                                              Control: Classic/Button
                                              Properties:
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =0
                                                Color: =If(glbSelectedDate = Today(), AppTheme.TextPrimary, ColorValue(AppTheme.Primary))
                                                DisabledBorderColor: =AppTheme.Border
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =AppTheme.SurfaceAlt
                                                DisplayMode: =If(glbSelectedDate = Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                                Fill: =If(glbSelectedDate = Today(), AppTheme.SurfaceAlt, Color.Transparent)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =42
                                                HoverColor: =If(glbSelectedDate = Today(), AppTheme.TextPrimary, ColorValue(AppTheme.Primary))
                                                HoverFill: =AppTheme.SurfaceAlt
                                                OnSelect: |-
                                                  =Set(glbSelectedDate, Today());
                                                  UpdateContext({tlSelStart: Blank()});
                                                  Select(tl2BtnLoadTimeline)
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.SurfaceAlt
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =11
                                                Text: ="Today"
                                                Width: =64
                                          - tl2DtpDate:
                                              Control: ModernDatePicker
                                              Properties:
                                                Color: =AppTheme.TextPrimary
                                                DefaultDate: =glbSelectedDate
                                                Fill: =Color.Transparent
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnChange: |-
                                                  =Set(glbSelectedDate, tl2DtpDate.SelectedDate);
                                                  UpdateContext({tlSelStart: Blank()});
                                                  Select(tl2BtnLoadTimeline)
                                                Visible: |-
                                                  =/* Dead vestige carried for parity (always-hidden picker); old tree now
                                                     removed - control itself still pending deletion, see T9 tidy. */
                                                  false
                                                Width: =180
                                          - tl2ConHeaderSpacer:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                          - tl2HtxLegend:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                HtmlText: |-
                                                  =/* T5 consolidation: the 4 legend labels (Free/Booked swatch+text pairs)
                                                     collapsed into one flex row. Free swatch keeps an inline span - it needs
                                                     a border (Surface fill + Border stroke), which CarbonSwatch's single-hex
                                                     signature cannot carry. Border/Surface/SurfaceAlt hex tokens lifted into
                                                     ThemeMapHex for this site (T1 pattern). */
                                                  "<div style=""display: flex; align-items: center; gap: 6px;"">" &
                                                  "<span style=""display: inline-block; width: 12px; height: 12px; background-color: " & AppThemeHex.Surface & "; border: 1px solid " & AppThemeHex.Border & ";""></span>" &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Free", AppThemeHex.TextSecondary) &
                                                  CarbonSwatch(AppThemeHex.SurfaceAlt, 12) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Booked", AppThemeHex.TextSecondary) &
                                                  CarbonSwatch(AppThemeHex.BattleRhythm, 12) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Battle Rhythm", AppThemeHex.TextSecondary) &
                                                  "<span style=""display: inline-block; width: 12px; height: 12px; background-color: " & AppThemeHex.Border & "; opacity: 0.45;""></span>" &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Past", AppThemeHex.TextSecondary) &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Width: =390
                                    - tl2ConCardDivider:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          Fill: =AppTheme.Border
                                          FillPortions: =0
                                          Height: =1
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                    - tl2GalRows:
                                        Control: Gallery
                                        Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          Height: =Parent.Height - 57
                                          Items: =colTimelineRows
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          TemplatePadding: =0
                                          Width: =Parent.Width
                                        Children:
                                          - tl2ConRow:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                Fill: =AppTheme.Surface
                                                Height: =ThisItem.RowHeight
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - tl2ConGutter:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Fill: =AppTheme.Surface
                                                      Height: =Parent.Height
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutMaxWidth: =64
                                                      LayoutMinWidth: =64
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                    Children:
                                                      - tl2LblSlotTime:
                                                          Control: Label
                                                          Properties:
                                                            Align: =Align.Right
                                                            AlignInContainer: =AlignInContainer.Center
                                                            Color: =AppTheme.TextMuted
                                                            Height: =18
                                                            LayoutMinHeight: =16
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingRight: =8
                                                            PaddingTop: =4
                                                            Size: =11
                                                            Text: =If(Mod(DateDiff(Timeline_DayStart, ThisItem.RowStart, TimeUnit.Minutes), 60) = 0, Text(ThisItem.RowStart, "HH:mm"), "")
                                                            VerticalAlign: =VerticalAlign.Top
                                                            Width: =Parent.Width
                                                      - tl2LblNowTag:
                                                          Control: Label
                                                          Properties:
                                                            Align: =Align.Center
                                                            AlignInContainer: =AlignInContainer.End
                                                            Color: =ColorValue(AppTheme.PrimaryText)
                                                            Fill: =AppTheme.StatusBusyText
                                                            Font: ="IBM Plex Sans"
                                                            Height: =16
                                                            LayoutMinHeight: =14
                                                            Size: =10
                                                            Text: =Text(varNowTick, "HH:mm")
                                                            Visible: =varNowTick >= ThisItem.RowStart && varNowTick < ThisItem.RowEnd
                                                            Width: =64
                                                      - tl2LblSlotEnd:
                                                          Control: Label
                                                          Properties:
                                                            Align: =Align.Right
                                                            AlignInContainer: =AlignInContainer.Center
                                                            Color: =AppTheme.TextMuted
                                                            FillPortions: =1
                                                            Height: =18
                                                            LayoutMinHeight: =16
                                                            PaddingBottom: =4
                                                            PaddingLeft: =0
                                                            PaddingRight: =8
                                                            PaddingTop: =0
                                                            Size: =11
                                                            Text: =If(Mod(DateDiff(Timeline_DayStart, ThisItem.RowEnd, TimeUnit.Minutes), 60) <> 0, Text(ThisItem.RowEnd, "HH:mm"), "")
                                                            VerticalAlign: =VerticalAlign.Bottom
                                                            Width: =Parent.Width
                                                - tl2ConSlot:
                                                    Control: GroupContainer
                                                    Variant: ManualLayout
                                                    Properties:
                                                      Height: =Parent.Height
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                    Children:
                                                      - tl2ConBooked:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            Fill: |-
                                                              =With(
                                                                  {_c: If(ThisItem.IsBR, ColorValue(AppThemeHex.BattleRhythm), ThisItem.IsMine, ColorValue(AppThemeHex.Primary), AppTheme.SurfaceAlt)},
                                                                  If(ThisItem.RowEnd < varNowTick, ColorFade(_c, 55%), _c)
                                                              )
                                                            Height: =Parent.Height - 4
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            Visible: =ThisItem.RowType = "booked"
                                                            Width: =Parent.Width - 16
                                                            Y: =2
                                                          Children:
                                                            - tl2RecAccent:
                                                                Control: GroupContainer
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  Fill: =If(fnIsPast(ThisItem.RowEnd), AppTheme.TextMuted, AppTheme.TextSecondary)
                                                                  FillPortions: =0
                                                                  LayoutDirection: =LayoutDirection.Horizontal
                                                                  LayoutMaxWidth: =3
                                                                  LayoutMinWidth: =3
                                                                  RadiusBottomLeft: =0
                                                                  RadiusBottomRight: =0
                                                                  RadiusTopLeft: =0
                                                                  RadiusTopRight: =0
                                                                  Width: =3
                                                            - tl2ConBookedText:
                                                                Control: GroupContainer
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  Fill: =Color.Transparent
                                                                  LayoutAlignItems: =LayoutAlignItems.Stretch
                                                                  LayoutDirection: =LayoutDirection.Vertical
                                                                  PaddingBottom: =2
                                                                  PaddingLeft: =12
                                                                  PaddingTop: =4
                                                                  RadiusBottomLeft: =0
                                                                  RadiusBottomRight: =0
                                                                  RadiusTopLeft: =0
                                                                  RadiusTopRight: =0
                                                                Children:
                                                                  - tl2LblBookingTitle:
                                                                      Control: Label
                                                                      Properties:
                                                                        AutoHeight: =true
                                                                        Color: =If(ThisItem.IsBR, ColorValue(AppThemeHex.BattleRhythmText), fnIsPast(ThisItem.RowEnd), AppTheme.TextMuted, AppTheme.TextPrimary)
                                                                        FillPortions: =1
                                                                        Font: ="IBM Plex Sans"
                                                                        FontWeight: =FontWeight.Semibold
                                                                        LayoutMinHeight: =18
                                                                        LayoutMinWidth: =0
                                                                        PaddingBottom: =0
                                                                        PaddingLeft: =0
                                                                        PaddingRight: =0
                                                                        PaddingTop: =0
                                                                        Size: =12
                                                                        Text: =If(ThisItem.RowHeight < 48, ThisItem.Title & "  ·  " & Text(ThisItem.RowStart, "HH:mm") & " – " & Text(ThisItem.RowEnd, "HH:mm"), ThisItem.Title)
                                                                        VerticalAlign: =VerticalAlign.Top
                                                                  - tl2LblBookedBy:
                                                                      Control: Label
                                                                      Properties:
                                                                        AutoHeight: =true
                                                                        Color: =If(ThisItem.IsBR, ColorValue(AppThemeHex.BattleRhythmText), fnIsPast(ThisItem.RowEnd), AppTheme.TextMuted, AppTheme.TextSecondary)
                                                                        FillPortions: =1
                                                                        Font: ="IBM Plex Sans"
                                                                        LayoutMinHeight: =16
                                                                        Size: =11
                                                                        Text: =ThisItem.BookedBy & "  ·  " & Text(ThisItem.RowStart, "HH:mm") & " – " & Text(ThisItem.RowEnd, "HH:mm")
                                                                        VerticalAlign: =VerticalAlign.Top
                                                                        Visible: =ThisItem.RowHeight >= 48
                                                      - tl2BtnOpenBooking:
                                                          Control: Classic/Button
                                                          Properties:
                                                            BorderColor: =Color.Transparent
                                                            BorderStyle: =BorderStyle.None
                                                            BorderThickness: =0
                                                            Color: =Color.Transparent
                                                            Fill: =Color.Transparent
                                                            FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                            FocusedBorderThickness: =2
                                                            Font: ="IBM Plex Sans"
                                                            Height: =Parent.Height - 4
                                                            HoverColor: =Color.Transparent
                                                            HoverFill: =RGBA(0, 0, 0, 0.04)
                                                            OnSelect: |-
                                                              =/* Virtual Battle Rhythm rows have negative BookingID and no colBookings row -
                                                                 manage them from the Admin screen instead of bookingDetail. */
                                                              If(ThisItem.BookingID > 0,
                                                                  Set(gblSelectedBooking, LookUp(colBookings, ID = ThisItem.BookingID));
                                                                  Navigate(bookingDetail, ScreenTransition.Fade))
                                                            PressedColor: =Color.Transparent
                                                            PressedFill: =RGBA(0, 0, 0, 0.08)
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Text: |-
                                                              ="Open booking details: " & ThisItem.Title
                                                            Visible: =ThisItem.RowType = "booked" && !ThisItem.IsMasked && ThisItem.BookingID > 0
                                                            Width: =Parent.Width - 16
                                                            Y: =2
                                                      - tl2ConFree:
                                                          Control: GroupContainer
                                                          Variant: ManualLayout
                                                          Properties:
                                                            Fill: =AppTheme.Surface
                                                            Height: =Parent.Height - 4
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Visible: =ThisItem.RowType = "free"
                                                            Width: =Parent.Width - 16
                                                            Y: =2
                                                          Children:
                                                            - tl2BtnFree:
                                                                Control: Classic/Button
                                                                Properties:
                                                                  BorderColor: =Color.Transparent
                                                                  BorderStyle: =BorderStyle.None
                                                                  BorderThickness: =0
                                                                  Color: =AppTheme.TextMuted
                                                                  DisplayMode: =If(fnIsPast(ThisItem.RowEnd), DisplayMode.Disabled, DisplayMode.Edit)
                                                                  Fill: =Color.Transparent
                                                                  FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                                  FocusedBorderThickness: =2
                                                                  Font: ="IBM Plex Sans"
                                                                  Height: =Parent.Height
                                                                  HoverColor: =AppTheme.TextPrimary
                                                                  HoverFill: =RGBA(0, 0, 0, 0.04)
                                                                  OnSelect: |-
                                                                    =With(
                                                                        {_slotStart: ThisItem.RowStart, _slotEnd: ThisItem.RowEnd, _now: Now()},
                                                                        With(
                                                                            {
                                                                                _clamped: If(
                                                                                    _slotStart < _now,
                                                                                    DateAdd(_now, Mod(15 - Mod(DateDiff(_slotStart, _now, TimeUnit.Minutes), 15), 15), TimeUnit.Minutes),
                                                                                    _slotStart
                                                                                )
                                                                            },
                                                                            With(
                                                                                {_start: If(_clamped < _slotEnd, _clamped, _slotStart)},
                                                                                With(
                                                                                    {
                                                                                        /* BUG-5: free rows are clipped to hour cells; the true contiguous
                                                                                           free run ends at the next BOOKED row (or day end), which is what
                                                                                           the 90m/120m duration chips must compare against. */
                                                                                        _runEnd: With(
                                                                                            {_nextBooked: Min(Filter(colTimelineRows, RowType = "booked", RowStart >= _slotStart), RowStart)},
                                                                                            If(
                                                                                                IsBlank(_nextBooked),
                                                                                                DateAdd(Timeline_DayStart, (DayEndHour - DayStartHour) * 60, TimeUnit.Minutes),
                                                                                                _nextBooked
                                                                                            )
                                                                                        )
                                                                                    },
                                                                                    With(
                                                                                        {_fit: DateDiff(_start, _runEnd, TimeUnit.Minutes)},
                                                                                        UpdateContext({
                                                                                            tlSelStart: _start,
                                                                                            tlSelRunStart: ThisItem.RowStart,
                                                                                            tlSelRunEnd: _runEnd,
                                                                                            tlSelMinutes: If(
                                                                                                !IsBlank(tlSelStart) && ThisItem.RowStart = tlSelRunStart && tlSelMinutes <= _fit,
                                                                                                tlSelMinutes,
                                                                                                If(_fit >= 60, 60, _fit >= 30, 30, _fit)
                                                                                            )
                                                                                        })
                                                                                    )
                                                                                )
                                                                            )
                                                                        )
