Screens:
  Rooms:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =UpdateContext({varShowTimeline: false});

    Children:
      - con_shell_view:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Shell_Header_2:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: |-
                    ={
                        ShellIconMenu: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect x='2' y='4' width='16' height='2' fill='%23f4f4f4'/><rect x='2' y='9' width='16' height='2' fill='%23f4f4f4'/><rect x='2' y='14' width='16' height='2' fill='%23f4f4f4'/></svg>",
                        ShellIconClose: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><line x1='3' y1='3' x2='17' y2='17' stroke='%23f4f4f4' stroke-width='2'/><line x1='17' y1='3' x2='3' y2='17' stroke='%23f4f4f4' stroke-width='2'/></svg>",
                        ShellIconSearch: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='9' cy='9' r='6' fill='none' stroke='%23f4f4f4' stroke-width='2'/><line x1='13.5' y1='13.5' x2='17' y2='17' stroke='%23f4f4f4' stroke-width='2' stroke-linecap='round'/></svg>",
                        ShellIconNotification: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><path d='M10 2C7.24 2 5 4.24 5 7v7l-2 2h14l-2-2V7c0-2.76-2.24-5-5-5z' fill='%23f4f4f4'/><rect x='8.5' y='16' width='3' height='2.5' rx='1.5' fill='%23f4f4f4'/></svg>",
                        ShellIconAppSwitcher: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect x='2' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='2' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='2' y='14' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='14' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='14' width='4' height='4' fill='%23f4f4f4'/></svg>"
                    }
                  Width: =App.Width
            - con_body_home_view:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - con_rooms_view:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =!varShowTimeline
                      Children:
                        - gal_rooms_view:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderColor: =RGBA(245, 245, 245, 1)
                              Height: =Parent.Height
                              Items: =colRooms
                              TemplatePadding: =0
                              Width: =Parent.Width
                              WrapCount: =2
                            Children:
                              - con_tile_view:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.TemplateHeight
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - lbl_textID_Desc:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(50, 49, 48, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.Lato
                                          Height: =1
                                          Text: =ThisItem.description
                                          Visible: =false
                                          Width: =200
                                          X: =20
                                          Y: =20
                                    - lbl_textID_Card:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =RGBA(50, 49, 48, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.Lato
                                          Height: =1
                                          Text: =ThisItem.Title
                                          Visible: =false
                                          Width: =200
                                    - img_Card:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =AppTheme.FocusedBorder
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderThickness: =4
                                          Height: =Parent.Height
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverFill: =
                                          Image: |-
                                            =With(
                                                { 
                                                    _tileTitle: lbl_textID_Card.Text,
                                                    _tileSubtitle: lbl_textID_Desc.Text, 
                                                    _isActive: varUI_ST_ActiveBtn = lbl_textID_Card.Text
                                                },
                                                TileProperties(
                                                    "primary",
                                                    _tileTitle, 
                                                    _tileSubtitle,
                                                    Self.Width, 
                                                    Self.Height,
                                                    _isActive,
                                                    false, 
                                                    CarbonFontFamily,
                                                    false
                                                )
                                            )
                                          OnSelect: =Select(btn_Card)
                                          PressedBorderColor: =RGBA(0, 0, 0, 0)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          TabIndex: =0
                                          Width: =Parent.Width
                                    - btn_Card:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderColor: =Color.Red
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =AppTheme.ButtonPrimaryHover
                                          OnSelect: |-
                                            =UpdateContext({
                                                varUI_ST_ActiveBtn: If(varUI_ST_ActiveBtn = lbl_textID_Card.Text, Blank(), lbl_textID_Card.Text)
                                            });
                                            UpdateContext({varSelectedRoom: ThisItem, varShowTimeline: true});
                                            Set(glbSelectedDate, Today());
                                            Select(btn_LoadTimeline);
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =RGBA(0, 69, 120, 1)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =AppTheme.ButtonPrimaryPressed
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          TabIndex: =-1
                                          Text: =""
                                          Width: =Parent.Width
                  - con_timeline_view:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =varShowTimeline
                        Width: =Parent.Width
                      Children:
                        - con_timelineheader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.HeaderBackground
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnBackToRooms:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    Fill: =RGBA(0,0,0,0)
                                    FocusedBorderColor: =RGBA(255,255,255,1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Normal
                                    Height: =32
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =RGBA(255,255,255,0.16)
                                    OnSelect: |-
                                      =UpdateContext({varShowTimeline: false})
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =RGBA(255,255,255,0.24)
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="← Rooms"
                                    Width: =96
                              - conHeaderTitle:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =1
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =0
                                    PaddingLeft: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblRoomName:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =ColorValue(AppTheme.PrimaryText)
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =20
                                          PaddingBottom: =0
                                          PaddingTop: =2
                                          Size: =13
                                          Text: =varSelectedRoom.Title
                                    - lblHeaderSummary:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(255,255,255,0.7)
                                          LayoutMinHeight: =14
                                          Size: =10
                                          Text: |-
                                            =Text(glbSelectedDate, "ddd dd mmm") & " · " & CountRows(colRoomBookings) & " booking" & If(CountRows(colRoomBookings) = 1, "", "s") & " · " &
                                            With(
                                                {freeMin: 600 - Sum(colRoomBookings, DateDiff(StartDateTime, EndDateTime, TimeUnit.Minutes))},
                                                If(
                                                    freeMin <= 0,
                                                    "fully booked",
                                                    If(freeMin >= 60, Text(RoundDown(freeMin / 60, 0)) & "h ", "") & If(Mod(freeMin, 60) > 0, Text(Mod(freeMin, 60)) & "m ", "") & "free"
                                                )
                                            )
                              - btnToday:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    DisabledBorderColor: =RGBA(0,0,0,0)
                                    DisabledColor: =RGBA(255,255,255,0.4)
                                    DisabledFill: =RGBA(0,0,0,0)
                                    DisplayMode: =If(glbSelectedDate = Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(0,0,0,0)
                                    FocusedBorderColor: =RGBA(255,255,255,1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Normal
                                    Height: =32
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =RGBA(255,255,255,0.16)
                                    OnSelect: |-
                                      =Set(glbSelectedDate, Today()); Select(btn_LoadTimeline)
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =RGBA(255,255,255,0.24)
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Today"
                                    Width: =64
                              - imgDateBack:
                                  Control: Image@2.2.3
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =44
                                    Image: ="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHBhdGggZD0nTTIwIDI0TDEyIDE2IDIwIDgnIHN0cm9rZT0nI0M2QzZDNicgc3Ryb2tlLXdpZHRoPScyJyBmaWxsPSdub25lJyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnLz48L3N2Zz4="
                                    OnSelect: |-
                                      =Set(glbSelectedDate, DateAdd(glbSelectedDate, -1, TimeUnit.Days));
                                      Select(btn_LoadTimeline);
                                    Width: =40
                              - DatePicker2:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    DefaultDate: =glbSelectedDate
                                    Fill: =Color.Transparent
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: =Set(glbSelectedDate, DatePicker2.SelectedDate); Select(btn_LoadTimeline)
                                    Width: =200
                              - lblCurrentDate:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    FontWeight: =FontWeight.Semibold
                                    OnSelect: |-
                                      =UpdateContext({varShowDatePicker: true})
                                    Size: =14
                                    Text: =Text(glbSelectedDate, "dd mmm yyyy")
                                    Visible: =false
                                    Width: =140
                              - imgDateForward:
                                  Control: Image@2.2.3
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =44
                                    Image: ="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHBhdGggZD0nTTEyIDI0TDIwIDE2IDEyIDgnIHN0cm9rZT0nI0M2QzZDNicgc3Ryb2tlLXdpZHRoPScyJyBmaWxsPSdub25lJyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnLz48L3N2Zz4="
                                    OnSelect: |-
                                      =Set(glbSelectedDate, DateAdd(glbSelectedDate, 1, TimeUnit.Days));
                                      Select(btn_LoadTimeline)
                                    Width: =40
                        - galTimeline:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
                            Properties:
                              Height: =Parent.Height - 48
                              Items: =colTimelineRows
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplatePadding: =0
                              Width: =Parent.Width
                            Children:
                              - conSlotRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    Fill: =AppTheme.Surface
                                    Height: =ThisItem.RowHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - conTimeLabel:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Fill: =AppTheme.Surface
                                          Height: =Parent.Height
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMaxWidth: =64
                                          LayoutMinWidth: =64
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - lblSlotTime:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =AppTheme.TextMuted
                                                Height: =18
                                                LayoutMinHeight: =16
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =8
                                                PaddingTop: =4
                                                Size: =11
                                                Text: =If(Mod(DateDiff(Timeline_DayStart, ThisItem.RowStart, TimeUnit.Minutes), 60) = 0, Text(ThisItem.RowStart, "HH:mm"), "")
                                                VerticalAlign: =VerticalAlign.Top
                                                Width: =Parent.Width
                                          - lblNowMarker:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Right
                                                AlignInContainer: =AlignInContainer.Center
                                                Color: =AppTheme.StatusBusyText
                                                LayoutMinHeight: =14
                                                PaddingRight: =8
                                                Size: =10
                                                Text: ="● now"
                                                Visible: =Now() >= ThisItem.RowStart && Now() < ThisItem.RowEnd
                                                Width: =Parent.Width
                                    - conSlotBlock:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FillPortions: =1
                                          Height: =Parent.Height
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          PaddingBottom: =2
                                          PaddingLeft: =0
                                          PaddingRight: =16
                                          PaddingTop: =2
                                        Children:
                                          - conBookedCard:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Fill: =If(ThisItem.RowEnd < Now(), AppTheme.SurfaceAlt, If(ThisItem.IsMine, AppTheme.StatusFreeBg, AppTheme.HeaderAccent))
                                                FillPortions: =1
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Visible: =ThisItem.RowType = "booked"
                                              Children:
                                                - recAccentBar:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: ManualLayout
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Fill: =If(ThisItem.RowEnd < Now(), AppTheme.TextMuted, If(ThisItem.IsMine, AppTheme.StatusFreeText, ColorValue(AppTheme.Primary)))
                                                      FillPortions: =0
                                                      LayoutMaxWidth: =4
                                                      LayoutMinWidth: =4
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                - conBookedText:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: AutoLayout
                                                    Properties:
                                                      Fill: =RGBA(0, 0, 0, 0)
                                                      FillPortions: =1
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =0
                                                      PaddingBottom: =2
                                                      PaddingLeft: =10
                                                      PaddingTop: =4
                                                    Children:
                                                      - lblBookingTitle:
                                                          Control: Label@2.5.1
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            AutoHeight: =false
                                                            Color: =If(ThisItem.RowEnd < Now(), AppTheme.TextMuted, AppTheme.TextPrimary)
                                                            FillPortions: =1
                                                            FontWeight: =FontWeight.Semibold
                                                            LayoutMinHeight: =18
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingRight: =0
                                                            PaddingTop: =0
                                                            Size: =13
                                                            Text: =If(ThisItem.RowHeight < 48, ThisItem.Title & "  ·  " & ThisItem.BookedBy, ThisItem.Title)
                                                      - lblBookedBy:
                                                          Control: Label@2.5.1
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =If(ThisItem.RowEnd < Now(), AppTheme.TextMuted, AppTheme.TextSecondary)
                                                            LayoutMinHeight: =16
                                                            Size: =11
                                                            Text: =ThisItem.BookedBy & "  ·  " & Text(ThisItem.RowStart, "HH:mm") & " – " & Text(ThisItem.RowEnd, "HH:mm")
                                                            Visible: =ThisItem.RowHeight >= 48
                                          - conFreeSlot:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =1
                                                Fill: =AppTheme.Surface
                                                FillPortions: =1
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Vertical
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Visible: =ThisItem.RowType = "free"
                                              Children:
                                                - lblFreeSlot:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Align: =Align.Center
                                                      Color: =AppTheme.TextMuted
                                                      Height: =Parent.Height
                                                      Size: =11
                                                      Text: =If(ThisItem.RowMinutes >= 30, "Available · " & If(ThisItem.RowMinutes >= 60, Text(RoundDown(ThisItem.RowMinutes / 60, 0)) & "h", "") & If(Mod(ThisItem.RowMinutes, 60) > 0, If(ThisItem.RowMinutes >= 60, " ", "") & Text(Mod(ThisItem.RowMinutes, 60)) & "m", ""), "")
                                                      VerticalAlign: =VerticalAlign.Middle
                                                      Width: =Parent.Width
                        - btn_LoadTimeline:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =RGBA(0, 120, 212, 1)
                              Font: =Font.Lato
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(16, 110, 190, 1)
                              OnSelect: |-
                                =ClearCollect(colRoomBookings,
                                    Sort(
                                        Filter(
                                            colBookings,
                                            RoomID.Id = varSelectedRoom.ID,
                                            StartDateTime >= Timeline_DayStart,
                                            EndDateTime <= Timeline_DayEnd
                                        ),
                                        StartDateTime,
                                        SortOrder.Ascending
                                    )
                                );
                                Clear(colTimelineRows);
                                ForAll(
                                    colRoomBookings As booking,
                                    Collect(colTimelineRows, {
                                        RowType: "booked",
                                        RowStart: booking.StartDateTime,
                                        RowEnd: booking.EndDateTime,
                                        RowHeight: DateDiff(booking.StartDateTime, booking.EndDateTime, TimeUnit.Minutes) * 2,
                                        RowMinutes: DateDiff(booking.StartDateTime, booking.EndDateTime, TimeUnit.Minutes),
                                        Title: booking.Title,
                                        BookedBy: booking.BookedBy.DisplayName,
                                        IsMine: booking.BookedBy.Email = User().Email
                                    })
                                );
                                ForAll(
                                    Sequence(10) As hr,
                                    With(
                                        {
                                            cellStart: DateAdd(Timeline_DayStart, (hr.Value - 1) * 60, TimeUnit.Minutes),
                                            cellEnd: DateAdd(Timeline_DayStart, hr.Value * 60, TimeUnit.Minutes)
                                        },
                                        With(
                                            { overl: SortByColumns(Filter(colRoomBookings, StartDateTime < cellEnd, EndDateTime > cellStart), "StartDateTime", SortOrder.Ascending) },
                                            If(
                                                IsEmpty(overl),
                                                Collect(colTimelineRows, {
                                                    RowType: "free",
                                                    RowStart: cellStart,
                                                    RowEnd: cellEnd,
                                                    RowHeight: DateDiff(cellStart, cellEnd, TimeUnit.Minutes) * 2,
                                                    RowMinutes: DateDiff(cellStart, cellEnd, TimeUnit.Minutes),
                                                    Title: "",
                                                    BookedBy: "",
                                                    IsMine: false
                                                }),
                                                If(
                                                    First(overl).StartDateTime > cellStart,
                                                    Collect(colTimelineRows, {
                                                        RowType: "free",
                                                        RowStart: cellStart,
                                                        RowEnd: First(overl).StartDateTime,
                                                        RowHeight: DateDiff(cellStart, First(overl).StartDateTime, TimeUnit.Minutes) * 2,
                                                        RowMinutes: DateDiff(cellStart, First(overl).StartDateTime, TimeUnit.Minutes),
                                                        Title: "",
                                                        BookedBy: "",
                                                        IsMine: false
                                                    })
                                                );
                                                ForAll(
                                                    overl As b,
                                                    With(
                                                        { segStart: If(b.EndDateTime > cellStart, b.EndDateTime, cellStart) },
                                                        With(
                                                            {
                                                                nb: LookUp(
                                                                    SortByColumns(Filter(colRoomBookings, StartDateTime >= b.EndDateTime), "StartDateTime", SortOrder.Ascending),
                                                                    StartDateTime < cellEnd,
                                                                    StartDateTime
                                                                )
                                                            },
                                                            With(
                                                                { segEnd: If(IsBlank(nb), cellEnd, If(nb < cellEnd, nb, cellEnd)) },
                                                                If(
                                                                    segStart < segEnd &&
                                                                        segStart >= cellStart &&
                                                                        segEnd <= cellEnd &&
                                                                        CountRows(Filter(overl, EndDateTime = b.EndDateTime, StartDateTime < b.StartDateTime)) = 0,
                                                                    Collect(colTimelineRows, {
                                                                        RowType: "free",
                                                                        RowStart: segStart,
                                                                        RowEnd: segEnd,
                                                                        RowHeight: DateDiff(segStart, segEnd, TimeUnit.Minutes) * 2,
                                                                        RowMinutes: DateDiff(segStart, segEnd, TimeUnit.Minutes),
                                                                        Title: "",
                                                                        BookedBy: "",
                                                                        IsMine: false
                                                                    })
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    )
                                );
                                ClearCollect(colTimelineRows, Sort(colTimelineRows, RowStart, SortOrder.Ascending))
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =false
                              X: =40
                              Y: =40
