Screens:
  Rooms:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =Set(varSelectedRoom, Blank());
        Set(varNowTick, Now());

        /* Re-pull the shared bookings snapshot so colleagues' writes since App.OnStart
           (or since this session's last write) show up without requiring a write of our own */
        IfError(
            Refresh(Book_Bookings);
            ClearCollect(colBookings, BookingsWindow);
            ClearCollect(colBRMasters,
                Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active")),
            Notify("Couldn't refresh bookings — showing the last snapshot", NotificationType.Warning)
        );

        Set(gblRoomsSearch, "");
        Set(gblRoomsMinCapacity, 0);
        Set(gblRoomsSort, "Name");
        Set(gblRoomsAvailableOnly, false);
        ClearCollect(
            colRoomsEquipmentFilter,
            Filter(Table({Value: ""}), !IsBlank(Value))
        )

    Children:
      - con_shell_view:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Shell_Header_2:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - con_body_home_view:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =AppTheme.layer01Bg
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =28
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =16
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - con_rooms_view:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =16
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - RoomsConBreadcrumb:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =24
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - RoomsBtnCrumbHome:
                                  Control: Classic/Button
                                  Properties:
                                    Align: =Align.Left
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =Color.Transparent
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.Primary)
                                    DisabledBorderColor: =Color.Transparent
                                    DisabledColor: =AppTheme.TextMuted
                                    DisabledFill: =Color.Transparent
                                    Fill: =Color.Transparent
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    Height: =16
                                    HoverBorderColor: =Color.Transparent
                                    HoverColor: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    HoverFill: =Color.Transparent
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Navigate(Home, ScreenTransition.Fade)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    PressedBorderColor: =Color.Transparent
                                    PressedColor: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    PressedFill: =Color.Transparent
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
                                    Text: ="Home"
                                    Width: =48
                              - htxRoomsCrumbTail:
                                  Control: HtmlViewer
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    DisplayMode: =DisplayMode.View
                                    FillPortions: =1
                                    Height: =16
                                    HtmlText: |-
                                      ="<div style=""display: flex; align-items: center; gap: 4px;"">" &
                                      CarbonSpan(CarbonHtmlType.Label01, "/", AppThemeHex.TextMuted) &
                                      CarbonSpan(CarbonHtmlType.Label01, "Rooms", AppThemeHex.TextSecondary) &
                                      "</div>"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Width: =176
                        - conRoomsHeading:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =32
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              Width: =Parent.Width
                            Children:
                              - htxRoomsHeading:
                                  Control: HtmlViewer
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    FillPortions: =1
                                    HtmlText: |-
                                      =CarbonFlexBetween(
                                          CarbonSpan(CarbonHtmlType.Heading04, "Choose a room", AppThemeHex.TextPrimary) &
                                          CarbonSpan(CarbonHtmlType.Body01, fnHtmlEscape(RoomsBrowseFilteredCount & " of " & RoomsBrowseTotalCount & " rooms · " & RoomsBrowseAvailableCount & " available now"), AppThemeHex.TextSecondary)
                                      )
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                        - conRoomsToolbar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(App.Width < 768, 240, 48)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =If(App.Width < 768, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - txtRoomsSearch:
                                  Control: Classic/TextInput
                                  Properties:
                                    AccessibleLabel: ="Search rooms and equipment"
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Default: =gblRoomsSearch
                                    DelayOutput: =true
                                    Fill: =AppTheme.layer01Bg
                                    FillPortions: =If(App.Width < 768, 0, 1)
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    HintText: ="Search rooms and equipment"
                                    HoverBorderColor: =AppTheme.TextSecondary
                                    OnChange: =Set(gblRoomsSearch, Self.Text)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
                                    Width: =Parent.Width
                              - drpRoomsCapacity:
                                  Control: Classic/DropDown
                                  Properties:
                                    AccessibleLabel: ="Filter by room capacity"
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    ChevronBackground: =AppTheme.layer01Bg
                                    ChevronFill: =AppTheme.TextPrimary
                                    ChevronHoverBackground: =Color.Transparent
                                    Color: =AppTheme.TextPrimary
                                    Default: ="Any size"
                                    Fill: =AppTheme.layer01Bg
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    Items: =["Any size","4+","8+","14+","20+"]
                                    Items.Value: =Value
                                    OnChange: =Set(gblRoomsMinCapacity, Switch(Self.Selected.Value, "4+", 4, "8+", 8, "14+", 14, "20+", 20, 0))
                                    SelectionFill: =AppTheme.ButtonDangerHover
                                    Size: =11
                                    Visible: =false
                                    Width: =160
                              - drpRoomsSort:
                                  Control: Classic/DropDown
                                  Properties:
                                    AccessibleLabel: ="Sort rooms"
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    ChevronBackground: =AppTheme.layer01Bg
                                    ChevronFill: =AppTheme.TextPrimary
                                    Color: =AppTheme.TextPrimary
                                    Default: ="Name"
                                    Fill: =AppTheme.layer01Bg
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    Items: |-
                                      =["Name","Capacity: smallest","Capacity: largest"]
                                    Items.Value: =Value
                                    OnChange: =Set(gblRoomsSort, Self.Selected.Value)
                                    Size: =11
                                    Visible: =false
                                    Width: =180
                              - tglRoomsAvailable:
                                  Control: Toggle
                                  Properties:
                                    Checked: =gblRoomsAvailableOnly
                                    Height: =48
                                    Label: ="Available now"
                                    OnCheck: =Set(gblRoomsAvailableOnly, true)
                                    OnUncheck: =Set(gblRoomsAvailableOnly, false)
                                    Width: =200
                              - rmBtnFavFilter:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =If(gblRoomsFavOnly, ColorValue(AppTheme.Primary), AppTheme.Border)
                                    BorderThickness: =1
                                    Color: =If(gblRoomsFavOnly, ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                    Fill: =If(gblRoomsFavOnly, ColorValue(AppTheme.ButtonPrimary), AppTheme.SurfaceAlt)
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =32
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(gblRoomsFavOnly, !gblRoomsFavOnly)
                                    RadiusBottomLeft: =16
                                    RadiusBottomRight: =16
                                    RadiusTopLeft: =16
                                    RadiusTopRight: =16
                                    Size: =10
                                    Text: =If(gblRoomsFavOnly, "★ Favourites only", "☆ Favourites")
                                    Width: =150
                        - conRoomsEquipmentFilters:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              Visible: =false
                              Width: =Parent.Width
                            Children:
                              - lblRoomsEquipmentHeading:
                                  Control: Label
                                  Properties:
                                    Color: =AppTheme.TextMuted
                                    Font: ="IBM Plex Sans"
                                    Height: =24
                                    Size: =9
                                    Text: ="Equipment"
                                    Width: =80
                              - galRoomsEquipmentFilters:
                                  Control: Gallery
                                  Variant: Horizontal
                                  Properties:
                                    Height: =32
                                    Items: |-
                                      =Table(
                                          {Value: "Screen"},
                                          {Value: "VC"},
                                          {Value: "Whiteboard"},
                                          {Value: "Projector"}
                                      )
                                    LayoutMinHeight: =0
                                    ShowScrollbar: =false
                                    TemplatePadding: =2
                                    TemplateSize: =98
                                  Children:
                                    - btnRoomsEquipmentFilter:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =If(ThisItem.Value in colRoomsEquipmentFilter.Value, ColorValue(AppTheme.Primary), AppTheme.Border)
                                          BorderThickness: =1
                                          Color: =If(ThisItem.Value in colRoomsEquipmentFilter.Value, ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                          Fill: =If(ThisItem.Value in colRoomsEquipmentFilter.Value, ColorValue(AppTheme.ButtonPrimary), AppTheme.SurfaceAlt)
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =24
                                          OnSelect: |-
                                            =If(
                                                ThisItem.Value in colRoomsEquipmentFilter.Value,
                                                RemoveIf(colRoomsEquipmentFilter, Value = ThisItem.Value),
                                                Collect(colRoomsEquipmentFilter, {Value: ThisItem.Value})
                                            )
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =10
                                          Text: =ThisItem.Value
                                          Width: =Parent.TemplateWidth - 4
                        - gal_rooms_view:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              Height: =Parent.Height
                              Items: =RoomsBrowseFavFiltered
                              TemplatePadding: =8
                              TemplateSize: =216
                              Visible: =!IsEmpty(RoomsBrowseFavFiltered)
                              Width: =Parent.Width
                              WrapCount: =If(App.Width >= 1200, 4, App.Width >= 768, 2, 1)
                            Children:
                              - con_tile_view:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =If(!IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID, ColorValue(AppTheme.Primary), AppTheme.Border)
                                    BorderThickness: =If(!IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID, 2, 1)
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.Surface
                                    Height: =Parent.TemplateHeight
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - lbl_textID_Card:
                                        Control: Label
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =AppTheme.TextPrimary
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =AppTheme.TextMuted
                                          FocusedBorderThickness: =4
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          Size: =14
                                          Text: =ThisItem.Title
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =44
                                    - lblRoomsStripMid:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =AppTheme.TextMuted
                                          Font: ="IBM Plex Sans"
                                          Height: =14
                                          Size: =9
                                          Text: =Text(DateAdd(TodayWindowStart, WorkingDayMinutes / 2, TimeUnit.Minutes), "HH:mm")
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =132
                                    - lbl_textID_Desc:
                                        Control: Label
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =Color.Transparent
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =AppTheme.TextSecondary
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =AppTheme.TextMuted
                                          FocusedBorderThickness: =4
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =11
                                          Text: |-
                                            =With(
                                                {_d: Trim(Coalesce(ThisItem.Description, ""))},
                                                If(
                                                    IsBlank(_d),
                                                    "seats " & Text(ThisItem.Capacity),
                                                    "seats" in Lower(_d),
                                                    _d,
                                                    _d & " · seats " & Text(ThisItem.Capacity)
                                                )
                                            )
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =72
                                    - lblRoomsCardStatus:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextSecondary
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =10
                                          Text: =ThisItem.StatusText
                                          Width: =Parent.Width - 80
                                          X: =32
                                          Y: =16
                                    - lblRoomsSelectedCheck:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =ColorValue(AppTheme.PrimaryText)
                                          Fill: =ColorValue(AppTheme.ButtonPrimary)
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          Size: =11
                                          Text: ="✓"
                                          Visible: =!IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID
                                          Width: =24
                                          X: =Parent.Width - 36
                                          Y: =12
                                    - galRoomsAvailabilitySegments:
                                        Control: Gallery
                                        Variant: Horizontal
                                        Properties:
                                          Height: =8
                                          Items: =ThisItem.Slots
                                          ShowScrollbar: =false
                                          TemplatePadding: =1
                                          TemplateSize: =(Self.Width / ((DayEndHour - DayStartHour) * 2))
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =124
                                        Children:
                                          - rectRoomsAvailabilitySegment:
                                              Control: Rectangle
                                              Properties:
                                                Fill: =If(ThisItem.IsBooked, AppTheme.TextMuted, AppTheme.HeaderAccent)
                                                Height: =6
                                                Width: =Parent.TemplateWidth - 2
                                    - lblRoomsStripStart:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextMuted
                                          Font: ="IBM Plex Sans"
                                          Height: =14
                                          Size: =9
                                          Text: =Text(TodayWindowStart, "HH:mm")
                                          Width: =59
                                          X: =16
                                          Y: =132
                                    - lblRoomsStripEnd:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Right
                                          Color: =AppTheme.TextMuted
                                          Font: ="IBM Plex Sans"
                                          Height: =14
                                          Size: =9
                                          Text: =Text(TodayWindowEnd, "HH:mm")
                                          Width: =81
                                          X: =217
                                          Y: =132
                                    - galRoomsCardEquipment:
                                        Control: Gallery
                                        Variant: Horizontal
                                        Properties:
                                          Height: =24
                                          Items: |-
                                            =With(
                                                {_equipmentText: ThisItem.Equipment},
                                                Filter(
                                                    Table(
                                                        {Value: "Screen"},
                                                        {Value: "VC"},
                                                        {Value: "Whiteboard"},
                                                        {Value: "Projector"}
                                                    ),
                                                    Lower(Value) in Lower(_equipmentText)
                                                )
                                            )
                                          ShowScrollbar: =false
                                          TemplatePadding: =2
                                          TemplateSize: =84
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =160
                                        Children:
                                          - lblRoomsCardEquipmentTag:
                                              Control: Label
                                              Properties:
                                                Align: =Align.Center
                                                Color: =AppTheme.TextSecondary
                                                Fill: =AppTheme.SurfaceAlt
                                                Font: ="IBM Plex Sans"
                                                Height: =20
                                                Size: =9
                                                Text: =ThisItem.Value
                                                Width: =Parent.TemplateWidth - 4
                                                Wrap: =false
                                    - btn_Card:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0, 0, 0, 0)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(0, 0, 0, 0)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          Fill: =Color.Transparent
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =Parent.Height
                                          HoverBorderColor: =Color.Transparent
                                          HoverColor: =Color.Transparent
                                          HoverFill: =Color.Transparent
                                          OnSelect: |-
                                            =If(
                                                !IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID,
                                                Set(varSelectedRoom, Blank()),
                                                Set(varSelectedRoom, LookUp(colRooms, ID = ThisItem.ID))
                                            );
                                            Set(glbSelectedDate, Today());
                                            Navigate(RoomsTimeline, ScreenTransition.None);
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =Color.Transparent
                                          PressedColor: =Color.Transparent
                                          PressedFill: =Color.Transparent
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: |-
                                            =If(
                                                !IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID,
                                                "Deselect ",
                                                "Select "
                                            ) &
                                            ThisItem.Title &
                                            ", capacity " & Text(ThisItem.Capacity) &
                                            ", " & ThisItem.StatusText
                                          Width: =Parent.Width
                                    - lblRoomsCardStatusDot:
                                        Control: Label
                                        Properties:
                                          Color: =Switch(ThisItem.StatusKey, "Busy", AppTheme.TextMuted, "OutsideHours", AppTheme.TextMuted, AppTheme.StatusFreeText)
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =10
                                          Text: ="●"
                                          Width: =12
                                          X: =16
                                          Y: =16
                                    - rmLblFavStar:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =If(fnIsFavourite(ThisItem.ID), ColorValue("#f1c21b"), AppTheme.TextMuted)
                                          Font: ="IBM Plex Sans"
                                          Height: =24
                                          Text: =If(fnIsFavourite(ThisItem.ID), "★", "☆")
                                          Width: =24
                                          X: =Parent.Width - 68
                                          Y: =12
                                    - rmBtnFav:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =Color.Transparent
                                          DisabledBorderColor: =Color.Transparent
                                          DisabledColor: =Color.Transparent
                                          DisabledFill: =Color.Transparent
                                          Fill: =Color.Transparent
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =24
                                          HoverBorderColor: =Color.Transparent
                                          HoverColor: =Color.Transparent
                                          HoverFill: =Color.Transparent
                                          OnSelect: |-
                                            =/* FavouriteRoomIDs is rewritten whole from the parsed list, so the stored
                                               text is always a clean comma-separated set with no stray separators. */
                                            IfError(
                                                Patch(
                                                    Book_UserSettings,
                                                    gblUserSettings,
                                                    {
                                                        FavouriteRoomIDs:
                                                            If(
                                                                fnIsFavourite(ThisItem.ID),
                                                                Concat(Filter(FavouriteRoomIds, Id <> ThisItem.ID), Text(Id, "[$-en-US]0"), ","),
                                                                Concat(FavouriteRoomIds, Text(Id, "[$-en-US]0"), ",") &
                                                                    If(IsEmpty(FavouriteRoomIds), "", ",") &
                                                                    Text(ThisItem.ID, "[$-en-US]0")
                                                            )
                                                    }
                                                ),
                                                Notify("Couldn't save setting", NotificationType.Error)
                                            );
                                            Set(gblUserSettings, LookUp(Book_UserSettings, ID = gblUserSettings.ID))
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =Color.Transparent
                                          PressedColor: =Color.Transparent
                                          PressedFill: =Color.Transparent
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =10
                                          Text: |-
                                            =If(
                                                fnIsFavourite(ThisItem.ID),
                                                "Remove " & ThisItem.Title & " from favourites",
                                                "Add " & ThisItem.Title & " to favourites"
                                            )
                                          Width: =24
                                          X: =Parent.Width - 68
                                          Y: =12
                        - conRoomsEmptyState:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              Visible: =IsEmpty(RoomsBrowseFavFiltered)
                              Width: =Parent.Width
                            Children:
                              - lblRoomsNoMatches:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    Color: =AppTheme.TextSecondary
                                    Font: ="IBM Plex Sans"
                                    Height: =24
                                    Size: =12
                                    Text: ="No rooms match these filters"
                                    Width: =Parent.Width
                              - btnRoomsClearFilters:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =ColorValue(AppTheme.ButtonTertiary)
                                    BorderThickness: =1
                                    Color: =ColorValue(AppTheme.ButtonTertiary)
                                    Fill: =Color.Transparent
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    OnSelect: |-
                                      =Set(gblRoomsSearch, "");
                                      Set(gblRoomsMinCapacity, 0);
                                      Set(gblRoomsSort, "Name");
                                      Set(gblRoomsAvailableOnly, false);
                                      ClearCollect(
                                          colRoomsEquipmentFilter,
                                          Filter(Table({Value: ""}), !IsBlank(Value))
                                      );
                                      Reset(txtRoomsSearch);
                                      Reset(drpRoomsCapacity);
                                      Reset(drpRoomsSort);
                                      Reset(tglRoomsAvailable)
                                    Text: ="Clear filters"
                                    Width: =144
      - cpt_Modal__book_rooms:
          Control: CanvasComponent
          ComponentName: cpt_Modal_
          Properties:
            Height: =App.Height
            ModalTitleText: =
            OnSubmit: |-
              =If(cpt_Modal__book_rooms.ValidPayload,
                  ClearCollect(colPayloadSnapshot, cpt_Modal__book_rooms.PatchPayload);
                  Clear(colFailedBookings);
                  /* BUG-1: fresh per-occurrence server reads, materialized before the main loop.
                     Each slot-sized query is fully delegable; RoomID.Id (not delegable on
                     SharePoint) and exact-overlap narrowing happen client-side on the collection.
                     ClearCollect/Clear are illegal inside ForAll, hence the two-pass shape. */
                  Clear(colOccOverlap);
                  // PERF-5-SKIP[table-ingest] do not batch — each iteration Collects a Filter sub-table, not a record
                  ForAll(
                      colPayloadSnapshot As _w,
                      Collect(
                          colOccOverlap,
                          Filter(
                              Book_Bookings,
                              Status = "Active",
                              StartDateTime < _w.EndDateTime,
                              EndDateTime > _w.StartDateTime
                          )
                      )
                  );
                  /* BR-aware clash inputs: master anchor rows must not block (only their expansion
                     does) - drop them; virtual BR occurrences are checked via BRVirtual in _hasClash. */
                  RemoveIf(colOccOverlap, StartsWith(Coalesce(RecurrenceType, ""), "BR-") && !IsException);
                  Set(varNewSeriesID, If(First(colPayloadSnapshot).RecurrenceType <> "", GUID(), Blank()));

                  /* Loop through all snapshot occurrences */
                  ForAll(
                      colPayloadSnapshot As _occ,
                      With(
                          {
                              _isWeekend: (Weekday(_occ.StartDateTime, StartOfWeek.Sunday) = 1 || Weekday(_occ.StartDateTime, StartOfWeek.Sunday) = 7) && WeekendPolicy <> "allow",
                              _hasClash: !IsBlank(
                                  LookUp(
                                      Filter(colOccOverlap, fnOverlaps(StartDateTime, EndDateTime, _occ.StartDateTime, _occ.EndDateTime)),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              ) || !IsBlank(
                                  LookUp(
                                      Filter(BRVirtual, fnOverlaps(StartDateTime, EndDateTime, _occ.StartDateTime, _occ.EndDateTime)),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              )
                          },
                          With(
                              {
                                  /* Create booking; on success Collect() mirrors the row Patch
                                     returns (server-assigned ID included) into colBookings;
                                     record a write failure if it errors.
                                     Series occurrences that are clean are NOT written — the master
                                     row below expands them at read time; only weekend/clash
                                     occurrences become stored exception rows. */
                                  _patchOk: If(
                                      IsBlank(varNewSeriesID) || _isWeekend || _hasClash,
                                      IfError(
                                          Collect(colBookings, Patch(
                                              Book_Bookings,
                                              Defaults(Book_Bookings),
                                              {
                                                  Title: _occ.Title,
                                                  BookedByEmail: _occ.BookedByEmail,
                                                  RoomID: {
                                                      Id: _occ.RoomIdNumber,
                                                      Value: _occ.RoomIdText
                                                  },
                                                  StartDateTime: _occ.StartDateTime,
                                                  EndDateTime: _occ.EndDateTime,
                                                  IsPrivate: _occ.IsPrivate,
                                                  // PROD-REVERT[booked-by-actor] person = actor; mock claims don't resolve
                                                  BookedBy: {
                                                      '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                      Claims: $"i:0#.f|membership|{Lower(User().Email)}",
                                                      DisplayName: User().FullName,
                                                      Email: Lower(User().Email),
                                                      Department: "",
                                                      JobTitle: "",
                                                      Picture: ""
                                                  },
                                                  Status: If(_isWeekend || _hasClash, "Clash", "Active"),
                                                  SeriesID: If(IsBlank(varNewSeriesID), Blank(), Text(varNewSeriesID)),
                                                  RecurrenceType: If(IsBlank(varNewSeriesID), _occ.RecurrenceType, "BR-Exception"),
                                                  OccIndex: _occ.OccIndex,
                                                  IsException: !IsBlank(varNewSeriesID),
                                                  WantsInvite: _occ.WantsInvite
                                              }
                                          ));
                                          true,
                                          Collect(
                                              colFailedBookings,
                                              {
                                                  BookingDate: Text(_occ.StartDateTime, "dd mmm yyyy"),
                                                  Reason: "error"
                                              }
                                          );
                                          false
                                      ),
                                      true
                                  )
                              },

                              /* Slot already occupied or the occurrence lands on a weekend —
                                 the row is still written, just as Clash instead of Active */
                              If(
                                  _patchOk && (_isWeekend || _hasClash),
                                  Collect(
                                      colFailedBookings,
                                      {
                                          BookingDate: Text(_occ.StartDateTime, "dd mmm yyyy"),
                                          Reason: "clash"
                                      }
                                  )
                              )
                          )
                      )
                  );

                  /* Series: exactly one master row carrying the rule in RecurrenceType.
                     Occurrences are expanded at read time by BRVirtual; clashing ones were
                     written as exception rows in the loop above. */
                  If(
                      !IsBlank(varNewSeriesID),
                      With(
                          {_first: First(colPayloadSnapshot)},
                          IfError(
                              Collect(colBookings, Patch(
                                  Book_Bookings,
                                  Defaults(Book_Bookings),
                                  {
                                      Title: _first.Title,
                                      BookedByEmail: _first.BookedByEmail,
                                      RoomID: {
                                          Id: _first.RoomIdNumber,
                                          Value: _first.RoomIdText
                                      },
                                      StartDateTime: _first.StartDateTime,
                                      EndDateTime: _first.EndDateTime,
                                      IsPrivate: _first.IsPrivate,
                                      // PROD-REVERT[booked-by-actor] person = actor; mock claims don't resolve
                                      BookedBy: {
                                          '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                          Claims: $"i:0#.f|membership|{Lower(User().Email)}",
                                          DisplayName: User().FullName,
                                          Email: Lower(User().Email),
                                          Department: "",
                                          JobTitle: "",
                                          Picture: ""
                                      },
                                      Status: "Active",
                                      SeriesID: Text(varNewSeriesID),
                                      RecurrenceType: _first.RecurrenceType,
                                      OccIndex: 0,
                                      IsException: false,
                                      WantsInvite: _first.WantsInvite,
                                      RecurrenceLabel: fnRuleLabel(_first.RecurrenceType, _first.StartDateTime),
                                      NextOccurrence: _first.StartDateTime
                                  }
                              )),
                              Collect(
                                  colFailedBookings,
                                  {
                                      BookingDate: Text(_first.StartDateTime, "dd mmm yyyy"),
                                      Reason: "error"
                                  }
                              )
                          );
                          Refresh(Book_Bookings);
                          ClearCollect(
                              colBRMasters,
                              Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active")
                          )
                      )
                  );

                  // PROD-REVERT[booking-create-rooms] SharePoint round-trip after series create
                  // (created rows are mirrored into colBookings per-occurrence above; failed rows have no server row to mirror)
                  Refresh(Book_Bookings);

                  Set(varBookingError, !IsEmpty(Filter(colFailedBookings, Reason = "error")));

                  /* Report the outcome back to the wizard */
                  Set(
                      gbl_Book_SubmitResult,
                      If(varBookingError, "error", "success")
                  );

                  /* Tell user what happened; close the modal on all branches */
                  If(
                      varBookingError,
                      Notify(
                          "Some bookings failed to save. Please try again. Not created: " &
                          Concat(Filter(colFailedBookings, Reason = "error"), BookingDate, ", "),
                          NotificationType.Error,
                          10000
                      ),
                      !IsBlank(varNewSeriesID),
                      Notify(
                          If(fnRuleIsPermanent(First(colPayloadSnapshot).RecurrenceType), "Permanent booking created", $"Series booked · {CountRows(colPayloadSnapshot)} occurrences") &
                          If(
                              CountRows(Filter(colFailedBookings, Reason = "clash")) > 0,
                              $", {CountRows(Filter(colFailedBookings, Reason = "clash"))} clash(es) to resolve",
                              ""
                          ),
                          If(
                              CountRows(Filter(colFailedBookings, Reason = "clash")) > 0,
                              NotificationType.Warning,
                              NotificationType.Success
                          ),
                          10000
                      ),
                      CountRows(Filter(colFailedBookings, Reason = "clash")) > 0,
                      Notify(
                          $"Created {CountRows(colPayloadSnapshot)} bookings — {CountRows(Filter(colFailedBookings, Reason = "clash"))} clash and need rescheduling. See My Bookings → Series.",
                          NotificationType.Warning,
                          10000
                      ),
                      Notify(
                          "Booking(s) created successfully",
                          NotificationType.Success
                      )
                  );
                  Set(gbl_UI_Book_Modal, false)

                  /* Stay on Rooms — nothing to rebuild (T8b PERF-3): the old tail re-ran
                     btn_LoadTimeline to refresh the embedded timeline, which moved to the
                     RoomsTimeline screen. The browse tree renders from RoomsBrowseBase, a
                     named formula over colBookings, so the per-occurrence mirror above is
                     enough. (Home navigates back to Home here instead.) */
              )
            OnSubmitEdit: ="Text"
            OptionalLabelText: =" "
            Visible: =gbl_UI_Book_Modal = true
            Width: =App.Width
