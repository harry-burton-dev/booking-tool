Screens:
  Rooms:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =UpdateContext({varShowTimeline: false});
        Set(varSelectedRoom, Blank());
        Set(varNowTick, Now());
        Set(gblRoomsSearch, "");
        Set(gblRoomsMinCapacity, 0);
        Set(gblRoomsSort, "Name");
        Set(gblRoomsAvailableOnly, false);
        ClearCollect(
            colRoomsEquipmentFilter,
            Filter(Table({Value: ""}), !IsBlank(Value))
        )

    Children:
      - con_shell_view:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Shell_Header_2:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - con_body_home_view:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - con_rooms_view:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =!varShowTimeline
                      Children:
                        - conRoomsHeading:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              Width: =Parent.Width
                            Children:
                              - lblRoomsHeading:
                                  Control: Label
                                  Properties:
                                    Color: =AppTheme.TextPrimary
                                    FillPortions: =1
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Semibold
                                    Size: =20
                                    Text: ="Choose a room"
                              - lblRoomsResultSummary:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Right
                                    Color: =AppTheme.TextSecondary
                                    Font: ="IBM Plex Sans"
                                    Size: =11
                                    Text: =RoomsBrowseFilteredCount & " of " & RoomsBrowseTotalCount & " rooms · " & RoomsBrowseAvailableCount & " available now"
                                    Width: =300
                        - conRoomsToolbar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =If(App.Width < 768, 240, 48)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =If(App.Width < 768, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =16
                              Width: =Parent.Width
                            Children:
                              - txtRoomsSearch:
                                  Control: Classic/TextInput
                                  Properties:
                                    AccessibleLabel: ="Search rooms and equipment"
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =0
                                    Color: =AppTheme.TextPrimary
                                    Default: =gblRoomsSearch
                                    DelayOutput: =true
                                    Fill: =AppTheme.layer01Bg
                                    FillPortions: =If(App.Width < 768, 0, 1)
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    HintText: ="Search rooms and equipment"
                                    HoverBorderColor: =AppTheme.TextSecondary
                                    OnChange: =Set(gblRoomsSearch, Self.Text)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
                                    Width: =Parent.Width
                              - drpRoomsCapacity:
                                  Control: Classic/DropDown
                                  Properties:
                                    AccessibleLabel: ="Filter by room capacity"
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =0
                                    ChevronBackground: =AppTheme.layer01Bg
                                    ChevronFill: =AppTheme.TextPrimary
                                    Color: =AppTheme.TextPrimary
                                    Default: ="Any size"
                                    Fill: =AppTheme.layer01Bg
                                    FillPortions: =0
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    Items: =["Any size","4+","8+","14+","20+"]
                                    Items.Value: =Value
                                    OnChange: =Set(gblRoomsMinCapacity, Switch(Self.Selected.Value, "4+", 4, "8+", 8, "14+", 14, "20+", 20, 0))
                                    Size: =11
                                    Width: =160
                              - drpRoomsSort:
                                  Control: Classic/DropDown
                                  Properties:
                                    AccessibleLabel: ="Sort rooms"
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =0
                                    ChevronBackground: =AppTheme.layer01Bg
                                    ChevronFill: =AppTheme.TextPrimary
                                    Color: =AppTheme.TextPrimary
                                    Default: ="Name"
                                    Fill: =AppTheme.layer01Bg
                                    FillPortions: =0
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    Items: |-
                                      =["Name","Capacity: smallest","Capacity: largest"]
                                    Items.Value: =Value
                                    OnChange: =Set(gblRoomsSort, Self.Selected.Value)
                                    Size: =11
                                    Width: =180
                              - tglRoomsAvailable:
                                  Control: Toggle
                                  Properties:
                                    Checked: =gblRoomsAvailableOnly
                                    FillPortions: =0
                                    Height: =48
                                    Label: ="Available now"
                                    OnCheck: =Set(gblRoomsAvailableOnly, true)
                                    OnUncheck: =Set(gblRoomsAvailableOnly, false)
                                    Width: =200
                        - conRoomsEquipmentFilters:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              Width: =Parent.Width
                            Children:
                              - lblRoomsEquipmentHeading:
                                  Control: Label
                                  Properties:
                                    Color: =AppTheme.TextMuted
                                    Font: ="IBM Plex Sans"
                                    Height: =24
                                    Size: =9
                                    Text: ="Equipment"
                                    Width: =80
                              - galRoomsEquipmentFilters:
                                  Control: Gallery
                                  Variant: Horizontal
                                  Properties:
                                    Height: =32
                                    Items: |-
                                      =Table(
                                          {Value: "Screen"},
                                          {Value: "VC"},
                                          {Value: "Whiteboard"},
                                          {Value: "Projector"}
                                      )
                                    LayoutMinHeight: =0
                                    ShowScrollbar: =false
                                    TemplatePadding: =2
                                    TemplateSize: =98
                                  Children:
                                    - btnRoomsEquipmentFilter:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =If(ThisItem.Value in colRoomsEquipmentFilter.Value, ColorValue(AppTheme.Primary), AppTheme.Border)
                                          BorderThickness: =1
                                          Color: =If(ThisItem.Value in colRoomsEquipmentFilter.Value, ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                          Fill: =If(ThisItem.Value in colRoomsEquipmentFilter.Value, ColorValue(AppTheme.ButtonPrimary), AppTheme.SurfaceAlt)
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =24
                                          OnSelect: |-
                                            =If(
                                                ThisItem.Value in colRoomsEquipmentFilter.Value,
                                                RemoveIf(colRoomsEquipmentFilter, Value = ThisItem.Value),
                                                Collect(colRoomsEquipmentFilter, {Value: ThisItem.Value})
                                            )
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Size: =10
                                          Text: =ThisItem.Value
                                          Width: =Parent.TemplateWidth - 4
                                          Y: =8
                        - gal_rooms_view:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              Height: =Parent.Height
                              Items: =RoomsBrowseData
                              TemplatePadding: =8
                              TemplateSize: =216
                              Visible: =!IsEmpty(RoomsBrowseData)
                              Width: =Parent.Width
                              WrapCount: =If(App.Width >= 1200, 4, App.Width >= 768, 2, 1)
                            Children:
                              - con_tile_view:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =If(!IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID, ColorValue(AppTheme.Primary), AppTheme.Border)
                                    BorderThickness: =If(!IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID, 2, 1)
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.Surface
                                    Height: =Parent.TemplateHeight
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - lbl_textID_Card:
                                        Control: Label
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =AppTheme.TextPrimary
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =AppTheme.TextMuted
                                          FocusedBorderThickness: =4
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Semibold
                                          Height: =26
                                          Size: =14
                                          Text: =ThisItem.Title
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =44
                                    - lblRoomsStripMid:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =AppTheme.TextMuted
                                          Font: ="IBM Plex Sans"
                                          Height: =14
                                          Size: =9
                                          Text: =Text(DateAdd(TodayWindowStart, WorkingDayMinutes / 2, TimeUnit.Minutes), "HH:mm")
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =124
                                    - lbl_textID_Desc:
                                        Control: Label
                                        Properties:
                                          AutoHeight: =false
                                          BorderColor: =Color.Transparent
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =AppTheme.TextSecondary
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =AppTheme.TextMuted
                                          FocusedBorderThickness: =4
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =11
                                          Text: |-
                                            =With(
                                                {_d: Trim(Coalesce(ThisItem.Description, ""))},
                                                If(
                                                    IsBlank(_d),
                                                    "seats " & Text(ThisItem.Capacity),
                                                    "seats" in Lower(_d),
                                                    _d,
                                                    _d & " · seats " & Text(ThisItem.Capacity)
                                                )
                                            )
                                          Wrap: =false
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =72
                                    - lblRoomsCardStatusDot:
                                        Control: Label
                                        Properties:
                                          Color: =Switch(ThisItem.StatusKey, "Busy", AppTheme.TextMuted, "OutsideHours", AppTheme.TextMuted, AppTheme.StatusFreeText)
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =10
                                          Text: ="●"
                                          Width: =12
                                          X: =16
                                          Y: =16
                                    - lblRoomsCardStatus:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextSecondary
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =10
                                          Text: =ThisItem.StatusText
                                          Width: =Parent.Width - 80
                                          X: =32
                                          Y: =16
                                    - lblRoomsSelectedCheck:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =ColorValue(AppTheme.PrimaryText)
                                          Fill: =ColorValue(AppTheme.ButtonPrimary)
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          Size: =11
                                          Text: ="✓"
                                          Visible: =!IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID
                                          Width: =24
                                          X: =Parent.Width - 36
                                          Y: =12
                                    - galRoomsAvailabilitySegments:
                                        Control: Gallery
                                        Variant: Horizontal
                                        Properties:
                                          Height: =8
                                          Items: |-
                                            =With(
                                                {_roomBookings: ThisItem.TodayRoomBookings},
                                                ForAll(
                                                    Sequence((DayEndHour - DayStartHour) * 2) As _slot,
                                                    With(
                                                        {
                                                            _start: DateAdd(
                                                                TodayWindowStart,
                                                                (_slot.Value - 1) * 30,
                                                                TimeUnit.Minutes
                                                            )
                                                        },
                                                        {
                                                            SlotStart: _start,
                                                            SlotEnd: DateAdd(_start, 30, TimeUnit.Minutes),
                                                            IsBooked: !IsBlank(
                                                                LookUp(
                                                                    _roomBookings,
                                                                    fnOverlaps(
                                                                        StartDateTime,
                                                                        EndDateTime,
                                                                        _start,
                                                                        DateAdd(_start, 30, TimeUnit.Minutes)
                                                                    )
                                                                )
                                                            )
                                                        }
                                                    )
                                                )
                                            )
                                          ShowScrollbar: =false
                                          TemplatePadding: =1
                                          TemplateSize: =(Self.Width / ((DayEndHour - DayStartHour) * 2))
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =112
                                        Children:
                                          - rectRoomsAvailabilitySegment:
                                              Control: Rectangle
                                              Properties:
                                                Fill: =If(ThisItem.IsBooked, AppTheme.TextMuted, AppTheme.HeaderAccent)
                                                Height: =6
                                                Width: =Parent.TemplateWidth - 2
                                    - lblRoomsStripStart:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextMuted
                                          Font: ="IBM Plex Sans"
                                          Height: =14
                                          Size: =9
                                          Text: =Text(TodayWindowStart, "HH:mm")
                                          Width: =59
                                          X: =16
                                          Y: =124
                                    - lblRoomsStripEnd:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Right
                                          Color: =AppTheme.TextMuted
                                          Font: ="IBM Plex Sans"
                                          Height: =14
                                          Size: =9
                                          Text: =Text(TodayWindowEnd, "HH:mm")
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =124
                                    - galRoomsCardEquipment:
                                        Control: Gallery
                                        Variant: Horizontal
                                        Properties:
                                          Height: =24
                                          Items: |-
                                            =With(
                                                {_equipmentText: ThisItem.Equipment},
                                                Filter(
                                                    Table(
                                                        {Value: "Screen"},
                                                        {Value: "VC"},
                                                        {Value: "Whiteboard"},
                                                        {Value: "Projector"}
                                                    ),
                                                    Lower(Value) in Lower(_equipmentText)
                                                )
                                            )
                                          ShowScrollbar: =false
                                          TemplatePadding: =2
                                          TemplateSize: =84
                                          Width: =Parent.Width - 32
                                          X: =16
                                          Y: =160
                                        Children:
                                          - lblRoomsCardEquipmentTag:
                                              Control: Label
                                              Properties:
                                                Align: =Align.Center
                                                Color: =AppTheme.TextSecondary
                                                Fill: =AppTheme.SurfaceAlt
                                                Font: ="IBM Plex Sans"
                                                Height: =20
                                                Size: =9
                                                Text: =ThisItem.Value
                                                Wrap: =false
                                                Width: =Parent.TemplateWidth - 4
                                    - btn_Card:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0, 0, 0, 0)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(0, 0, 0, 0)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          Fill: =Color.Transparent
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =Parent.Height
                                          HoverBorderColor: =Color.Transparent
                                          HoverColor: =Color.Transparent
                                          HoverFill: =Color.Transparent
                                          OnSelect: |-
                                            =If(
                                                !IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID,
                                                Set(varSelectedRoom, Blank()),
                                                Set(varSelectedRoom, LookUp(colRooms, ID = ThisItem.ID))
                                            )
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =Color.Transparent
                                          PressedColor: =Color.Transparent
                                          PressedFill: =Color.Transparent
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: |-
                                            =If(
                                                !IsBlank(varSelectedRoom) && varSelectedRoom.ID = ThisItem.ID,
                                                "Deselect ",
                                                "Select "
                                            ) &
                                            ThisItem.Title &
                                            ", capacity " & Text(ThisItem.Capacity) &
                                            ", " & ThisItem.StatusText
                                          Width: =Parent.Width
                        - conRoomsEmptyState:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              Visible: =IsEmpty(RoomsBrowseData)
                              Width: =Parent.Width
                            Children:
                              - lblRoomsNoMatches:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    Color: =AppTheme.TextSecondary
                                    Font: ="IBM Plex Sans"
                                    Height: =24
                                    Size: =12
                                    Text: ="No rooms match these filters"
                                    Width: =Parent.Width
                              - btnRoomsClearFilters:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =ColorValue(AppTheme.ButtonTertiary)
                                    BorderThickness: =1
                                    Color: =ColorValue(AppTheme.ButtonTertiary)
                                    Fill: =Color.Transparent
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    OnSelect: |-
                                      =Set(gblRoomsSearch, "");
                                      Set(gblRoomsMinCapacity, 0);
                                      Set(gblRoomsSort, "Name");
                                      Set(gblRoomsAvailableOnly, false);
                                      ClearCollect(
                                          colRoomsEquipmentFilter,
                                          Filter(Table({Value: ""}), !IsBlank(Value))
                                      );
                                      Reset(txtRoomsSearch);
                                      Reset(drpRoomsCapacity);
                                      Reset(drpRoomsSort);
                                      Reset(tglRoomsAvailable)
                                    Text: ="Clear filters"
                                    Width: =144
                  - con_timeline_view:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =varShowTimeline
                        Width: =Parent.Width
                      Children:
                        - con_timelineheader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.HeaderBackground
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - btnBackToRooms:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    Fill: =RGBA(0,0,0,0)
                                    FocusedBorderColor: =RGBA(255,255,255,1)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    Height: =32
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =RGBA(255,255,255,0.16)
                                    OnSelect: |-
                                      =Set(varNowTick, Now());
                                      UpdateContext({varShowTimeline: false})
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =RGBA(255,255,255,0.24)
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="← Rooms"
                                    Width: =96
                              - conHeaderTitle:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    PaddingLeft: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - lblRoomName:
                                        Control: Label
                                        Properties:
                                          Color: =ColorValue(AppTheme.PrimaryText)
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =20
                                          PaddingBottom: =0
                                          PaddingTop: =2
                                          Text: =varSelectedRoom.Title
                                    - lblHeaderSummary:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(255,255,255,0.7)
                                          LayoutMinHeight: =14
                                          Size: =10
                                          Text: |-
                                            =Text(glbSelectedDate, "ddd dd mmm") & " · " & CountRows(colRoomBookings) & " booking" & If(CountRows(colRoomBookings) = 1, "", "s") & " · " &
                                            With(
                                                {freeMin: WorkingDayMinutes - Sum(colRoomBookings, DateDiff(StartDateTime, EndDateTime, TimeUnit.Minutes))},
                                                If(
                                                    freeMin <= 0,
                                                    "fully booked",
                                                    If(freeMin >= 60, Text(RoundDown(freeMin / 60, 0)) & "h ", "") & If(Mod(freeMin, 60) > 0, Text(Mod(freeMin, 60)) & "m ", "") & "free"
                                                )
                                            )
                              - btnToday:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    DisabledBorderColor: =RGBA(0,0,0,0)
                                    DisabledColor: =RGBA(255,255,255,0.4)
                                    DisabledFill: =RGBA(0,0,0,0)
                                    DisplayMode: =If(glbSelectedDate = Today(), DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(0,0,0,0)
                                    FocusedBorderColor: =RGBA(255,255,255,1)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    Height: =32
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =RGBA(255,255,255,0.16)
                                    OnSelect: =Set(glbSelectedDate, Today()); Select(btn_LoadTimeline)
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =RGBA(255,255,255,0.24)
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Today"
                                    Width: =64
                              - imgDateBack:
                                  Control: Image
                                  Properties:
                                    AccessibleLabel: ="Previous day"
                                    AlignInContainer: =AlignInContainer.Center
                                    Height: =44
                                    Image: ="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHBhdGggZD0nTTIwIDI0TDEyIDE2IDIwIDgnIHN0cm9rZT0nIzUyNTI1Micgc3Ryb2tlLXdpZHRoPScyJyBmaWxsPSdub25lJyBzdHJva2UtbGluZWNhcD0ncm91bmQnIHN0cm9rZS1saW5lam9pbj0ncm91bmQnLz48L3N2Zz4="
                                    OnSelect: |-
                                      =Set(glbSelectedDate, DateAdd(glbSelectedDate, -1, TimeUnit.Days));
                                      Select(btn_LoadTimeline);
                                    TabIndex: =0
                                    Width: =40
