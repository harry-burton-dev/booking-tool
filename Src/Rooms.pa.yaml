      - cpt_Modal__book_rooms:
          Control: CanvasComponent
          ComponentName: cpt_Modal_
          Properties:
            Height: =App.Height
            ModalTitleText: =
            OnSubmit: |-
              =If(cpt_Modal__book_rooms.ValidPayload,
                  ClearCollect(colPayloadSnapshot, cpt_Modal__book_rooms.PatchPayload);
                  Clear(colFailedBookings);
                  Set(varNewSeriesID, If(First(colPayloadSnapshot).RecurrenceType <> "", GUID(), Blank()));

                  /* Loop through all snapshot occurrences */
                  ForAll(
                      colPayloadSnapshot As _occ,
                      With(
                          {
                              _isWeekend: Weekday(_occ.StartDateTime, StartOfWeek.Sunday) = 1 || Weekday(_occ.StartDateTime, StartOfWeek.Sunday) = 7,
                              /* BUG-1: fresh slot-sized server read per occurrence — the narrow
                                 window keeps the result far under the data-row cap; room
                                 narrowing stays client-side on that small set. */
                              _hasClash: !IsBlank(
                                  LookUp(
                                      Filter(
                                          Filter(
                                              Book_Bookings,
                                              Status = "Active",
                                              StartDateTime < _occ.EndDateTime,
                                              EndDateTime > _occ.StartDateTime
                                          ),
                                          ID <> gblEditingBookingID
                                      ),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              )
                          },
                          With(
                              {
                                  /* Create booking; record a write failure if it errors */
                                  _patchOk: IfError(
                                      Patch(
                                          Book_Bookings,
                                          Defaults(Book_Bookings),
                                          {
                                              Title: _occ.Title,
                                              BookedByEmail: _occ.BookedByEmail,
                                              RoomID: {
                                                  Id: _occ.RoomIdNumber,
                                                  Value: _occ.RoomIdText
                                              },
                                              StartDateTime: _occ.StartDateTime,
                                              EndDateTime: _occ.EndDateTime,
                                              IsPrivate: _occ.IsPrivate,
                                              // PROD-REVERT[booked-by-actor] person = actor; mock claims don't resolve
                                              BookedBy: {
                                                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                  Claims: $"i:0#.f|membership|{Lower(User().Email)}",
                                                  DisplayName: User().FullName,
                                                  Email: Lower(User().Email),
                                                  Department: "",
                                                  JobTitle: "",
                                                  Picture: ""
                                              },
                                              Status: If(_isWeekend || _hasClash, "Clash", "Active"),
                                              SeriesID: If(IsBlank(varNewSeriesID), Blank(), Text(varNewSeriesID)),
                                              RecurrenceType: _occ.RecurrenceType,
                                              OccIndex: _occ.OccIndex,
                                              IsException: false
                                          }
                                      );
                                      true,
                                      Collect(
                                          colFailedBookings,
                                          {
                                              BookingDate: Text(_occ.StartDateTime, "dd mmm yyyy"),
                                              Reason: "error"
                                          }
                                      );
                                      false
                                  )
                              },

                              /* Slot already occupied or the occurrence lands on a weekend —
                                 the row is still written, just as Clash instead of Active */
                              If(
                                  _patchOk && (_isWeekend || _hasClash),
                                  Collect(
                                      colFailedBookings,
                                      {
                                          BookingDate: Text(_occ.StartDateTime, "dd mmm yyyy"),
                                          Reason: "clash"
                                      }
                                  )
                              )
                          )
                      )
                  );

                  // PROD-REVERT[booking-create-rooms] SharePoint round-trip after series create
                  Refresh(Book_Bookings);
                  ClearCollect(colBookings, BookingsWindow);

                  Set(varBookingError, !IsEmpty(Filter(colFailedBookings, Reason = "error")));

                  /* Report the outcome back to the wizard */
                  Set(
                      gbl_Book_SubmitResult,
                      If(varBookingError, "error", "success")
                  );

                  /* Tell user what happened; close the modal on all branches */
                  If(
                      varBookingError,
                      Notify(
                          "Some bookings failed to save. Please try again. Not created: " &
                          Concat(Filter(colFailedBookings, Reason = "error"), BookingDate, ", "),
                          NotificationType.Error,
                          10000
                      ),
                      CountRows(Filter(colFailedBookings, Reason = "clash")) > 0,
                      Notify(
                          $"Created {CountRows(colPayloadSnapshot)} bookings — {CountRows(Filter(colFailedBookings, Reason = "clash"))} clash and need rescheduling. See My Bookings → Series.",
                          NotificationType.Warning,
                          10000
                      ),
                      Notify(
                          "Booking(s) created successfully",
                          NotificationType.Success
                      )
                  );
                  Set(gbl_UI_Book_Modal, false);

                  /* Stay on Rooms — rebuild the timeline so the new booking(s) show up.
