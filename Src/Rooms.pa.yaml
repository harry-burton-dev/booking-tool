                                        colBookings,
                                        Status = "Active",
                                        fnOverlaps(StartDateTime, EndDateTime, Timeline_DayStart, Timeline_DayEnd),
                                        RoomID.Id = varSelectedRoom.ID
                                    )
                                );
                                UpdateIf(colRoomBookings, StartDateTime < Timeline_DayStart, {StartDateTime: Timeline_DayStart});
                                UpdateIf(colRoomBookings, EndDateTime > Timeline_DayEnd, {EndDateTime: Timeline_DayEnd});
                                ClearCollect(colRoomBookings, Sort(colRoomBookings, StartDateTime, SortOrder.Ascending));
                                Clear(colTimelineRows);
                                ForAll(
                                    colRoomBookings As booking,
                                    Collect(colTimelineRows, {
                                        RowType: "booked",
                                        RowStart: booking.StartDateTime,
                                        RowEnd: booking.EndDateTime,
                                        RowHeight: DateDiff(booking.StartDateTime, booking.EndDateTime, TimeUnit.Minutes) * 2,
                                        RowMinutes: DateDiff(booking.StartDateTime, booking.EndDateTime, TimeUnit.Minutes),
                                        Title: If(booking.IsPrivate && booking.BookedByEmail <> Lower(User().Email), "Busy", booking.Title),
                                        BookedBy: If(booking.IsPrivate && booking.BookedByEmail <> Lower(User().Email), "", booking.BookedBy.DisplayName),
                                        IsMine: booking.BookedBy.Email = User().Email
                                    })
                                );
                                ForAll(
                                    Sequence(DayEndHour - DayStartHour) As hr,
                                    With(
                                        {
                                            cellStart: DateAdd(Timeline_DayStart, (hr.Value - 1) * 60, TimeUnit.Minutes),
                                            cellEnd: DateAdd(Timeline_DayStart, hr.Value * 60, TimeUnit.Minutes)
                                        },
                                        With(
                                            { overl: SortByColumns(Filter(colRoomBookings, fnOverlaps(StartDateTime, EndDateTime, cellStart, cellEnd)), "StartDateTime", SortOrder.Ascending) },
                                            If(
                                                IsEmpty(overl),
                                                Collect(colTimelineRows, {
                                                    RowType: "free",
                                                    RowStart: cellStart,
                                                    RowEnd: cellEnd,
                                                    RowHeight: DateDiff(cellStart, cellEnd, TimeUnit.Minutes) * 2,
                                                    RowMinutes: DateDiff(cellStart, cellEnd, TimeUnit.Minutes),
                                                    Title: "",
                                                    BookedBy: "",
                                                    IsMine: false
                                                }),
                                                If(
                                                    First(overl).StartDateTime > cellStart,
                                                    Collect(colTimelineRows, {
                                                        RowType: "free",
                                                        RowStart: cellStart,
                                                        RowEnd: First(overl).StartDateTime,
                                                        RowHeight: DateDiff(cellStart, First(overl).StartDateTime, TimeUnit.Minutes) * 2,
                                                        RowMinutes: DateDiff(cellStart, First(overl).StartDateTime, TimeUnit.Minutes),
                                                        Title: "",
                                                        BookedBy: "",
                                                        IsMine: false
                                                    })
                                                );
                                                ForAll(
                                                    overl As b,
                                                    With(
                                                        { segStart: If(b.EndDateTime > cellStart, b.EndDateTime, cellStart) },
                                                        With(
                                                            {
                                                                nb: LookUp(
                                                                    SortByColumns(Filter(colRoomBookings, StartDateTime >= b.EndDateTime), "StartDateTime", SortOrder.Ascending),
                                                                    StartDateTime < cellEnd,
                                                                    StartDateTime
                                                                )
                                                            },
                                                            With(
                                                                { segEnd: If(IsBlank(nb), cellEnd, If(nb < cellEnd, nb, cellEnd)) },
                                                                If(
                                                                    segStart < segEnd &&
                                                                        segStart >= cellStart &&
                                                                        segEnd <= cellEnd &&
                                                                        CountRows(Filter(overl, EndDateTime = b.EndDateTime, StartDateTime < b.StartDateTime)) = 0,
                                                                    Collect(colTimelineRows, {
                                                                        RowType: "free",
                                                                        RowStart: segStart,
                                                                        RowEnd: segEnd,
                                                                        RowHeight: DateDiff(segStart, segEnd, TimeUnit.Minutes) * 2,
                                                                        RowMinutes: DateDiff(segStart, segEnd, TimeUnit.Minutes),
                                                                        Title: "",
                                                                        BookedBy: "",
                                                                        IsMine: false
                                                                    })
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    )
                                );
                                ClearCollect(colTimelineRows, Sort(colTimelineRows, RowStart, SortOrder.Ascending))
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
