Screens:
  Admin:
    Properties:
      Fill: =AppTheme.Background
      LoadingSpinnerColor: =ColorValue(AppTheme.Primary)
      OnVisible: |-
        =/* Navigate() is illegal in OnVisible - non-admins are gated by adConPage.Visible
           plus the IsAdmin-hidden nav link instead. */
        IfError(
            Refresh(Book_Bookings);
            ClearCollect(colBookings, BookingsWindow);
            ClearCollect(colBRMasters,
                Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active")),
            Notify("Couldn't refresh bookings — showing the last snapshot", NotificationType.Warning)
        );
        /* re-init tab state on every entry so stale selections can't dereference
           masters that no longer exist (review-B 1) */
        UpdateContext({adTab: "All"});
        UpdateContext({adBRSel: 0});
        UpdateContext({adBRDevK: -1});
        UpdateContext({adBRConfirmEnd: 0});
        // RESET-SITE[admin-onvisible] per-row cancel confirms are context vars scoped to this
        // screen, so an armed prompt would survive navigating away and back. 0 is the disarmed
        // sentinel for adConfirmCancel (gates compare against ThisItem.ID, never 0); -1 is the
        // disarmed sentinel for adBRConfirmOccCancel (gates compare against ThisItem.K, which
        // starts at 0).
        UpdateContext({adConfirmCancel: 0});
        UpdateContext({adBRConfirmOccCancel: -1});
        /* T-11: occurrence calendar always opens on the current month */
        UpdateContext({adBRCalMonth: Date(Year(Today()), Month(Today()), 1)})
    Children:
      - adConShell:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - adCptHeader:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - adConBody:
