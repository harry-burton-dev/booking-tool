                                                },
                                                With(
                                                    {
                                                        _ge: DateAdd(_gs, 41, TimeUnit.Days),
                                                        _slot: Text(_m.StartDateTime, "HH:mm") & "-" & Text(_m.EndDateTime, "HH:mm"),
                                                        _until: fnRuleUntil(_m.RecurrenceType),
                                                        _cnt: fnRuleCount(_m.RecurrenceType),
                                                        _k0: Max(0, fnBROccIndex(_m.StartDateTime, _m.RecurrenceType, _gs) - 1)
                                                    },
                                                    /* _k1 is clamped to _k0 so Sequence() can never receive a negative
                                                       count. T-10: fnBROccIndex is a lower bound on multi-weekday rules,
                                                       so the upper end widens by one k per booking day, not by 1. */
                                                    With(
                                                        {_k1: Max(_k0, fnBROccIndex(_m.StartDateTime, _m.RecurrenceType, _ge) + fnRuleNd(_m.RecurrenceType, _m.StartDateTime))},
                                                        With(
