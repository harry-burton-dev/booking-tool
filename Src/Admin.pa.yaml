Screens:
  Admin:
    Properties:
      Fill: =AppTheme.Background
      LoadingSpinnerColor: =ColorValue(AppTheme.Primary)
      OnVisible: |-
        =/* Navigate() is illegal in OnVisible - non-admins are gated by adConPage.Visible
           plus the IsAdmin-hidden nav link instead. */
        Refresh(Book_Bookings);
        ClearCollect(colBookings, BookingsWindow);
        ClearCollect(colBRMasters,
            Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active"))
    Children:
      - adConShell:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - adCptHeader:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - adConBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - adConPage:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =IsAdmin
                        Width: =Parent.Width
                      Children:
                        - adHtxNoAccess:
                            Control: HtmlViewer
                            Properties:
                              AutoHeight: =true
                              DisplayMode: =DisplayMode.View
                              HtmlText: =CarbonTextSecondary(CarbonHtmlType.Body01, "You need administrator access to view this page.")
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Visible: =!IsAdmin
                              Width: =Parent.Width - 32
                        - adConPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - adConTitleStack:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - adConBreadcrumb:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =16
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - adHtxBreadcrumb:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                DisplayMode: =DisplayMode.View
                                                Height: =16
                                                HtmlText: |-
                                                  ="<div style=""display: flex; align-items: center; gap: 4px;"">" &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Home", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "/", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Admin", AppThemeHex.TextSecondary) &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Width: =176
                                    - adHtxPageTitle:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: =CarbonText(CarbonHtmlType.Heading04, "Admin")
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                        - adHtxStatLine:
                            Control: HtmlViewer
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              DisplayMode: =DisplayMode.View
                              HtmlText: =CarbonTextSecondary(CarbonHtmlType.BodyCompact01, CountRows(adGalBookings.AllItems) & " bookings shown · " & CountRows(colBRMasters) & " Battle Rhythm series · " & CountRows(colRooms) & " rooms")
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                        - adConToolbar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - adConTabs:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =480
                                  Children:
                                    - adConTabBtnAll:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =48
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =160
                                        Children:
                                          - adBtnTabAll:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =If(adTab = "All", AppTheme.TextPrimary, AppTheme.TextSecondary)
                                                DisabledBorderColor: =Color.Transparent
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =AppTheme.SurfaceAlt
                                                Fill: =If(adTab = "All", AppTheme.Background, AppTheme.SurfaceAlt)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =46
                                                HoverBorderColor: =Color.Transparent
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext({adTab: "All"})
                                                PressedBorderColor: =Color.Transparent
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="All bookings"
                                                Width: =Parent.Width
                                          - adRectTabAllBar:
                                              Control: Rectangle
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                Fill: =If(adTab = "All", ColorValue(AppTheme.Primary), AppTheme.Border)
                                                Height: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                                    - adConTabBtnBR:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =48
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =160
                                        Children:
                                          - adBtnTabBR:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =If(adTab = "BR", AppTheme.TextPrimary, AppTheme.TextSecondary)
                                                DisabledBorderColor: =Color.Transparent
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =AppTheme.SurfaceAlt
                                                Fill: =If(adTab = "BR", AppTheme.Background, AppTheme.SurfaceAlt)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =46
                                                HoverBorderColor: =Color.Transparent
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext({adTab: "BR"})
                                                PressedBorderColor: =Color.Transparent
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="Battle Rhythm"
                                                Width: =Parent.Width
                                          - adRectTabBRBar:
                                              Control: Rectangle
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                Fill: =If(adTab = "BR", ColorValue(AppTheme.Primary), AppTheme.Border)
                                                Height: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                                    - adConTabBtnRooms:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =48
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =160
                                        Children:
                                          - adBtnTabRooms:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =If(adTab = "Rooms", AppTheme.TextPrimary, AppTheme.TextSecondary)
                                                DisabledBorderColor: =Color.Transparent
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =AppTheme.SurfaceAlt
                                                Fill: =If(adTab = "Rooms", AppTheme.Background, AppTheme.SurfaceAlt)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =46
                                                HoverBorderColor: =Color.Transparent
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =UpdateContext({adTab: "Rooms"})
                                                PressedBorderColor: =Color.Transparent
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="Rooms"
                                                Width: =Parent.Width
                                          - adRectTabRoomsBar:
                                              Control: Rectangle
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                Fill: =If(adTab = "Rooms", ColorValue(AppTheme.Primary), AppTheme.Border)
                                                Height: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                        - adConTabAll:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =adTab = "All"
                              Width: =Parent.Width
                            Children:
                              - adConFilters:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width
                                  Children:
                                    - adInpSearch:
                                        Control: Classic/TextInput
                                        Properties:
                                          AccessibleLabel: ="Search title or owner"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =AppTheme.TextPrimary
                                          Default: =""
                                          DelayOutput: =true
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          HintText: ="Search title or owner"
                                          HoverBorderColor: =AppTheme.TextSecondary
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =11
                                          Width: =260
                                    - adDteFrom:
                                        Control: Classic/DatePicker
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =AppTheme.TextPrimary
                                          DefaultDate: =DateAdd(Today(), -7, TimeUnit.Days)
                                          DisabledColor: =AppTheme.TextMuted
                                          DisabledFill: =AppTheme.SurfaceAlt
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          IconBackground: =AppTheme.HeaderBackground
                                          IconFill: =AppTheme.HeaderAccent
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Width: =160
                                    - adDteTo:
                                        Control: Classic/DatePicker
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =AppTheme.TextPrimary
                                          DefaultDate: =DateAdd(Today(), 30, TimeUnit.Days)
                                          DisabledColor: =AppTheme.TextMuted
                                          DisabledFill: =AppTheme.SurfaceAlt
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          IconBackground: =AppTheme.HeaderBackground
                                          IconFill: =AppTheme.HeaderAccent
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Width: =160
                              - adConTableHeadWrap:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =33
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - adConTableHead:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =32
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =32
                                          PaddingRight: =16
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - adHtxTableHead:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                DisplayMode: =DisplayMode.View
                                                FillPortions: =1
                                                Height: =16
                                                HtmlText: |-
                                                  =/* Same +10 header/row gutter convention as htxMb2TableHead/MB2TableCols. Admin
                                                     table has no flexible title column, so a blank flex:1 1 auto spacer takes the
                                                     place of MEETING - the fixed columns stay right-packed, matching adGalBookings'
                                                     TemplateWidth-anchored row labels below. */
                                                  "<div style=""display: flex; align-items: center;"">" &
                                                  CarbonSpan("flex: 1 1 auto; " & CarbonHtmlType.TableHead, "", AppThemeHex.TextMuted) &
                                                  CarbonSpan("flex: 0 0 " & (AdminTableCols.Room + 10) & "px; " & CarbonHtmlType.TableHead, "ROOM", AppThemeHex.TextMuted) &
                                                  CarbonSpan("flex: 0 0 " & (AdminTableCols.Date + 10) & "px; " & CarbonHtmlType.TableHead, "DATE", AppThemeHex.TextMuted) &
                                                  CarbonSpan("flex: 0 0 " & (AdminTableCols.Time + 10) & "px; " & CarbonHtmlType.TableHead, "TIME", AppThemeHex.TextMuted) &
                                                  CarbonSpan("flex: 0 0 " & (AdminTableCols.Owner + 10) & "px; " & CarbonHtmlType.TableHead, "OWNER", AppThemeHex.TextMuted) &
                                                  CarbonSpan("flex: 0 0 " & (AdminTableCols.Status + 10) & "px; " & CarbonHtmlType.TableHead, "STATUS", AppThemeHex.TextMuted) &
                                                  CarbonSpan("flex: 0 0 " & AdminTableCols.Action & "px; " & CarbonHtmlType.TableHead, "", AppThemeHex.TextMuted) &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                    - adRectHeadRule:
                                        Control: Rectangle
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          BorderColor: =Color.Transparent
                                          Fill: =AppTheme.Border
                                          Height: =1
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =Parent.Width
                              - adGalBookings:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    Fill: =AppTheme.Background
                                    FillPortions: =1
                                    Height: =Parent.Height
                                    Items: |-
                                      =SortByColumns(
                                          Filter(AllBookings,
                                              Status = "Active" || Status = "Clash",
                                              EndDateTime >= adDteFrom.SelectedDate,
                                              StartDateTime <= DateAdd(adDteTo.SelectedDate, 1, TimeUnit.Days),
                                              IsBlank(Trim(adInpSearch.Text))
                                                  || Lower(Trim(adInpSearch.Text)) in Lower(Title)
                                                  || Lower(Trim(adInpSearch.Text)) in Lower(BookedByEmail)),
                                          "StartDateTime", SortOrder.Ascending)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    TemplatePadding: =0
                                    TemplateSize: =56
                                    Visible: =Self.AllItemsCount > 0
                                    Width: =Parent.Width
                                  Children:
                                    - adRectRowBg:
                                        Control: Rectangle
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          Fill: =AppTheme.Surface
                                          Height: =Parent.TemplateHeight
                                          Width: =Parent.TemplateWidth
                                    - adRectRowDivider:
                                        Control: Rectangle
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          Fill: =AppTheme.Border
                                          Height: =1
                                          Width: =Parent.TemplateWidth
                                          Y: =Parent.TemplateHeight - 1
                                    - adLblRowRoom:
                                        Control: Label
                                        Properties:
                                          Color: =ColorValue(AppTheme.Primary)
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =ThisItem.RoomID.Value
                                          Width: =AdminTableCols.Room
                                          Wrap: =false
                                          X: =Parent.TemplateWidth - 840
                                          Y: =18
                                    - adLblRowDate:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =Text(ThisItem.StartDateTime, "ddd d mmm")
                                          Width: =AdminTableCols.Date
                                          Wrap: =false
                                          X: =Parent.TemplateWidth - 660
                                          Y: =18
                                    - adLblRowTime:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =Text(ThisItem.StartDateTime, "HH:mm") & "–" & Text(ThisItem.EndDateTime, "HH:mm")
                                          Width: =AdminTableCols.Time
                                          Wrap: =false
                                          X: =Parent.TemplateWidth - 550
                                          Y: =18
                                    - adLblRowOwner:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextSecondary
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =ThisItem.BookedByEmail
                                          Width: =AdminTableCols.Owner
                                          Wrap: =false
                                          X: =Parent.TemplateWidth - 430
                                          Y: =18
                                    - adLblRowStatus:
                                        Control: Label
                                        Properties:
                                          Color: =If(ThisItem.Status = "Clash", AppTheme.StatusWarnText, ThisItem.Status = "Cancelled", AppTheme.TextMuted, ColorValue(AppTheme.Primary))
                                          Font: ="IBM Plex Sans"
                                          Height: =20
                                          Size: =12
                                          Text: =If(ThisItem.IsVirtual, "Battle Rhythm", fnIsBRRow(ThisItem.RecurrenceType), "BR exception", ThisItem.Status)
                                          Width: =AdminTableCols.Status
                                          Wrap: =false
                                          X: =Parent.TemplateWidth - 230
                                          Y: =18
                                    - adBtnView:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =ColorValue(AppTheme.ButtonTertiary)
                                          BorderThickness: =1
                                          Color: =ColorValue(AppTheme.ButtonTertiary)
                                          DisabledBorderColor: =AppTheme.Border
                                          DisabledColor: =AppTheme.TextMuted
                                          DisabledFill: =Color.Transparent
                                          Fill: =Color.Transparent
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Normal
                                          Height: =32
                                          HoverBorderColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          HoverColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          HoverFill: =AppTheme.SurfaceAlt
                                          OnSelect: |-
                                            =Set(gblSelectedBooking, LookUp(colBookings, ID = ThisItem.ID));
                                            Navigate(bookingDetail, ScreenTransition.Fade)
                                          PressedBorderColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          PressedColor: =ColorValue(AppTheme.ButtonTertiaryActive)
                                          PressedFill: =AppTheme.SurfaceAlt
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =11
                                          Text: ="View"
                                          Visible: =!ThisItem.IsVirtual
                                          Width: =50
                                          X: =Parent.TemplateWidth - 108
                                          Y: =12
                                    - adBtnCancel:
                                        Control: Classic/Button
                                        Properties:
