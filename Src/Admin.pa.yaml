            Width: =App.Width
      - cpt_Modal__book_ad:
          Control: CanvasComponent
          ComponentName: cpt_Modal_
          Properties:
            Height: =App.Height
            ModalTitleText: =
            OnSubmit: |-
              =/* Create is unreachable from this screen: both wizard-open sites Navigate(Home)
                   immediately, and the wizard scrim covers the nav bar so you cannot return
                   mid-flow. Same shape as the instance this was ported from. */
              Set(gbl_UI_Book_Modal, false)
            OnSubmitEdit: |-
              =If(cpt_Modal__book_ad.ValidPayload && gblEditingBookingID <> 0,
                  With({_occ: First(cpt_Modal__book_ad.PatchPayload)},
                      If(
                          !IsBlank(gblSelectedBooking.SeriesID),
                          // Series member: stash the pending times AND room (T-09/3.2 - the payload's
                          // room used to be dropped here) and ask for scope before writing anything
                          Set(gbl_PendingStart, _occ.StartDateTime);
                          Set(gbl_PendingEnd, _occ.EndDateTime);
                          Set(gbl_PendingRoomId, _occ.RoomIdNumber);
                          Set(gbl_PendingRoomText, _occ.RoomIdText);
                          Set(gbl_UI_Detail_ConfirmMode, "edit-scope");
                          /* Re-open the detail modal: bdmEditScopeRow lives inside the component, which is
                             gated on gbl_UI_Detail_Modal. Every route to this wizard closed it on the way
                             in, so without this the prompt arms invisibly and the edit is discarded. */
                          Set(gbl_UI_Detail_Modal, true),
                          // Standalone booking: unchanged single-row conflict check + Patch
                          If(
                              !IsBlank(
                                  LookUp(
                                      Filter(
                                          colBookings,
                                          Status = "Active",
                                          fnOverlaps(StartDateTime, EndDateTime, _occ.StartDateTime, _occ.EndDateTime),
                                          ID <> gblEditingBookingID
                                      ),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              ),
                              Notify("That slot is no longer free. Your booking is unchanged.", NotificationType.Warning, 6000),
                              // PROD-REVERT[booking-edit] prod form: Patch(Book_Bookings, ...) below
                              If(
                                  gblEditingBookingID < 0,
                                  /* Virtual occurrence of a series: nothing to patch — write an
                                     exception row for occurrence k of its master instead.
                                     UNREACHABLE: a virtual occurrence always has a SeriesID, so the
                                     series branch above claims it. Kept in step with the live paths. */
                                  With(
                                      {
                                          _m: LookUp(colBRMasters, ID = RoundDown(-gblEditingBookingID / 10000, 0)),
                                          _k: Mod(-gblEditingBookingID, 10000)
                                      },
                                      With(
                                          {
                                              _new: Patch(
                                                  Book_Bookings,
                                                  Defaults(Book_Bookings),
                                                  {
                                                      Title: _m.Title,
                                                      BookedByEmail: _m.BookedByEmail,
                                                      RoomID: {Id: _occ.RoomIdNumber, Value: _occ.RoomIdText},
                                                      StartDateTime: _occ.StartDateTime,
                                                      EndDateTime: _occ.EndDateTime,
                                                      IsPrivate: Coalesce(_m.IsPrivate, false),
                                                      BookedBy: _m.BookedBy,
                                                      Status: "Active",
                                                      SeriesID: _m.SeriesID,
                                                      RecurrenceType: "BR-Exception",
                                                      OccIndex: _k,
                                                      IsException: true
                                                  }
                                              )
                                          },
                                          Collect(colBookings, _new);
                                          Set(gblSelectedBooking, LookUp(AllBookings, ID = _new.ID));
                                          Notify("Booking updated", NotificationType.Success)
                                      )
                                  ),
                                  // _changes shared by the server Patch and the colBookings mirror so the field lists cannot drift
                                  With(
                                      {
                                          _changes: {
                                              Title: _occ.Title,
                                              RoomID: {Id: _occ.RoomIdNumber, Value: _occ.RoomIdText},
                                              StartDateTime: _occ.StartDateTime,
                                              EndDateTime: _occ.EndDateTime
                                          }
                                      },
                                      IfError(
                                          Patch(
                                              Book_Bookings,
                                              LookUp(Book_Bookings, ID = gblEditingBookingID),
                                              _changes
                                          ),
                                          Notify("Couldn't update this booking. Please try again.", NotificationType.Error),
                                          Refresh(Book_Bookings);
                                          UpdateIf(colBookings, ID = gblEditingBookingID, _changes);
                                          Notify("Booking updated", NotificationType.Success)
                                      )
                                  )
                              )
                          )
                      )
                  );

                  /* Negative IDs are virtual occurrences: the exception-row branch above already
                     re-pointed gblSelectedBooking at the row it created. */
                  If(
                      gblEditingBookingID > 0,
                      Set(gblSelectedBooking, LookUp(AllBookings, ID = gblEditingBookingID))
                  );
                  Set(gblEditingBookingID, 0);
                  Set(gbl_UI_Book_Modal, false)
              )
            OptionalLabelText: =" "
            Visible: =gbl_UI_Book_Modal = true
            Width: =App.Width
