Screens:
  myBookings:
    Properties:
      Fill: =AppTheme.Background
      LoadingSpinnerColor: =ColorValue(AppTheme.Primary)
      OnVisible: |-
        =/* Re-pull the shared bookings snapshot so colleagues' writes since App.OnStart
           (or since this session's last write) show up without requiring a write of our own */
        IfError(
            Refresh(Book_Bookings);
            ClearCollect(colBookings, BookingsWindow);
            ClearCollect(colBRMasters,
                Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active")),
            Notify("Couldn't refresh bookings — showing the last snapshot", NotificationType.Warning)
        );
        // RESET-SITE[mybookings-onvisible] the per-row cancel-series confirm is a global, so an
        // armed "Yes, cancel series" survived navigating away and back - one click on return
        // would cancel the series. Cleared on entry; Blank() is the disarmed value here because
        // the gates compare against ThisItem.SeriesID, not "".
        Set(gbl_UI_CancelSeriesConfirmID, Blank())
    Children:
      - mb2ConShell:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - mb2CptHeader:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - mb2ConBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - mb2ConPage:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - mb2ConPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - mb2ConTitleStack:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - mb2ConBreadcrumb:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =16
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - mb2BtnCrumbHome:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =ColorValue(AppTheme.Primary)
                                                DisabledBorderColor: =Color.Transparent
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =Color.Transparent
                                                Fill: =Color.Transparent
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =16
                                                HoverBorderColor: =Color.Transparent
                                                HoverColor: =ColorValue(AppTheme.ButtonPrimaryActive)
                                                HoverFill: =Color.Transparent
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Navigate(Home, ScreenTransition.Fade)
