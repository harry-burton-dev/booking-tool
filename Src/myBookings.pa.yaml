Screens:
  myBookings:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varMyBookingsFilter, "Upcoming");
        ClearCollect(varMyBookings,
            Sort(
                Filter(colBookings,
                    BookedBy.Email = User().Email
                ),
                StartDateTime,
                SortOrder.Ascending
            )
        )
    Children:
      - con_shell_mybook:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cpt_header_mybook:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: |-
                    ={
                        ShellIconMenu: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect x='2' y='4' width='16' height='2' fill='%23f4f4f4'/><rect x='2' y='9' width='16' height='2' fill='%23f4f4f4'/><rect x='2' y='14' width='16' height='2' fill='%23f4f4f4'/></svg>",
                        ShellIconClose: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><line x1='3' y1='3' x2='17' y2='17' stroke='%23f4f4f4' stroke-width='2'/><line x1='17' y1='3' x2='3' y2='17' stroke='%23f4f4f4' stroke-width='2'/></svg>",
                        ShellIconSearch: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='9' cy='9' r='6' fill='none' stroke='%23f4f4f4' stroke-width='2'/><line x1='13.5' y1='13.5' x2='17' y2='17' stroke='%23f4f4f4' stroke-width='2' stroke-linecap='round'/></svg>",
                        ShellIconNotification: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><path d='M10 2C7.24 2 5 4.24 5 7v7l-2 2h14l-2-2V7c0-2.76-2.24-5-5-5z' fill='%23f4f4f4'/><rect x='8.5' y='16' width='3' height='2.5' rx='1.5' fill='%23f4f4f4'/></svg>",
                        ShellIconAppSwitcher: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect x='2' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='2' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='2' y='14' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='14' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='14' width='4' height='4' fill='%23f4f4f4'/></svg>"
                    }
                  Width: =App.Width
            - con_body_mybookings:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - conMyBookingsBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - conContentSwitcher:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.Background
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =16
                              PaddingTop: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - con_SegUpcoming:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =32
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =120
                                  Children:
                                    - lbl_SegUpcomingText:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="Upcoming"
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - img_SegUpcoming:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =32
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0)
                                          Image: =ContentSwitcherItem(lbl_SegUpcomingText.Text, Self.Width, Self.Height, varMyBookingsFilter = "Upcoming", CarbonFontFamily)
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0)
                                          Width: =120
                                    - btn_SegUpcoming:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =RGBA(0,0,0,0)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          FocusedBorderColor: =RGBA(15,98,254,1)
                                          FocusedBorderThickness: =2
                                          Height: =32
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0.06)
                                          OnSelect: =Set(varMyBookingsFilter, "Upcoming")
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0.12)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: =""
                                          Width: =120
                              - con_SegAll:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =32
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =80
                                  Children:
                                    - lbl_SegAllText:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="All"
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - img_SegAll:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =32
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0)
                                          Image: =ContentSwitcherItem(lbl_SegAllText.Text, Self.Width, Self.Height, varMyBookingsFilter = "All", CarbonFontFamily)
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0)
                                          Width: =80
                                    - btn_SegAll:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =RGBA(0,0,0,0)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          FocusedBorderColor: =RGBA(15,98,254,1)
                                          FocusedBorderThickness: =2
                                          Height: =32
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0.06)
                                          OnSelect: =Set(varMyBookingsFilter, "All")
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0.12)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: =""
                                          Width: =80
                        - galMyBookings:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Fill: =AppTheme.Background
                              Items: |-
                                =Sort(
                                    Filter(varMyBookings,
                                        If(varMyBookingsFilter = "Upcoming",
                                            EndDateTime >= Now(),
                                            true
                                        )
                                    ),
                                    StartDateTime,
                                    If(varMyBookingsFilter = "Upcoming", SortOrder.Ascending, SortOrder.Descending)
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplatePadding: =0
                              TemplateSize: =88
                              Visible: =If(Self.AllItemsCount = 0, false, true)
                            Children:
                              - rectCardBg:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0,0,0,0)
                                    Fill: =If(ThisItem.EndDateTime < Now(), AppTheme.Background, ColorValue("#f4f4f4"))
                                    Height: =Parent.TemplateHeight
                                    Width: =Parent.Width
                              - rectCardDivider:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0,0,0,0)
                                    Fill: =AppTheme.Border
                                    Height: =1
                                    Width: =Parent.Width
                                    Y: =Parent.TemplateHeight - 1
                              - lblCardRoom:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(ThisItem.EndDateTime < Now(), AppTheme.TextSecondary, AppTheme.TextPrimary)
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Text: =ThisItem.Title
                                    Width: =Parent.Width - 80
                                    Wrap: =false
                                    X: =16
                                    Y: =10
                              - lblCardDate:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(ThisItem.EndDateTime < Now(), AppTheme.TextSecondary, AppTheme.TextMuted)
                                    Font: =Font.Lato
                                    Height: =16
                                    Size: =12
                                    Text: =Text(ThisItem.StartDateTime, "ddd dd mmm yyyy")
                                    Width: =Parent.Width - 32
                                    Wrap: =false
                                    X: =16
                                    Y: =32
                              - lblCardTime:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(ThisItem.EndDateTime < Now(), AppTheme.TextSecondary, AppTheme.TextMuted)
                                    Font: =Font.Lato
                                    Height: =16
                                    Size: =12
                                    Text: =Text(ThisItem.StartDateTime, "HH:mm") & " - " & Text(ThisItem.EndDateTime, "HH:mm")
                                    Width: =Parent.Width - 32
                                    Wrap: =false
                                    X: =16
                                    Y: =49
                              - lblCardTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(ThisItem.EndDateTime < Now(), AppTheme.TextSecondary, AppTheme.TextSecondary)
                                    Font: =Font.Lato
                                    Height: =16
                                    Size: =12
                                    Text: |-
                                      =ThisItem.'RoomID: Title'.Value
                                    Width: =Parent.Width - 32
                                    Wrap: =false
                                    X: =16
                                    Y: =66
                              - lblPastBadge:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =AppTheme.Background
                                    Fill: =AppTheme.TextMuted
                                    Font: =Font.Lato
                                    Height: =20
                                    Size: =11
                                    Text: ="Past"
                                    Visible: =ThisItem.EndDateTime < Now()
                                    Width: =44
                                    Wrap: =false
                                    X: =Parent.Width - 60
                                    Y: =10
                              - btnCardOverlay:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0,0,0,0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =RGBA(0,0,0,0)
                                    DisabledBorderColor: =RGBA(0,0,0,0)
                                    DisabledColor: =RGBA(0,0,0,0)
                                    DisabledFill: =RGBA(0,0,0,0)
                                    Fill: =RGBA(0,0,0,0)
                                    FocusedBorderColor: =RGBA(15,98,254,1)
                                    FocusedBorderThickness: =2
                                    Height: =Parent.TemplateHeight
                                    HoverBorderColor: =RGBA(0,0,0,0)
                                    HoverColor: =RGBA(0,0,0,0)
                                    HoverFill: =RGBA(0,0,0,0.04)
                                    OnSelect: =Set(gblSelectedBooking, ThisItem); Navigate(bookingDetail, ScreenTransition.Fade)
                                    PressedBorderColor: =RGBA(0,0,0,0)
                                    PressedColor: =RGBA(0,0,0,0)
                                    PressedFill: =RGBA(0,0,0,0.08)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Text: =""
                                    Width: =Parent.Width
                        - conEmptyState:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =16
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =IsEmpty(galMyBookings.AllItems)
                              Width: =Parent.Width
                            Children:
                              - lblEmptyState:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =AppTheme.TextMuted
                                    Fill: =RGBA(0,0,0,0)
                                    Font: =Font.Lato
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Text: =If(varMyBookingsFilter = "Upcoming", "No upcoming bookings yet.", "No bookings found.")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - btnEmptyBook:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =RGBA(15,98,254,1)
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    DisplayMode: =DisplayMode.Disabled
                                    Fill: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderColor: =RGBA(15,98,254,1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =RGBA(13,83,217,1)
                                    OnSelect: =
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =RGBA(11,69,182,1)
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Book a room"
