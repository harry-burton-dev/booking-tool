                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                PressedBorderColor: =Color.Transparent
                                                PressedColor: =ColorValue(AppTheme.ButtonPrimaryActive)
                                                PressedFill: =Color.Transparent
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =11
                                                Text: ="Home"
                                                VerticalAlign: =VerticalAlign.Bottom
                                                Width: =58
                                          - htxMb2CrumbTail:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                Height: =16
                                                HtmlText: |-
                                                  ="<div style=""display: flex; align-items: center; gap: 4px;"">" &
                                                  CarbonSpan(CarbonHtmlType.Label01, "/", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "My bookings", AppThemeHex.TextSecondary) &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Width: =176
                                    - mb2LblPageTitle:
                                        Control: Label
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =AppTheme.TextPrimary
                                          Fill: =Color.Transparent
                                          Font: ="IBM Plex Sans"
                                          FontWeight: =FontWeight.Semibold
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =28
                                          Text: ="My bookings"
                                          Wrap: =false
                              - mb2LblPageMeta:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =AppTheme.TextSecondary
                                    Fill: =Color.Transparent
                                    Font: ="IBM Plex Sans"
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: =Text(MyBookingsUpcomingCount, "[$-en-US]0") & " upcoming"
                                    Width: =260
                                    Wrap: =false
                        - mb2ConNextUp:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.layer01Bg
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =!IsBlank(NextBookingRecord)
                            Children:
                              - mb2RectNextAccent:
                                  Control: Rectangle
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =Color.Transparent
                                    Fill: =ColorValue(AppTheme.Primary)
                                    Height: =70
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =3
                              - mb2ConNextText:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =8
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - htxMbNextText:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: |-
                                            =CarbonTextColored(CarbonHtmlType.Eyebrow, "NEXT UP", AppThemeHex.TextMuted) &
                                            CarbonText(CarbonHtmlType.HeadingCompact01, fnHtmlEscape(NextBookingRecord.Title)) &
                                            CarbonTextSecondary(
                                                CarbonHtmlType.Label01,
                                                fnHtmlEscape(NextBookingRecord.'RoomID: Title'.Value & " · " & Text(NextBookingRecord.StartDateTime, "HH:mm") & " – " & Text(NextBookingRecord.EndDateTime, "HH:mm"))
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                              - mb2LblNextCountdown:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorValue(AppTheme.Primary)
                                    Fill: =Color.Transparent
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingRight: =16
                                    Size: =12
                                    Text: |-
                                      =With(
                                          {_mins: DateDiff(varNowTick, NextBookingRecord.StartDateTime, TimeUnit.Minutes)},
                                          If(_mins <= 0, "In progress", "Starts in " & Text(_mins, "[$-en-US]0") & "m")
                                      )
                                    Width: =160
                                    Wrap: =false
                        - mb2ConToolbar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - mb2ConTabs:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =480
                                  Children:
                                    - mb2ConTabUpcoming:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =48
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =160
                                        Children:
                                          - mb2BtnTabUpcoming:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =If(varMyBookingsFilter = "Upcoming", AppTheme.TextPrimary, AppTheme.TextSecondary)
                                                DisabledBorderColor: =Color.Transparent
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =AppTheme.SurfaceAlt
                                                Fill: =If(varMyBookingsFilter = "Upcoming", AppTheme.Background, AppTheme.SurfaceAlt)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =46
                                                HoverBorderColor: =Color.Transparent
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Set(varMyBookingsFilter, "Upcoming")
                                                PressedBorderColor: =Color.Transparent
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="Upcoming " & Text(MyBookingsUpcomingCount, "[$-en-US]0")
                                                Width: =Parent.Width
                                          - mb2RectTabUpcomingBar:
                                              Control: Rectangle
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                Fill: =If(varMyBookingsFilter = "Upcoming", ColorValue(AppTheme.Primary), AppTheme.Border)
                                                Height: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                                    - mb2ConTabPast:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =48
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =160
                                        Children:
                                          - mb2BtnTabPast:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =If(varMyBookingsFilter = "Past", AppTheme.TextPrimary, AppTheme.TextSecondary)
                                                DisabledBorderColor: =Color.Transparent
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =AppTheme.SurfaceAlt
                                                Fill: =If(varMyBookingsFilter = "Past", AppTheme.Background, AppTheme.SurfaceAlt)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =46
                                                HoverBorderColor: =Color.Transparent
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Set(varMyBookingsFilter, "Past")
                                                PressedBorderColor: =Color.Transparent
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="Past " & Text(MyBookingsPastCount, "[$-en-US]0")
                                                Width: =Parent.Width
                                          - mb2RectTabPastBar:
                                              Control: Rectangle
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                Fill: =If(varMyBookingsFilter = "Past", ColorValue(AppTheme.Primary), AppTheme.Border)
                                                Height: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                                    - mb2ConTabSeries:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =48
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =160
                                        Children:
                                          - mb2BtnTabSeries:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =If(varMyBookingsFilter = "Series", AppTheme.TextPrimary, AppTheme.TextSecondary)
                                                DisabledBorderColor: =Color.Transparent
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =AppTheme.SurfaceAlt
                                                Fill: =If(varMyBookingsFilter = "Series", AppTheme.Background, AppTheme.SurfaceAlt)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =46
                                                HoverBorderColor: =Color.Transparent
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Set(varMyBookingsFilter, "Series")
                                                PressedBorderColor: =Color.Transparent
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="Series " & Text(MyBookingsSeriesCount, "[$-en-US]0")
                                                Width: =Parent.Width
                                          - mb2RectTabSeriesBar:
                                              Control: Rectangle
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =Color.Transparent
                                                Fill: =If(varMyBookingsFilter = "Series", ColorValue(AppTheme.Primary), AppTheme.Border)
                                                Height: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =Parent.Width
                              - mb2TxtSearch:
                                  Control: Classic/TextInput
                                  Properties:
                                    AccessibleLabel: ="Search meetings or rooms"
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Default: =""
                                    DelayOutput: =true
                                    Fill: =AppTheme.layer01Bg
                                    FillPortions: =1
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    HintText: ="Search meetings or rooms"
                                    HoverBorderColor: =AppTheme.TextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
                              - mb2BtnBookRoom:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    DisabledColor: =ColorValue(AppTheme.ButtonDisabledText)
                                    DisabledFill: =ColorValue(AppTheme.ButtonDisabled)
                                    Fill: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    Height: =48
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(gbl_UI_Book_Modal_Step, WizardStep1);
                                      // RESET-SITE[mybookings-empty-book] wizard state reset before opening step 1
                                      Set(varSelectedRoom, Blank());
                                      Set(varSelectedDate, Today());
                                      Set(varStartTime, Blank());
                                      Set(varEndTime, Blank());
                                      Set(varTitle, Blank());
                                      Set(varConflict, false);
                                      Set(varBookingError, false);
                                      Set(varSubmitting, false);
                                      Set(varTitleTouched, false);
                                      Set(gbl_UI_Book_CancelConfirm, false);
                                      Set(gbl_Book_SubmitResult, "");
                                      Set(varConflictingBooking, Blank());
                                      Set(varNextFreeSlot, Blank());
                                      Set(gblEditingBookingID, 0);
                                      With(
                                          {_now: Now(), _todayStart: DateAdd(Today(), DayStartHour * 60, TimeUnit.Minutes)},
                                          With(
                                              {_next: DateAdd(_now, Mod(15 - Mod(DateDiff(_todayStart, _now, TimeUnit.Minutes), 15), 15), TimeUnit.Minutes)},
                                              With(
                                                  {_start: If(_next < _todayStart, _todayStart, _next)},
                                                  If(
                                                      _start <= DateAdd(_todayStart, 540, TimeUnit.Minutes),
                                                      Set(varStartTime, _start);
                                                      Set(varEndTime, DateAdd(_start, 60, TimeUnit.Minutes))
                                                  )
                                              )
                                          )
                                      );
                                      Set(gbl_UI_Book_Modal, true);
                                      Set(gblUI_Nav_currentTab, "Home");
                                      Navigate(Home, ScreenTransition.Fade)
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =12
                                    Text: ="Book a room"
                        - mb2ConTableHeadWrap:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =33
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =varMyBookingsFilter <> "Series"
                            Children:
                              - mb2ConTableHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =32
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =32
                                    PaddingRight: =16
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - htxMb2TableHead:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DisplayMode: =DisplayMode.View
                                          FillPortions: =1
                                          Height: =16
                                          HtmlText: |-
                                            =/* The +10 on the sized spans mirrors the pre-existing 10px header/row column gutter - the header labels were each 10px wider than their MB2TableCols row width (ACTION was equal, so it carries no +10). */
                                            "<div style=""display: flex; align-items: center;"">" &
                                            CarbonSpan("flex: 1 1 auto; " & CarbonHtmlType.TableHead, "MEETING", AppThemeHex.TextMuted) &
                                            CarbonSpan("flex: 0 0 " & (MB2TableCols.Room + 10) & "px; " & CarbonHtmlType.TableHead, "ROOM", AppThemeHex.TextMuted) &
                                            CarbonSpan("flex: 0 0 " & (MB2TableCols.Date + 10) & "px; " & CarbonHtmlType.TableHead, "DATE", AppThemeHex.TextMuted) &
                                            CarbonSpan("flex: 0 0 " & (MB2TableCols.Time + 10) & "px; " & CarbonHtmlType.TableHead, "TIME", AppThemeHex.TextMuted) &
                                            CarbonSpan("flex: 0 0 " & (MB2TableCols.Status + 10) & "px; " & CarbonHtmlType.TableHead, "STATUS", AppThemeHex.TextMuted) &
                                            CarbonSpan("flex: 0 0 " & MB2TableCols.Action & "px; " & CarbonHtmlType.TableHead, "", AppThemeHex.TextMuted) &
                                            "</div>"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                              - mb2RectHeadRule:
                                  Control: Rectangle
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =Color.Transparent
                                    Fill: =AppTheme.Border
                                    Height: =1
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                        - mb2GalBookings:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              Fill: =AppTheme.Background
                              Items: |-
                                =Sort(
                                    Filter(MyBookings,
                                        If(varMyBookingsFilter = "Past",
                                            fnIsPast(EndDateTime),
                                            !fnIsPast(EndDateTime)
                                        ),
