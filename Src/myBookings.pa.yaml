                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =16
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =varMyBookingsFilter = "Series" && IsEmpty(mb2GalSeries.AllItems)
                              Width: =Parent.Width
                            Children:
                              - mb2LblEmptySeries:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =AppTheme.TextMuted
                                    Fill: =Color.Transparent
                                    Font: ="IBM Plex Sans"
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: ="No series bookings yet."
                                    Width: =Parent.Width
                                    Wrap: =false
                        - mb2GalSeriesOcc:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              Fill: =AppTheme.Background
                              Items: |-
                                =Sort(
                                    Filter(MyBookings, SeriesID = gbl_SelectedSeriesID),
                                    StartDateTime,
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplatePadding: =0
                              TemplateSize: =56
                              Visible: =varMyBookingsFilter = "Series" && !IsBlank(gbl_SelectedSeriesID)
                            Children:
                              - mb2RectOccBg:
                                  Control: Rectangle
                                  Properties:
                                    BorderColor: =Color.Transparent
                                    Fill: |-
                                      =If(
                                          ThisItem.Status = "Clash", AppTheme.StatusWarnBg,
                                          fnIsPast(ThisItem.EndDateTime), AppTheme.SurfaceAlt,
                                          AppTheme.Surface
                                      )
                                    Height: =Parent.TemplateHeight
                                    Width: =Parent.Width
                              - mb2RectOccDivider:
                                  Control: Rectangle
                                  Properties:
                                    BorderColor: =Color.Transparent
                                    Fill: =AppTheme.Border
                                    Height: =1
                                    Width: =Parent.Width
                                    Y: =Parent.TemplateHeight - 1
                              - mb2RectOccDot:
                                  Control: Rectangle
                                  Properties:
                                    BorderColor: =Color.Transparent
                                    Fill: |-
                                      =If(
                                          ThisItem.Status = "Clash", AppTheme.StatusWarnText,
                                          fnIsPast(ThisItem.EndDateTime), AppTheme.TextMuted,
                                          ColorValue(AppTheme.Primary)
                                      )
                                    Height: =8
                                    Width: =8
                                    X: =16
                                    Y: =24
                              - mb2LblOccDateTime:
                                  Control: Label
                                  Properties:
                                    Color: =If(ThisItem.Status = "Clash", AppTheme.StatusWarnText, AppTheme.TextPrimary)
                                    Font: ="IBM Plex Sans"
                                    Height: =Parent.TemplateHeight
                                    Size: =12
                                    Text: ="Occ " & ThisItem.OccIndex & " · " & Text(ThisItem.StartDateTime, "[$-en-US]ddd d mmm yyyy") & "  " & Text(ThisItem.StartDateTime, "HH:mm") & " – " & Text(ThisItem.EndDateTime, "HH:mm")
                                    Width: =Max(Parent.Width - 192, 120)
                                    Wrap: =false
                                    X: =32
                              - mb2LblOccStatus:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Right
                                    Color: =If(ThisItem.Status = "Clash", AppTheme.StatusWarnText, AppTheme.TextMuted)
                                    Font: ="IBM Plex Sans"
                                    Height: =Parent.TemplateHeight
                                    Size: =12
                                    Text: =If(ThisItem.Status = "Clash", "Clash", ThisItem.Status)
                                    Width: =128
                                    Wrap: =false
                                    X: =Parent.Width - 144
                              - mb2BtnOccOverlay:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =Color.Transparent
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =0
                                    Color: =Color.Transparent
                                    DisabledBorderColor: =Color.Transparent
                                    DisabledColor: =Color.Transparent
                                    DisabledFill: =Color.Transparent
                                    Fill: =Color.Transparent
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Height: =Parent.TemplateHeight
                                    HoverBorderColor: =Color.Transparent
                                    HoverColor: =Color.Transparent
                                    HoverFill: =RGBA(0, 0, 0, 0.04) // DS-EXEMPT hover tint on a transparent full-row overlay; no theme token exists for an alpha wash
                                    OnSelect: |-
                                      =// RESET-SITE[detail-modal-open] the component has no
                                      // OnVisible; confirm state must be cleared here or a
                                      // previous row's prompt survives into this one.
                                      Set(gblSelectedBooking, ThisItem);
                                      Set(gbl_UI_Detail_ConfirmMode, "");
                                      Set(gbl_UI_Detail_Modal, true)
                                    PressedBorderColor: =Color.Transparent
                                    PressedColor: =Color.Transparent
                                    PressedFill: =RGBA(0, 0, 0, 0.08) // DS-EXEMPT pressed tint on a transparent full-row overlay; no theme token exists for an alpha wash
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Text: =ThisItem.Title & ", occurrence " & ThisItem.OccIndex & ", " & Text(ThisItem.StartDateTime, "ddd dd mmm HH:mm") & ", " & ThisItem.Status & ". Open booking details"
                                    Width: =Parent.Width
                        - mb2LblFooterHint:
                            Control: Label
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =AppTheme.TextMuted
                              Fill: =Color.Transparent
                              Font: ="IBM Plex Sans"
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =11
                              Text: ="Select a booking to view details."
                              Wrap: =false
      - cpt_BookingDetailModal_myb:
          Control: CanvasComponent
          ComponentName: cpt_BookingDetailModal
          Properties:
            Height: =App.Height
            Visible: =gbl_UI_Detail_Modal = true
            Width: =App.Width
      - cpt_Modal__book_mb2:
          Control: CanvasComponent
          ComponentName: cpt_Modal_
          Properties:
            Height: =App.Height
            ModalTitleText: =
            OnSubmit: |-
              =/* Create is unreachable from this screen: both wizard-open sites Navigate(Home)
                   immediately, and the wizard scrim covers the nav bar so you cannot return
                   mid-flow. Same shape as the instance this was ported from. */
              Set(gbl_UI_Book_Modal, false)
            OnSubmitEdit: |-
              =If(cpt_Modal__book_mb2.ValidPayload && gblEditingBookingID <> 0,
                  With({_occ: First(cpt_Modal__book_mb2.PatchPayload)},
                      If(
                          !IsBlank(gblSelectedBooking.SeriesID),
                          // Series member: stash the pending times AND room (T-09/3.2 - the payload's
                          // room used to be dropped here) and ask for scope before writing anything
                          Set(gbl_PendingStart, _occ.StartDateTime);
                          Set(gbl_PendingEnd, _occ.EndDateTime);
                          Set(gbl_PendingRoomId, _occ.RoomIdNumber);
                          Set(gbl_PendingRoomText, _occ.RoomIdText);
                          Set(gbl_UI_Detail_ConfirmMode, "edit-scope");
                          /* Re-open the detail modal: bdmEditScopeRow lives inside the component, which is
                             gated on gbl_UI_Detail_Modal. Every route to this wizard closed it on the way
                             in, so without this the prompt arms invisibly and the edit is discarded. */
                          Set(gbl_UI_Detail_Modal, true),
                          // Standalone booking: unchanged single-row conflict check + Patch
                          If(
                              !IsBlank(
                                  LookUp(
                                      Filter(
                                          colBookings,
                                          Status = "Active",
                                          fnOverlaps(StartDateTime, EndDateTime, _occ.StartDateTime, _occ.EndDateTime),
                                          ID <> gblEditingBookingID
                                      ),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              ),
                              Notify("That slot is no longer free. Your booking is unchanged.", NotificationType.Warning, 6000),
                              // PROD-REVERT[booking-edit] prod form: Patch(Book_Bookings, ...) below
                              If(
                                  gblEditingBookingID < 0,
                                  /* Virtual occurrence of a series: nothing to patch — write an
                                     exception row for occurrence k of its master instead.
                                     UNREACHABLE: a virtual occurrence always has a SeriesID, so the
                                     series branch above claims it. Kept in step with the live paths. */
                                  With(
                                      {
                                          _m: LookUp(colBRMasters, ID = RoundDown(-gblEditingBookingID / 10000, 0)),
                                          _k: Mod(-gblEditingBookingID, 10000)
                                      },
                                      With(
                                          {
                                              _new: Patch(
                                                  Book_Bookings,
                                                  Defaults(Book_Bookings),
                                                  {
                                                      Title: _m.Title,
                                                      BookedByEmail: _m.BookedByEmail,
                                                      RoomID: {Id: _occ.RoomIdNumber, Value: _occ.RoomIdText},
                                                      StartDateTime: _occ.StartDateTime,
                                                      EndDateTime: _occ.EndDateTime,
                                                      IsPrivate: Coalesce(_m.IsPrivate, false),
                                                      BookedBy: _m.BookedBy,
                                                      Status: "Active",
                                                      SeriesID: _m.SeriesID,
                                                      RecurrenceType: "BR-Exception",
                                                      OccIndex: _k,
                                                      IsException: true
                                                  }
                                              )
                                          },
                                          Collect(colBookings, _new);
                                          Set(gblSelectedBooking, LookUp(AllBookings, ID = _new.ID));
                                          Notify("Booking updated", NotificationType.Success)
                                      )
                                  ),
                                  // _changes shared by the server Patch and the colBookings mirror so the field lists cannot drift
                                  With(
                                      {
                                          _changes: {
                                              Title: _occ.Title,
                                              RoomID: {Id: _occ.RoomIdNumber, Value: _occ.RoomIdText},
                                              StartDateTime: _occ.StartDateTime,
                                              EndDateTime: _occ.EndDateTime
                                          }
                                      },
                                      IfError(
                                          Patch(
                                              Book_Bookings,
                                              LookUp(Book_Bookings, ID = gblEditingBookingID),
                                              _changes
                                          ),
                                          Notify("Couldn't update this booking. Please try again.", NotificationType.Error),
                                          Refresh(Book_Bookings);
                                          UpdateIf(colBookings, ID = gblEditingBookingID, _changes);
                                          Notify("Booking updated", NotificationType.Success)
                                      )
                                  )
                              )
                          )
                      )
                  );

                  /* Negative IDs are virtual occurrences: the exception-row branch above already
                     re-pointed gblSelectedBooking at the row it created. */
                  If(
                      gblEditingBookingID > 0,
                      Set(gblSelectedBooking, LookUp(AllBookings, ID = gblEditingBookingID))
                  );
                  Set(gblEditingBookingID, 0);
                  Set(gbl_UI_Book_Modal, false)
              )
            OptionalLabelText: =" "
            Visible: =gbl_UI_Book_Modal = true
            Width: =App.Width
