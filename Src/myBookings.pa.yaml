                              - btnKeepSeries:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Fill: =AppTheme.Surface
                                    FocusedBorderColor: =RGBA(15,98,254,1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Normal
                                    Height: =28
                                    HoverColor: =AppTheme.TextPrimary
                                    HoverFill: =AppTheme.Border
                                    OnSelect: =Set(gbl_UI_CancelSeriesConfirmID, Blank())
                                    PressedColor: =AppTheme.TextPrimary
                                    PressedFill: =AppTheme.Border
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Keep series"
                                    Visible: =gbl_UI_CancelSeriesConfirmID = ThisItem.SeriesID
                                    Width: =110
                                    X: =Parent.Width - 264
                                    Y: =72
                              - btnConfirmCancelSeries:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =AppTheme.StatusBusyText
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    Fill: =AppTheme.StatusBusyText
                                    FocusedBorderColor: =RGBA(15,98,254,1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Normal
                                    Height: =28
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =ColorValue("#b81922")
                                    OnSelect: |-
                                      =// PROD-REVERT[booking-cancel] soft delete via per-row Patch; matches single-cancel pattern in bookingDetail.
                                      // UpdateIf's <> and Now() predicates aren't delegable to SharePoint, so this iterates the
                                      // client-side colBookings copy (series capped at 12 rows) and patches each row by ID instead.
                                      IfError(
                                          ForAll(
                                              Filter(colBookings, SeriesID = gbl_UI_CancelSeriesConfirmID, StartDateTime >= Now(), Status <> "Cancelled") As _m,
                                              Patch(Book_Bookings, LookUp(Book_Bookings, ID = _m.ID), {Status: "Cancelled"})
                                          ),
                                          Notify("Couldn't cancel this series. Please try again.", NotificationType.Error),
                                          Refresh(Book_Bookings);
                                          ClearCollect(colBookings, BookingWindow);
                                          Set(gbl_UI_CancelSeriesConfirmID, Blank());
                                          Notify("Series cancelled", NotificationType.Success)
                                      )
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =ColorValue("#921620")
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Yes, cancel series"
                                    Visible: =gbl_UI_CancelSeriesConfirmID = ThisItem.SeriesID
                                    Width: =130
                                    X: =Parent.Width - 144
                                    Y: =72
