App:
  Properties:
    Formulas: |-
      =ButtonProperties(kind:Text, size:Text, font:Text, text:Text, w:Number, disabled:Boolean,active:Boolean):Text = 
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          With({
                              FillColor: Switch(kind,
                                  "danger",  If(active, AppTheme.ButtonDangerActive, AppTheme.ButtonDangerPrimary),
                                  "tertiary", If(active, AppTheme.ButtonTertiaryActive, AppTheme.ButtonTertiary),
                                  "ghost",   If(active, AppTheme.ButtonPrimaryActive, "transparent"), 
                                  If(active, AppTheme.ButtonPrimaryActive, AppTheme.ButtonPrimary) 
                              ),
                              TextColor: Switch(kind,
                                  "ghost",   "#0f62fe", 
                                  AppTheme.PrimaryText 
                              ),
                              CalcHeight: Switch(Lower(size),
                                  "sm",   32,
                                  "md",   40,
                                  "lg",   48,
                                  "xl",   64,
                                  "2xl",  80,
                                  48 
                              ),
                              FontSize: Switch(Lower(size),
                                  "sm",   "12px",
                                  "md",   "14px",
                                  "lg",   "14px",
                                  "xl",   "16px",
                                  "2xl",  "18px",
                                  "14px"
                              )
                          },
                          "<svg width='" & w & "' height='" & CalcHeight & "' xmlns='http://www.w3.org/2000/svg'>
                              <rect width='100%' height='100%' 
                                  fill='" & If(disabled, "#c6c6c6", FillColor) & "' 
                                  fill-opacity='" & If(kind = "ghost" && !disabled && !active, "0", "1") & "' />
                              <text 
                                  x='16' 
                                  y='50%' 
                                  dominant-baseline='central' 
                                  fill='" & If(disabled, "#8d8d8d", TextColor) & "' 
                                  font-family=""" & font & """ 
                                  font-size='" & FontSize & "'>
                                  " & text & "
                              </text>
                          </svg>"
                      ));

                  TileProperties(kind:Text, title:Text, subtitle:Text, w:Number, h:Number, active:Boolean, disabled:Boolean, font:Text, showArrow:Boolean):Text =
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          With(
                              {
                                  _bg: Switch(kind,
                                      "primary", If(disabled, "#525252", If(active, AppTheme.ButtonDisabled, AppTheme.TileBg)),
                                      "ghost", "transparent",
                                      If(disabled, "#e0e0e0", If(active, "#e0e0e0", "#ffffff"))
                                  ),
                                  _border: Switch(kind,
                                      "primary", If(disabled, "#525252", If(active, "#002d9c", "#0f62fe")),
                                      "ghost", If(active, "#0f62fe", "#525252"),
                                      If(active, "#0f62fe", "#3d3d3d")
                                  ),
                                  _titleCol: If(disabled, "#525252", AppTheme.TileText),
                                  _subCol: If(disabled, "#393939", If(kind = "primary", "#6f6f6f", "#8d8d8d")),
                                  _arrowCol: If(disabled, "#525252", "#8d8d8d"),
                                  _font: If(IsBlank(font), "'IBM Plex Sans', sans-serif", font),
                                  _ty: Text(h / 2 - 9, "[$-en-US]0"),
                                  _sy: Text(h / 2 + 10, "[$-en-US]0"),
                                  _ax1: Text(w - 28, "[$-en-US]0"),
                                  _ax2: Text(w - 16, "[$-en-US]0"),
                                  _ay0: Text(h / 2 - 6, "[$-en-US]0"),
                                  _aym: Text(h / 2, "[$-en-US]0"),
                                  _ay1: Text(h / 2 + 6, "[$-en-US]0")
                              },
                              "<svg width='" & w & "' height='" & h & "' xmlns='http://www.w3.org/2000/svg'>" &
                              "<rect width='" & w & "' height='" & h & "' fill='" & _bg & "' stroke='" & _border & "' stroke-width='0'/>" &
                              "<text x='16' y='" & _ty & "' dominant-baseline='central' fill='" & _titleCol & "' font-family=""" & _font & """ font-size='14px' font-weight='600'>" & title & "</text>" &
                              "<text x='16' y='" & _sy & "' dominant-baseline='central' fill='" & _subCol & "' font-family=""" & _font & """ font-size='11px'>" & subtitle & "</text>" &
                              If(showArrow && !disabled,
                                  "<path d='M " & _ax1 & " " & _ay0 & " L " & _ax2 & " " & _aym & " L " & _ax1 & " " & _ay1 & "' stroke='" & _arrowCol & "' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/>",
                                  ""
                              ) &
                              "</svg>"
                          )
                      );

                  ContentSwitcherItem(text:Text, w:Number, h:Number, active:Boolean, font:Text):Text = 
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          With({
                              BgColor: If(active, AppTheme.ButtonPrimary, "#f4f4f4"),
                              TextColor: If(active, "#f4f4f4", "#8d8d8d"),
                              BorderColor: "transparent"
                          },
                          "<svg width='" & w & "' height='" & h & "' xmlns='http://www.w3.org/2000/svg'><rect width='100%' height='100%' fill='" & BgColor & "' stroke='" & BorderColor & "' stroke-width='1'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' fill='" & TextColor & "' font-family=""" & font & """ font-size='12px'>" & text & "</text></svg>"
                      ));

                  CarbonHtmlType = {
                      Label01:          "font-size: 12px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.33333; letter-spacing: 0.32px;",
                      Body01:           "font-size: 14px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.42857; letter-spacing: 0.16px;",
                      BodyCompact01:    "font-size: 14px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.28572; letter-spacing: 0.16px;",
                      HeadingCompact01: "font-size: 14px; font-family: " & CarbonFontFamily & "; font-weight: 600; line-height: 1.28572; letter-spacing: 0.16px;",
                      Heading02:        "font-size: 16px; font-family: " & CarbonFontFamily & "; font-weight: 600; line-height: 1.5; letter-spacing: 0px;",
                      Heading03:        "font-size: 20px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.4; letter-spacing: 0px;",
                      Heading04:        "font-size: 28px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.28572; letter-spacing: 0px;",
                      Eyebrow:          "font-size: 11px; font-family: " & CarbonFontFamily & "; font-weight: 400; letter-spacing: 0.6px; text-transform: uppercase;",
                      TableHead:        "font-size: 10px; font-family: " & CarbonFontFamily & "; font-weight: 400; letter-spacing: 0.32px;",
                      Code01:           "font-size: 12px; font-family: " & CarbonFontFamilyMono & "; font-weight: 400; line-height: 1.33333; letter-spacing: 0.32px;"
                  };

                  /* Kit rule: any non-literal value interpolated into a CarbonText* call goes through fnHtmlEscape (ampersand first, so entities are not double-decoded). */
                  fnHtmlEscape(t:Text):Text = Substitute(Substitute(Substitute(t, "&", "&amp;"), "<", "&lt;"), ">", "&gt;");

                  CarbonText(css:Text, content:Text):Text          = "<div style=""" & css & " color: " & AppThemeHex.TextPrimary & ";"">" & content & "</div>";
                  CarbonTextSecondary(css:Text, content:Text):Text = "<div style=""" & css & " color: " & AppThemeHex.TextSecondary & ";"">" & content & "</div>";
                  CarbonTextColored(css:Text, content:Text, hex:Text):Text = "<div style=""" & css & " color: " & hex & ";"">" & content & "</div>";

                  /* Shared HTML fragments for consolidated htx sites (T8 prep). Compositions are
                     verbatim copies of the wave-2 strings (htxHDOccHeader / htxHDNextProgLabels /
                     the legend now-marker, since merged into htxHDOccLegendAll in Home) so rendering is identical:
                     - CarbonSpan: inline styled span (css from CarbonHtmlType, text color hex).
                     - CarbonFlexBetween: space-between flex row wrapper.
                     - CarbonSwatch: square legend swatch, size parameterized. Round status dots
                       and bordered swatches keep their inline spans - border-radius/border cannot
                       ride the single-hex signature. */
                  CarbonSpan(css:Text, content:Text, hex:Text):Text = "<span style=""" & css & " color: " & hex & ";"">" & content & "</span>";
                  CarbonFlexBetween(content:Text):Text = "<div style=""display: flex; justify-content: space-between; align-items: center;"">" & content & "</div>";
                  CarbonSwatch(hex:Text, px:Number):Text = "<span style=""display: inline-block; width: " & px & "px; height: " & px & "px; background-color: " & hex & ";""></span>";

                  /* Phase-3 additions: absolute-positioned span + relative row wrapper, for the
                     Home occupancy column header (fractional-width hour marks). leftCss is a full
                     CSS length/calc() expression, e.g. "calc(170px + (100% - 218px)*0.2)". */
                  CarbonRelRow(hPx:Number, content:Text):Text = "<div style=""position: relative; height: " & hPx & "px;"">" & content & "</div>";
                  CarbonAbsSpan(leftCss:Text, css:Text, content:Text, hex:Text):Text = "<span style=""position: absolute; top: 2px; left: " & leftCss & "; " & css & " color: " & hex & ";"">" & content & "</span>";
                  CarbonAbsSpanRight(rightCss:Text, css:Text, content:Text, hex:Text):Text = "<span style=""position: absolute; top: 2px; right: " & rightCss & "; " & css & " color: " & hex & ";"">" & content & "</span>";

                  /* Single source of truth for the myBookings table columns - consumed by BOTH
                     htxMb2TableHead's flex spans (T2) and the mb2GalBookings row-label Width/X
                     properties. Change a width here, header and rows move together. */
                  MB2TableCols = { Room: 190, Date: 100, Time: 110, Status: 110, Action: 110 };

                  /* Admin all-bookings table columns - same single-source-of-truth pattern as MB2TableCols:
                     consumed by BOTH adHtxTableHead's flex spans and the adGalBookings row-label Width/X. */
                  AdminTableCols = { Room: 170, Date: 100, Time: 110, Owner: 190, Status: 110, Action: 110 };

                  //------------------------------------------------------------
                  //--- Shared predicates, policy constants, wizard step keys ---
                  //------------------------------------------------------------
                  // fnOverlaps: half-open interval intersection. Strict on both ends, so
                  // back-to-back bookings (e1 = s2) do NOT overlap. Matches every original
                  // call site, which all read: StartDateTime < otherEnd && EndDateTime > otherStart.
                  fnOverlaps(s1:DateTime, e1:DateTime, s2:DateTime, e2:DateTime):Boolean =
                      s1 < e2 && e1 > s2;

                  // fnIsPast: strictly before "now". Exactly negates the original ">= Now()" sites.
                  fnIsPast(d:DateTime):Boolean = d < Now();

                  // fnIsMine: case-insensitive, blank-safe ownership check (BUG-21 - was three
                  // different comparisons across screens, one of which lowercased only one side).
                  fnIsMine(email:Text):Boolean = Lower(Coalesce(email, "")) = Lower(User().Email);

                  /* Battle Rhythm (BR-*) helpers. Masters: any RecurrenceType starting "BR-" except
                     "BR-Exception", with IsException=false. Exceptions: "BR-Exception", IsException=true, OccIndex=k.
                     Rich rule encoding: BR-RULE;F=<D|W|M|MW>;I=<n>;BD=<1..7>;BM=<1..31>;BP=<1..4|-1>;C=<n>;U=<yyyymmdd>
                     (every key optional except F; no C and no U means a permanent series).
                     Legacy masters stay valid: BR-Weekly = F=W,I=1; BR-Fortnightly = F=W,I=2; BR-Monthly = F=M.
                     k is rule periods since the master anchor (OccIndex 0 = the anchor occurrence). */
                  fnIsBRRow(rt:Text):Boolean = StartsWith(Coalesce(rt, ""), "BR-");
                  fnBROccStart(anchor:DateTime, cadence:Text, k:Number):DateTime =
                      fnOccStart(anchor, cadence, k);
                  /* NOTE (T-10): on a multi-weekday rule (WD= with more than one digit) this is a
                     LOWER BOUND - it returns the index of the FIRST slot of d's week, which is at
                     most fnRuleNd - 1 below the true index of d. Callers using it as an upper bound
                     must therefore add fnRuleNd(...), not 1. Single-day rules are unchanged. */
                  fnBROccIndex(anchor:DateTime, cadence:Text, d:DateTime):Number =
                      With({_f: fnRuleFreq(cadence), _n: fnRuleInterval(cadence)},
                          Switch(_f,
                              "D", RoundDown(DateDiff(anchor, d, TimeUnit.Days) / _n, 0),
                              "W",
                                  With({_wd: fnRuleWD(cadence, anchor)},
                                      With({_nd: Len(_wd), _p: Max(0, Coalesce(Find(Text(Weekday(anchor)), _wd), 1) - 1), _ws: DateAdd(DateValue(anchor), -(Weekday(anchor) - 1), TimeUnit.Days)},
                                          If(_nd <= 1,
                                              RoundDown(DateDiff(anchor, d, TimeUnit.Days) / (7 * _n), 0),
                                              RoundDown(DateDiff(_ws, d, TimeUnit.Days) / (7 * _n), 0) * _nd - _p))),
                              RoundDown(DateDiff(anchor, d, TimeUnit.Months) / _n, 0)));

                  /* --- BR-RULE parsing / expansion primitives (see encoding above) --- */
                  fnRuleGet(rt:Text, key:Text):Text =
                      With({_h: Coalesce(rt, "") & ";", _t: ";" & key & "="},
                          With({_p: Find(_t, _h)},
                              If(IsBlank(_p) || _p = 0, Blank(),
                                  With({_r: Mid(_h, _p + Len(_t))},
                                      Left(_r, Find(";", _r) - 1)))));
                  fnRuleIsMaster(rt:Text):Boolean =
                      StartsWith(Coalesce(rt, ""), "BR-") && Coalesce(rt, "") <> "BR-Exception";
                  fnRuleFreq(rt:Text):Text =
                      Switch(rt,
                          "BR-Weekly", "W",
                          "BR-Fortnightly", "W",
                          "BR-Monthly", "M",
                          Coalesce(fnRuleGet(rt, "F"), "W"));
                  fnRuleInterval(rt:Text):Number =
                      If(rt = "BR-Fortnightly", 2, Max(1, Value(Coalesce(fnRuleGet(rt, "I"), "1"))));
                  fnRuleBD(rt:Text, anchor:DateTime):Number =
                      Coalesce(Value(fnRuleGet(rt, "BD")), Weekday(anchor));
                  fnRuleBM(rt:Text, anchor:DateTime):Number =
                      Coalesce(Value(fnRuleGet(rt, "BM")), Day(anchor));
                  fnRuleBP(rt:Text):Number = Coalesce(Value(fnRuleGet(rt, "BP")), 1);
                  /* T-10: WD= is the multi-weekday key on F=W rules - ascending Weekday() digits
                     (1 = Sunday ... 7 = Saturday), e.g. ";WD=246" = Mon/Wed/Fri. Absent means "the
                     anchor's weekday only", which is exactly the pre-T-10 behaviour, so fnRuleNd = 1
                     is the untouched single-day path everywhere below. WD always contains the
                     anchor's own weekday (the writers guarantee it). */
                  fnRuleWD(rt:Text, anchor:DateTime):Text =
                      Coalesce(fnRuleGet(rt, "WD"), Text(Weekday(anchor)));
                  fnRuleNd(rt:Text, anchor:DateTime):Number =
                      Len(fnRuleWD(rt, anchor));
                  fnRuleCount(rt:Text):Number =
                      With({_c: fnRuleGet(rt, "C")}, If(IsBlank(_c) || _c = "", Blank(), Value(_c)));
                  fnRuleUntil(rt:Text):Date =
                      With({_u: fnRuleGet(rt, "U")},
                          If(IsBlank(_u),
                              Blank(),
                              Date(Value(Left(_u, 4)), Value(Mid(_u, 5, 2)), Value(Mid(_u, 7, 2)))));
                  fnRuleIsPermanent(rt:Text):Boolean =
                      fnRuleIsMaster(rt) && IsBlank(fnRuleGet(rt, "C")) && IsBlank(fnRuleGet(rt, "U"));
                  fnOrdinal(n:Number):Text =
                      Switch(n, 1, "first", 2, "second", 3, "third", 4, "fourth", -1, "last", Text(n));

                  /* Date of occurrence k (k=0 is the anchor's own date). Blank when the period has no
                     valid date - Power Fx rolls e.g. Feb 30 forward, so those months are skipped. */
                  fnOccDate(anchor:DateTime, rt:Text, k:Number):Date =
                      With({_a: DateValue(anchor), _n: fnRuleInterval(rt), _f: fnRuleFreq(rt)},
                          Switch(_f,
                              "D", DateAdd(_a, k * _n, TimeUnit.Days),
                              /* Multi-weekday weeks: k indexes OCCURRENCES, not weeks. Slots run
                                 ascending inside a week, so occurrence _p + k sits in week
                                 RoundDown((_p + k) / _nd) counted from the anchor's own week (_ws is
                                 that week's Sunday) at slot Mod(_p + k, _nd). k = 0 lands back on the
                                 anchor by construction, since _p is the anchor's own slot. */
                              "W",
                                  With({_wd: fnRuleWD(rt, anchor)},
                                      With({_nd: Len(_wd), _p: Max(0, Coalesce(Find(Text(Weekday(_a)), _wd), 1) - 1), _ws: DateAdd(_a, -(Weekday(_a) - 1), TimeUnit.Days)},
                                          If(_nd <= 1,
                                              DateAdd(_a, k * _n * 7, TimeUnit.Days),
                                              With({_idx: _p + k},
                                                  DateAdd(_ws, RoundDown(_idx / _nd, 0) * 7 * _n + (Value(Mid(_wd, Mod(_idx, _nd) + 1, 1)) - 1), TimeUnit.Days))))),
                              "MW",
                                  With({_first: Date(Year(_a), Month(_a) + k * _n, 1), _bd: fnRuleBD(rt, anchor), _bp: fnRuleBP(rt)},
                                      If(_bp > 0,
                                          With({_d: DateAdd(_first, Mod(_bd - Weekday(_first) + 7, 7) + (_bp - 1) * 7, TimeUnit.Days)},
                                              If(Month(_d) = Month(_first), _d, Blank())),
                                          With({_last: DateAdd(Date(Year(_first), Month(_first) + 1, 1), -1, TimeUnit.Days)},
                                              DateAdd(_last, -Mod(Weekday(_last) - _bd + 7, 7), TimeUnit.Days)))),
                              With({_bm: fnRuleBM(rt, anchor)},
                                  With({_d: Date(Year(_a), Month(_a) + k * _n, _bm)},
                                      If(Day(_d) = _bm, _d, Blank())))));
                  fnOccStart(anchor:DateTime, rt:Text, k:Number):DateTime =
                      With({_d: fnOccDate(anchor, rt, k)},
                          If(IsBlank(_d), Blank(), DateAdd(_d, Hour(anchor) * 60 + Minute(anchor), TimeUnit.Minutes)));

                  /* Highest k worth generating: a frequency-dependent cap, tightened by an explicit C=.
                     T-13/B2: on F=W the cap counts OCCURRENCES, not weeks, so a multi-weekday rule
                     needs one cap-unit per booking day or it stops short (WD=246 covered ~17 weeks
                     instead of 52). WD is read straight off the rule string - absent means one day,
                     which is the untouched single-day cap. */
                  fnRuleKmax(rt:Text):Number =
                      With({_f: fnRuleFreq(rt), _n: fnRuleInterval(rt), _c: fnRuleCount(rt)},
                          With({_cap: Switch(_f,
                                  "D", RoundDown(800 / _n, 0),
                                  "W", RoundDown(120 * Max(1, Len(Coalesce(fnRuleGet(rt, "WD"), "1"))) / _n, 0),
                                  RoundDown(30 / _n, 0))},
                              If(IsBlank(_c), _cap, _c - 1)));

                  /* Human-readable cadence label. Covers one-offs, the pre-BR real-row series strings,
                     exception rows and every BR-RULE master. 2026-03-01 is a Sunday (Weekday 1). */
                  fnRuleLabel(rt:Text, anchor:DateTime):Text =
                      With({_rt: Coalesce(rt, "")},
                          If(_rt = "", "One-off",
                          If(_rt = "Weekly", "Weekly",
                          If(_rt = "BiWeekly", "Every 2 weeks",
                          If(_rt = "Monthly", "Monthly",
                          If(_rt = "BR-Exception", "Moved occurrence",
                          If(!fnRuleIsMaster(_rt), _rt,
                              With({_f: fnRuleFreq(_rt), _n: fnRuleInterval(_rt), _c: fnRuleCount(_rt), _u: fnRuleUntil(_rt)},
                                  With({_cad: Switch(_f,
                                          "D", If(_n = 1, "Daily", "Every " & _n & " days"),
                                          "W",
                                              With({_wd: fnRuleWD(_rt, anchor)},
                                                  With({_days: Concat(Sequence(Len(_wd)) As _i, Text(DateAdd(Date(2026, 3, 1), Value(Mid(_wd, _i.Value, 1)) - 1, TimeUnit.Days), "[$-en-US]ddd") & ", ")},
                                                      If(_n = 1, "Weekly", "Every " & _n & " weeks") &
                                                      If(Len(_wd) > 1, " on " & Left(_days, Len(_days) - 2), ""))),
                                          "MW", If(_n = 1, "Monthly", "Every " & _n & " months") & " on the " & fnOrdinal(fnRuleBP(_rt)) & " " & Text(DateAdd(Date(2026, 3, 1), fnRuleBD(_rt, anchor) - 1, TimeUnit.Days), "[$-en-US]dddd"),
                                          If(_n = 1, "Monthly", "Every " & _n & " months") & " on day " & fnRuleBM(_rt, anchor))},
                                      _cad &
                                      If(fnRuleIsPermanent(_rt), " · permanent",
                                      If(!IsBlank(_c), " · " & _c & " times",
                                      If(!IsBlank(_u), " · until " & Text(_u, "dd mmm yyyy"), "")))))
                          )))))));

                  /* --- T-09: rule surgery for the "this and following" split ---------------
                     fnRuleCanon upgrades a legacy BR-Weekly/BR-Fortnightly/BR-Monthly string
                     (no keys at all) to an explicit BR-RULE so the key-level edits below have
                     something to bite on; an existing BR-RULE passes through untouched.
                     fnRuleStripEnd drops whichever end marker is present (C wins over U, so
                     giving a series an end date means removing C as well as any old U).
                     fnRuleWithUntil ends a series on a given date.
                     fnRuleRebase builds the rule of the NEW series whose occurrence 0 is
                     newAnchor, split off at index k of the old one. */
                  fnRuleCanon(rt:Text, anchor:DateTime):Text =
                      If(StartsWith(Coalesce(rt, ""), "BR-RULE"), rt,
                         "BR-RULE;F=" & fnRuleFreq(rt) & ";I=" & fnRuleInterval(rt) &
                         If(fnRuleFreq(rt) = "M", ";BM=" & Day(anchor), ""));

                  /* "§" never occurs in a rule, so an absent key substitutes a needle that
                     cannot match - a no-op pass rather than a branch. */
                  fnRuleStripEnd(rt:Text):Text =
                      With({_c: fnRuleGet(rt, "C"), _u: fnRuleGet(rt, "U")},
                          Substitute(Substitute(rt, If(IsBlank(_c), "§", ";C=" & _c), ""), If(IsBlank(_u), "§", ";U=" & _u), ""));

                  fnRuleWithUntil(rt:Text, anchor:DateTime, u:DateTime):Text =
                      fnRuleStripEnd(fnRuleCanon(rt, anchor)) & ";U=" & Text(u, "yyyymmdd");

                  /* Only the date-shaped keys that are actually present are re-derived, and only
                     when the split occurrence's date actually moved; every other key (F, I, and
                     anything a later ticket adds) passes through untouched. The end marker is
                     re-appended last: C shrinks by k, otherwise the old U carries over,
                     otherwise the new series stays permanent. */
                  fnRuleRebase(rt:Text, anchor:DateTime, newAnchor:DateTime, k:Number):Text =
                      With(
                          {
                              _base: fnRuleStripEnd(fnRuleCanon(rt, anchor)),
                              _moved: DateValue(newAnchor) <> fnOccDate(anchor, rt, k),
                              _c: fnRuleCount(rt),
                              _u: fnRuleGet(rt, "U")
                          },
                          With(
                              {
                                  _bm: fnRuleGet(_base, "BM"),
                                  _bd: fnRuleGet(_base, "BD"),
                                  _bp: fnRuleGet(_base, "BP"),
                                  _wd: fnRuleGet(_base, "WD"),
                                  /* weekday of the occurrence being split off (not the master anchor's) */
                                  _kwd: Text(Weekday(fnOccDate(anchor, rt, k)))
                              },
                              With(
                                  {
                                      _keys: If(!_moved, _base,
                                          Substitute(
                                          Substitute(
                                              Substitute(
                                                  Substitute(
                                                      _base,
                                                      If(IsBlank(_bm), "§", ";BM=" & _bm),
                                                      If(IsBlank(_bm), "", ";BM=" & Day(newAnchor))),
                                                  If(IsBlank(_bd), "§", ";BD=" & _bd),
                                                  If(IsBlank(_bd), "", ";BD=" & Weekday(newAnchor))),
                                              If(IsBlank(_bp), "§", ";BP=" & _bp),
                                              If(IsBlank(_bp), "", ";BP=" & If(Day(newAnchor) >= 29, -1, RoundUp(Day(newAnchor) / 7, 0)))),
                                          /* WD: swap the split occurrence's weekday for the new anchor's and re-sort,
                                             so the new anchor is always a member of its own weekday set */
                                          If(IsBlank(_wd), "§", ";WD=" & _wd),
                                          If(IsBlank(_wd), "",
                                              ";WD=" & Concat(Sequence(7) As _d,
                                                  If(Text(_d.Value) = Text(Weekday(newAnchor)) ||
                                                     Coalesce(Find(Text(_d.Value), Substitute(_wd, _kwd, "")), 0) > 0,
                                                      Text(_d.Value), "")))))
                                  },
                                  _keys &
                                  If(!IsBlank(_c), ";C=" & (_c - k),
                                     If(!IsBlank(_u), ";U=" & _u, ""))
                              )
                          )
                      );

                  /* Recurrence panel contract — the shared surface the wizard/permanent panel binds to.
                     Anchors come from the wizard globals in "recurring" mode and from the explicit
                     permanent-panel anchor globals in "permanent" mode (Admin has no wizard pickers). */
                  RecurAnchorStart = If(gblRecurMode = "permanent", gblRecurAnchorStart, Coalesce(varStartTime, Now()));

                  RecurAnchorEnd = If(gblRecurMode = "permanent", gblRecurAnchorEnd, Coalesce(varEndTime, DateAdd(RecurAnchorStart, 60, TimeUnit.Minutes)));

                  RecurRoomId = If(gblRecurMode = "permanent", gblRecurRoomId, Value(varSelectedRoom.ID));

                  RecurFreqCode = If(gblRecurFreq = "M" && gblRecurMonthMode = "weekday", "MW", gblRecurFreq);

                  /* T-10: the weekday set the chips are editing, normalised for the rule writer -
                     ascending Weekday() digits, the anchor's own weekday always present (it is the
                     one chip that cannot be switched off), and weekend digits dropped when the site
                     policy blocks weekends. gblRecurWD is the raw, unordered chip accumulator. */
                  RecurWD =
                      With({_aw: Text(Weekday(RecurAnchorStart)), _sel: Coalesce(gblRecurWD, "")},
                          Concat(Sequence(7) As _d,
                              If(Text(_d.Value) = _aw ||
                                 (Find(Text(_d.Value), _sel) > 0 && (WeekendPolicy = "allow" || (_d.Value >= 2 && _d.Value <= 6))),
                                  Text(_d.Value), "")));

                  RecurRule =
                      With({_d: DateValue(RecurAnchorStart)},
                          "BR-RULE;F=" & RecurFreqCode &
                          ";I=" & Max(1, gblRecurInterval) &
                          If(RecurFreqCode = "W" && Len(RecurWD) > 1, ";WD=" & RecurWD, "") &
                          If(RecurFreqCode = "M", ";BM=" & Day(_d), "") &
                          If(RecurFreqCode = "MW", ";BD=" & Weekday(_d) & ";BP=" & If(Day(_d) >= 29, -1, RoundUp(Day(_d) / 7, 0)), "") &
                          If(gblRecurMode = "permanent" || gblRecurEndMode = "never", "",
                              If(gblRecurEndMode = "date", ";U=" & Text(gblRecurUntil, "yyyymmdd"), ";C=" & Max(2, gblRecurCount))));

                  RecurLabel = fnRuleLabel(RecurRule, RecurAnchorStart);

                  /* Weekday-only expansion capped at 52 rows (_kmax + 1). Inside the clash Filter,
                     StartDateTime/EndDateTime bind to the AllBookings row; the occurrence window
                     comes from _q. */
                  RecurOccurrences =
                      With({_kmax: Min(fnRuleKmax(RecurRule), 51), _dur: DateDiff(RecurAnchorStart, RecurAnchorEnd, TimeUnit.Minutes), _until: fnRuleUntil(RecurRule)},
                          ForAll(
                              Filter(
                                  ForAll(Sequence(_kmax + 1, 0) As _k,
                                      {K: _k.Value, S: fnOccStart(RecurAnchorStart, RecurRule, _k.Value)}
                                  ) As _o,
                                  !IsBlank(_o.S),
                                  WeekendPolicy = "allow" || (Weekday(_o.S) >= 2 && Weekday(_o.S) <= 6),
                                  IsBlank(_until) || DateValue(_o.S) <= _until
                              ) As _q,
                              {
                                  K: _q.K,
                                  StartDateTime: _q.S,
                                  EndDateTime: DateAdd(_q.S, _dur, TimeUnit.Minutes),
                                  IsClash: !IsEmpty(
                                      Filter(AllBookings,
                                          Status = "Active",
                                          RoomID.Id = RecurRoomId,
                                          fnOverlaps(StartDateTime, EndDateTime, _q.S, DateAdd(_q.S, _dur, TimeUnit.Minutes))
                                      )
                                  )
                              }
                          ));

                  RecurPreview = FirstN(RecurOccurrences, 8);

                  RecurCount = CountRows(RecurOccurrences);

                  RecurClashCount = CountRows(Filter(RecurOccurrences, IsClash));

                  RecurAllowed = gblRecurMode = "permanent" || IsAdmin || gblRecurEndMode <> "never";

                  /* --- T-06: booking route, wizard defaults, favourite rooms ---------------
                     The wizard still advances by step number 1 -> 2 -> 3. Only WHICH container
                     is the Room step and which is the When step swaps with the route, so every
                     "this is the Room step" / "this is the When step" test goes through the two
                     mappings below rather than through a bare step literal. */
                  WizardStepRoom = If(gblBookRoute = "time", WizardStep2, WizardStep1);
                  WizardStepWhen = If(gblBookRoute = "time", WizardStep1, WizardStep2);

                  /* Per-user booking defaults from Book_UserSettings (gblUserSettings). */
                  DefaultBookRoute = Coalesce(gblUserSettings.BookingRoute.Value, "room");
                  /* The route the user did NOT make their default - Home offers both entry
                     points and orders the two booking tiles by DefaultBookRoute. */
                  OtherBookRoute = If(DefaultBookRoute = "time", "room", "time");
                  WizardDefaultDurationMin = Coalesce(gblUserSettings.DefaultDurationMin, 60);
                  WizardDefaultStartHour = Coalesce(gblUserSettings.DefaultStartHour, DayStartHour);
                  WizardDefaultRoomId = Coalesce(gblUserSettings.DefaultRoomID, 0);

                  /* FavouriteRoomIDs is a single Text column holding a comma-separated list of
                     colRooms IDs; parsed once here so every consumer tests membership the same way. */
                  FavouriteRoomIds =
                      ForAll(
                          Filter(
                              Split(Coalesce(gblUserSettings.FavouriteRoomIDs, ""), ",") As _s,
                              !IsBlank(Trim(_s.Value))
                          ) As _f,
                          {Id: Value(Trim(_f.Value))}
                      );
                  fnIsFavourite(roomId:Number):Boolean = !IsBlank(LookUp(FavouriteRoomIds, Id = roomId));

                  /* Rooms browse list with the Favourites chip applied (gblRoomsFavOnly). */
                  RoomsBrowseFavFiltered =
                      Filter(RoomsBrowseData As _rmf, !gblRoomsFavOnly || fnIsFavourite(_rmf.ID));


                  DayStartHour = SettingNumber("DayStartHour", 8);
                  DayEndHour = SettingNumber("DayEndHour", 18);
                  SlotMinutes = SettingNumber("SlotMinutes", 15);
                  /* "block" (the default) marks Saturday/Sunday occurrences as clashes;
                     "allow" lets weekend bookings through everywhere. */
                  WeekendPolicy = Coalesce(SettingText("WeekendPolicy"), "block");
                  SiteName = Coalesce(SettingText("SiteName"), "MOC");
                  MaxBookingMinutes = 240;

                  /* The one bounded source for the colBookings snapshot. Rolling window:
                     every consumer (MyBookings -90d, Find/Rooms day views, clash checks)
                     filters narrower than this. Both predicates are delegable to SharePoint
                     (>= / <= on DateTime), which decides WHERE the rows are filtered, not how
                     many of them ClearCollect will materialise: the snapshot is still capped
                     at BookingsRowLimit below, and SharePoint returns the window oldest-first,
                     so an over-cap window drops the FURTHEST-FUTURE bookings out of timelines
                     and clash checks. (Corrects the BUG-2 note that claimed delegability alone
                     removed the cap - it does not; BookingsTruncated is what makes a capped
                     pull visible instead of silent.)
                     BOUNDS AUDIT (BOOK-6, 2026-09-08): both bounds were re-checked against
                     their consumers and NEITHER can be tightened without silently hiding real
                     bookings, so both are deliberately unchanged.
                     Start -90d: MyBookings hard-codes the same -90d lookback, and the
                     myBookings Past tab (mb2GalBookings) plus its MyBookingsPastCount label
                     show every past row in that lookback with no lower bound of their own -
                     a -30d window would silently drop days 31-90 from both. Admin's audit
                     gallery (adGalBookings) reads AllBookings through an unbounded "from"
                     date picker, so it already sees no further back than this.
                     End +24mo: a count- or until-bounded BR series expands only as far as
                     BookingsWindowEnd (see BRVirtual below), and the recurrence panel offers
                     2-52 occurrences at intervals of 1-12 from an unbounded, user-picked
                     anchor; 24 months covers the realistic ceiling of a ~12-month series
                     anchored up to ~12 months out (longer rules are an accepted known limit,
                     as for permanent series at BRVirtualEnd). Find/Rooms date navigation and
                     Admin's "to" picker are unbounded too, so any real row past this bound is
                     invisible on a day the user can still navigate to. */
                  /* MIRROR CONVENTION: colBookings is a local mirror of BookingsWindow.
                     Every Book_Bookings write must either mirror the same change into
                     colBookings or re-pull the window behind a MIRROR-FALLBACK comment;
                     single-row mirrors use blank-safe UpdateIf (no-op if the row is not local). */
                  BookingsWindowStart = DateAdd(Today(), -90, TimeUnit.Days);
                  BookingsWindowEnd   = DateAdd(Today(), 24, TimeUnit.Months);
                  /* Virtual expansion horizon for PERMANENT (open-ended) series (Harry, 2026-09-04:
                     3 months). Bounded series and real rows keep the 24-month window. KNOWN LIMIT:
                     bookings made further ahead than this will not see permanent-series occurrences
                     as busy - widen here if that bites. */
                  BRVirtualEnd = DateAdd(Today(), 3, TimeUnit.Months);
                  BookingsWindow = Filter(
                      Book_Bookings,
                      EndDateTime >= BookingsWindowStart,
                      StartDateTime <= BookingsWindowEnd
                  );

                  /* App settings > General > "Data row limit for non-delegable queries".
                     ClearCollect never materialises more than this many rows, however
                     delegable the query is. Confirmed 2000 in Studio on 2026-09-09 (the
                     maximum; the Power Apps default is 500). This MUST track that setting:
                     set HIGHER than the real value and BookingsTruncated can never fire - the
                     silent failure this exists to prevent - while setting it LOWER makes the
                     warning fire on complete data. Re-check if the app setting is ever changed. */
                  BookingsRowLimit = 2000;
                  /* True when the last colBookings pull came back at the cap: the mirror is
                     then a prefix of BookingsWindow rather than the whole window, and every
                     consumer of it (Find/Rooms timelines, occupancy, the whole-series retime
                     clash check in bookingDetail) is reading incomplete data. Checked here
                     rather than at each of the ~10 ClearCollect sites, and against colBookings
                     rather than any narrower derived set - a day-window set like FindBookings
                     is far below the cap even when the pull behind it truncated. Cheap and not
                     a per-render cost: no control property binds it, so it is only evaluated
                     by the pull sites that read it. */
                  BookingsTruncated = CountRows(colBookings) >= BookingsRowLimit;
                  /* One wording for every pull site that reports the above. */
                  BookingsTruncatedWarning = "Not all bookings could be loaded - the furthest-ahead ones are missing, so timelines and clash checks may be incomplete. Please report this to your admin.";

                  /* Virtual BR occurrences over the bookings window. One in-memory record per non-deviated
                     occurrence of each Active master; a (SeriesID, OccIndex) match against an exception row in
                     colBookings suppresses that occurrence (the exception row itself renders, or not, on its own
                     Status). Negative ID marks virtual rows un-Patchable; consumers detect them via IsVirtual. */
                  BRVirtual = Ungroup(
                      ForAll(colBRMasters As m,
                          With(
                              {
                                  _dur: DateDiff(m.StartDateTime, m.EndDateTime, TimeUnit.Minutes),
                                  /* k range is window-relative for open-ended series (an old anchor must not
                                     age out of the virtual horizon); count-bounded series use C-1. */
                                  _k0: Max(0, fnBROccIndex(m.StartDateTime, m.RecurrenceType, BookingsWindowStart) - 1),
                                  /* fnBROccIndex is a lower bound on multi-weekday rules, so the upper
                                     end of the k range widens by one k per booking day (T-10), not by 1.
                                     Permanent (open-ended) series stop at BRVirtualEnd; bounded series keep the
                     24-month window (B1 - Harry's decision covers permanent bookings only). */
                                  _kmax: If(IsBlank(fnRuleCount(m.RecurrenceType)),
                                            Max(0, fnBROccIndex(m.StartDateTime, m.RecurrenceType, If(fnRuleIsPermanent(m.RecurrenceType), BRVirtualEnd, BookingsWindowEnd)) + fnRuleNd(m.RecurrenceType, m.StartDateTime)),
                                            fnRuleKmax(m.RecurrenceType)),
                                  _until: fnRuleUntil(m.RecurrenceType),
                                  _perm: fnRuleIsPermanent(m.RecurrenceType),
                                  _roomTitle: LookUp(colRooms, ID = m.RoomID.Id).Title,
                                  _exc: Filter(colBookings, SeriesID = m.SeriesID, IsException)
                              },
                              {
                                  occs: ForAll(
                                      Filter(
                                          ForAll(Sequence(Max(0, _kmax - _k0 + 1), _k0) As _k,
                                              {k: _k.Value, s: fnOccStart(m.StartDateTime, m.RecurrenceType, _k.Value)}
                                          ) As _kk,
                                          !IsBlank(_kk.s),
                                          WeekendPolicy = "allow" || (Weekday(_kk.s) >= 2 && Weekday(_kk.s) <= 6),
                                          _kk.s >= BookingsWindowStart,
                                          _kk.s <= If(_perm, BRVirtualEnd, BookingsWindowEnd),
                                          IsBlank(_until) || DateValue(_kk.s) <= _until,
                                          IsBlank(LookUp(_exc, OccIndex = _kk.k))
                                      ) As _o,
                                      {
                                          ID: -(m.ID * 10000 + _o.k),
                                          Title: m.Title,
                                          RoomID: {Id: m.RoomID.Id, Value: m.RoomID.Value},
                                          'RoomID: Title': {Value: _roomTitle},
                                          BookedBy: m.BookedBy,
                                          BookedByEmail: Coalesce(m.BookedByEmail, ""),
                                          IsPrivate: Coalesce(m.IsPrivate, false),
                                          StartDateTime: _o.s,
                                          EndDateTime: DateAdd(_o.s, _dur, TimeUnit.Minutes),
                                          Status: "Active",
                                          SeriesID: m.SeriesID,
                                          RecurrenceType: m.RecurrenceType,
                                          OccIndex: _o.k,
                                          IsException: false,
                                          IsVirtual: true,
                                          IsPermanent: _perm
                                      }
                                  )
                              }
                          )
                      ),
                      occs
                  );

                  /* THE read surface for timelines and conflict checks: real rows (masters excluded - only their
                     expansion renders/blocks) reshaped to the plain schema, unioned with BRVirtual.
                     MyBookings now reads this too (see MyBookings). */
                  AllBookings = Ungroup(
                      Table(
                          {r: ForAll(
                                  Filter(colBookings, !(fnIsBRRow(RecurrenceType) && !IsException)) As b,
                                  {
                                      ID: b.ID,
                                      Title: b.Title,
                                      RoomID: {Id: b.RoomID.Id, Value: b.RoomID.Value},
                                      'RoomID: Title': {Value: b.'RoomID: Title'.Value},
                                      BookedBy: b.BookedBy,
                                      BookedByEmail: Coalesce(b.BookedByEmail, ""),
                                      IsPrivate: b.IsPrivate,
                                      StartDateTime: b.StartDateTime,
                                      EndDateTime: b.EndDateTime,
                                      Status: b.Status,
                                      SeriesID: Coalesce(b.SeriesID, ""),
                                      RecurrenceType: Coalesce(b.RecurrenceType, ""),
                                      OccIndex: Coalesce(b.OccIndex, 0),
                                      IsException: Coalesce(b.IsException, false),
                                      IsVirtual: false,
                                      IsPermanent: If(Coalesce(b.IsException, false), fnRuleIsPermanent(LookUp(colBRMasters, SeriesID = b.SeriesID).RecurrenceType), false)
                                  }
                              )},
                          {r: BRVirtual}
                      ),
                      r
                  );

                  WizardStep1 = "1";
                  WizardStep2 = "2";
                  WizardStep3 = "3";

                  AppVersionInfo = "Phase 6 · 2026-07-26";
                  /* AdminEmails stays as the bootstrap super-admin list: these two addresses are
                     always admins and cannot be removed from the Admin > Settings tab, so the app can
                     never lock every admin out. Everyone else comes from Book_AppSettings.
                     UI-level gating only: SharePoint list permissions are unchanged (see spec section 3). */
                  AdminEmails = ["harry@harry-burton.ai", "harry.burton100@mod.gov.uk"];

                  /* Typed accessors over the Book_AppSettings key/value list (colAppSettings is pulled in OnStart). */
                  SettingText(key:Text):Text = LookUp(colAppSettings, Title = key).Value;
                  SettingNumber(key:Text, dflt:Number):Number = With({_v: SettingText(key)}, If(IsBlank(_v), dflt, Value(_v)));

                  /* What's new: the settings date is the release stamp; a user has seen it when their
                     Book_UserSettings.LastSeenWhatsNew matches. Blank date = no announcement to show. */
                  WhatsNewDate = Coalesce(SettingText("WhatsNewDate"), "");
                  WhatsNewSeen = Coalesce(gblUserSettings.LastSeenWhatsNew, "") = WhatsNewDate;

                  AdminEmailList = Filter(colAppSettings, Title = "AdminEmail");

                  IsAdmin = Lower(User().Email) in AdminEmails || !IsBlank(LookUp(AdminEmailList, Lower(Value) = Lower(User().Email)));
                  /* Sandbox sentinel - the production revert flips this to false (MOCK_DATA.md) */
                  IsSandbox = false;

                  //--------------------------------------------------------
                  //--- Room facilities vocabulary (T3): classification tags,
                  //--- system/equipment tag matching, derived-key helpers ---
                  //--------------------------------------------------------

                  /* In-code fallback vocabularies (T3). These are what ClassificationLevels/
                     SystemTagList/EquipmentTagList resolve to before any admin configures rows
                     in Book_AppSettings, so the feature works out of the box. */
                  ClassificationDefaults = Table(
                      {Code: "OFF", Label: "Official",           Rank: 10, ColorToken: "StatusFree"},
                      {Code: "OS",  Label: "Official-Sensitive", Rank: 20, ColorToken: "StatusBusy"},
                      {Code: "SEC", Label: "Secret",             Rank: 30, ColorToken: "StatusBusy"}
                  );
                  SystemTagDefaults = Table(
                      {Code: "MODNET",     Label: "MODNET"},
                      {Code: "DVS",        Label: "DVS"},
                      {Code: "VTC",        Label: "VTC"},
                      {Code: "STANDALONE", Label: "Standalone"}
                  );
                  EquipmentTagDefaults = Table(
                      {Code: "Screen",     Label: "Screen"},
                      {Code: "Whiteboard", Label: "Whiteboard"},
                      {Code: "Projector",  Label: "Projector"},
                      {Code: "VC",         Label: "VC"}
                  );

                  /* Settings-backed vocabularies (T3). Rows share Title = "Classification" /
                     "SystemTag" / "EquipmentTag" in Book_AppSettings (same multi-row-key
                     pattern as AdminEmailList above), pipe-delimited in Value:
                     Classification is code|label|rank|themeToken, the tag lists are code|label.
                     Falls back to the in-code defaults above when no rows are configured yet.
                     ClassificationLevels is sorted by Rank ascending. */
                  ClassificationLevels = With(
                      {_rows: Filter(colAppSettings, Title = "Classification")},
                      If(
                          IsEmpty(_rows),
                          ClassificationDefaults,
                          Sort(
                              ForAll(
                                  _rows As _r,
                                  With(
                                      {_p: Split(_r.Value, "|")},
                                      {
                                          Code: Index(_p, 1).Value,
                                          Label: Index(_p, 2).Value,
                                          Rank: Value(Index(_p, 3).Value),
                                          ColorToken: Index(_p, 4).Value
                                      }
                                  )
                              ),
                              Rank,
                              SortOrder.Ascending
                          )
                      )
                  );
                  SystemTagList = With(
                      {_rows: Filter(colAppSettings, Title = "SystemTag")},
                      If(
                          IsEmpty(_rows),
                          SystemTagDefaults,
                          ForAll(
                              _rows As _r,
                              With(
                                  {_p: Split(_r.Value, "|")},
                                  {Code: Index(_p, 1).Value, Label: Index(_p, 2).Value}
                              )
                          )
                      )
                  );
                  EquipmentTagList = With(
                      {_rows: Filter(colAppSettings, Title = "EquipmentTag")},
                      If(
                          IsEmpty(_rows),
                          EquipmentTagDefaults,
                          ForAll(
                              _rows As _r,
                              With(
                                  {_p: Split(_r.Value, "|")},
                                  {Code: Index(_p, 1).Value, Label: Index(_p, 2).Value}
                              )
                          )
                      )
                  );

                  /* Tag key/match helpers (T3, defect B-1). Canonical key form is lowercase,
                     semicolon-delimited, WITH leading and trailing semicolons - that is what
                     makes fnHasTag an exact membership test instead of a substring match
                     (";vc;" in ";screen;vc;" is true; ";vc;" in ";screen;avc;" is false). */
                  fnTagKey(raw:Text):Text =
                      ";" & Concat(
                          ForAll(
                              Split(Substitute(Coalesce(raw, ""), ",", ";"), ";") As _t,
                              {V: Trim(_t.Value)}
                          ),
                          If(IsBlank(V), "", Lower(V) & ";")
                      );

                  fnHasTag(key:Text, tag:Text):Boolean = ";" & Lower(Trim(tag)) & ";" in key;

                  /* Classification rank helper (T3). 0 for a blank or unrecognised code, so an
                     unrated room never outranks a rated one in classification-ordered
                     comparisons. The LookUp is inlined rather than split into a fnClassOf
                     companion: a UDF must declare a return type, and Power Fx has no record
                     return type to declare here (probe compile 2026-09-09 rejected it with
                     "'fnClassOf' is an unknown or unsupported function"). Consumers that need
                     the whole level record LookUp ClassificationLevels directly. */
                  fnClassRank(code:Text):Number = Coalesce(LookUp(ClassificationLevels, Code = code).Rank, 0);

                  //--------------------------------------------------------
                  //--- End room facilities vocabulary (T3) ---
                  //--------------------------------------------------------

                  ThemeMap = {
                      Light: {
                          PrimaryText: ThemeMapHex.Light.PrimaryText,
                          TextPrimary: ColorValue(ThemeMapHex.Light.TextPrimary),
                          TextSecondary: ColorValue(ThemeMapHex.Light.TextSecondary),
                          TextMuted: ColorValue(ThemeMapHex.Light.TextMuted),
                          Border: ColorValue(ThemeMapHex.Light.Border),
                          Surface: ColorValue(ThemeMapHex.Light.Surface),
