App:
  Properties:
    Formulas: |-
      =ButtonProperties(kind:Text, size:Text, font:Text, text:Text, w:Number, disabled:Boolean,active:Boolean):Text = 
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          With({
                              FillColor: Switch(kind,
                                  "danger",  If(active, AppTheme.ButtonDangerActive, AppTheme.ButtonDangerPrimary),
                                  "tertiary", If(active, AppTheme.ButtonTertiaryActive, AppTheme.ButtonTertiary),
                                  "ghost",   If(active, AppTheme.ButtonPrimaryActive, "transparent"), 
                                  If(active, AppTheme.ButtonPrimaryActive, AppTheme.ButtonPrimary) 
                              ),
                              TextColor: Switch(kind,
                                  "ghost",   "#0f62fe", 
                                  AppTheme.PrimaryText 
                              ),
                              CalcHeight: Switch(Lower(size),
                                  "sm",   32,
                                  "md",   40,
                                  "lg",   48,
                                  "xl",   64,
                                  "2xl",  80,
                                  48 
                              ),
                              FontSize: Switch(Lower(size),
                                  "sm",   "12px",
                                  "md",   "14px",
                                  "lg",   "14px",
                                  "xl",   "16px",
                                  "2xl",  "18px",
                                  "14px"
                              )
                          },
                          "<svg width='" & w & "' height='" & CalcHeight & "' xmlns='http://www.w3.org/2000/svg'>
                              <rect width='100%' height='100%' 
                                  fill='" & If(disabled, "#c6c6c6", FillColor) & "' 
                                  fill-opacity='" & If(kind = "ghost" && !disabled && !active, "0", "1") & "' />
                              <text 
                                  x='16' 
                                  y='50%' 
                                  dominant-baseline='central' 
                                  fill='" & If(disabled, "#8d8d8d", TextColor) & "' 
                                  font-family=""" & font & """ 
                                  font-size='" & FontSize & "'>
                                  " & text & "
                              </text>
                          </svg>"
                      ));

                  TileProperties(kind:Text, title:Text, subtitle:Text, w:Number, h:Number, active:Boolean, disabled:Boolean, font:Text, showArrow:Boolean):Text =
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          With(
                              {
                                  _bg: Switch(kind,
                                      "primary", If(disabled, "#525252", If(active, AppTheme.ButtonDisabled, AppTheme.TileBg)),
                                      "ghost", "transparent",
                                      If(disabled, "#e0e0e0", If(active, "#e0e0e0", "#ffffff"))
                                  ),
                                  _border: Switch(kind,
                                      "primary", If(disabled, "#525252", If(active, "#002d9c", "#0f62fe")),
                                      "ghost", If(active, "#0f62fe", "#525252"),
                                      If(active, "#0f62fe", "#3d3d3d")
                                  ),
                                  _titleCol: If(disabled, "#525252", AppTheme.TileText),
                                  _subCol: If(disabled, "#393939", If(kind = "primary", "#6f6f6f", "#8d8d8d")),
                                  _arrowCol: If(disabled, "#525252", "#8d8d8d"),
                                  _font: If(IsBlank(font), "'IBM Plex Sans', sans-serif", font),
                                  _ty: Text(h / 2 - 9, "[$-en-US]0"),
                                  _sy: Text(h / 2 + 10, "[$-en-US]0"),
                                  _ax1: Text(w - 28, "[$-en-US]0"),
                                  _ax2: Text(w - 16, "[$-en-US]0"),
                                  _ay0: Text(h / 2 - 6, "[$-en-US]0"),
                                  _aym: Text(h / 2, "[$-en-US]0"),
                                  _ay1: Text(h / 2 + 6, "[$-en-US]0")
                              },
                              "<svg width='" & w & "' height='" & h & "' xmlns='http://www.w3.org/2000/svg'>" &
                              "<rect width='" & w & "' height='" & h & "' fill='" & _bg & "' stroke='" & _border & "' stroke-width='0'/>" &
                              "<text x='16' y='" & _ty & "' dominant-baseline='central' fill='" & _titleCol & "' font-family=""" & _font & """ font-size='14px' font-weight='600'>" & title & "</text>" &
                              "<text x='16' y='" & _sy & "' dominant-baseline='central' fill='" & _subCol & "' font-family=""" & _font & """ font-size='11px'>" & subtitle & "</text>" &
                              If(showArrow && !disabled,
                                  "<path d='M " & _ax1 & " " & _ay0 & " L " & _ax2 & " " & _aym & " L " & _ax1 & " " & _ay1 & "' stroke='" & _arrowCol & "' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/>",
                                  ""
                              ) &
                              "</svg>"
                          )
                      );

                  ContentSwitcherItem(text:Text, w:Number, h:Number, active:Boolean, font:Text):Text = 
                      "data:image/svg+xml;utf8," & EncodeUrl(
                          With({
                              BgColor: If(active, AppTheme.ButtonPrimary, "#f4f4f4"),
                              TextColor: If(active, "#f4f4f4", "#8d8d8d"),
                              BorderColor: "transparent"
                          },
                          "<svg width='" & w & "' height='" & h & "' xmlns='http://www.w3.org/2000/svg'><rect width='100%' height='100%' fill='" & BgColor & "' stroke='" & BorderColor & "' stroke-width='1'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' fill='" & TextColor & "' font-family=""" & font & """ font-size='12px'>" & text & "</text></svg>"
                      ));

                  CarbonHtmlType = {
                      Label01:          "font-size: 12px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.33333; letter-spacing: 0.32px;",
                      Body01:           "font-size: 14px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.42857; letter-spacing: 0.16px;",
                      BodyCompact01:    "font-size: 14px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.28572; letter-spacing: 0.16px;",
                      HeadingCompact01: "font-size: 14px; font-family: " & CarbonFontFamily & "; font-weight: 600; line-height: 1.28572; letter-spacing: 0.16px;",
                      Heading02:        "font-size: 16px; font-family: " & CarbonFontFamily & "; font-weight: 600; line-height: 1.5; letter-spacing: 0px;",
                      Heading03:        "font-size: 20px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.4; letter-spacing: 0px;",
                      Heading04:        "font-size: 28px; font-family: " & CarbonFontFamily & "; font-weight: 400; line-height: 1.28572; letter-spacing: 0px;",
                      Eyebrow:          "font-size: 11px; font-family: " & CarbonFontFamily & "; font-weight: 400; letter-spacing: 0.6px; text-transform: uppercase;",
                      TableHead:        "font-size: 10px; font-family: " & CarbonFontFamily & "; font-weight: 400; letter-spacing: 0.32px;"
                  };

                  /* Kit rule: any non-literal value interpolated into a CarbonText* call goes through fnHtmlEscape (ampersand first, so entities are not double-decoded). */
                  fnHtmlEscape(t:Text):Text = Substitute(Substitute(Substitute(t, "&", "&amp;"), "<", "&lt;"), ">", "&gt;");

                  CarbonText(css:Text, content:Text):Text          = "<div style=""" & css & " color: " & AppThemeHex.TextPrimary & ";"">" & content & "</div>";
                  CarbonTextSecondary(css:Text, content:Text):Text = "<div style=""" & css & " color: " & AppThemeHex.TextSecondary & ";"">" & content & "</div>";
                  CarbonTextColored(css:Text, content:Text, hex:Text):Text = "<div style=""" & css & " color: " & hex & ";"">" & content & "</div>";

                  /* Shared HTML fragments for consolidated htx sites (T8 prep). Compositions are
                     verbatim copies of the wave-2 strings (htxHDOccHeader / htxHDNextProgLabels /
                     the legend now-marker, since merged into htxHDOccLegendAll in Home) so rendering is identical:
                     - CarbonSpan: inline styled span (css from CarbonHtmlType, text color hex).
                     - CarbonFlexBetween: space-between flex row wrapper.
                     - CarbonSwatch: square legend swatch, size parameterized. Round status dots
                       and bordered swatches keep their inline spans - border-radius/border cannot
                       ride the single-hex signature. */
                  CarbonSpan(css:Text, content:Text, hex:Text):Text = "<span style=""" & css & " color: " & hex & ";"">" & content & "</span>";
                  CarbonFlexBetween(content:Text):Text = "<div style=""display: flex; justify-content: space-between; align-items: center;"">" & content & "</div>";
                  CarbonSwatch(hex:Text, px:Number):Text = "<span style=""display: inline-block; width: " & px & "px; height: " & px & "px; background-color: " & hex & ";""></span>";

                  /* Phase-3 additions: absolute-positioned span + relative row wrapper, for the
                     Home occupancy column header (fractional-width hour marks). leftCss is a full
                     CSS length/calc() expression, e.g. "calc(170px + (100% - 218px)*0.2)". */
                  CarbonRelRow(hPx:Number, content:Text):Text = "<div style=""position: relative; height: " & hPx & "px;"">" & content & "</div>";
                  CarbonAbsSpan(leftCss:Text, css:Text, content:Text, hex:Text):Text = "<span style=""position: absolute; top: 2px; left: " & leftCss & "; " & css & " color: " & hex & ";"">" & content & "</span>";
                  CarbonAbsSpanRight(rightCss:Text, css:Text, content:Text, hex:Text):Text = "<span style=""position: absolute; top: 2px; right: " & rightCss & "; " & css & " color: " & hex & ";"">" & content & "</span>";

                  /* Single source of truth for the myBookings table columns - consumed by BOTH
                     htxMb2TableHead's flex spans (T2) and the mb2GalBookings row-label Width/X
                     properties. Change a width here, header and rows move together. */
                  MB2TableCols = { Room: 190, Date: 100, Time: 110, Status: 110, Action: 110 };

                  //------------------------------------------------------------
                  //--- Shared predicates, policy constants, wizard step keys ---
                  //------------------------------------------------------------
                  // fnOverlaps: half-open interval intersection. Strict on both ends, so
                  // back-to-back bookings (e1 = s2) do NOT overlap. Matches every original
                  // call site, which all read: StartDateTime < otherEnd && EndDateTime > otherStart.
                  fnOverlaps(s1:DateTime, e1:DateTime, s2:DateTime, e2:DateTime):Boolean =
                      s1 < e2 && e1 > s2;

                  // fnIsPast: strictly before "now". Exactly negates the original ">= Now()" sites.
                  fnIsPast(d:DateTime):Boolean = d < Now();

                  DayStartHour = 8;
                  DayEndHour = 18;
                  SlotMinutes = 15;
                  MaxBookingMinutes = 240;

                  /* The one bounded source for the colBookings snapshot. Rolling window:
                     every consumer (MyBookings -90d, Find/Rooms day views, clash checks)
                     filters narrower than this. Both predicates are delegable to SharePoint
                     (>= / <= on DateTime), so the pull no longer truncates at the
                     data-row limit for in-window rows (BUG-2). End = 24 months: the
                     longest series is 12 monthly occurrences (last at start+11 months)
                     and the start date is user-picked and unbounded, so 12 months alone
                     only covers series starting today. */
                  /* MIRROR CONVENTION: colBookings is a local mirror of BookingsWindow.
                     Every Book_Bookings write must either mirror the same change into
                     colBookings or re-pull the window behind a MIRROR-FALLBACK comment;
                     single-row mirrors use blank-safe UpdateIf (no-op if the row is not local). */
                  BookingsWindowStart = DateAdd(Today(), -90, TimeUnit.Days);
                  BookingsWindowEnd   = DateAdd(Today(), 24, TimeUnit.Months);
                  BookingsWindow = Filter(
                      Book_Bookings,
                      EndDateTime >= BookingsWindowStart,
                      StartDateTime <= BookingsWindowEnd
                  );

                  WizardStep1 = "1";
                  WizardStep2 = "2";
                  WizardStep3 = "3";

                  AppVersionInfo = "Phase 6 · 2026-07-26";
                  /* Sandbox sentinel - the production revert flips this to false (MOCK_DATA.md) */
                  IsSandbox = false;

                  ThemeMap = {
                      Light: {
                          PrimaryText: ThemeMapHex.Light.PrimaryText,
                          TextPrimary: ColorValue(ThemeMapHex.Light.TextPrimary),
                          TextSecondary: ColorValue(ThemeMapHex.Light.TextSecondary),
                          TextMuted: ColorValue(ThemeMapHex.Light.TextMuted),
                          Border: ColorValue(ThemeMapHex.Light.Border),
                          Surface: ColorValue(ThemeMapHex.Light.Surface),
                          SurfaceAlt: ColorValue(ThemeMapHex.Light.SurfaceAlt),
                          StatusBusyText: ColorValue(ThemeMapHex.Light.StatusBusyText),
                          StatusBusyBg: ColorValue("#fff1f1"),
                          StatusFreeText: ColorValue(ThemeMapHex.Light.StatusFreeText),
                          StatusFreeBg: ColorValue("#defbe6"),
                          StatusWarnText: ColorValue("#684e00"),
                          StatusWarnBg: ColorValue("#fcf4d6"),
                          Primary: ThemeMapHex.Light.Primary,
                          FocusedBorder: Color.Red,
                          ButtonPrimary: "#0f62fe",
                          ButtonPrimaryHover: RGBA(0, 0, 0, 0.1),
                          ButtonPrimaryActive: "#002d9c",
                          ButtonPrimaryPressed: RGBA(0, 0, 0, 0.2),
                          ButtonSecondary: "#393939",
                          ButtonSecondaryHover: RGBA(0, 0, 0, 0.1),
                          ButtonSecondaryActive: "#6f6f6f",
                          ButtonSecondaryPressed: RGBA(0, 0, 0, 0.2),
                          ButtonTertiary: "#0f62fe",
                          ButtonTertiaryHover: RGBA(0, 0, 0, 0.1),
                          ButtonTertiaryActive: "#002d9c",
                          ButtonTertiaryPressed: RGBA(0, 0, 0, 0.2),
                          ButtonDangerPrimary: "#da1e28",
                          ButtonDangerSecondary: "#da1e28",
                          ButtonDangerHover: RGBA(0, 0, 0, 0.1),
                          ButtonDangerActive: "#750e13",
                          ButtonDangerPressed: RGBA(0, 0, 0, 0.2),
                          ButtonSeparator: "#e0e0e0",
                          ButtonDisabled: "#c6c6c6",
                          ButtonDisabledText: "#8d8d8d",
                          HeaderBackground: ColorValue(ColourTokens.Light.Primary),
                          HeaderBorder: ColorValue(ColourTokens.Light.BorderSubtle),
                          HeaderAccent: ColorValue(ColourTokens.Light.Accent),
                          layer01Bg: ColorValue(ColourTokens.Light.layer01Bg),
                          Background: ColorValue(ColourTokens.Light.Background),
                          SideNavBg:           ColorValue(ColourTokens.Light.SideNavBg),
                          SideNavItemHover:    ColorValue(ColourTokens.Light.SideNavItemHover),
                          SideNavItemActive:   ColorValue(ColourTokens.Light.SideNavItemActive),
                          SideNavItemSelected: ColorValue(ColourTokens.Light.SideNavItemSelected),
                          SideNavText:         ColorValue(ColourTokens.Light.SideNavText),
                          SideNavTextActive:   ColorValue(ColourTokens.Light.SideNavTextActive),
                          SideNavActiveBar:    ColorValue(ColourTokens.Light.SideNavActiveBar),
                          SideNavSectionLabel: ColorValue(ColourTokens.Light.SideNavSectionLabel),
                          SideNavDivider:      ColorValue(ColourTokens.Light.SideNavDivider),
                          SideNavFooterBg:     ColorValue(ColourTokens.Light.SideNavFooterBg),
                          SideNavFooterText:   ColorValue(ColourTokens.Light.SideNavFooterText),
                          SwitcherNavBg:       ColorValue(ColourTokens.Light.Primary),
                          TileBg:              ColourTokens.Light.layer01Bg,
                          TileText:              ColourTokens.Light.SideNavText,
                          HeaderNavBg: ColorValue("#161616"),
                          HeaderNavItemText: ColorValue("#f4f4f4"),
                          HeaderNavItemHover: RGBA(255, 255, 255, 0.08),
                          HeaderNavItemPressed: RGBA(255, 255, 255, 0.12),
                          HeaderNavItemActiveBg: RGBA(255, 255, 255, 0.1),
                          ModalScrim: RGBA(0, 0, 0, 0.5)
                      },
                      Dark: {
                          PrimaryText: ThemeMapHex.Dark.PrimaryText,
                          TextPrimary: ColorValue(ThemeMapHex.Dark.TextPrimary),
                          TextSecondary: ColorValue(ThemeMapHex.Dark.TextSecondary),
                          TextMuted: ColorValue(ThemeMapHex.Dark.TextMuted),
                          Border: ColorValue(ThemeMapHex.Dark.Border),
                          Surface: ColorValue(ThemeMapHex.Dark.Surface),
                          SurfaceAlt: ColorValue(ThemeMapHex.Dark.SurfaceAlt),
                          StatusBusyText: ColorValue(ThemeMapHex.Dark.StatusBusyText),
                          StatusBusyBg: ColorValue("#2d1515"),
                          StatusFreeText: ColorValue(ThemeMapHex.Dark.StatusFreeText),
                          StatusFreeBg: ColorValue("#152a17"),
                          StatusWarnText: ColorValue("#f1c21b"),
                          StatusWarnBg: ColorValue("#2d2200"),
                          Primary: ThemeMapHex.Dark.Primary,
                          FocusedBorder: Color.Red,
                          ButtonPrimary: "#0f62fe",
                          ButtonPrimaryHover: RGBA(0, 0, 0, 0.1),
                          ButtonPrimaryActive: "#002d9c",
                          ButtonPrimaryPressed: RGBA(0, 0, 0, 0.2),
                          ButtonSecondary: "#393939",
                          ButtonSecondaryHover: RGBA(0, 0, 0, 0.1),
                          ButtonSecondaryActive: "#6f6f6f",
                          ButtonSecondaryPressed: RGBA(0, 0, 0, 0.2),
                          ButtonTertiary: "#0f62fe",
                          ButtonTertiaryHover: RGBA(0, 0, 0, 0.1),
                          ButtonTertiaryActive: "#002d9c",
                          ButtonTertiaryPressed: RGBA(0, 0, 0, 0.2),
                          ButtonDangerPrimary: "#da1e28",
                          ButtonDangerSecondary: "#da1e28",
                          ButtonDangerHover: RGBA(0, 0, 0, 0.1),
                          ButtonDangerActive: "#750e13",
                          ButtonDangerPressed: RGBA(0, 0, 0, 0.2),
                          ButtonSeparator: "#e0e0e0",
                          ButtonDisabled: "#c6c6c6",
                          ButtonDisabledText: "#8d8d8d",
                          HeaderBackground: ColorValue(ColourTokens.Dark.Primary),
                          HeaderBorder: ColorValue(ColourTokens.Dark.BorderSubtle),
                          HeaderAccent: ColorValue(ColourTokens.Dark.Accent),
                          Background: ColorValue(ColourTokens.Dark.Background),
                          layer01Bg: ColorValue(ColourTokens.Dark.layer01Bg),
                          SideNavBg:           ColorValue(ColourTokens.Dark.SideNavBg),
                          SideNavItemHover:    ColorValue(ColourTokens.Dark.SideNavItemHover),
                          SideNavItemActive:   ColorValue(ColourTokens.Dark.SideNavItemActive),
                          SideNavItemSelected: ColorValue(ColourTokens.Dark.SideNavItemSelected),
                          SideNavText:         ColorValue(ColourTokens.Dark.SideNavText),
                          SideNavTextActive:   ColorValue(ColourTokens.Dark.SideNavTextActive),
                          SideNavActiveBar:    ColorValue(ColourTokens.Dark.SideNavActiveBar),
                          SideNavSectionLabel: ColorValue(ColourTokens.Dark.SideNavSectionLabel),
                          SideNavDivider:      ColorValue(ColourTokens.Dark.SideNavDivider),
                          SideNavFooterBg:     ColorValue(ColourTokens.Dark.SideNavFooterBg),
                          SideNavFooterText:   ColorValue(ColourTokens.Dark.SideNavFooterText),
                          SwitcherNavBg:       ColorValue(ColourTokens.Dark.Primary),
                          TileBg:              ColourTokens.Dark.layer01Bg,
                          TileText:              ColourTokens.Dark.SideNavText,
                          HeaderNavBg: ColorValue("#161616"),
                          HeaderNavItemText: ColorValue("#f4f4f4"),
                          HeaderNavItemHover: RGBA(255, 255, 255, 0.08),
                          HeaderNavItemPressed: RGBA(255, 255, 255, 0.12),
                          HeaderNavItemActiveBg: RGBA(255, 255, 255, 0.1),
                          ModalScrim: RGBA(0, 0, 0, 0.5)
                      }
                  };

                  ColourTokens = {
                      Light: {
                          BorderSubtle: "#e0e0e0",
                          Background: "#ffffff",
                          PrimaryText: "#ffffff", /* no longer referenced - live source is ThemeMapHex.Light.PrimaryText */
                          Primary: "#0f62fe",
                          Accent: "#d0e2ff",
                          layer01Bg: "#f4f4f4",
                          SideNavBg:            "#ffffff",
                          SideNavItemHover:     "#e8e8e880",
                          SideNavItemActive:    "#e0e0e0",
                          SideNavItemSelected:  "#d0e2ff",
                          SideNavText:          "#525252",
                          SideNavTextActive:    "#161616",
                          SideNavActiveBar:     "#0f62fe",
                          SideNavSectionLabel:  "#8d8d8d",
                          SideNavDivider:       "#e0e0e0",
                          SideNavFooterBg:      "#f4f4f4",
                          SideNavFooterText:    "#8d8d8d"
                      },
                      Dark: {
                          BorderSubtle: "#393939",
                          Background: "#161616",
                          Primary: "#0f62fe",
                          PrimaryText: "#ffffff", /* no longer referenced - live source is ThemeMapHex.Dark.PrimaryText */
                          Accent: "#d0e2ff",
                          layer01Bg: "#262626",
                          SideNavBg:            "#161616",
                          SideNavItemHover:     "#2d2d2d80",
                          SideNavItemActive:    "#393939",
                          SideNavItemSelected:  "#002d9c",
                          SideNavText:          "#c6c6c6",
                          SideNavTextActive:    "#f4f4f4",
                          SideNavActiveBar:     "#4589ff",
                          SideNavSectionLabel:  "#6f6f6f",
                          SideNavDivider:       "#393939",
                          SideNavFooterBg:      "#262626",
                          SideNavFooterText:    "#6f6f6f"
                      }
                  };

                  /* ThemeMapHex is the source of truth for the ten lifted color tokens
                     (TextPrimary/TextSecondary/TextMuted/StatusBusyText/StatusFreeText/Primary/PrimaryText/
                     Border/Surface/SurfaceAlt - the last three lifted for the RoomsTimeline legend swatches, T8) - plain
                     hex strings, since a CSS string cannot embed a Color value. Same light/dark
                     branch shape as ThemeMap - KEEP IN SYNC with the corresponding ThemeMap
                     entries, which derive their Color values via ColorValue(ThemeMapHex.X.Y).
                     Primary is a three-copy chain: the literal lives in ColourTokens.X.Primary,
                     ThemeMapHex derives from it, ThemeMap derives from ThemeMapHex - KEEP ALL
                     THREE IN SYNC when changing the brand color.
                     AppThemeHex resolves ThemeMapHex to the active theme for direct hex access
                     in HTML/CSS composition (CarbonText* UDFs).
                     NOTE: distinct from ThemeHex below, which is %23-URL-encoded for embedding
                     in SVG data-URIs, not for CSS style strings. */
                  ThemeMapHex = {
                      Light: {
                          TextPrimary: "#161616",
                          TextSecondary: "#525252",
                          TextMuted: "#6f6f6f",
                          StatusBusyText: "#da1e28",
                          StatusFreeText: "#198038",
                          Primary: ColourTokens.Light.Primary,
                          PrimaryText: "#ffffff",
                          Border: "#e0e0e0",
                          Surface: "#ffffff",
                          SurfaceAlt: "#f4f4f4",
                          HeaderBackground: ColourTokens.Light.Primary,
                          Layer01Bg: ColourTokens.Light.layer01Bg,
                          HeaderNavItemText: "#f4f4f4", /* header band is dark in both themes - Light and Dark carry the same value */
                          WordmarkSecondary: "#c6c6c6" /* borrows ButtonDisabled (#c6c6c6) as wordmark secondary tint - retheme together; see T6 */
                      },
                      Dark: {
                          TextPrimary: "#f4f4f4",
                          TextSecondary: "#c6c6c6",
                          TextMuted: "#8d8d8d",
                          StatusBusyText: "#ff8389",
                          StatusFreeText: "#42be65",
                          Primary: ColourTokens.Dark.Primary,
                          PrimaryText: "#ffffff",
                          Border: "#393939",
                          Surface: "#161616",
                          SurfaceAlt: "#262626",
                          HeaderBackground: ColourTokens.Dark.Primary,
                          Layer01Bg: ColourTokens.Dark.layer01Bg,
                          HeaderNavItemText: "#f4f4f4", /* header band is dark in both themes - Light and Dark carry the same value */
                          WordmarkSecondary: "#c6c6c6" /* borrows ButtonDisabled (#c6c6c6) as wordmark secondary tint - retheme together; see T6 */
                      }
                  };

                  AppThemeHex = If(glbIsDarkMode, ThemeMapHex.Dark, ThemeMapHex.Light);

                  AppTheme = If(glbIsDarkMode, ThemeMap.Dark, ThemeMap.Light);

                  /* URL-encoded hex mirror of AppTheme for SVG data-URIs.
                     KEEP IN SYNC with AppTheme - a token changed there must change here. */
                  ThemeHex = {
                      HeaderNavItemText: "%23f4f4f4"
                  };

                  // Single source for the Shell_Header icon set (was pasted per-screen - Q-3)
                  ShellIconSet = {
                      ShellIconMenu: $"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect x='2' y='4' width='16' height='2' fill='{ThemeHex.HeaderNavItemText}'/><rect x='2' y='9' width='16' height='2' fill='{ThemeHex.HeaderNavItemText}'/><rect x='2' y='14' width='16' height='2' fill='{ThemeHex.HeaderNavItemText}'/></svg>",
                      ShellIconClose: $"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><line x1='3' y1='3' x2='17' y2='17' stroke='{ThemeHex.HeaderNavItemText}' stroke-width='2'/><line x1='17' y1='3' x2='3' y2='17' stroke='{ThemeHex.HeaderNavItemText}' stroke-width='2'/></svg>",
                      ShellIconSearch: $"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='9' cy='9' r='6' fill='none' stroke='{ThemeHex.HeaderNavItemText}' stroke-width='2'/><line x1='13.5' y1='13.5' x2='17' y2='17' stroke='{ThemeHex.HeaderNavItemText}' stroke-width='2' stroke-linecap='round'/></svg>",
                      ShellIconNotification: $"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><path d='M10 2C7.24 2 5 4.24 5 7v7l-2 2h14l-2-2V7c0-2.76-2.24-5-5-5z' fill='{ThemeHex.HeaderNavItemText}'/><rect x='8.5' y='16' width='3' height='2.5' rx='1.5' fill='{ThemeHex.HeaderNavItemText}'/></svg>",
                      ShellIconAppSwitcher: $"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect x='2' y='2' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/><rect x='8' y='2' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/><rect x='14' y='2' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/><rect x='2' y='8' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/><rect x='8' y='8' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/><rect x='14' y='8' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/><rect x='2' y='14' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/><rect x='8' y='14' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/><rect x='14' y='14' width='4' height='4' fill='{ThemeHex.HeaderNavItemText}'/></svg>"
                  };

                  CarbonFontFamily = "'IBM Plex Sans', 'Segoe UI', Arial";

                  glbSideNavIconStr =
                      If(!glbIsDarkMode, "rgba(198,198,198,1)", "rgba(82,82,82,1)");
                  glbSideNavIconActiveStr =
                      If(!glbIsDarkMode, "rgba(69,137,255,1)", "rgba(15,98,254,1)");

                  Timeline_OpenHour = DayStartHour;
                  Timeline_CloseHour = DayEndHour;
                  Timeline_HoursPerDay = Timeline_CloseHour - Timeline_OpenHour;
                  Timeline_PxPerMinute = 2;
                  Timeline_WeekDayCount = 5;
                  Timeline_WeekCellPx = (Timeline_HoursPerDay * 60 * Timeline_PxPerMinute) / Timeline_WeekDayCount;

                  Timeline_DayStart = DateAdd(DateValue(Text(glbSelectedDate, "yyyy-mm-dd")), DayStartHour * 60, TimeUnit.Minutes);
                  Timeline_DayEnd = DateAdd(DateValue(Text(glbSelectedDate, "yyyy-mm-dd")), DayEndHour * 60, TimeUnit.Minutes);
                  Timeline_SlotMinutes = SlotMinutes;
                  Timeline_SlotCount = 40;

                  // In-progress booking on the RoomsTimeline screen's selected room/day
                  // (colRoomBookings is materialized by RoomsTimeline tl2BtnLoadTimeline,
                  // already clamped to the day window). Consumer: RoomsTimeline
                  // tl2HtxStatusRow.HtmlText (dot colour + status text share this LookUp, PERF-7).
                  // Blank when no booking spans varNowTick.
                  TimelineCurrentBooking = LookUp(colRoomBookings, StartDateTime <= varNowTick && EndDateTime > varNowTick);




                  //------------------------------
                  //--- Find Timeline Formulas ---
                  //------------------------------

                  varFindWindowStart = DateAdd(DateValue(Text(varFindSelectedDate,"yyyy-mm-dd")),DayStartHour*60,TimeUnit.Minutes);
                  varFindWindowEnd   = If(varFindViewMode="Day",DateAdd(DateValue(Text(varFindSelectedDate,"yyyy-mm-dd")),DayEndHour*60,TimeUnit.Minutes),DateAdd(DateValue(Text(varFindSelectedDate,"yyyy-mm-dd")),7*24*60-360,TimeUnit.Minutes));
                  varFindWeekStart   = DateAdd(varFindSelectedDate,-(Weekday(varFindSelectedDate,StartOfWeek.Monday)-1),TimeUnit.Days);
                  WeekBookings = Filter(colBookings,
                      Status = "Active",
                      fnOverlaps(StartDateTime, EndDateTime, varFindWeekStart, DateAdd(varFindWeekStart, Timeline_WeekDayCount * 24 * 60, TimeUnit.Minutes))
                  );

                  //----------------------------------
                  //--- End Find Timeline Formulas ---
                  //----------------------------------

                  //--------------------------------------------------
                  //--- Derived data (named formulas — always fresh) ---
                  //--------------------------------------------------
                  // Date bounds first (delegable against SharePoint after revert);
                  // person narrowing on BookedByEmail (plain text column = delegable eq).

                  TodayBookings = Sort(
                      Filter(colBookings,
                          Status = "Active",
                          StartDateTime >= Date(Year(varNowTick), Month(varNowTick), Day(varNowTick)),
                          StartDateTime < DateAdd(Date(Year(varNowTick), Month(varNowTick), Day(varNowTick)), 1, TimeUnit.Days)
                      ),
                      StartDateTime, SortOrder.Ascending
                  );

                  // Working-day window for "today" (varNowTick, not Now(), so it recalcs with the
                  // rest of the Home surface). Occupancy is measured against this window only.
                  TodayWindowStart = DateAdd(Date(Year(varNowTick), Month(varNowTick), Day(varNowTick)), DayStartHour * 60, TimeUnit.Minutes);
                  TodayWindowEnd   = DateAdd(Date(Year(varNowTick), Month(varNowTick), Day(varNowTick)), DayEndHour * 60, TimeUnit.Minutes);
                  WorkingDayMinutes = (DayEndHour - DayStartHour) * 60;

                  // Occupancy per room = booked minutes inside the working-day window / working-day minutes.
                  // Booking spans are clamped to the window so early/late/overnight bookings cannot
                  // push a room past 100%. Shaped once here (one Filter per room) instead of once per
                  // gallery control per row.
                  RoomOccupancyToday = ForAll(
                      colRooms As _r,
                      With(
                          {
                              _bookings: Filter(TodayBookings, RoomID.Id = _r.ID)
                          },
                          {
                              RoomId: _r.ID,
                              Title: _r.Title,
                              Pct: Min(
                                  1,
                                  Sum(
                                      ForAll(
                                          _bookings As _b,
                                          {
                                              m: Max(
                                                  0,
                                                  DateDiff(
                                                      If(_b.StartDateTime < TodayWindowStart, TodayWindowStart, _b.StartDateTime),
                                                      If(_b.EndDateTime > TodayWindowEnd, TodayWindowEnd, _b.EndDateTime),
                                                      TimeUnit.Minutes
                                                  )
                                              )
                                          }
                                      ),
                                      m
                                  ) / WorkingDayMinutes
                              ),
                              // Per-slot strip precomputed here so galHDOccSegments binds
                              // ThisItem.Slots with zero per-slot LookUps in the template.
                              Slots: ForAll(
                                  Sequence((DayEndHour - DayStartHour) * 2) As _slot,
                                  With(
                                      {
                                          _start: DateAdd(
                                              TodayWindowStart,
                                              (_slot.Value - 1) * 30,
                                              TimeUnit.Minutes
                                          )
                                      },
                                      {
                                          SlotStart: _start,
                                          SlotEnd: DateAdd(_start, 30, TimeUnit.Minutes),
                                          IsBooked: !IsBlank(
                                              LookUp(
                                                  _bookings,
                                                  fnOverlaps(
                                                      StartDateTime,
                                                      EndDateTime,
                                                      _start,
                                                      DateAdd(_start, 30, TimeUnit.Minutes)
                                                  )
                                              )
                                          )
                                      }
                                  )
                              )
                          }
                      )
                  );

                  // Rooms with no active booking covering this instant. Consumers: Home
                  // lblHDStatLine ("N of M rooms free") and htxHDTileViewRow ("N free now")
                  // — was the same O(rooms × bookings) Filter pasted at both sites (PERF-7).
                  // varNowTick-based (directly and via TodayBookings), so it recalcs per
                  // Home visit like the rest of the Home surface.
                  FreeNowCount = CountRows(
                      Filter(colRooms As _r,
                          IsBlank(LookUp(TodayBookings, RoomID.Id = _r.ID && fnOverlaps(StartDateTime, EndDateTime, varNowTick, varNowTick)))
                      )
                  );

                  // 90-day lookback keeps the "All" tab bounded (delegation-safe on revert).
                  // Widened to include Clash rows (owner-facing surface only) - Find/Rooms
                  // timelines and all conflict checks stay Active-only.
                  MyBookings = Sort(
                      Filter(colBookings,
                          Status = "Active" || Status = "Clash",
                          EndDateTime >= DateAdd(Today(), -90, TimeUnit.Days),
                          BookedByEmail = Lower(User().Email)
                      ),
                      StartDateTime, SortOrder.Ascending
                  );

                  // "N upcoming" for the Home My-bookings tile. Consumers: htxHDTileMyRow
                  // meta line and btnHDTileMy accessible Text (was a keep-in-sync comment
                  // pair — PERF-7). Home prefix is load-bearing: varNowTick cutoff like the
                  // rest of the Home surface, distinct from MyBookingsUpcomingCount, whose
                  // fnIsPast cutoff is Now().
                  HomeMyUpcomingCount = CountRows(Filter(MyBookings, EndDateTime >= varNowTick));

                  // varNowTick (set on App.OnStart and Home.OnVisible) forces recalc per Home visit — Now() alone would not trigger re-evaluation.
                  NextBookingRecord = First(
                      Sort(
                          Filter(MyBookings, EndDateTime > varNowTick),
                          StartDateTime, SortOrder.Ascending
                      )
                  );

                  // myBookings tab/stat counts (PERF-7). Each hoists a CountRows(Filter(...))
                  // that re-evaluated inline in a Label.Text. Cutoff is Now() via fnIsPast,
                  // matching the mb2Gal* tab contents these labels count (the Home tile's
                  // HomeMyUpcomingCount cuts off at varNowTick instead).
                  // Consumers: mb2LblPageMeta stat line + mb2BtnTabUpcoming label.
                  MyBookingsUpcomingCount = CountRows(Filter(MyBookings, !fnIsPast(EndDateTime)));
                  // Consumer: mb2BtnTabPast label.
                  MyBookingsPastCount = CountRows(Filter(MyBookings, fnIsPast(EndDateTime)));
                  // Consumer: mb2BtnTabSeries label — one row per distinct SeriesID.
                  MyBookingsSeriesCount = CountRows(GroupBy(Filter(MyBookings, !IsBlank(SeriesID)), SeriesID, SeriesRows));

                  /* Booking-wizard conflict panel (cpt_Modal_, AccessAppScope): rooms free
                     for the requested slot - every room other than the selected one with
                     no row in the colOverlappingBookings working set. Each conflict site
                     still materializes colOverlappingBookings imperatively first
                     (colBookings snapshot on room/time change; Book_Bookings re-read on
                     Confirm - BUG-1), so this always reflects the state the panel opened
                     with. Consumers: conConflictPanel sizing, galAlternativeRooms,
                     lbl_textNoRoomsAvailable, btnBookAlternative. Replaces the
                     varAlternativeRooms collection that four wizard sites each rebuilt
                     with this same Filter (PERF-7; its removal also clears the
                     CollectingReadOnlyTable checker finding). */
                  AlternativeRoomsNow = Filter(
                      colRooms As rm,
                      rm.ID <> varSelectedRoom.ID &&
                      IsEmpty(Filter(colOverlappingBookings, RoomID.Id = rm.ID))
                  );

                  FindBookings = Sort(
                      ForAll(
                          Filter(colBookings,
                              Status = "Active",
                              fnOverlaps(StartDateTime, EndDateTime, varFindWindowStart, varFindWindowEnd)
                          ) As b,
                          {
                              ID: b.ID,
                              Title: b.Title,
                              RoomID: b.RoomID,
                              BookedBy: b.BookedBy,
                              BookedByEmail: b.BookedByEmail,
                              IsPrivate: b.IsPrivate,
                              StartDateTime: If(b.StartDateTime < varFindWindowStart, varFindWindowStart, b.StartDateTime),
                              EndDateTime: If(b.EndDateTime > varFindWindowEnd, varFindWindowEnd, b.EndDateTime)
                          }
                      ),
                      StartDateTime, SortOrder.Ascending
                  );

                  /* Rooms surfaced on Find after the capacity/equipment filter (P-6/S-3).
                     varFindMinCapacity: 0 = Any. varFindEquipment: "Any" or one Equipment token. */
                  FindRooms = Filter(colRooms,
                      Capacity >= varFindMinCapacity,
                      varFindEquipment = "Any" || varFindEquipment in Equipment
                  );

                  RoomsBrowseBase =
                      ForAll(
                          colRooms As _room,
                          With(
                              {
                                  _bookings: Sort(
                                      Filter(TodayBookings, RoomID.Id = _room.ID),
                                      StartDateTime,
                                      SortOrder.Ascending
                                  )
                              },
                              With(
                                  {
                                      _current: LookUp(
                                          _bookings,
                                          StartDateTime <= varNowTick && EndDateTime > varNowTick
                                      ),
                                      _next: First(
                                          Filter(_bookings, StartDateTime > varNowTick)
                                      )
                                  },
                                  {
                                      ID: _room.ID,
                                      RoomID: _room.RoomID,
                                      Title: _room.Title,
                                      Description: _room.description,
                                      Capacity: _room.Capacity,
                                      Equipment: Coalesce(_room.Equipment, ""),
                                      StatusKey: If(
                                          varNowTick < TodayWindowStart || varNowTick >= TodayWindowEnd,
                                          "OutsideHours",
                                          !IsBlank(_current),
                                          "Busy",
                                          IsBlank(_next),
                                          "FreeAllDay",
                                          "Free"
                                      ),
                                      StatusText: If(
                                          varNowTick < TodayWindowStart || varNowTick >= TodayWindowEnd,
                                          "Outside booking hours",
                                          !IsBlank(_current),
                                          "Busy until " & Text(_current.EndDateTime, "HH:mm"),
                                          IsBlank(_next),
                                          "Free all day",
                                          "Free until " & Text(_next.StartDateTime, "HH:mm")
                                      ),
                                      IsAvailableNow:
                                          varNowTick >= TodayWindowStart &&
                                          varNowTick < TodayWindowEnd &&
                                          IsBlank(_current),
                                      BookedMinutes: Sum(
                                          ForAll(
                                              _bookings As _booking,
                                              {
                                                  Minutes: Max(
                                                      0,
                                                      DateDiff(
                                                          If(_booking.StartDateTime > TodayWindowStart, _booking.StartDateTime, TodayWindowStart),
                                                          If(_booking.EndDateTime < TodayWindowEnd, _booking.EndDateTime, TodayWindowEnd),
                                                          TimeUnit.Minutes
                                                      )
                                                  )
                                              }
                                          ),
                                          Minutes
                                      ),
                                      // Per-slot strip precomputed here so galRoomsAvailabilitySegments
                                      // binds ThisItem.Slots with zero per-slot LookUps in the template.
                                      Slots: ForAll(
                                          Sequence((DayEndHour - DayStartHour) * 2) As _slot,
                                          With(
                                              {
                                                  _start: DateAdd(
                                                      TodayWindowStart,
                                                      (_slot.Value - 1) * 30,
                                                      TimeUnit.Minutes
                                                  )
                                              },
                                              {
                                                  SlotStart: _start,
                                                  SlotEnd: DateAdd(_start, 30, TimeUnit.Minutes),
                                                  IsBooked: !IsBlank(
                                                      LookUp(
                                                          _bookings,
                                                          fnOverlaps(
                                                              StartDateTime,
                                                              EndDateTime,
                                                              _start,
                                                              DateAdd(_start, 30, TimeUnit.Minutes)
                                                          )
                                                      )
                                                  )
                                              }
                                          )
                                      )
                                  }
                              )
                          )
                      );

                  RoomsBrowseData =
                      With(
                          {
                              _needle: Lower(Trim(gblRoomsSearch))
                          },
                          With(
                              {
                                  _filtered: Filter(
                                      RoomsBrowseBase As _room,
                                      IsBlank(_needle) ||
                                          _needle in Lower(_room.Title) ||
                                          _needle in Lower(_room.Description) ||
                                          _needle in Lower(_room.Equipment),
                                      _room.Capacity >= gblRoomsMinCapacity,
                                      !gblRoomsAvailableOnly || _room.IsAvailableNow,
                                      CountRows(
                                          Filter(
                                              colRoomsEquipmentFilter As _required,
                                              !(Lower(_required.Value) in Lower(_room.Equipment))
                                          )
                                      ) = 0
                                  )
                              },
                              Switch(
                                  gblRoomsSort,
                                  "Capacity: smallest",
                                      Sort(_filtered, Capacity, SortOrder.Ascending),
                                  "Capacity: largest",
                                      Sort(_filtered, Capacity, SortOrder.Descending),
                                  Sort(_filtered, Title, SortOrder.Ascending)
                              )
                          )
                      );

                  RoomsBrowseTotalCount = CountRows(colRooms);
                  RoomsBrowseFilteredCount = CountRows(RoomsBrowseData);
                  RoomsBrowseAvailableCount = CountRows(Filter(RoomsBrowseData, IsAvailableNow));

                  //--------------------------------------------------------
                  //--- Sandbox mock data (mirrors Book_Rooms/Book_Bookings) ---
                  //--------------------------------------------------------

                  /* Per-user settings - mirrors intended Book_UserSettings list (see MOCK_DATA.md).
                     Single blank-email row is bound to the signed-in user in App.OnStart. */
                  MockUserSettingsSeed = Table(
                      {Email: "", NotifyConfirm: true, NotifyCancel: true, NotifyReminder: false, ReminderMinutes: 15, NotifyDigest: false}
                  );

                  /* Sandbox stand-in for Office365Users.SearchUserV2 (P-8/S-6).
                     First row is a select-prompt sentinel: blank Mail keeps the
                     Confirm gate closed until a real person is picked.
                     colPeople stays mock until Office365Users is wired. */
                  // PROD-REVERT[people-picker-mock] mock people list; repoint to Office365Users (MS2)
                  MockPeopleSeed = Table(
                      {DisplayName: "Select a person...", Mail: ""},
                      {DisplayName: "Alex Morgan", Mail: "alex.morgan@example.com"},
                      {DisplayName: "Priya Shah",  Mail: "priya.shah@example.com"},
                      {DisplayName: "Sam Lee",     Mail: "sam.lee@example.com"},
                      {DisplayName: "Sam Patel",   Mail: "sam.patel@example.com"}
                  );

                  //--------------------------------------------------------
                  //--- End sandbox mock data ---
                  //--------------------------------------------------------
    OnError: |-
      =Trace("Unhandled error: " & FirstError.Message & " (" & FirstError.Source & ")", TraceSeverity.Error);
            Notify("Something went wrong: " & FirstError.Message, NotificationType.Error)
    OnStart: |-
      =Set(glbIsDarkMode, false);

                  Set(gblUI_Nav_currentTab, "Home");
                  Set(glbSelectedDate, Today());
                  Set(varNowTick, Now());
                  Set(varMyBookingsFilter, "Upcoming");
                  Set(varFindMinCapacity, 0);
                  Set(varFindEquipment, "Any");
                  Set(gblRoomsSearch, "");
                  Set(gblRoomsMinCapacity, 0);
                  Set(gblRoomsSort, "Name");
                  Set(gblRoomsAvailableOnly, false);
                  ClearCollect(
                      colRoomsEquipmentFilter,
                      Filter(Table({Value: ""}), !IsBlank(Value))
                  );
                  /* 0 = create mode; >0 = booking being edited */
                  Set(gblEditingBookingID, 0);
                  /* Seed the Find-screen globals the App-level named formulas
                     (varFindWindowStart/End, varFindWeekStart, WeekBookings) read —
                     without these, any consumer outside Find gets poisoned blanks (BUG-8). */
                  Set(varFindSelectedDate, Today());
                  Set(varFindViewMode, "Day");

                  Concurrent(
                      ClearCollect(colRooms, Book_Rooms),
                      ClearCollect(colBookings, BookingsWindow)
                  );


                  Set(gblUserInitials, Upper(Left(User().FullName, 1) & If(CountRows(Split(User().FullName, " ")) > 1, Left(Last(Split(User().FullName, " ")).Value, 1), "")));
                  ClearCollect(colUserSettings, MockUserSettingsSeed);
                  UpdateIf(colUserSettings, Email = "", {Email: Lower(User().Email)});
                  Set(gblUserSettings, LookUp(colUserSettings, Email = Lower(User().Email)));
                  ClearCollect(colPeople, MockPeopleSeed);
                  Set(varBookForEmail, "");
                  Set(varBookForName, "");
    Theme: =PowerAppsTheme
