                                            =ForAll(
                                                Sequence(If(varFindViewMode = "Day", Timeline_HoursPerDay * 4, Timeline_WeekDayCount)) As n,
                                                {Value: n.Value, SlotRoomID: ThisItem.ID, SlotRoomTitle: ThisItem.Title}
                                            )
                                          ShowScrollbar: =false
                                          TemplatePadding: =0
                                          TemplateSize: =Self.Width / If(varFindViewMode = "Day", Timeline_HoursPerDay * 4, Timeline_WeekDayCount)
                                          Width: =Parent.TemplateWidth - Timeline_RoomColPx
                                          X: =Timeline_RoomColPx
                                        Children:
                                          - btnFindSlot_f3:
                                              Control: Classic/Button
                                              Properties:
                                                BorderColor: =RGBA(0,0,0,0)
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =RGBA(0,0,0,0)
                                                DisabledBorderColor: =RGBA(0,0,0,0)
                                                DisabledColor: =RGBA(0,0,0,0)
                                                DisabledFill: =RGBA(0,0,0,0)
                                                Fill: =RGBA(0,0,0,0)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Height: =Parent.TemplateHeight
                                                HoverBorderColor: =RGBA(0,0,0,0)
                                                HoverColor: =RGBA(0,0,0,0)
                                                HoverFill: =RGBA(0,0,0,0.06)
                                                OnSelect: |-
                                                  =If(varFindViewMode = "Day",
                                                      /* Resolve the free run containing this 15-min slot; a click on a
                                                         booked slot is a no-op. Selection = design semantics: run start
                                                         (clamped to the next 15-min mark if already begun today),
                                                         one hour long, capped at the end of the free run. */
                                                      With({_t: DateAdd(varFindWindowStart, (ThisItem.Value - 1) * 15, TimeUnit.Minutes)},
                                                          With({_gap: LookUp(colFindRows, RoomKey = ThisItem.SlotRoomID && RowType = "free" && RowStart <= _t && RowEnd > _t)},
                                                              If(!IsBlank(_gap.RowStart),
                                                                  With(
                                                                      {
                                                                          _slotStart: _gap.RowStart,
                                                                          _slotEnd: _gap.RowEnd,
                                                                          _now: Now()
                                                                      },
                                                                      With(
                                                                          {
                                                                              _clamped: If(
                                                                                  _slotStart < _now,
                                                                                  DateAdd(
                                                                                      _now,
                                                                                      Mod(15 - Mod(DateDiff(_slotStart, _now, TimeUnit.Minutes), 15), 15),
                                                                                      TimeUnit.Minutes
                                                                                  ),
                                                                                  _slotStart
                                                                              )
                                                                          },
                                                                          With(
                                                                              {_start: If(_clamped < _slotEnd, _clamped, _slotStart)},
                                                                              UpdateContext({
                                                                                  findSelRoomID: ThisItem.SlotRoomID,
                                                                                  findSelRoomTitle: ThisItem.SlotRoomTitle,
                                                                                  findSelStart: _start,
                                                                                  findSelEnd: If(
                                                                                      DateAdd(_start, 60, TimeUnit.Minutes) < _slotEnd,
                                                                                      DateAdd(_start, 60, TimeUnit.Minutes),
                                                                                      _slotEnd
                                                                                  )
                                                                              })
                                                                          )
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      ),
                                                      /* Week: drill into that day's Day view */
                                                      Set(varFindSelectedDate, DateAdd(varFindWeekStart, ThisItem.Value - 1, TimeUnit.Days));
                                                      Set(varFindViewMode, "Day");
                                                      UpdateContext({findSelRoomID: Blank(), findSelRoomTitle: Blank(), findSelStart: Blank(), findSelEnd: Blank()});
                                                      Select(btnLoadFindBookings)
