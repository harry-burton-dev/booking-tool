                                                                    "<div style='" & CarbonHtmlType.Label01 & " font-weight:600; color:" & If(b.IsMine, AppThemeHex.PrimaryText, AppThemeHex.TextPrimary) & "; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;'>" & fnHtmlEscape(b.Title) & "</div>" &
                                                                    "<div style='" & CarbonHtmlType.Code01 & " font-size:11px; color:" & If(b.IsMine, ColourTokens.Light.Accent, AppThemeHex.TextMuted) & "; white-space:nowrap;'>" & Text(b.RowStart, "HH:mm") & "–" & Text(b.RowEnd, "HH:mm") & If(b.BookedBy <> "", " · " & fnHtmlEscape(b.BookedBy), "") & "</div>" &
