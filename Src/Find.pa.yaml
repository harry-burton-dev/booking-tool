                  - btnLoadFindBookings:
                      Control: Button
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        OnSelect: |-
                          =If(CountRows(FindBookings) >= 500,
                              Notify("Warning: results may be incomplete. Too many bookings in this window.", NotificationType.Warning)
                          );
                          // parameterised grid builder
                          Clear(colFindRows);
                          With({_s: varFindWindowStart, _e: varFindWindowEnd},
                              ForAll(FindRooms As rm,
                                  With({room: Filter(FindBookings, RoomID.Id = rm.ID)},
                                      Collect(colFindRows,
                                          ForAll(room As b, {
                                              RoomKey:   rm.ID,
                                              RowType:   "booked",
                                              RowStart:  b.StartDateTime,
                                              RowEnd:    b.EndDateTime,
                                              RowHeight: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes) * Timeline_PxPerMinute,
                                              RowMinutes: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes),
                                              Title:     If(b.IsPrivate && b.BookedByEmail <> Lower(User().Email), "Busy", b.Title),
                                              BookedBy:  If(b.IsPrivate && b.BookedByEmail <> Lower(User().Email), "", b.BookedBy.DisplayName)
                                          })
                                      );
                                      If(IsEmpty(room),
                                          Collect(colFindRows, {RoomKey:rm.ID,RowType:"free",RowStart:_s,RowEnd:_e,
                                              RowHeight:DateDiff(_s,_e,TimeUnit.Minutes)*Timeline_PxPerMinute,
                                              RowMinutes:DateDiff(_s,_e,TimeUnit.Minutes),Title:"",BookedBy:""}),
                                          First(room).StartDateTime > _s,
                                          Collect(colFindRows, {RoomKey:rm.ID,RowType:"free",RowStart:_s,RowEnd:First(room).StartDateTime,
                                              RowHeight:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes)*Timeline_PxPerMinute,
                                              RowMinutes:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes),Title:"",BookedBy:""})
                                      );
                                      ForAll(room As b,
                                          With({next: LookUp(room, StartDateTime >= b.EndDateTime, StartDateTime)},
                                              If(IsBlank(next) && b.EndDateTime < _e,
                                                  Collect(colFindRows, {RoomKey:rm.ID,RowType:"free",RowStart:b.EndDateTime,RowEnd:_e,
                                                      RowHeight:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes)*Timeline_PxPerMinute,
                                                      RowMinutes:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes),Title:"",BookedBy:""}),
                                                  !IsBlank(next) && next > b.EndDateTime,
                                                  Collect(colFindRows, {RoomKey:rm.ID,RowType:"free",RowStart:b.EndDateTime,RowEnd:next,
                                                      RowHeight:DateDiff(b.EndDateTime,next,TimeUnit.Minutes)*Timeline_PxPerMinute,
                                                      RowMinutes:DateDiff(b.EndDateTime,next,TimeUnit.Minutes),Title:"",BookedBy:""})
                                              )
                                          )
                                      )
                                  )
                              )
                          );
                          ClearCollect(colFindRows, SortByColumns(colFindRows, "RoomKey", SortOrder.Ascending, "RowStart", SortOrder.Ascending));
                          Clear(colFindWeekRows);
                          If(varFindViewMode = "Week",
                              ForAll(
                                  Sequence(Timeline_WeekDayCount) As dy2,
                                  With(
                                      {
                                          dayOpen:  DateAdd(DateAdd(varFindWeekStart, (dy2.Value - 1) * 24 * 60, TimeUnit.Minutes), Timeline_OpenHour * 60, TimeUnit.Minutes),
                                          dayClose: DateAdd(DateAdd(varFindWeekStart, (dy2.Value - 1) * 24 * 60, TimeUnit.Minutes), Timeline_CloseHour * 60, TimeUnit.Minutes)
                                      },
                                      ForAll(
                                          FindRooms As rm2,
                                          With(
                                              { overl: Filter(WeekBookings,
                                                          RoomID.Id = rm2.ID,
                                                          fnOverlaps(StartDateTime, EndDateTime, dayOpen, dayClose)) },
                                              With(
                                                  { bookedMin: Sum(
                                                          ForAll(overl As b,
                                                              DateDiff(
                                                                  If(b.StartDateTime > dayOpen, b.StartDateTime, dayOpen),
                                                                  If(b.EndDateTime < dayClose, b.EndDateTime, dayClose),
                                                                  TimeUnit.Minutes
                                                              )
                                                          ),
                                                          Value
                                                      )
                                                  },
                                                  With(
                                                      {
                                                          cellTitle: CountRows(overl) & If(CountRows(overl) = 1, " booking", " bookings"),
                                                          cellFree: RoundDown(((Timeline_HoursPerDay * 60) - bookedMin) / 60, 0) & "h " & Mod((Timeline_HoursPerDay * 60) - bookedMin, 60) & "m free"
                                                      },
                                                      Collect(colFindWeekRows, {RoomKey:rm2.ID, RowType:"week", RowStart:dayOpen, RowEnd:dayClose, RowHeight:Timeline_WeekCellPx, RowMinutes:DateDiff(dayOpen, dayClose, TimeUnit.Minutes), Title:cellTitle, BookedBy:cellFree})
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Load"
                        Visible: =false
