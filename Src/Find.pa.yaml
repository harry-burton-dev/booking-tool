                                                            Visible: =ThisItem.RowType = "booked"
                                                - conFreeSlot_v2:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =AppTheme.Border
                                                      BorderThickness: =1
                                                      DropShadow: =DropShadow.None
                                                      Fill: =AppTheme.Surface
                                                      Height: =ThisItem.RowHeight
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Visible: =varFindViewMode = "Day" && ThisItem.RowType = "free"
                                                      Width: =Parent.TemplateWidth
                                                    Children:
                                                      - btnFreeSlot_v2:
                                                          Control: Classic/Button
                                                          Properties:
                                                            BorderColor: =RGBA(0,0,0,0)
                                                            BorderStyle: =BorderStyle.None
                                                            BorderThickness: =0
                                                            Color: =AppTheme.TextMuted
                                                            DisabledBorderColor: =RGBA(0,0,0,0)
                                                            DisabledColor: =AppTheme.TextMuted
                                                            DisabledFill: =RGBA(0,0,0,0)
                                                            Fill: =RGBA(0,0,0,0)
                                                            FocusedBorderColor: =RGBA(15,98,254,1)
                                                            FocusedBorderThickness: =2
                                                            Font: =Font.Lato
                                                            Height: =Parent.Height
                                                            HoverBorderColor: =RGBA(0,0,0,0)
                                                            HoverColor: =AppTheme.TextPrimary
                                                            HoverFill: =RGBA(0,0,0,0.06)
                                                            OnSelect: |-
                                                              =Set(varSelectedDate, varFindSelectedDate);
                                                              // RESET-SITE[find-free-slot] wizard state reset before opening step 2
                                                              Set(varSelectedRoom, LookUp(colRooms, ID = ThisItem.RoomKey));
                                                              Set(varTitle, Blank());
                                                              Set(varConflict, false);
                                                              Set(varBookingError, false);
                                                              Set(varSubmitting, false);
                                                              Set(varTitleTouched, false);
                                                              Set(gbl_UI_Book_CancelConfirm, false);
                                                              Set(gbl_Book_SubmitResult, "");
                                                              Set(varConflictingBooking, Blank());
                                                              Set(varNextFreeSlot, Blank());
                                                              Set(gblEditingBookingID, 0);
                                                              ClearCollect(varAlternativeRooms, Filter(colRooms, true = false));

                                                              /* Start = slot start, pushed to the next 15-minute mark if the
                                                                 slot has already begun; End = start + 60 min, capped at the
                                                                 end of this free run. */
                                                              With(
                                                                  {
                                                                      _slotStart: ThisItem.RowStart,
                                                                      _slotEnd: ThisItem.RowEnd,
                                                                      _now: Now()
                                                                  },
                                                                  With(
                                                                      {
                                                                          _clamped: If(
                                                                              _slotStart < _now,
                                                                              DateAdd(
                                                                                  _now,
                                                                                  Mod(15 - Mod(DateDiff(_slotStart, _now, TimeUnit.Minutes), 15), 15),
                                                                                  TimeUnit.Minutes
                                                                              ),
                                                                              _slotStart
                                                                          )
                                                                      },
                                                                      With(
                                                                          {_start: If(_clamped < _slotEnd, _clamped, _slotStart)},
                                                                          Set(varStartTime, _start);
                                                                          Set(
                                                                              varEndTime,
                                                                              If(
                                                                                  DateAdd(_start, 60, TimeUnit.Minutes) < _slotEnd,
                                                                                  DateAdd(_start, 60, TimeUnit.Minutes),
                                                                                  _slotEnd
                                                                              )
                                                                          )
                                                                      )
                                                                  )
                                                              );

                                                              /* Room already known from the timeline - open the wizard on step 2 */
                                                              Set(gbl_UI_Book_Modal_Step, WizardStep2);
                                                              Set(gbl_UI_Book_Modal, true);
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingRight: =0
                                                            PaddingTop: =0
                                                            PressedBorderColor: =RGBA(0,0,0,0)
                                                            PressedColor: =AppTheme.TextPrimary
                                                            PressedFill: =RGBA(0,0,0,0.12)
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Size: =11
                                                            Text: =If(ThisItem.RowMinutes >= 30, "Book " & Text(ThisItem.RowStart, "HH:mm") & " - " & Text(ThisItem.RowEnd, "HH:mm") & "  ·  Available " & If(ThisItem.RowMinutes >= 60, Text(RoundDown(ThisItem.RowMinutes / 60, 0)) & "h", "") & If(Mod(ThisItem.RowMinutes, 60) > 0, If(ThisItem.RowMinutes >= 60, " ", "") & Text(Mod(ThisItem.RowMinutes, 60)) & "m", ""), "Book " & Text(ThisItem.RowStart, "HH:mm") & " - " & Text(ThisItem.RowEnd, "HH:mm"))
                                                            Width: =Parent.Width
