                                                      "Book " & ThisItem.SlotRoomTitle & " from " & Text(DateAdd(varFindWindowStart, (ThisItem.Value - 1) * 15, TimeUnit.Minutes), "HH:mm"),
                                                      "Open " & Text(DateAdd(varFindWeekStart, ThisItem.Value - 1, TimeUnit.Days), "ddd dd mmm")
                                                  )
