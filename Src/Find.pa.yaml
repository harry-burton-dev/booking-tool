                  - btnLoadFindBookings:
                      Control: Button@0.0.45
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        OnSelect: |-
                          =If(CountRows(FindBookings) = 500,
                              Notify("Warning: results may be incomplete. Too many bookings in this window.", NotificationType.Warning)
                          );
                          // ── 2. Reset ──────────────────────────────────────────────────────────────
                          Clear(colTimelineRows_R01); Clear(colTimelineRows_R02); Clear(colTimelineRows_R03);
                          Clear(colTimelineRows_R04); Clear(colTimelineRows_R05); Clear(colTimelineRows_R06);
                          // ── 3. Build timeline rows ────────────────────────────────────────────────
                          // _s/_e = window start/end aliases — avoids repeating the var names in every free-slot record.
                          // Each room block:
                          //   (a) collect all booked rows in one call
                          //   (b) insert leading free slot if day doesn't open with a booking
                          //   (c) insert gap / trailing free slots after each booking
                          //   (d) sort by RowStart
                          With({_s: varFindWindowStart, _e: varFindWindowEnd},
                              // ── R01 ───────────────────────────────────────────────────────────────
                              With({room: Filter(FindBookings, RoomID.Id = LookUp(colRooms, RoomID = 1, ID))},
                                  Collect(colTimelineRows_R01,                                                     // (a)
                                      ForAll(room As b, {
                                          RowType:   "booked",
                                          RowStart:  b.StartDateTime,
                                          RowEnd:    b.EndDateTime,
                                          RowHeight: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes) / 60 * 120,
                                          Title:     b.Title,
                                          BookedBy:  b.BookedBy.DisplayName
                                      })
                                  );
                                  If(IsEmpty(room),                                                                // (b)
                                      Collect(colTimelineRows_R01, {RowType:"free",RowStart:_s,RowEnd:_e,
                                          RowHeight:DateDiff(_s,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                      First(room).StartDateTime > _s,
                                      Collect(colTimelineRows_R01, {RowType:"free",RowStart:_s,RowEnd:First(room).StartDateTime,
                                          RowHeight:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                  );
                                  ForAll(room As b,                                                                // (c)
                                      With({next: LookUp(room, StartDateTime > b.EndDateTime, StartDateTime)},
                                          If(IsBlank(next) && b.EndDateTime < _e,
                                              Collect(colTimelineRows_R01, {RowType:"free",RowStart:b.EndDateTime,RowEnd:_e,
                                                  RowHeight:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                              !IsBlank(next),
                                              Collect(colTimelineRows_R01, {RowType:"free",RowStart:b.EndDateTime,RowEnd:next,
                                                  RowHeight:DateDiff(b.EndDateTime,next,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                          )
                                      )
                                  );
                                  ClearCollect(colTimelineRows_R01, Sort(colTimelineRows_R01, RowStart, SortOrder.Ascending)) // (d)
                              );
                              // ── R02 ───────────────────────────────────────────────────────────────
                              With({room: Filter(FindBookings, RoomID.Id = LookUp(colRooms, RoomID = 2, ID))},
                                  Collect(colTimelineRows_R02,
                                      ForAll(room As b, {
                                          RowType:   "booked",
                                          RowStart:  b.StartDateTime,
                                          RowEnd:    b.EndDateTime,
                                          RowHeight: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes) / 60 * 120,
                                          Title:     b.Title,
                                          BookedBy:  b.BookedBy.DisplayName
                                      })
                                  );
                                  If(IsEmpty(room),
                                      Collect(colTimelineRows_R02, {RowType:"free",RowStart:_s,RowEnd:_e,
                                          RowHeight:DateDiff(_s,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                      First(room).StartDateTime > _s,
                                      Collect(colTimelineRows_R02, {RowType:"free",RowStart:_s,RowEnd:First(room).StartDateTime,
                                          RowHeight:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                  );
                                  ForAll(room As b,
                                      With({next: LookUp(room, StartDateTime > b.EndDateTime, StartDateTime)},
                                          If(IsBlank(next) && b.EndDateTime < _e,
                                              Collect(colTimelineRows_R02, {RowType:"free",RowStart:b.EndDateTime,RowEnd:_e,
                                                  RowHeight:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                              !IsBlank(next),
                                              Collect(colTimelineRows_R02, {RowType:"free",RowStart:b.EndDateTime,RowEnd:next,
                                                  RowHeight:DateDiff(b.EndDateTime,next,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                          )
                                      )
                                  );
                                  ClearCollect(colTimelineRows_R02, Sort(colTimelineRows_R02, RowStart, SortOrder.Ascending))
                              );
                              // ── R03 ───────────────────────────────────────────────────────────────
                              With({room: Filter(FindBookings, RoomID.Id = LookUp(colRooms, RoomID = 3, ID))},
                                  Collect(colTimelineRows_R03,
                                      ForAll(room As b, {
                                          RowType:   "booked",
                                          RowStart:  b.StartDateTime,
                                          RowEnd:    b.EndDateTime,
                                          RowHeight: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes) / 60 * 120,
                                          Title:     b.Title,
                                          BookedBy:  b.BookedBy.DisplayName
                                      })
                                  );
                                  If(IsEmpty(room),
                                      Collect(colTimelineRows_R03, {RowType:"free",RowStart:_s,RowEnd:_e,
                                          RowHeight:DateDiff(_s,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                      First(room).StartDateTime > _s,
                                      Collect(colTimelineRows_R03, {RowType:"free",RowStart:_s,RowEnd:First(room).StartDateTime,
                                          RowHeight:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                  );
                                  ForAll(room As b,
                                      With({next: LookUp(room, StartDateTime > b.EndDateTime, StartDateTime)},
                                          If(IsBlank(next) && b.EndDateTime < _e,
                                              Collect(colTimelineRows_R03, {RowType:"free",RowStart:b.EndDateTime,RowEnd:_e,
                                                  RowHeight:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                              !IsBlank(next),
                                              Collect(colTimelineRows_R03, {RowType:"free",RowStart:b.EndDateTime,RowEnd:next,
                                                  RowHeight:DateDiff(b.EndDateTime,next,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                          )
                                      )
                                  );
                                  ClearCollect(colTimelineRows_R03, Sort(colTimelineRows_R03, RowStart, SortOrder.Ascending))
                              );
                              // ── R04 ───────────────────────────────────────────────────────────────
                              With({room: Filter(FindBookings, RoomID.Id = LookUp(colRooms, RoomID = 4, ID))},
                                  Collect(colTimelineRows_R04,
                                      ForAll(room As b, {
                                          RowType:   "booked",
                                          RowStart:  b.StartDateTime,
                                          RowEnd:    b.EndDateTime,
                                          RowHeight: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes) / 60 * 120,
                                          Title:     b.Title,
                                          BookedBy:  b.BookedBy.DisplayName
                                      })
                                  );
                                  If(IsEmpty(room),
                                      Collect(colTimelineRows_R04, {RowType:"free",RowStart:_s,RowEnd:_e,
                                          RowHeight:DateDiff(_s,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                      First(room).StartDateTime > _s,
                                      Collect(colTimelineRows_R04, {RowType:"free",RowStart:_s,RowEnd:First(room).StartDateTime,
                                          RowHeight:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                  );
                                  ForAll(room As b,
                                      With({next: LookUp(room, StartDateTime > b.EndDateTime, StartDateTime)},
                                          If(IsBlank(next) && b.EndDateTime < _e,
                                              Collect(colTimelineRows_R04, {RowType:"free",RowStart:b.EndDateTime,RowEnd:_e,
                                                  RowHeight:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                              !IsBlank(next),
                                              Collect(colTimelineRows_R04, {RowType:"free",RowStart:b.EndDateTime,RowEnd:next,
                                                  RowHeight:DateDiff(b.EndDateTime,next,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                          )
                                      )
                                  );
                                  ClearCollect(colTimelineRows_R04, Sort(colTimelineRows_R04, RowStart, SortOrder.Ascending))
                              );
                              // ── R05 ───────────────────────────────────────────────────────────────
                              With({room: Filter(FindBookings, RoomID.Id = LookUp(colRooms, RoomID = 5, ID))},
                                  Collect(colTimelineRows_R05,
                                      ForAll(room As b, {
                                          RowType:   "booked",
                                          RowStart:  b.StartDateTime,
                                          RowEnd:    b.EndDateTime,
                                          RowHeight: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes) / 60 * 120,
                                          Title:     b.Title,
                                          BookedBy:  b.BookedBy.DisplayName
                                      })
                                  );
                                  If(IsEmpty(room),
                                      Collect(colTimelineRows_R05, {RowType:"free",RowStart:_s,RowEnd:_e,
                                          RowHeight:DateDiff(_s,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                      First(room).StartDateTime > _s,
                                      Collect(colTimelineRows_R05, {RowType:"free",RowStart:_s,RowEnd:First(room).StartDateTime,
                                          RowHeight:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                  );
                                  ForAll(room As b,
                                      With({next: LookUp(room, StartDateTime > b.EndDateTime, StartDateTime)},
                                          If(IsBlank(next) && b.EndDateTime < _e,
                                              Collect(colTimelineRows_R05, {RowType:"free",RowStart:b.EndDateTime,RowEnd:_e,
                                                  RowHeight:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                              !IsBlank(next),
                                              Collect(colTimelineRows_R05, {RowType:"free",RowStart:b.EndDateTime,RowEnd:next,
                                                  RowHeight:DateDiff(b.EndDateTime,next,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                          )
                                      )
                                  );
                                  ClearCollect(colTimelineRows_R05, Sort(colTimelineRows_R05, RowStart, SortOrder.Ascending))
                              );
                              // ── R06 ───────────────────────────────────────────────────────────────
                              With({room: Filter(FindBookings, RoomID.Id = LookUp(colRooms, RoomID = 6, ID))},
                                  Collect(colTimelineRows_R06,
                                      ForAll(room As b, {
                                          RowType:   "booked",
                                          RowStart:  b.StartDateTime,
                                          RowEnd:    b.EndDateTime,
                                          RowHeight: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes) / 60 * 120,
                                          Title:     b.Title,
                                          BookedBy:  b.BookedBy.DisplayName
                                      })
                                  );
                                  If(IsEmpty(room),
                                      Collect(colTimelineRows_R06, {RowType:"free",RowStart:_s,RowEnd:_e,
                                          RowHeight:DateDiff(_s,_e,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""}),
                                      First(room).StartDateTime > _s,
                                      Collect(colTimelineRows_R06, {RowType:"free",RowStart:_s,RowEnd:First(room).StartDateTime,
                                          RowHeight:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes)/60*120,Title:"",BookedBy:""})
                                  );
                                  ForAll(room As b,
                                      With({next: LookUp(room, StartDateTime > b.EndDateTime, StartDateTime)},
                                          If(IsBlank(next) && b.EndDateTime < _e,
