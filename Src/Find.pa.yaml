Screens:
  Find:
    Properties:
      Fill: =AppTheme.layer01Bg
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |
        =Set(varFindViewMode, "Day");
        Set(varFindSelectedDate, Today());
        /* Timeline-redesign selection state (bottom bar). Screen-local, reset on entry. */
        UpdateContext({findSelRoomID: Blank(), findSelRoomTitle: Blank(), findSelStart: Blank(), findSelEnd: Blank()});

        /* Re-pull the shared bookings snapshot so colleagues' writes since App.OnStart
           (or since this session's last write) show up without requiring a write of our own */
        Refresh(Book_Bookings);
        ClearCollect(colBookings, BookingsWindow);

        Select(btnLoadFindBookings)
    Children:
      - con_shell_find:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_root_find:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  PaddingBottom: =24
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =24
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - conFindPageHeader_f3:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.End
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - htxFindTitle_f3:
                            Control: HtmlViewer
                            Properties:
                              DisplayMode: =DisplayMode.View
                              FillPortions: =1
                              Height: =Parent.Height
                              HtmlText: |-
                                ="<div style='" & CarbonHtmlType.Eyebrow & " color:" & AppThemeHex.TextMuted & "; margin-bottom:6px;'>Room booking</div>" &
                                CarbonText(CarbonHtmlType.Heading04, "Room availability")
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                        - htxFindSummary_f3:
                            Control: HtmlViewer
                            Properties:
                              DisplayMode: =DisplayMode.View
                              Height: =Parent.Height
                              HtmlText: |-
                                ="<div style='display:flex; align-items:flex-end; justify-content:flex-end; height:100%; padding-bottom:6px; box-sizing:border-box;'>" &
                                "<span style='" & CarbonHtmlType.Code01 & " color:" & AppThemeHex.TextSecondary & "; white-space:nowrap;'>" &
                                CountRows(FindRooms) & " of " & CountRows(colRooms) & " rooms shown" &
                                If(varFindSelectedDate = Today(), " · " & FreeNowCount & " free right now", "") &
                                "</span></div>"
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Width: =360
                  - btnLoadFindBookings:
                      Control: Button
                      Properties:
                        OnSelect: |-
                          =If(CountRows(FindBookings) >= 500,
                              Notify("Warning: results may be incomplete. Too many bookings in this window.", NotificationType.Warning)
                          );
                          // parameterised grid builder
                          Clear(colFindRows);
                          With({_s: varFindWindowStart, _e: varFindWindowEnd},
                              ForAll(FindRooms As rm,
                                  With({room: Filter(FindBookings, RoomID.Id = rm.ID)},
                                      Collect(colFindRows,
                                          ForAll(room As b, {
                                              RoomKey:   rm.ID,
                                              RowType:   "booked",
                                              RowStart:  b.StartDateTime,
                                              RowEnd:    b.EndDateTime,
                                              RowHeight: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes) * Timeline_PxPerMinute,
                                              RowMinutes: DateDiff(b.StartDateTime, b.EndDateTime, TimeUnit.Minutes),
                                              Title:     If(b.IsPrivate && b.BookedByEmail <> Lower(User().Email), "Busy", b.Title),
                                              BookedBy:  If(b.IsPrivate && b.BookedByEmail <> Lower(User().Email), "", b.BookedBy.DisplayName),
                                              IsMine:    Lower(Coalesce(b.BookedByEmail, "")) = Lower(User().Email)
                                          })
                                      );
                                      If(IsEmpty(room),
                                          Collect(colFindRows, {RoomKey:rm.ID,RowType:"free",RowStart:_s,RowEnd:_e,
                                              RowHeight:DateDiff(_s,_e,TimeUnit.Minutes)*Timeline_PxPerMinute,
                                              RowMinutes:DateDiff(_s,_e,TimeUnit.Minutes),Title:"",BookedBy:"",IsMine:false}),
                                          First(room).StartDateTime > _s,
                                          Collect(colFindRows, {RoomKey:rm.ID,RowType:"free",RowStart:_s,RowEnd:First(room).StartDateTime,
                                              RowHeight:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes)*Timeline_PxPerMinute,
                                              RowMinutes:DateDiff(_s,First(room).StartDateTime,TimeUnit.Minutes),Title:"",BookedBy:"",IsMine:false})
                                      );
                                      // PERF-5-SKIP[conditional-cardinality] do not batch — If branches Collect 0-1 rows per iteration
                                      ForAll(room As b,
                                          With({next: LookUp(room, StartDateTime >= b.EndDateTime, StartDateTime)},
                                              If(IsBlank(next) && b.EndDateTime < _e,
                                                  Collect(colFindRows, {RoomKey:rm.ID,RowType:"free",RowStart:b.EndDateTime,RowEnd:_e,
                                                      RowHeight:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes)*Timeline_PxPerMinute,
                                                      RowMinutes:DateDiff(b.EndDateTime,_e,TimeUnit.Minutes),Title:"",BookedBy:"",IsMine:false}),
                                                  !IsBlank(next) && next > b.EndDateTime,
                                                  Collect(colFindRows, {RoomKey:rm.ID,RowType:"free",RowStart:b.EndDateTime,RowEnd:next,
                                                      RowHeight:DateDiff(b.EndDateTime,next,TimeUnit.Minutes)*Timeline_PxPerMinute,
                                                      RowMinutes:DateDiff(b.EndDateTime,next,TimeUnit.Minutes),Title:"",BookedBy:"",IsMine:false})
                                              )
                                          )
                                      )
                                  )
                              )
                          );
                          ClearCollect(colFindRows, SortByColumns(colFindRows, "RoomKey", SortOrder.Ascending, "RowStart", SortOrder.Ascending));
                          Clear(colFindWeekRows);
                          If(varFindViewMode = "Week",
                              // PERF-5-SKIP[partial] inner room loop batched; day loop stays — see T3
                              ForAll(
                                  Sequence(Timeline_WeekDayCount) As dy2,
                                  With(
                                      {
                                          dayOpen:  DateAdd(DateAdd(varFindWeekStart, (dy2.Value - 1) * 24 * 60, TimeUnit.Minutes), Timeline_OpenHour * 60, TimeUnit.Minutes),
                                          dayClose: DateAdd(DateAdd(varFindWeekStart, (dy2.Value - 1) * 24 * 60, TimeUnit.Minutes), Timeline_CloseHour * 60, TimeUnit.Minutes)
                                      },
                                      Collect(
                                          colFindWeekRows,
                                          ForAll(
                                              FindRooms As rm2,
                                              With(
                                                  { overl: Filter(WeekBookings,
                                                              RoomID.Id = rm2.ID,
                                                              fnOverlaps(StartDateTime, EndDateTime, dayOpen, dayClose)) },
                                                  With(
                                                      { bookedMin: Sum(
                                                              ForAll(overl As b,
                                                                  DateDiff(
                                                                      If(b.StartDateTime > dayOpen, b.StartDateTime, dayOpen),
                                                                      If(b.EndDateTime < dayClose, b.EndDateTime, dayClose),
                                                                      TimeUnit.Minutes
                                                                  )
                                                              ),
                                                              Value
                                                          )
                                                      },
                                                      With(
                                                          {
                                                              cellTitle: CountRows(overl) & If(CountRows(overl) = 1, " booking", " bookings"),
                                                              cellFree: RoundDown(((Timeline_HoursPerDay * 60) - bookedMin) / 60, 0) & "h " & Mod((Timeline_HoursPerDay * 60) - bookedMin, 60) & "m free",
                                                              /* 30-min occupancy strip, precomputed at build time so the
                                                                 week lane HtmlViewer does zero per-slot LookUps at render */
                                                              segsHtml: Concat(
                                                                  ForAll(Sequence(Timeline_HoursPerDay * 2) As sg,
                                                                      With({_ss: DateAdd(dayOpen, (sg.Value - 1) * 30, TimeUnit.Minutes)},
                                                                          With({_hit: LookUp(overl, fnOverlaps(StartDateTime, EndDateTime, _ss, DateAdd(_ss, 30, TimeUnit.Minutes)))},
                                                                              {seg: "<span style='flex:1 1 0;background:" &
                                                                                  If(IsBlank(_hit), AppThemeHex.Border,
                                                                                     Lower(Coalesce(_hit.BookedByEmail, "")) = Lower(User().Email), AppThemeHex.Primary,
                                                                                     AppThemeHex.TextSecondary) &
                                                                                  ";'></span>"}
                                                                          )
                                                                      )
                                                                  ),
                                                                  seg
                                                              )
                                                          },
                                                          {RoomKey:rm2.ID, RowType:"week", RowStart:dayOpen, RowEnd:dayClose, RowHeight:Timeline_WeekCellPx, RowMinutes:DateDiff(dayOpen, dayClose, TimeUnit.Minutes), Title:cellTitle, BookedBy:cellFree, BookedMinutes:bookedMin, SegsHtml:segsHtml}
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Load"
                        Visible: =false
