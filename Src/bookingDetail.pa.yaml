                                                                      UpdateContext({locScopeRefused: true});
                                                                      Notify("The new date is after the series end date (" & Text(_untilNew, "d mmm yyyy") & "). Choose ""Just this booking"" or pick an earlier date.", NotificationType.Warning, 6000),
                                                                      // F11: the split cannot be dragged back on top of the occurrence before it
                                                                      _k > 0 && DateValue(gbl_PendingStart) <= _prevDate,
                                                                      UpdateContext({locScopeRefused: true});
                                                                      Notify("This and following can't start before the previous occurrence (" & Text(_prevDate, "d mmm yyyy") & "). Choose ""Just this booking"" to move only this one.", NotificationType.Warning, 6000),
                                                                      With(
