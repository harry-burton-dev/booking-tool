                                                                          Book_Bookings,
                                                                          {ID: _master.ID},
                                                                          {
                                                                              StartDateTime: DateAdd(DateValue(Text(_master.StartDateTime, "yyyy-mm-dd")), _startMinutes, TimeUnit.Minutes),
