                                                          With(
                                                              {
                                                                  _endSeries: !IsBlank(_master) && (fnIsMine(_master.BookedByEmail) || IsAdmin),
                                                                  _targets: Filter(
                                                                      colSeriesServerRows,
                                                                      StartDateTime >= Now(),
                                                                      Status <> "Cancelled",
                                                                      Status <> "Migrated",
                                                                      fnIsMine(BookedByEmail),
                                                                      !(fnIsBRRow(RecurrenceType) && !IsException)
                                                                  )
                                                              },
                                                          /* Ending a rule-driven series: cancel the master (which stops every
                                                             remaining virtual occurrence at once) plus its future exceptions. */
                                                          If(
                                                              _endSeries,
                                                              Patch(Book_Bookings, {ID: _master.ID}, {Status: "Cancelled"});
                                                              Patch(
                                                                  Book_Bookings,
                                                                  ForAll(
                                                                      Filter(Book_Bookings, SeriesID = _sid, IsException = true, Status = "Active", StartDateTime > Now()) As _ex,
                                                                      {ID: _ex.ID, Status: "Cancelled"}
                                                                  )
                                                              );
                                                              UpdateIf(colBookings, SeriesID = _sid && IsException && Status = "Active" && StartDateTime > Now(), {Status: "Cancelled"});
                                                              ClearCollect(colBRMasters, Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active"))
                                                          );
                                                          With(
                                                              {
                                                                  _results: ForAll(
                                                                      _targets As _m,
                                                                      IfError(
                                                                          Patch(Book_Bookings, LookUp(Book_Bookings, ID = _m.ID), {Status: "Cancelled"});
                                                                          true,
                                                                          false
                                                                      )
                                                                  )
                                                              },
                                                              Refresh(Book_Bookings);
                                                              If(
                                                                  CountRows(Filter(_results, !Value)) = 0,
                                                                  // Mirror: same _targets rows the server loop wrote (blank-safe; UpdateIf is not supported inside ForAll)
                                                                  ForAll(
                                                                      _targets As _t,
                                                                      With(
                                                                          {_mirrorRow: LookUp(colBookings, ID = _t.ID)},
                                                                          If(!IsBlank(_mirrorRow), Patch(colBookings, _mirrorRow, {Status: "Cancelled"}))
                                                                      )
                                                                  ),
                                                                  // MIRROR-FALLBACK: partial series-cancel failure — local picture uncertain, re-pull the window
                                                                  ClearCollect(colBookings, BookingsWindow)
                                                              );
                                                              Set(gblSelectedBooking, Blank());
                                                              If(
                                                                  _endSeries,
                                                                  Notify("Series ended", NotificationType.Success),
                                                                  CountRows(_results) = 0,
                                                                  Notify("Nothing to cancel — no upcoming occurrences you own in this series.", NotificationType.Warning),
                                                                  CountRows(Filter(_results, !Value)) = 0,
                                                                  Notify("Series cancelled", NotificationType.Success),
                                                                  Notify(
                                                                      $"Couldn't cancel {CountRows(Filter(_results, !Value))} occurrence(s) — the series is only partially cancelled.",
                                                                      NotificationType.Error
                                                                  )
                                                              );
                                                              Set(gbl_FixCycleSeriesID, "");
                                                              Navigate(myBookings, ScreenTransition.Fade)
                                                          )
                                                          )
                                                          )
                                                      )
                                                  );
                                                  // RESET-SITE[bookingdetail-scope-series] pending payload cleared only when a write (or no-op success) happened
                                                  If(
                                                      !locScopeRefused,
                                                      Set(gbl_UI_ScopePrompt, "");
                                                      Set(gbl_PendingStart, Blank());
                                                      Set(gbl_PendingEnd, Blank());
                                                      Set(gbl_PendingRoomId, 0);
                                                      Set(gbl_PendingRoomText, "")
                                                  )
                                                PressedColor: =ColorValue(AppTheme.PrimaryText)
                                                PressedFill: =RGBA(11,69,182,1)
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Whole series"
                                                Width: =130
                                          - btnScopeBack:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =1
                                                Color: =AppTheme.TextPrimary
                                                Fill: =AppTheme.Surface
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                OnSelect: |-
                                                  =Set(gbl_UI_ScopePrompt, "");
                                                  Set(gbl_PendingStart, Blank());
                                                  Set(gbl_PendingEnd, Blank());
                                                  Set(gbl_PendingRoomId, 0);
                                                  Set(gbl_PendingRoomText, "");
                                                  Set(gbl_FixCycleSeriesID, "")
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Back"
                                                Width: =80
      - cpt_Modal__book_detail:
          Control: CanvasComponent
          ComponentName: cpt_Modal_
          Properties:
            Height: =App.Height
            ModalTitleText: =
            OnSubmit: =Set(gbl_UI_Book_Modal, false) /* create flow unreachable from this screen */
            OnSubmitEdit: |-
              =If(cpt_Modal__book_detail.ValidPayload && gblEditingBookingID <> 0,
                  With({_occ: First(cpt_Modal__book_detail.PatchPayload)},
                      If(
                          !IsBlank(gblSelectedBooking.SeriesID),
                          // Series member: stash the pending times AND room (T-09/3.2 - the payload's
                          // room used to be dropped here) and ask for scope before writing anything
                          Set(gbl_PendingStart, _occ.StartDateTime);
                          Set(gbl_PendingEnd, _occ.EndDateTime);
                          Set(gbl_PendingRoomId, _occ.RoomIdNumber);
                          Set(gbl_PendingRoomText, _occ.RoomIdText);
                          Set(gbl_UI_ScopePrompt, "edit"),
                          // Standalone booking: unchanged single-row conflict check + Patch
                          If(
                              !IsBlank(
                                  LookUp(
                                      Filter(
                                          colBookings,
                                          Status = "Active",
                                          fnOverlaps(StartDateTime, EndDateTime, _occ.StartDateTime, _occ.EndDateTime),
                                          ID <> gblEditingBookingID
                                      ),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              ),
                              Notify("That slot is no longer free. Your booking is unchanged.", NotificationType.Warning, 6000),
                              // PROD-REVERT[booking-edit] prod form: Patch(Book_Bookings, ...) below
                              If(
                                  gblEditingBookingID < 0,
                                  /* Virtual occurrence of a series: nothing to patch — write an
                                     exception row for occurrence k of its master instead.
                                     UNREACHABLE: a virtual occurrence always has a SeriesID, so the
                                     series branch above claims it. Kept in step with the live paths. */
                                  With(
                                      {
                                          _m: LookUp(colBRMasters, ID = RoundDown(-gblEditingBookingID / 10000, 0)),
                                          _k: Mod(-gblEditingBookingID, 10000)
                                      },
                                      With(
                                          {
                                              _new: Patch(
                                                  Book_Bookings,
                                                  Defaults(Book_Bookings),
                                                  {
                                                      Title: _m.Title,
                                                      BookedByEmail: _m.BookedByEmail,
                                                      RoomID: {Id: _occ.RoomIdNumber, Value: _occ.RoomIdText},
                                                      StartDateTime: _occ.StartDateTime,
                                                      EndDateTime: _occ.EndDateTime,
                                                      IsPrivate: Coalesce(_m.IsPrivate, false),
                                                      BookedBy: _m.BookedBy,
                                                      Status: "Active",
                                                      SeriesID: _m.SeriesID,
                                                      RecurrenceType: "BR-Exception",
                                                      OccIndex: _k,
                                                      IsException: true
                                                  }
                                              )
                                          },
                                          Collect(colBookings, _new);
                                          Set(gblSelectedBooking, LookUp(AllBookings, ID = _new.ID));
                                          Notify("Booking updated", NotificationType.Success)
                                      )
                                  ),
                                  // _changes shared by the server Patch and the colBookings mirror so the field lists cannot drift
                                  With(
                                      {
                                          _changes: {
                                              Title: _occ.Title,
                                              RoomID: {Id: _occ.RoomIdNumber, Value: _occ.RoomIdText},
                                              StartDateTime: _occ.StartDateTime,
                                              EndDateTime: _occ.EndDateTime
                                          }
                                      },
                                      IfError(
                                          Patch(
                                              Book_Bookings,
                                              LookUp(Book_Bookings, ID = gblEditingBookingID),
                                              _changes
                                          ),
                                          Notify("Couldn't update this booking. Please try again.", NotificationType.Error),
                                          Refresh(Book_Bookings);
                                          UpdateIf(colBookings, ID = gblEditingBookingID, _changes);
                                          Notify("Booking updated", NotificationType.Success)
                                      )
                                  )
                              )
                          )
                      )
                  );

                  /* Negative IDs are virtual occurrences: the exception-row branch above already
                     re-pointed gblSelectedBooking at the row it created. */
                  If(
                      gblEditingBookingID > 0,
                      Set(gblSelectedBooking, LookUp(AllBookings, ID = gblEditingBookingID))
                  );
                  Set(gblEditingBookingID, 0);
                  Set(gbl_UI_Book_Modal, false)
              )
            OptionalLabelText: =" "
            Visible: =gbl_UI_Book_Modal = true
            Width: =App.Width
