Screens:
  bookingDetail:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =UpdateContext({varConfirmCancel: false});
        Set(gbl_UI_ScopePrompt, "")
    Children:
      - con_shell_1:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cpt_header_detail:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - con_body_home_1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - conDetail:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0,0,0,0)
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Min(Parent.Width, 640)
                      Children:
                        - btnDetailBack:
                            Control: Classic/Button
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              Color: =AppTheme.TextPrimary
                              Fill: =AppTheme.SurfaceAlt
                              FocusedBorderColor: =RGBA(15,98,254,1)
                              FocusedBorderThickness: =2
                              Font: ="IBM Plex Sans"
                              FontWeight: =FontWeight.Normal
                              HoverColor: =AppTheme.TextPrimary
                              HoverFill: =AppTheme.Border
                              OnSelect: |-
                                =Set(gbl_UI_ScopePrompt, "");
                                Set(gbl_FixCycleSeriesID, "");
                                Navigate(myBookings, ScreenTransition.Fade)
                              PressedColor: =AppTheme.TextPrimary
                              PressedFill: =AppTheme.Border
                              RadiusBottomLeft: =2
                              RadiusBottomRight: =2
                              RadiusTopLeft: =2
                              RadiusTopRight: =2
                              Size: =11
                              Text: ="← Back to my bookings"
                              Width: =220
                        - htxDetailTitle:
                            Control: HtmlViewer
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              DisplayMode: =DisplayMode.View
                              HtmlText: |-
                                =/* The two merged labels were NOT mutually exclusive - the title was always visible and the empty-state line added a second row when IsBlank(gblSelectedBooking), so both lines compose here. The 16px margin reproduces conDetail's LayoutGap. */
                                CarbonText(CarbonHtmlType.Heading03 & " font-weight: 600;",
                                    fnHtmlEscape(
                                        If(
                                            IsBlank(gblSelectedBooking),
                                            "No booking selected",
                                            /* private bookings stay masked here as they are in the grids - owner and admin see the real title */
                                            gblSelectedBooking.IsPrivate && !fnIsMine(gblSelectedBooking.BookedByEmail) && !IsAdmin,
                                            "Busy",
                                            gblSelectedBooking.Title
                                        )
                                    )
                                ) &
                                If(IsBlank(gblSelectedBooking),
                                    CarbonTextColored(CarbonHtmlType.Label01 & " margin-top: 16px;", "Open a booking from My bookings to see its details.", AppThemeHex.TextMuted),
                                    ""
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                        - conDetailCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =24
                              RadiusBottomLeft: =2
                              RadiusBottomRight: =2
                              RadiusTopLeft: =2
                              RadiusTopRight: =2
                              Visible: =!IsBlank(gblSelectedBooking)
                            Children:
                              - lblStatusBadge:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Start
                                    Color: =If(fnIsPast(gblSelectedBooking.EndDateTime), AppTheme.TextMuted, ColorValue(AppTheme.PrimaryText))
                                    Fill: =If(fnIsPast(gblSelectedBooking.EndDateTime), AppTheme.Border, ColorValue(AppTheme.ButtonPrimary))
                                    Font: ="IBM Plex Sans"
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: |-
                                      =If(
                                          fnIsPast(gblSelectedBooking.EndDateTime), "Past",
                                          gblSelectedBooking.IsPermanent, "Permanent",
                                          "Upcoming"
                                      )
                                    Width: =88
                                    Wrap: =false
                              - fldRoom:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - htxDetailFieldRoom:
                                        Control: HtmlViewer
                                        Properties:
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: |-
                                            =CarbonTextColored(CarbonHtmlType.Label01, "Room", AppThemeHex.TextMuted) &
                                            CarbonText(CarbonHtmlType.HeadingCompact01, fnHtmlEscape(gblSelectedBooking.'RoomID: Title'.Value))
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                              - fldDate:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - htxDetailFieldDate:
                                        Control: HtmlViewer
                                        Properties:
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: |-
                                            =CarbonTextColored(CarbonHtmlType.Label01, "Date", AppThemeHex.TextMuted) &
                                            CarbonText(CarbonHtmlType.BodyCompact01, Text(gblSelectedBooking.StartDateTime, "dddd dd mmmm yyyy"))
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                              - fldTime:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - htxDetailFieldTime:
                                        Control: HtmlViewer
                                        Properties:
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: |-
                                            =CarbonTextColored(CarbonHtmlType.Label01, "Time", AppThemeHex.TextMuted) &
                                            CarbonText(CarbonHtmlType.BodyCompact01, Text(gblSelectedBooking.StartDateTime, "HH:mm") & " – " & Text(gblSelectedBooking.EndDateTime, "HH:mm"))
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                              - fldBy:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - htxDetailFieldBy:
                                        Control: HtmlViewer
                                        Properties:
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: |-
                                            =CarbonTextColored(CarbonHtmlType.Label01, "Booked by", AppThemeHex.TextMuted) &
                                            CarbonText(
                                                CarbonHtmlType.BodyCompact01,
                                                fnHtmlEscape(
                                                    If(
                                                        gblSelectedBooking.IsPermanent,
                                                        "Permanent booking",
                                                        /* private bookings stay masked here as they are in the grids - owner and admin see the organiser */
                                                        gblSelectedBooking.IsPrivate && !fnIsMine(gblSelectedBooking.BookedByEmail) && !IsAdmin,
                                                        "Private booking",
                                                        gblSelectedBooking.BookedBy.DisplayName
                                                    )
                                                )
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                        - conCancelZone:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0)
                              Height: =180
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMaxHeight: =110
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: |-
                                =!IsBlank(gblSelectedBooking) && !fnIsPast(gblSelectedBooking.EndDateTime) &&
                                (!gblSelectedBooking.IsPermanent || IsAdmin) &&
                                (fnIsMine(gblSelectedBooking.BookedByEmail) || IsAdmin)
                            Children:
                              - btnChangeTimeDetail:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    BorderThickness: =1
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    Fill: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderColor: =RGBA(15,98,254,1)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =RGBA(13,83,217,1)
                                    OnSelect: |-
                                      =Set(varConflict, false);
                                      // RESET-SITE[bookingdetail-change-time] wizard state reset before opening the When step (time and room)
                                      Set(varBookingError, false);
                                      Set(varSubmitting, false);
                                      Set(varTitleTouched, false);
                                      Set(gbl_UI_Book_CancelConfirm, false);
                                      Set(gbl_Book_SubmitResult, "");
                                      Set(varConflictingBooking, Blank());
                                      Set(varNextFreeSlot, Blank());

                                      /* T-09: time AND room may change here - the Room step is reachable
                                         from the When step (Back, or Next on the time-first route) and the
                                         payload's room is carried through the scope prompt. Still no series
                                         controls in this flow: tglRecurring/drpWeeks live inside cpt_Modal_
                                         and cannot be Reset() from a screen; the component resets them on close. */

                                      /* Prefill the wizard from the booking being edited */
                                      Set(gblEditingBookingID, gblSelectedBooking.ID);
                                      Set(varSelectedRoom, LookUp(colRooms, ID = gblSelectedBooking.RoomID.Id));
                                      Set(varSelectedDate, DateValue(Text(gblSelectedBooking.StartDateTime, "yyyy-mm-dd")));
                                      Set(varStartTime, gblSelectedBooking.StartDateTime);
                                      Set(varEndTime, gblSelectedBooking.EndDateTime);
                                      Set(varTitle, gblSelectedBooking.Title);

                                      Set(gbl_UI_Book_Modal_Step, WizardStepWhen);
                                      Set(gbl_UI_Book_Modal, true)
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =RGBA(11,69,182,1)
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Change time or room"
                                    Visible: =!varConfirmCancel && gbl_UI_ScopePrompt = ""
                                    Width: =200
                              - btnCancelStart:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =AppTheme.StatusBusyText
                                    BorderThickness: =1
                                    Color: =AppTheme.StatusBusyText
                                    Fill: =AppTheme.Surface
                                    FocusedBorderColor: =RGBA(15,98,254,1)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =AppTheme.StatusBusyText
                                    HoverFill: =AppTheme.StatusBusyBg
                                    OnSelect: |-
                                      =UpdateContext({varConfirmCancel: true})
                                    PressedColor: =AppTheme.StatusBusyText
                                    PressedFill: =AppTheme.StatusBusyBg
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Cancel booking"
                                    Visible: =!varConfirmCancel && gbl_UI_ScopePrompt = ""
                              - conConfirmRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =AppTheme.StatusBusyText
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.StatusBusyBg
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Visible: =varConfirmCancel && gbl_UI_ScopePrompt = ""
                                  Children:
                                    - htxCancelConfirm:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          Height: =24
                                          HtmlText: =CarbonTextColored(CarbonHtmlType.Label01, "Cancel this booking? This can't be undone.", AppThemeHex.StatusBusyText)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                    - conConfirmButtons:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - btnKeepBooking:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =1
                                                Color: =AppTheme.TextPrimary
                                                Fill: =AppTheme.Surface
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                OnSelect: |-
                                                  =UpdateContext({varConfirmCancel: false})
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Keep booking"
                                                Width: =140
                                          - btnConfirmCancel:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =AppTheme.StatusBusyText
                                                BorderThickness: =0
                                                Color: =ColorValue(AppTheme.PrimaryText)
                                                Fill: =AppTheme.StatusBusyText
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =ColorValue(AppTheme.PrimaryText)
                                                HoverFill: =ColorValue("#b81922")
                                                OnSelect: |-
                                                  =// PROD-REVERT[booking-cancel] soft delete via Patch; Remove() retired per WS4
                                                  If(
                                                      gblSelectedBooking.ID < 0,
                                                      /* Virtual occurrence: nothing to patch — materialise a Cancelled
                                                         exception row, which suppresses occurrence k of the master. */
                                                      IfError(
                                                          With(
                                                              {
                                                                  _m: LookUp(colBRMasters, ID = RoundDown(-gblSelectedBooking.ID / 10000, 0)),
                                                                  _k: Mod(-gblSelectedBooking.ID, 10000)
                                                              },
                                                              Collect(
                                                                  colBookings,
                                                                  Patch(
                                                                      Book_Bookings,
                                                                      Defaults(Book_Bookings),
                                                                      {
                                                                          Title: _m.Title,
                                                                          BookedByEmail: _m.BookedByEmail,
                                                                          RoomID: {Id: _m.RoomID.Id, Value: _m.RoomID.Value},
                                                                          StartDateTime: gblSelectedBooking.StartDateTime,
                                                                          EndDateTime: gblSelectedBooking.EndDateTime,
                                                                          IsPrivate: Coalesce(_m.IsPrivate, false),
                                                                          BookedBy: _m.BookedBy,
                                                                          Status: "Cancelled",
                                                                          SeriesID: _m.SeriesID,
                                                                          RecurrenceType: "BR-Exception",
                                                                          OccIndex: _k,
                                                                          IsException: true
                                                                      }
                                                                  )
                                                              )
                                                          ),
                                                          Notify("Couldn't cancel this booking. Please try again.", NotificationType.Error),
                                                          Refresh(Book_Bookings);
                                                          Set(gblSelectedBooking, Blank());
                                                          Notify("Booking cancelled", NotificationType.Success);
                                                          Navigate(myBookings, ScreenTransition.Fade)
                                                      ),
                                                      IsBlank(gblSelectedBooking.SeriesID),
                                                      IfError(
                                                          Patch(Book_Bookings, LookUp(Book_Bookings, ID = gblSelectedBooking.ID), {Status: "Cancelled"}),
                                                          Notify("Couldn't cancel this booking. Please try again.", NotificationType.Error),
                                                          Refresh(Book_Bookings);
                                                          UpdateIf(colBookings, ID = gblSelectedBooking.ID, {Status: "Cancelled"});
                                                          Set(gblSelectedBooking, Blank());
                                                          Notify("Booking cancelled", NotificationType.Success);
                                                          Navigate(myBookings, ScreenTransition.Fade)
                                                      ),
                                                      // Series member: ask for cancel scope instead of writing immediately
                                                      UpdateContext({varConfirmCancel: false});
                                                      Set(gbl_UI_ScopePrompt, "cancel")
                                                  )
                                                PressedColor: =ColorValue(AppTheme.PrimaryText)
                                                PressedFill: =ColorValue("#921620")
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Yes, cancel"
                                                Width: =140
                              - con_ScopePrompt:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =AppTheme.StatusWarnText
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.StatusWarnBg
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Visible: =gbl_UI_ScopePrompt = "edit" || gbl_UI_ScopePrompt = "cancel"
                                  Children:
                                    - htxScopePromptTitle:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          Height: =24
                                          HtmlText: =CarbonTextColored(CarbonHtmlType.Label01, If(gbl_UI_ScopePrompt = "edit", "This booking is part of a series. Apply the new time to:", "This booking is part of a series. Cancel:"), AppThemeHex.StatusWarnText)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                    - conScopePromptButtons:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - btnScopeJust:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =1
                                                Color: =AppTheme.TextPrimary
                                                Fill: =AppTheme.Surface
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                OnSelect: |-
                                                  =If(
                                                      gbl_UI_ScopePrompt = "edit",
                                                      // EDIT — just this occurrence: apply the pending times, mark as an exception
                                                      With(
                                                          {
                                                              /* T-09/3.2: the target room is the PENDING one (the wizard's Room step is
                                                                 reachable in edit mode), and the check runs over AllBookings rather than
                                                                 colBookings so another series' virtual occurrences block the move too. */
                                                              _free: IsBlank(
                                                                  LookUp(
                                                                      Filter(
                                                                          AllBookings,
                                                                          Status = "Active",
                                                                          fnOverlaps(StartDateTime, EndDateTime, gbl_PendingStart, gbl_PendingEnd),
                                                                          ID <> gblSelectedBooking.ID
                                                                      ),
                                                                      RoomID.Id = gbl_PendingRoomId
                                                                  )
                                                              )
                                                          },
                                                          If(
                                                          gblSelectedBooking.ID < 0,
                                                          /* Virtual occurrence: nothing to patch — materialise it as an
                                                             exception row carrying the moved times. */
                                                          With(
                                                              {
                                                                  _m: LookUp(colBRMasters, ID = RoundDown(-gblSelectedBooking.ID / 10000, 0)),
                                                                  _k: Mod(-gblSelectedBooking.ID, 10000)
                                                              },
                                                              With(
                                                                  {
                                                                      _new: Patch(
                                                                          Book_Bookings,
                                                                          Defaults(Book_Bookings),
                                                                          {
                                                                              Title: _m.Title,
                                                                              BookedByEmail: _m.BookedByEmail,
                                                                              /* T-09/3.2: the exception carries the pending room, not the master's */
                                                                              RoomID: {Id: gbl_PendingRoomId, Value: gbl_PendingRoomText},
                                                                              StartDateTime: gbl_PendingStart,
                                                                              EndDateTime: gbl_PendingEnd,
                                                                              IsPrivate: Coalesce(_m.IsPrivate, false),
                                                                              BookedBy: _m.BookedBy,
                                                                              Status: If(_free, "Active", "Clash"),
                                                                              SeriesID: _m.SeriesID,
                                                                              RecurrenceType: "BR-Exception",
                                                                              OccIndex: _k,
                                                                              IsException: true
                                                                          }
                                                                      )
                                                                  },
                                                                  Collect(colBookings, _new);
                                                                  Set(gblSelectedBooking, LookUp(AllBookings, ID = _new.ID));
                                                                  If(
                                                                      _free,
                                                                      Notify("Booking updated", NotificationType.Success),
                                                                      Notify("Slot still busy — booking is still clashed", NotificationType.Warning)
                                                                  )
                                                              )
                                                          ),
                                                          // _changes is the server Patch payload; the colBookings mirror re-reads the row instead (T-13/A1)
                                                          With(
                                                              {
                                                                  _changes: {
                                                                      /* T-09/3.2: a room move applies to this occurrence only */
                                                                      RoomID: {Id: gbl_PendingRoomId, Value: gbl_PendingRoomText},
                                                                      StartDateTime: gbl_PendingStart,
                                                                      EndDateTime: gbl_PendingEnd,
                                                                      IsException: true,
                                                                      /* BUG-4: a busy target slot is a clash, whatever the row was before */
                                                                      Status: If(_free, "Active", "Clash")
                                                                  }
                                                              },
                                                          IfError(
                                                              Patch(
                                                                  Book_Bookings,
