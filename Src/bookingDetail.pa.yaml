                                                          UpdateContext({locScopeRefused: true});
                                                          Notify("Date changes apply to this occurrence only. Choose ""Just this booking"" to move the date, or keep the original date to retime the whole series.", NotificationType.Warning),
                                                      // EDIT — whole series: re-time every future, non-cancelled, non-exception member
                                                      With(
                                                          {
                                                              _sid: gblSelectedBooking.SeriesID,
                                                              _startMinutes: Hour(gbl_PendingStart) * 60 + Minute(gbl_PendingStart),
                                                              _endMinutes: Hour(gbl_PendingEnd) * 60 + Minute(gbl_PendingEnd)
                                                          },
                                                          ClearCollect(colSeriesServerRows, Filter(Book_Bookings, SeriesID = _sid));
                                                          ClearCollect(
                                                              colSeriesEditPlan,
                                                              ForAll(
                                                                  Filter(
                                                                      colSeriesServerRows,
                                                                      StartDateTime >= Now(), Status <> "Cancelled", Status <> "Migrated", !IsException,
                                                                      fnIsMine(BookedByEmail)
                                                                  ),
                                                                  With(
                                                                      {
                                                                          _memberId: ID,
                                                                          _memberStatus: Status,
                                                                          _memberRoomId: RoomID.Id,
                                                                          _newStart: DateAdd(DateValue(Text(StartDateTime, "yyyy-mm-dd")), _startMinutes, TimeUnit.Minutes),
                                                                          _newEnd: DateAdd(DateValue(Text(StartDateTime, "yyyy-mm-dd")), _endMinutes, TimeUnit.Minutes)
