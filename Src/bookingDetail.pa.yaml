Screens:
  bookingDetail:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =UpdateContext({varConfirmCancel: false});
        Set(gbl_UI_ScopePrompt, "")
    Children:
      - con_shell_1:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cpt_header_detail:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - con_body_home_1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - conDetail:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0,0,0,0)
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Min(Parent.Width, 640)
                      Children:
                        - btnDetailBack:
                            Control: Classic/Button
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              Color: =AppTheme.TextPrimary
                              Fill: =AppTheme.SurfaceAlt
                              FocusedBorderColor: =RGBA(15,98,254,1)
                              FocusedBorderThickness: =2
                              Font: =Font.Lato
                              FontWeight: =FontWeight.Normal
                              HoverColor: =AppTheme.TextPrimary
                              HoverFill: =AppTheme.Border
                              OnSelect: |-
                                =Set(gbl_UI_ScopePrompt, "");
                                Set(gbl_FixCycleSeriesID, "");
                                Navigate(myBookings, ScreenTransition.Fade)
                              PressedColor: =AppTheme.TextPrimary
                              PressedFill: =AppTheme.Border
                              RadiusBottomLeft: =2
                              RadiusBottomRight: =2
                              RadiusTopLeft: =2
                              RadiusTopRight: =2
                              Size: =11
                              Text: ="← Back to my bookings"
                              Width: =220
                        - lblDetailTitle:
                            Control: Label
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =AppTheme.TextPrimary
                              Font: =Font.Lato
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =20
                              Text: =If(IsBlank(gblSelectedBooking), "No booking selected", gblSelectedBooking.Title)
                        - lblDetailEmpty:
                            Control: Label
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =AppTheme.TextMuted
                              Font: =Font.Lato
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: ="Open a booking from My bookings to see its details."
                              Visible: =IsBlank(gblSelectedBooking)
                        - conDetailCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =24
                              PaddingLeft: =24
                              PaddingRight: =24
                              PaddingTop: =24
                              RadiusBottomLeft: =2
                              RadiusBottomRight: =2
                              RadiusTopLeft: =2
                              RadiusTopRight: =2
                              Visible: =!IsBlank(gblSelectedBooking)
                            Children:
                              - lblStatusBadge:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Start
                                    Color: =If(fnIsPast(gblSelectedBooking.EndDateTime), AppTheme.TextMuted, ColorValue(AppTheme.PrimaryText))
                                    Fill: =If(fnIsPast(gblSelectedBooking.EndDateTime), AppTheme.Border, ColorValue(AppTheme.ButtonPrimary))
                                    Font: =Font.Lato
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: =If(fnIsPast(gblSelectedBooking.EndDateTime), "Past", "Upcoming")
                                    Width: =88
                                    Wrap: =false
                              - fldRoom:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - capRoom:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextMuted
                                          Font: =Font.Lato
                                          Height: =16
                                          LayoutMinHeight: =0
                                          Size: =11
                                          Text: ="Room"
                                          Wrap: =false
                                    - valRoom:
                                        Control: Label
                                        Properties:
                                          AutoHeight: =true
                                          Color: =AppTheme.TextPrimary
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          LayoutMinHeight: =0
                                          Size: =14
                                          Text: |-
                                            =gblSelectedBooking.'RoomID: Title'.Value
                                          Wrap: =false
                              - fldDate:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - capDate:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextMuted
                                          Font: =Font.Lato
                                          Height: =16
                                          LayoutMinHeight: =0
                                          Size: =11
                                          Text: ="Date"
                                          Wrap: =false
                                    - valDate:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: =Font.Lato
                                          Height: =20
                                          LayoutMinHeight: =0
                                          Size: =14
                                          Text: =Text(gblSelectedBooking.StartDateTime, "dddd dd mmmm yyyy")
                                          Wrap: =false
                              - fldTime:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - capTime:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextMuted
                                          Font: =Font.Lato
                                          Height: =16
                                          LayoutMinHeight: =0
                                          Size: =11
                                          Text: ="Time"
                                          Wrap: =false
                                    - valTime:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: =Font.Lato
                                          Height: =20
                                          LayoutMinHeight: =0
                                          Size: =14
                                          Text: =Text(gblSelectedBooking.StartDateTime, "HH:mm") & " – " & Text(gblSelectedBooking.EndDateTime, "HH:mm")
                                          Wrap: =false
                              - fldBy:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - capBy:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextMuted
                                          Font: =Font.Lato
                                          Height: =16
                                          LayoutMinHeight: =0
                                          Size: =11
                                          Text: ="Booked by"
                                          Wrap: =false
                                    - valBy:
                                        Control: Label
                                        Properties:
                                          Color: =AppTheme.TextPrimary
                                          Font: =Font.Lato
                                          Height: =20
                                          LayoutMinHeight: =0
                                          Size: =14
                                          Text: =gblSelectedBooking.BookedBy.DisplayName
                                          Wrap: =false
                        - conCancelZone:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0)
                              Height: =180
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMaxHeight: =110
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =!IsBlank(gblSelectedBooking) && !fnIsPast(gblSelectedBooking.EndDateTime)
                            Children:
                              - btnChangeTimeDetail:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    BorderThickness: =1
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    Fill: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderColor: =RGBA(15,98,254,1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =RGBA(13,83,217,1)
                                    OnSelect: |-
                                      =Set(varConflict, false);
                                      // RESET-SITE[bookingdetail-change-time] wizard state reset before opening step 2 (times-only)
                                      Set(varBookingError, false);
                                      Set(varSubmitting, false);
                                      Set(varTitleTouched, false);
                                      Set(gbl_UI_Book_CancelConfirm, false);
                                      Set(gbl_Book_SubmitResult, "");
                                      Set(varConflictingBooking, Blank());
                                      Set(varNextFreeSlot, Blank());
                                      ClearCollect(varAlternativeRooms, Filter(colRooms, true = false));

                                      /* Times-only edit: no series controls in this flow.
                                         tglRecurring/drpWeeks live inside cpt_Modal_ and cannot be
                                         Reset() from a screen; the component resets them on close. */

                                      /* Prefill the wizard from the booking being edited */
                                      Set(gblEditingBookingID, gblSelectedBooking.ID);
                                      Set(varSelectedRoom, LookUp(colRooms, ID = gblSelectedBooking.RoomID.Id));
                                      Set(varSelectedDate, DateValue(Text(gblSelectedBooking.StartDateTime, "yyyy-mm-dd")));
                                      Set(varStartTime, gblSelectedBooking.StartDateTime);
                                      Set(varEndTime, gblSelectedBooking.EndDateTime);
                                      Set(varTitle, gblSelectedBooking.Title);

                                      Set(gbl_UI_Book_Modal_Step, WizardStep2);
                                      Set(gbl_UI_Book_Modal, true)
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =RGBA(11,69,182,1)
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Change time"
                                    Visible: =!varConfirmCancel && gbl_UI_ScopePrompt = ""
                              - btnCancelStart:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =AppTheme.StatusBusyText
                                    BorderThickness: =1
                                    Color: =AppTheme.StatusBusyText
                                    Fill: =AppTheme.Surface
                                    FocusedBorderColor: =RGBA(15,98,254,1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =AppTheme.StatusBusyText
                                    HoverFill: =AppTheme.StatusBusyBg
                                    OnSelect: |-
                                      =UpdateContext({varConfirmCancel: true})
                                    PressedColor: =AppTheme.StatusBusyText
                                    PressedFill: =AppTheme.StatusBusyBg
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                                    Text: ="Cancel booking"
                                    Visible: =!varConfirmCancel && gbl_UI_ScopePrompt = ""
                              - conConfirmRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =AppTheme.StatusBusyText
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.StatusBusyBg
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Visible: =varConfirmCancel && gbl_UI_ScopePrompt = ""
                                  Children:
                                    - lblCancelConfirm:
                                        Control: Label
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =AppTheme.StatusBusyText
                                          Font: =Font.Lato
                                          Height: =24
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: ="Cancel this booking? This can't be undone."
                                    - conConfirmButtons:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - btnKeepBooking:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =1
                                                Color: =AppTheme.TextPrimary
                                                Fill: =AppTheme.Surface
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                OnSelect: |-
                                                  =UpdateContext({varConfirmCancel: false})
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Keep booking"
                                                Width: =140
                                          - btnConfirmCancel:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =AppTheme.StatusBusyText
                                                BorderThickness: =0
                                                Color: =ColorValue(AppTheme.PrimaryText)
                                                Fill: =AppTheme.StatusBusyText
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =ColorValue(AppTheme.PrimaryText)
                                                HoverFill: =ColorValue("#b81922")
                                                OnSelect: |-
                                                  =// PROD-REVERT[booking-cancel] soft delete via Patch; Remove() retired per WS4
                                                  If(
                                                      IsBlank(gblSelectedBooking.SeriesID),
                                                      IfError(
                                                          Patch(Book_Bookings, LookUp(Book_Bookings, ID = gblSelectedBooking.ID), {Status: "Cancelled"}),
                                                          Notify("Couldn't cancel this booking. Please try again.", NotificationType.Error),
                                                          Refresh(Book_Bookings);
                                                          UpdateIf(colBookings, ID = gblSelectedBooking.ID, {Status: "Cancelled"});
                                                          Set(gblSelectedBooking, Blank());
                                                          Notify("Booking cancelled", NotificationType.Success);
                                                          Navigate(myBookings, ScreenTransition.Fade)
                                                      ),
                                                      // Series member: ask for cancel scope instead of writing immediately
                                                      UpdateContext({varConfirmCancel: false});
                                                      Set(gbl_UI_ScopePrompt, "cancel")
                                                  )
                                                PressedColor: =ColorValue(AppTheme.PrimaryText)
                                                PressedFill: =ColorValue("#921620")
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Yes, cancel"
                                                Width: =140
                              - con_ScopePrompt:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =AppTheme.StatusWarnText
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.StatusWarnBg
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Visible: =gbl_UI_ScopePrompt = "edit" || gbl_UI_ScopePrompt = "cancel"
                                  Children:
                                    - lblScopePromptTitle:
                                        Control: Label
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =AppTheme.StatusWarnText
                                          Font: =Font.Lato
                                          Height: =24
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =12
                                          Text: =If(gbl_UI_ScopePrompt = "edit", "This booking is part of a series. Apply the new time to:", "This booking is part of a series. Cancel:")
                                    - conScopePromptButtons:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - btnScopeJust:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =1
                                                Color: =AppTheme.TextPrimary
                                                Fill: =AppTheme.Surface
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                OnSelect: |-
                                                  =If(
                                                      gbl_UI_ScopePrompt = "edit",
                                                      // EDIT — just this occurrence: apply the pending times, mark as an exception
                                                      With(
                                                          {
                                                              _free: IsBlank(
                                                                  LookUp(
                                                                      Filter(
                                                                          colBookings,
                                                                          Status = "Active",
                                                                          fnOverlaps(StartDateTime, EndDateTime, gbl_PendingStart, gbl_PendingEnd),
                                                                          ID <> gblSelectedBooking.ID
                                                                      ),
                                                                      RoomID.Id = gblSelectedBooking.RoomID.Id
                                                                  )
                                                              )
                                                          },
                                                          // _changes shared by the server Patch and the colBookings mirror so the field lists cannot drift
                                                          With(
                                                              {
                                                                  _changes: {
                                                                      StartDateTime: gbl_PendingStart,
                                                                      EndDateTime: gbl_PendingEnd,
                                                                      IsException: true,
                                                                      /* BUG-4: a busy target slot is a clash, whatever the row was before */
                                                                      Status: If(_free, "Active", "Clash")
                                                                  }
                                                              },
                                                          IfError(
                                                              Patch(
                                                                  Book_Bookings,
                                                                  LookUp(Book_Bookings, ID = gblSelectedBooking.ID),
                                                                  _changes
                                                              ),
                                                              Notify("Couldn't update this booking. Please try again.", NotificationType.Error),
                                                              Refresh(Book_Bookings);
                                                              UpdateIf(colBookings, ID = gblSelectedBooking.ID, _changes);
                                                              If(
                                                                  _free,
                                                                  Notify("Booking updated", NotificationType.Success),
                                                                  Notify("Slot still busy — booking is still clashed", NotificationType.Warning)
                                                              );
                                                              // Fix cycling: advance to the next clash in this series, if any
                                                              If(
                                                                  gbl_FixCycleSeriesID <> "",
                                                                  With(
                                                                      {_next: First(SortByColumns(Filter(colBookings, SeriesID = gbl_FixCycleSeriesID, Status = "Clash", ID <> gblSelectedBooking.ID), "StartDateTime", SortOrder.Ascending))},
                                                                      If(
                                                                          IsBlank(_next),
                                                                          Set(gbl_FixCycleSeriesID, "");
                                                                          If(
                                                                              _free,
                                                                              Notify("All clashes resolved", NotificationType.Success),
                                                                              Notify("No further clashes to fix — this booking is still clashed", NotificationType.Warning)
                                                                          ),
                                                                          // RESET-SITE[bookingdetail-fix-cycle-advance] wizard state reset before opening the next clash
                                                                          Set(gblSelectedBooking, _next);
                                                                          Set(gblEditingBookingID, _next.ID);
                                                                          Set(varConflict, false);
                                                                          Set(varBookingError, false);
                                                                          Set(varSubmitting, false);
                                                                          Set(varTitleTouched, false);
                                                                          Set(gbl_UI_Book_CancelConfirm, false);
                                                                          Set(gbl_Book_SubmitResult, "");
                                                                          Set(varConflictingBooking, Blank());
                                                                          Set(varNextFreeSlot, Blank());
                                                                          ClearCollect(varAlternativeRooms, Filter(colRooms, true = false));
                                                                          Set(varSelectedRoom, LookUp(colRooms, ID = _next.RoomID.Id));
                                                                          Set(varSelectedDate, DateValue(Text(_next.StartDateTime, "yyyy-mm-dd")));
                                                                          Set(varStartTime, _next.StartDateTime);
                                                                          Set(varEndTime, _next.EndDateTime);
                                                                          Set(varTitle, _next.Title);
                                                                          Set(gbl_UI_Book_Modal_Step, WizardStep2);
                                                                          Set(gbl_UI_Book_Modal, true)
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                          )
                                                      ),
                                                      // CANCEL — just this occurrence (current single-row cancel; works on Clash rows too)
                                                      IfError(
                                                          Patch(Book_Bookings, LookUp(Book_Bookings, ID = gblSelectedBooking.ID), {Status: "Cancelled"}),
                                                          Notify("Couldn't cancel this booking. Please try again.", NotificationType.Error),
                                                          Refresh(Book_Bookings);
                                                          UpdateIf(colBookings, ID = gblSelectedBooking.ID, {Status: "Cancelled"});
                                                          Set(gblSelectedBooking, Blank());
                                                          Notify("Booking cancelled", NotificationType.Success);
                                                          Set(gbl_FixCycleSeriesID, "");
                                                          Navigate(myBookings, ScreenTransition.Fade)
                                                      )
                                                  );
                                                  Set(gbl_UI_ScopePrompt, "");
                                                  Set(gbl_PendingStart, Blank());
                                                  Set(gbl_PendingEnd, Blank())
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Just this booking"
                                                Width: =168
                                          - btnScopeSeries:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                                BorderThickness: =1
                                                Color: =ColorValue(AppTheme.PrimaryText)
                                                Fill: =ColorValue(AppTheme.ButtonPrimary)
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =ColorValue(AppTheme.PrimaryText)
                                                HoverFill: =RGBA(13,83,217,1)
                                                OnSelect: |-
                                                  =If(
                                                      gbl_UI_ScopePrompt = "edit",
                                                      // EDIT — whole series: re-time every future, non-cancelled, non-exception member
                                                      With(
                                                          {
                                                              _sid: gblSelectedBooking.SeriesID,
                                                              _startMinutes: Hour(gbl_PendingStart) * 60 + Minute(gbl_PendingStart),
                                                              _endMinutes: Hour(gbl_PendingEnd) * 60 + Minute(gbl_PendingEnd)
                                                          },
                                                          ClearCollect(colSeriesServerRows, Filter(Book_Bookings, SeriesID = _sid));
                                                          ClearCollect(
                                                              colSeriesEditPlan,
                                                              ForAll(
                                                                  Filter(
                                                                      colSeriesServerRows,
                                                                      StartDateTime >= Now(), Status <> "Cancelled", !IsException,
                                                                      BookedByEmail = Lower(User().Email)
                                                                  ),
                                                                  With(
                                                                      {
                                                                          _memberId: ID,
                                                                          _memberStatus: Status,
                                                                          _memberRoomId: RoomID.Id,
                                                                          _newStart: DateAdd(DateValue(Text(StartDateTime, "yyyy-mm-dd")), _startMinutes, TimeUnit.Minutes),
                                                                          _newEnd: DateAdd(DateValue(Text(StartDateTime, "yyyy-mm-dd")), _endMinutes, TimeUnit.Minutes)
                                                                      },
                                                                      With(
                                                                          {
                                                                              _isWeekend: Weekday(_newStart, StartOfWeek.Monday) > 5,
                                                                              _occupied: !IsBlank(
                                                                                  LookUp(
                                                                                      Filter(colBookings, Status = "Active", SeriesID <> _sid, fnOverlaps(StartDateTime, EndDateTime, _newStart, _newEnd)),
                                                                                      RoomID.Id = _memberRoomId
                                                                                  )
                                                                              )
                                                                          },
                                                                          {
                                                                              MemberID: _memberId,
                                                                              PrevStatus: _memberStatus,
                                                                              NewStart: _newStart,
                                                                              NewEnd: _newEnd,
                                                                              NewStatus: If(_isWeekend || _occupied, "Clash", "Active")
                                                                          }
                                                                      )
                                                                  )
                                                              )
                                                          );

                                                          With(
                                                              {
                                                                  _results: ForAll(
                                                                      colSeriesEditPlan,
                                                                      IfError(
                                                                          Patch(
                                                                              Book_Bookings,
                                                                              LookUp(Book_Bookings, ID = MemberID),
                                                                              {StartDateTime: NewStart, EndDateTime: NewEnd, Status: NewStatus}
                                                                          );
                                                                          true,
                                                                          Notify("Couldn't update one or more occurrences.", NotificationType.Error);
                                                                          false
                                                                      )
                                                                  )
                                                              },
                                                              Refresh(Book_Bookings);
                                                              If(
                                                                  CountRows(Filter(_results, !Value)) = 0,
                                                                  // Mirror: iterate the same plan collection the server loop wrote from — identical change set
                                                                  // (blank-safe: skip rows absent from the colBookings window; UpdateIf is not supported inside ForAll)
                                                                  ForAll(
                                                                      colSeriesEditPlan As _p,
                                                                      With(
                                                                          {_mirrorRow: LookUp(colBookings, ID = _p.MemberID)},
                                                                          If(!IsBlank(_mirrorRow), Patch(colBookings, _mirrorRow, {StartDateTime: _p.NewStart, EndDateTime: _p.NewEnd, Status: _p.NewStatus}))
                                                                      )
                                                                  ),
                                                                  // MIRROR-FALLBACK: partial series-edit failure — local picture uncertain, re-pull the window
                                                                  ClearCollect(colBookings, BookingsWindow)
                                                              );
                                                              Set(gblSelectedBooking, LookUp(colBookings, ID = gblSelectedBooking.ID))
                                                          );

                                                          If(
                                                              CountRows(colSeriesEditPlan) = 0,
                                                              Notify("Nothing to update — no upcoming occurrences you own in this series.", NotificationType.Warning),
                                                              With(
                                                                  {
                                                                      _healed: CountRows(Filter(colSeriesEditPlan, PrevStatus = "Clash", NewStatus = "Active")),
                                                                      _newClashes: CountRows(Filter(colSeriesEditPlan, PrevStatus <> "Clash", NewStatus = "Clash"))
                                                                  },
                                                                  Notify(
                                                                      "Series updated" &
                                                                      If(_healed > 0, " — " & _healed & " clash" & If(_healed = 1, "", "es") & " healed", "") &
                                                                      If(_newClashes > 0, " — " & _newClashes & " now need" & If(_newClashes = 1, "s", "") & " rescheduling", ""),
                                                                      NotificationType.Success
                                                                  )
                                                              )
                                                          )
                                                      ),
                                                      // CANCEL — whole series (including exceptions; past occurrences untouched), OWNED only.
                                                      // Server-filtered by SeriesID so the mutation set is immune to the data-row limit (BUG-2/BUG-3).
                                                      // (refinement runs on the materialized collection — predicates layered on the live query draw compile-failing delegation warnings)
                                                      With(
                                                          {_sid: gblSelectedBooking.SeriesID},
                                                          ClearCollect(colSeriesServerRows, Filter(Book_Bookings, SeriesID = _sid));
                                                          // _targets captured once: the same rows drive the server loop and the mirror (one predicate, no Now() drift)
                                                          With(
                                                              {
                                                                  _targets: Filter(
                                                                      colSeriesServerRows,
                                                                      StartDateTime >= Now(),
                                                                      Status <> "Cancelled",
                                                                      BookedByEmail = Lower(User().Email)
                                                                  )
                                                              },
                                                          With(
                                                              {
                                                                  _results: ForAll(
                                                                      _targets As _m,
                                                                      IfError(
                                                                          Patch(Book_Bookings, LookUp(Book_Bookings, ID = _m.ID), {Status: "Cancelled"});
                                                                          true,
                                                                          false
                                                                      )
                                                                  )
                                                              },
                                                              Refresh(Book_Bookings);
                                                              If(
                                                                  CountRows(Filter(_results, !Value)) = 0,
                                                                  // Mirror: same _targets rows the server loop wrote (blank-safe; UpdateIf is not supported inside ForAll)
                                                                  ForAll(
                                                                      _targets As _t,
                                                                      With(
                                                                          {_mirrorRow: LookUp(colBookings, ID = _t.ID)},
                                                                          If(!IsBlank(_mirrorRow), Patch(colBookings, _mirrorRow, {Status: "Cancelled"}))
                                                                      )
                                                                  ),
                                                                  // MIRROR-FALLBACK: partial series-cancel failure — local picture uncertain, re-pull the window
                                                                  ClearCollect(colBookings, BookingsWindow)
                                                              );
                                                              Set(gblSelectedBooking, Blank());
                                                              If(
                                                                  CountRows(_results) = 0,
                                                                  Notify("Nothing to cancel — no upcoming occurrences you own in this series.", NotificationType.Warning),
                                                                  CountRows(Filter(_results, !Value)) = 0,
                                                                  Notify("Series cancelled", NotificationType.Success),
                                                                  Notify(
                                                                      $"Couldn't cancel {CountRows(Filter(_results, !Value))} occurrence(s) — the series is only partially cancelled.",
                                                                      NotificationType.Error
                                                                  )
                                                              );
                                                              Set(gbl_FixCycleSeriesID, "");
                                                              Navigate(myBookings, ScreenTransition.Fade)
                                                          )
                                                          )
                                                      )
                                                  );
                                                  Set(gbl_UI_ScopePrompt, "");
                                                  Set(gbl_PendingStart, Blank());
                                                  Set(gbl_PendingEnd, Blank())
                                                PressedColor: =ColorValue(AppTheme.PrimaryText)
                                                PressedFill: =RGBA(11,69,182,1)
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Whole series"
                                                Width: =168
                                          - btnScopeBack:
                                              Control: Classic/Button
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =1
                                                Color: =AppTheme.TextPrimary
                                                Fill: =AppTheme.Surface
                                                FocusedBorderColor: =RGBA(15,98,254,1)
                                                FocusedBorderThickness: =2
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =AppTheme.TextPrimary
                                                HoverFill: =AppTheme.Border
                                                OnSelect: |-
                                                  =Set(gbl_UI_ScopePrompt, "");
                                                  Set(gbl_PendingStart, Blank());
                                                  Set(gbl_PendingEnd, Blank());
                                                  Set(gbl_FixCycleSeriesID, "")
                                                PressedColor: =AppTheme.TextPrimary
                                                PressedFill: =AppTheme.Border
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Size: =11
                                                Text: ="Back"
                                                Width: =168
      - cpt_Modal__book_detail:
          Control: CanvasComponent
          ComponentName: cpt_Modal_
          Properties:
            Height: =App.Height
            ModalTitleText: =
            OnSubmit: =Set(gbl_UI_Book_Modal, false) /* create flow unreachable from this screen */
            OnSubmitEdit: |-
              =If(cpt_Modal__book_detail.ValidPayload && gblEditingBookingID > 0,
                  With({_occ: First(cpt_Modal__book_detail.PatchPayload)},
                      If(
                          !IsBlank(gblSelectedBooking.SeriesID),
                          // Series member: stash the pending times and ask for scope before writing anything
                          Set(gbl_PendingStart, _occ.StartDateTime);
                          Set(gbl_PendingEnd, _occ.EndDateTime);
                          Set(gbl_UI_ScopePrompt, "edit"),
                          // Standalone booking: unchanged single-row conflict check + Patch
                          If(
                              !IsBlank(
                                  LookUp(
                                      Filter(
                                          colBookings,
                                          Status = "Active",
                                          fnOverlaps(StartDateTime, EndDateTime, _occ.StartDateTime, _occ.EndDateTime),
                                          ID <> gblEditingBookingID
                                      ),
                                      RoomID.Id = _occ.RoomIdNumber
                                  )
                              ),
                              Notify("That slot is no longer free. Your booking is unchanged.", NotificationType.Warning, 6000),
                              // PROD-REVERT[booking-edit] prod form: Patch(Book_Bookings, ...) below
                              // _changes shared by the server Patch and the colBookings mirror so the field lists cannot drift
                              With(
                                  {
                                      _changes: {
                                          Title: _occ.Title,
                                          RoomID: {Id: _occ.RoomIdNumber, Value: _occ.RoomIdText},
                                          StartDateTime: _occ.StartDateTime,
                                          EndDateTime: _occ.EndDateTime
                                      }
                                  },
                                  IfError(
                                      Patch(
                                          Book_Bookings,
                                          LookUp(Book_Bookings, ID = gblEditingBookingID),
                                          _changes
                                      ),
                                      Notify("Couldn't update this booking. Please try again.", NotificationType.Error),
                                      Refresh(Book_Bookings);
                                      UpdateIf(colBookings, ID = gblEditingBookingID, _changes);
                                      Notify("Booking updated", NotificationType.Success)
                                  )
                              )
                          )
                      )
                  );

                  Set(gblSelectedBooking, LookUp(colBookings, ID = gblEditingBookingID));
                  Set(gblEditingBookingID, 0);
                  Set(gbl_UI_Book_Modal, false)
              )
            OptionalLabelText: =" "
            Visible: =gbl_UI_Book_Modal = true
            Width: =App.Width
