                                                                  ForAll(
                                                                      colSeriesEditPlan As _p,
                                                                      With(
                                                                          {_mirrorRow: LookUp(colBookings, ID = _p.MemberID)},
                                                                          If(!IsBlank(_mirrorRow), Patch(colBookings, _mirrorRow, {StartDateTime: _p.NewStart, EndDateTime: _p.NewEnd, Status: _p.NewStatus}))
                                                                      )
