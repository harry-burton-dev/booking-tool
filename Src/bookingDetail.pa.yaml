                                                                  // MIRROR-FALLBACK: partial series-edit failure — local picture uncertain, re-pull the window
                                                                  ClearCollect(colBookings, BookingsWindow)
                                                              );
                                                              Set(gblSelectedBooking, LookUp(AllBookings, ID = gblSelectedBooking.ID))
                                                          );

                                                          /* A rule-driven series is a single master row, so the plan loop above
                                                             has nothing to walk: re-time the master itself — same calendar date,
                                                             new clock times — and the whole expansion moves with it. */
