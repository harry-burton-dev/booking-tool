                                                                                                          RecurrenceType: _newRule,
                                                                                                          OccIndex: 0,
                                                                                                          IsException: false,
                                                                                                          Status: "Active",
                                                                                                          RecurrenceLabel: fnRuleLabel(_newRule, gbl_PendingStart),
