                        - adBRBtnCreate_pbm:
                            Control: Classic/Button
                            Properties:
                              BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                              BorderThickness: =0
                              Color: =ColorValue(AppTheme.PrimaryText)
                              Fill: =ColorValue(AppTheme.ButtonPrimary)
                              FocusedBorderColor: =ColorValue(AppTheme.Primary)
                              FocusedBorderThickness: =2
                              Font: ="IBM Plex Sans"
                              FontWeight: =FontWeight.Normal
                              HoverColor: =ColorValue(AppTheme.PrimaryText)
                              HoverFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With(
                                    {
                                        _s: DateAdd(DateAdd(DateValue(Text(adBRDteFirst_pbm.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpStartHour_pbm.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpStartMin_pbm.Selected.Value), TimeUnit.Minutes),
                                        _e: DateAdd(DateAdd(DateValue(Text(adBRDteFirst_pbm.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpEndHour_pbm.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpEndMin_pbm.Selected.Value), TimeUnit.Minutes),
                                        _room: adBRDrpRoom_pbm.Selected
                                    },
                                    If(IsBlank(Trim(adBRInpTitle_pbm.Text)) || IsBlank(_room),
                                        Notify("Title and room are required.", NotificationType.Error),
                                        _e <= _s,
                                        Notify("End time must be after start time.", NotificationType.Error),
                                        RecurClashCount > 0,
                                        Notify("This permanent booking clashes with existing bookings. Change the room or time.", NotificationType.Error),
                                        IfError(
                                            Patch(Book_Bookings, Defaults(Book_Bookings),
                                            {
                                                Title: Trim(adBRInpTitle_pbm.Text),
                                                RoomID: {Id: _room.ID, Value: Text(_room.RoomID)},
                                                StartDateTime: _s, EndDateTime: _e,
                                                BookedByEmail: Lower(User().Email),
                                                // PROD-REVERT[booked-by-actor] person = actor; mock claims don't resolve
                                                BookedBy: {
                                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                    Claims: $"i:0#.f|membership|{Lower(User().Email)}",
                                                    DisplayName: User().FullName,
                                                    Email: Lower(User().Email),
                                                    Department: "",
                                                    JobTitle: "",
                                                    Picture: ""
                                                },
                                                Status: "Active", SeriesID: Text(GUID()),
                                                RecurrenceType: RecurRule,
                                                OccIndex: 0, IsException: false, IsPrivate: false,
                                                /* T-08: denormalised fields the notification flows read (they must not parse rules) */
                                                WantsInvite: Coalesce(gblUserSettings.CalendarInvite, true),
                                                RecurrenceLabel: RecurLabel,
                                                NextOccurrence: _s
                                            }),
                                            /* BOOK-5: nothing was written, so the mirror refresh, the panel resets
                                               and the modal-close all stay on the success arm - the admin keeps their
                                               input in this modal and can retry. */
                                            Notify("Couldn't create this permanent booking. Please try again.", NotificationType.Error),
                                            /* MIRROR: masters live in colBRMasters, not colBookings */
                                            ClearCollect(colBRMasters, Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active"));
                                            Set(gblRecurWD, "");
                                            Set(gblRecurMode, "");
                                            Set(gblRecurFreq, "W");
                                            Set(gblRecurInterval, 1);
                                            Set(gblRecurMonthMode, "day");
                                            Notify("Permanent booking created.", NotificationType.Success);
                                            Set(gbl_UI_PermanentNew_Modal, false)
                                        )
                                    )
                                )
                              PressedColor: =ColorValue(AppTheme.PrimaryText)
                              PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =12
                              Text: ="Create series"
