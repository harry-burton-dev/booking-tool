                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - btnNext:
                      Control: Classic/Button
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(15, 98, 254, 1)
                        BorderThickness: =0
                        Color: =ColorValue(AppTheme.PrimaryText)
                        DisabledBorderColor: =AppTheme.SurfaceAlt
                        DisabledColor: =ColorValue(AppTheme.ButtonDisabledText)
                        DisabledFill: =ColorValue(AppTheme.ButtonDisabled)
                        DisplayMode: =If(IsBlank(varSelectedRoom) || IsBlank(varStartTime) || IsBlank(varEndTime) || varEndTime <= varStartTime || IsBlank(varTitle) || varConflict || fnIsPast(varStartTime) || (!IsBlank(varSelectedDate) && (Weekday(varSelectedDate, StartOfWeek.Sunday) in [1,7] || varSelectedDate < Today())) || DateDiff(varStartTime, varEndTime, TimeUnit.Minutes) > MaxBookingMinutes, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =ColorValue(AppTheme.ButtonPrimary)
                        FocusedBorderColor: =RGBA(15, 98, 254, 1)
                        FocusedBorderThickness: =2
                        Font: ="IBM Plex Sans"
                        FontWeight: =FontWeight.Normal
                        HoverBorderColor: =RGBA(13, 83, 217, 1)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(13, 83, 217, 1)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(gbl_UI_Book_Modal_Step, WizardStep3)
                        PressedBorderColor: =RGBA(11, 69, 182, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(11, 69, 182, 1)
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Size: =11
                        Text: ="Next"
                        Visible: =gbl_UI_Book_Modal_Step = WizardStep2
                        Width: =120
                  - btnConfirm:
                      Control: Classic/Button
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(15, 98, 254, 1)
                        BorderThickness: =0
                        Color: =ColorValue(AppTheme.PrimaryText)
                        DisabledBorderColor: =AppTheme.SurfaceAlt
                        DisabledColor: =AppTheme.TextMuted
                        DisabledFill: =AppTheme.SurfaceAlt
                        DisplayMode: =If(IsBlank(varSelectedRoom) || IsBlank(varStartTime) || IsBlank(varEndTime) || varEndTime <= varStartTime || IsBlank(varTitle) || (tglBookOnBehalf.Checked && IsBlank(varBookForEmail)) || varConflict || fnIsPast(varStartTime) || varSubmitting || (!IsBlank(varSelectedDate) && (Weekday(varSelectedDate, StartOfWeek.Sunday) in [1,7] || varSelectedDate < Today())) || DateDiff(varStartTime, varEndTime, TimeUnit.Minutes) > MaxBookingMinutes, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =ColorValue(AppTheme.ButtonPrimary)
                        FocusedBorderColor: =RGBA(15, 98, 254, 1)
                        FocusedBorderThickness: =2
                        Font: ="IBM Plex Sans"
                        FontWeight: =FontWeight.Normal
                        HoverBorderColor: =RGBA(13, 83, 217, 1)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(13, 83, 217, 1)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varSubmitting, true);
                          /* BUG-1: re-read the server, not the colBookings snapshot, so a slot
                             taken by ANOTHER user since screen entry is caught here. The edit-mode
                             self-exclusion happens collection-side: an ID <> predicate layered on
                             the server query draws a delegation warning that fails compile. */
                          ClearCollect(
                              colOverlappingBookings,
                              Filter(
                                  Book_Bookings,
                                  Status = "Active",
                                  StartDateTime < varEndTime,
                                  EndDateTime > varStartTime
                              )
                          );
                          RemoveIf(colOverlappingBookings, ID = gblEditingBookingID);
                          Set(varConflict, !IsEmpty(Filter(colOverlappingBookings, RoomID.Id = varSelectedRoom.ID)));
                          Set(varConflictingBooking, LookUp(colOverlappingBookings, RoomID.Id = varSelectedRoom.ID));
                          Set(
                              varNextFreeSlot,
                              LookUp(
                                  Filter(
                                      colBookings,
                                      Status = "Active",
                                      StartDateTime >= varStartTime,
                                      StartDateTime < DateAdd(varSelectedDate, 1, TimeUnit.Days),
                                      ID <> gblEditingBookingID
                                  ),
                                  RoomID.Id = varSelectedRoom.ID,
                                  EndDateTime
                              )
                          );
                          If(!varConflict,
                              /* Snapshot the payload BEFORE raising OnSubmit/OnSubmitEdit: the
                                 resets below used to race the host's read of PatchPayload (it read
                                 after the resets and always saw a single occurrence). PatchPayload
                                 now just returns this collection. */
                              ClearCollect(
                                  colPayloadOut,
                                  With(
                                      {
                                          _repeating: drpRepeats.Selected.Value <> "Doesn't repeat",
                                          _recurrenceType: Switch(
                                              drpRepeats.Selected.Value,
                                              "Weekly", "Weekly",
                                              "Every 2 weeks", "BiWeekly",
                                              "Monthly", "Monthly",
                                              ""
                                          )
                                      },
                                      ForAll(
                                          Sequence(If(_repeating, Value(drpOccurrences.Selected.Value), 1)) As _occ,
                                          With(
                                              {
                                                  _rawStart: Switch(
                                                      _recurrenceType,
                                                      "Weekly", DateAdd(varStartTime, 7 * (_occ.Value - 1), TimeUnit.Days),
                                                      "BiWeekly", DateAdd(varStartTime, 14 * (_occ.Value - 1), TimeUnit.Days),
                                                      "Monthly", DateAdd(varStartTime, _occ.Value - 1, TimeUnit.Months),
                                                      varStartTime
                                                  ),
                                                  _rawEnd: Switch(
                                                      _recurrenceType,
                                                      "Weekly", DateAdd(varEndTime, 7 * (_occ.Value - 1), TimeUnit.Days),
                                                      "BiWeekly", DateAdd(varEndTime, 14 * (_occ.Value - 1), TimeUnit.Days),
                                                      "Monthly", DateAdd(varEndTime, _occ.Value - 1, TimeUnit.Months),
                                                      varEndTime
                                                  )
                                              },
                                              With(
                                                  {
                                                      /* BUG-10b: Mon–Fri rule for every occurrence, not just #1.
                                                         Weekly/BiWeekly steps preserve the weekday, so the shift is
                                                         0 for them by construction; only Monthly can drift onto
                                                         Sat (Weekday 7 → +2) or Sun (Weekday 1 → +1). */
                                                      _shiftDays: Switch(
                                                          Weekday(_rawStart, StartOfWeek.Sunday),
                                                          7, 2,
                                                          1, 1,
                                                          0
                                                      )
                                                  },
                                                  With(
                                                      {
                                                          vStart: DateAdd(_rawStart, _shiftDays, TimeUnit.Days),
                                                          vEnd: DateAdd(_rawEnd, _shiftDays, TimeUnit.Days)
                                                      },
                                                      {
                                                          OccIndex: _occ.Value,
                                                          Title: varTitle,
                                                          BookedByEmail: If(IsBlank(varBookForEmail), Lower(User().Email), varBookForEmail),
                                                          RoomIdNumber: Value(varSelectedRoom.ID),
                                                          RoomIdText: Text(varSelectedRoom.RoomID),
                                                          RoomTitle: varSelectedRoom.Title,
                                                          StartDateTime: vStart,
                                                          EndDateTime: vEnd,
                                                          IsPrivate: tglPrivate.Checked,
                                                          RecurrenceType: _recurrenceType
                                                      }
                                                  )
                                              )
                                          )
                                      )
                                  )
                              );

                              /* Hand off to the host: the component validates and emits
                                 PatchPayload / ValidPayload, the host performs the write. */
                              If(gblEditingBookingID = 0, cpt_Modal_.OnSubmit(), cpt_Modal_.OnSubmitEdit());

                              /* Hosts close the modal on ALL outcomes (success and error), so reset
                                 unconditionally — a guarded reset would leave stale control state
                                 (on-behalf toggle, title, repeats) for the next open. BUG-14's
                                 "modal stays open on error" premise was disproven in review 2026-08-02. */
                              Reset(drpRepeats);
                              Reset(drpOccurrences);
                              Reset(tglPrivate);
                              Reset(tglBookOnBehalf);
                              Reset(drpBookFor);
                              Set(varBookForEmail, "");
                              Set(varBookForName, "");
                              Reset(txtBookingTitle);
                              Set(varTitleTouched, false);
                              Set(gbl_UI_Book_CancelConfirm, false)
                          );
                          Set(varSubmitting, false)
                        PressedBorderColor: =RGBA(11, 69, 182, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(11, 69, 182, 1)
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Size: =11
                        Text: =If(gblEditingBookingID > 0, "Save changes", If(varSubmitting, "Booking…", "Confirm"))
                        Visible: =gbl_UI_Book_Modal_Step = WizardStep3
                        Width: =120
