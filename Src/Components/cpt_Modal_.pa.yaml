                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(15, 98, 254, 1)
                        BorderThickness: =0
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =AppTheme.SurfaceAlt
                        DisabledColor: =AppTheme.TextMuted
                        DisabledFill: =AppTheme.SurfaceAlt
                        DisplayMode: =If(IsBlank(varSelectedRoom) || IsBlank(varStartTime) || IsBlank(varEndTime) || varEndTime <= varStartTime || IsBlank(varTitle) || varConflict || varStartTime < Now() || varSubmitting, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(15, 98, 254, 1)
                        FocusedBorderColor: =RGBA(15, 98, 254, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.Lato
                        FontWeight: =FontWeight.Normal
                        HoverBorderColor: =RGBA(13, 83, 217, 1)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(13, 83, 217, 1)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varSubmitting, true);
                          Clear(colFailedBookings);

                          /* Loop through all occurrences */
                          ForAll(
                              Sequence(
                                  If(
                                      tglRecurring.Checked,
                                      Max(1, Coalesce(Value(drpWeeks.Selected.Value), 1)),
                                      1
                                  )
                              ),
                              With(
                                  {
                                      vStart: DateAdd(varStartTime, (Value - 1) * 7, TimeUnit.Days),
                                      vEnd: DateAdd(varEndTime, (Value - 1) * 7, TimeUnit.Days)
                                  },
                                  If(
                                      !IsBlank(
                                          LookUp(
                                              colBookings,
                                              RoomID.Id = varSelectedRoom.ID &&
                                              StartDateTime < vEnd &&
                                              EndDateTime > vStart
                                          )
                                      ),

                                      /* Save failed date */
                                      Collect(
                                          colFailedBookings,
                                          {
                                              BookingDate: Text(vStart, "dd mmm yyyy")
                                          }
                                      ),

                                      /* Create booking */
                                      Collect(
                                          colBookings,
                                          {
                                              ID: Max(colBookings, ID) + 1,
                                              Title: varTitle,
                                              RoomID: {
                                                  Id: Value(varSelectedRoom.ID),
                                                  Value: Text(varSelectedRoom.RoomID)
                                              },
                                              'RoomID: Title': {
                                                  Id: Value(varSelectedRoom.ID),
                                                  Value: varSelectedRoom.Title
                                              },
                                              StartDateTime: vStart,
                                              EndDateTime: vEnd,
                                              BookedBy: {
                                                  '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                  Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                  DisplayName: User().FullName,
                                                  Email: User().Email,
                                                  Department: "",
                                                  JobTitle: "",
                                                  Picture: ""
                                              }
                                          }
                                      )
                                  )
                              )
                          );

                          /* Tell user what happened */
                          If(
                              CountRows(colFailedBookings) > 0,
                              Notify(
                                  "Some bookings could not be created: " &
                                  Concat(colFailedBookings, BookingDate, ", "),
                                  NotificationType.Warning,
                                  10000
                              ),
                              Notify(
                                  "Booking(s) created successfully",
                                  NotificationType.Success
                              );
                              Navigate(
                                  Home,
                                  ScreenTransition.Fade
                              );
                              Set(gbl_UI_Book_Modal, false)
                          );

                          Set(varSubmitting, false);
