                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =CarbonTextSecondary(CarbonHtmlType.HeadingCompact01, fnHtmlEscape(varSelectedRoom.Title)) &
                                      CarbonTextSecondary(CarbonHtmlType.Label01, Text(varSelectedDate, "dd mmm yyyy")) &
                                      CarbonTextSecondary(CarbonHtmlType.Label01, Text(varStartTime, "HH:mm") & " - " & Text(varEndTime, "HH:mm")) &
                                      If(
                                          !IsBlank(varBookForEmail),
                                          CarbonTextSecondary(CarbonHtmlType.Label01, $"Booking for: {fnHtmlEscape(varBookForName)}"),
                                          ""
                                      ) &
                                      If(
                                          drpRepeats.Selected.Value <> "Doesn't repeat",
                                          CarbonTextSecondary(CarbonHtmlType.Label01, drpRepeats.Selected.Value & " × " & drpOccurrences.Selected.Value),
                                          ""
