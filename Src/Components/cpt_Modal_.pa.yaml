ComponentDefinitions:
  cpt_Modal_:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ModalTitleText:
        PropertyKind: Input
        DisplayName: Modal Title Text
        Description: A custom property
        DataType: Text
        Default: ="Add a new Role to the Database"
      OnSubmit:
        PropertyKind: Event
        DisplayName: OnSubmit
        Description: Submit Payload
        ReturnType: Text
        Default: =true
      OnSubmitEdit:
        PropertyKind: Event
        DisplayName: OnSubmitEdit
        Description: A custom property
        ReturnType: Text
        Default: ="Text"
      OptionalLabelText:
        PropertyKind: Input
        DisplayName: Optional Label Text
        Description: A custom property
        DataType: Text
        Default: =" "
      PatchPayload:
        PropertyKind: Output
        DisplayName: PatchPayload
        Description: A custom property
        DataType: Table
      ValidPayload:
        PropertyKind: Output
        DisplayName: ValidPayload
        Description: A custom property
        DataType: Boolean
    Properties:
      Height: =App.Height
      PatchPayload: |
        =//With(
         //   {
          //      _record: {
          //          Title: Trim(txt_title_modal_1.Text),
           //         Description: Trim(txt_desc_modal_1.Text),
           //         IsPrivate: tog_private_modal_1.Checked,
           //         DirectoryType: drp_type_modal_1.Selected
           //     }
           // },
         //   Table(_record)
        //)
      ValidPayload: =//!IsBlank(txt_title_modal_1.Text) && !IsBlank(drp_type_modal_1.Selected)
      Width: =App.Width
    Children:
      - conRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =AppTheme.Border
            BorderThickness: =1
            DropShadow: =DropShadow.Regular
            Fill: =AppTheme.Surface
            Height: =Min(Parent.Height, 640)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Min(Parent.Width, 560)
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
          Children:
            - lblFormHeader:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =AppTheme.TextPrimary
                  Font: =Font.Lato
                  FontWeight: =FontWeight.Semibold
                  Height: =48
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingTop: =14
                  Size: =18
                  Text: ="New booking"
                  Wrap: =false
            - conProgressBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =AppTheme.Border
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.Background
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =32
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =false
            - conStepBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.Background
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                Children:
                  - conStep1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =16 + lbl_textStep1_chooseRoom.Height + 12 + galRooms.Height + 16
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =gbl_UI_Book_Modal_Step = "1"
                      Children:
                        - lbl_textStep1_chooseRoom:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =AppTheme.SideNavText
                              Font: =Font.Lato
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =14
                              Text: ="Choose a Room"
                              Wrap: =false
                        - galRooms:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              DelayItemLoading: =false
                              Height: =Self.AllItemsCount * Self.TemplateHeight
                              Items: =colRooms
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =160
                              WrapCount: =3
                            Children:
                              - con_tile:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.TemplateHeight
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - lbl_textItemTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =AppTheme.layer01Bg
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.Lato
                                          Text: =ThisItem.Title
                                          Visible: =false
                                          Width: =87.83333333333333
                                    - img_tile:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =AppTheme.FocusedBorder
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderColor: =Color.Transparent
                                          FocusedBorderThickness: =4
                                          Height: =Parent.Height
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverFill: =
                                          Image: |-
                                            =With(
                                                { 
                                                    _tileTitle: lbl_textItemTitle.Text,
                                                    _tileSubtitle: "Description text here", 
                                                    _isActive: If(varSelectedRoom.RoomID = ThisItem.RoomID, true, false)
                                                },
                                                TileProperties(
                                                    "primary",
                                                    _tileTitle, 
                                                    _tileSubtitle,
                                                    Self.Width, 
                                                    Self.Height,
                                                    _isActive,
                                                    false, 
                                                    CarbonFontFamily,
                                                    false
                                                )
                                            )
                                          OnSelect: =Select(btn_tile)
                                          PressedBorderColor: =RGBA(0, 0, 0, 0)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          TabIndex: =0
                                          Width: =Parent.Width
                                    - btn_tile:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderColor: =Color.Red
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =AppTheme.ButtonPrimaryHover
                                          OnSelect: |-
                                            =Set(varSelectedRoom, ThisItem);
                                            Set(gbl_UI_Book_Modal_Step, "2")
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =RGBA(0, 69, 120, 1)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =AppTheme.ButtonPrimaryPressed
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          TabIndex: =-1
                                          Text: =""
                                          Width: =Parent.Width
                  - conStep2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: '=16 + lbl_textStep2_chooseDate.Height + 12 + con_DateRow.Height + conTimeRow.Height + 8 + lblStep2Hint.Height + If(varConflict, 12 + conConflictPanel.Height, 0) + 16 '
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =gbl_UI_Book_Modal_Step = "2"
                      Children:
                        - lbl_textStep2_chooseDate:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =AppTheme.SideNavText
                              Font: =Font.Lato
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =14
                              Text: ="Choose a Date and Time"
                              Wrap: =false
                              X: =40
                              Y: =40
                        - conTitleField:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =lbl_textBookingTitleLabel.Height + 44 + 6
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =2
                              PaddingRight: =2
                            Children:
                              - lbl_textBookingTitleLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =AppTheme.SideNavText
                                    Font: =Font.Lato
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: ="Booking title (required)"
                                    Wrap: =false
                              - txtBookingTitle:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    DisabledBorderColor: =AppTheme.SurfaceAlt
                                    DisabledColor: =AppTheme.TextMuted
                                    DisabledFill: =AppTheme.SurfaceAlt
                                    Fill: =AppTheme.SurfaceAlt
                                    FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    HintText: ="Enter a title for this booking"
                                    HoverBorderColor: =AppTheme.TextSecondary
                                    HoverColor: =AppTheme.TextPrimary
                                    HoverFill: =AppTheme.SurfaceAlt
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Set(varTitle, txtBookingTitle.Text)
                                    PressedColor: =AppTheme.TextPrimary
                                    PressedFill: =AppTheme.SurfaceAlt
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                        - conNotesField:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =lbl_textNotesOptionalLabel.Height + 84 + 6
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =2
                              PaddingRight: =2
                            Children:
                              - lbl_textNotesOptionalLabel:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =AppTheme.SideNavText
                                    Font: =Font.Lato
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: ="Notes (optional)"
                                    Wrap: =false
                              - txtBookingNotes:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    DisabledBorderColor: =AppTheme.SurfaceAlt
                                    DisabledColor: =AppTheme.TextMuted
                                    DisabledFill: =AppTheme.SurfaceAlt
                                    Fill: =AppTheme.SurfaceAlt
                                    FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    Height: =80
                                    HintText: ="Add any notes or requirements"
                                    HoverBorderColor: =AppTheme.TextSecondary
                                    HoverColor: =AppTheme.TextPrimary
                                    HoverFill: =AppTheme.SurfaceAlt
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Mode: =TextMode.MultiLine
                                    OnChange: =Set(varNotes, txtBookingNotes.Text)
                                    PressedColor: =AppTheme.TextPrimary
                                    PressedFill: =AppTheme.SurfaceAlt
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                        - con_DateRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - dtpBookingDate:
                                  Control: Classic/DatePicker@2.6.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =0
                                    Color: =AppTheme.SideNavText
                                    DefaultDate: =varSelectedDate
                                    DisabledColor: =AppTheme.TextMuted
                                    DisabledFill: =AppTheme.SurfaceAlt
                                    Fill: =AppTheme.layer01Bg
                                    FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                    FocusedBorderThickness: =2
                                    Font: =Font.Lato
                                    IconBackground: =AppTheme.HeaderBackground
                                    IconFill: =AppTheme.HeaderAccent
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |+
                                      =Concurrent(
                                          Set(varSelectedDate, dtpBookingDate.SelectedDate),
                                          Set(varStartTime, Blank()),
                                          Set(varEndTime, Blank()),
                                          Set(varConflict, false)
                                      )
                                    Size: =11
                        - conTimeRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =lbl_textStartTimeLabel.Height + 44 + 6
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conStartTimeField:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =lbl_textStartTimeLabel.Height + 44 + 6
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                  Children:
                                    - lbl_textStartTimeLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =AppTheme.SideNavText
                                          Font: =Font.Lato
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="Start time"
                                          Wrap: =false
                                    - drpStartTime:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =0
                                          ChevronBackground: =AppTheme.HeaderBackground
                                          ChevronFill: =AppTheme.HeaderAccent
                                          Color: =AppTheme.SideNavText
                                          Default: =If(IsBlank(varStartTime), "", Text(varStartTime, "HH:mm"))
                                          DisabledBorderColor: =AppTheme.SurfaceAlt
                                          DisabledColor: =AppTheme.TextMuted
                                          DisabledFill: =AppTheme.SurfaceAlt
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                          FocusedBorderThickness: =2
                                          Font: =Font.Lato
                                          HoverBorderColor: =AppTheme.TextSecondary
                                          HoverColor: =AppTheme.TextPrimary
                                          HoverFill: =AppTheme.SurfaceAlt
                                          Items: |-
                                            =Filter(
                                                ForAll(
                                                    Sequence(41),
                                                    {
                                                        display: Text(DateAdd(DateTimeValue("1900-01-01 08:00:00"), (Value - 1) * 15, TimeUnit.Minutes), "HH:mm"),
                                                        value: DateAdd(DateTime(Year(varSelectedDate), Month(varSelectedDate), Day(varSelectedDate), 8, 0, 0), (Value - 1) * 15, TimeUnit.Minutes)
                                                    }
                                                ),
                                                value > Now()
                                            )
                                          Items.Value: =display
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(varStartTime, drpStartTime.Selected.value);
                                            If(!IsBlank(varEndTime) && varEndTime <= varStartTime, Set(varEndTime, Blank()));

                                            Set(
                                                varConflict,
                                                !IsEmpty(
                                                    Filter(
                                                        colBookings,
                                                        RoomID.Id = varSelectedRoom.ID,
                                                        StartDateTime < varEndTime,
                                                        EndDateTime > varStartTime
                                                    )
                                                )
                                            );

                                            Set(
                                                varConflictingBooking,
                                                LookUp(
                                                    colBookings,
                                                    RoomID.Id = varSelectedRoom.ID &&
                                                    StartDateTime < varEndTime &&
                                                    EndDateTime > varStartTime
                                                )
                                            );

                                            Set(
                                                varNextFreeSlot,
                                                LookUp(
                                                    colBookings,
                                                    RoomID.Id = varSelectedRoom.ID &&
                                                    StartDateTime >= varStartTime,
                                                    EndDateTime
                                                )
                                            );

                                            ClearCollect(
                                                colOverlappingBookings,
                                                Filter(
                                                    colBookings,
                                                    StartDateTime < varEndTime &&
                                                    EndDateTime > varStartTime
                                                )
                                            );

                                            ClearCollect(
                                                varAlternativeRooms,
                                                Filter(
                                                    colRooms As rm,
                                                    rm.ID <> varSelectedRoom.ID &&
                                                    IsEmpty(
                                                        Filter(
                                                            colOverlappingBookings,
                                                            RoomID.Id = rm.ID
                                                        )
                                                    )
                                                )
                                            );
                                          PressedColor: =AppTheme.TextPrimary
                                          PressedFill: =AppTheme.SurfaceAlt
                                          Size: =11
                              - conEndTimeField:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =lbl_textEndTimeLabel.Height + 44 + 6
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                  Children:
                                    - lbl_textEndTimeLabel:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =AppTheme.SideNavText
                                          Font: =Font.Lato
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="End time"
                                          Wrap: =false
                                    - drpEndTime:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =0
                                          ChevronBackground: =AppTheme.HeaderBackground
                                          ChevronFill: =AppTheme.HeaderAccent
                                          Color: =AppTheme.SideNavText
                                          Default: =If(IsBlank(varEndTime), "", Text(varEndTime, "HH:mm"))
                                          DisabledBorderColor: =AppTheme.SurfaceAlt
                                          DisabledColor: =AppTheme.TextMuted
                                          DisabledFill: =AppTheme.SurfaceAlt
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                          FocusedBorderThickness: =2
                                          Font: =Font.Lato
                                          HoverBorderColor: =AppTheme.TextSecondary
                                          HoverColor: =AppTheme.TextPrimary
                                          HoverFill: =AppTheme.SurfaceAlt
                                          Items: |-
                                            =Filter(
                                                ForAll(
                                                    Sequence(41),
                                                    {
                                                        display: Text(DateAdd(DateTimeValue("1900-01-01 08:00:00"), (Value - 1) * 15, TimeUnit.Minutes), "HH:mm"),
                                                        value: DateAdd(DateTime(Year(varSelectedDate), Month(varSelectedDate), Day(varSelectedDate), 8, 0, 0), (Value - 1) * 15, TimeUnit.Minutes)
                                                    }
                                                ),
                                                value > varStartTime
                                            )
                                          Items.Value: =display
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(varEndTime, drpEndTime.Selected.value);

                                            Set(
                                                varConflict,
                                                !IsEmpty(
                                                    Filter(
                                                        colBookings,
                                                        RoomID.Id = varSelectedRoom.ID,
                                                        StartDateTime < varEndTime,
                                                        EndDateTime > varStartTime
                                                    )
                                                )
                                            );

                                            Set(
                                                varConflictingBooking,
                                                LookUp(
                                                    colBookings,
                                                    RoomID.Id = varSelectedRoom.ID &&
                                                    StartDateTime < varEndTime &&
                                                    EndDateTime > varStartTime
                                                )
                                            );

                                            Set(
                                                varNextFreeSlot,
                                                LookUp(
                                                    colBookings,
                                                    RoomID.Id = varSelectedRoom.ID &&
                                                    StartDateTime >= varStartTime,
                                                    EndDateTime
                                                )
                                            );

                                            ClearCollect(
                                                colOverlappingBookings,
                                                Filter(
                                                    colBookings,
                                                    StartDateTime < varEndTime &&
                                                    EndDateTime > varStartTime
                                                )
                                            );

                                            ClearCollect(
                                                varAlternativeRooms,
                                                Filter(
                                                    colRooms As rm,
                                                    rm.ID <> varSelectedRoom.ID &&
                                                    IsEmpty(
                                                        Filter(
                                                            colOverlappingBookings,
                                                            RoomID.Id = rm.ID
                                                        )
                                                    )
                                                )
                                            );
                                          PressedColor: =AppTheme.TextPrimary
                                          PressedFill: =AppTheme.SurfaceAlt
                                          Size: =11
                        - con_series:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =tglRecurring.Height + 44 + 6
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conStartTimeField_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =lbl_textEndTimeLabel_2.Height + 44 + 6
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                  Children:
                                    - lbl_textEndTimeLabel_2:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =AppTheme.SideNavText
                                          Font: =Font.Lato
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: ="Book a Series"
                                          Wrap: =false
                                    - tglRecurring:
                                        Control: Toggle@1.1.5
                                        Properties:
                                          Label: =
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Set(varIsaSeries, !varIsaSeries)
                              - conEndTimeField_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
