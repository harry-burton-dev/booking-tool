                              BorderColor: =ColorValue(AppTheme.ButtonDangerPrimary)
                              BorderThickness: =0
                              Color: =ColorValue(AppTheme.PrimaryText)
                              Fill: =ColorValue(AppTheme.ButtonDangerPrimary)
                              FocusedBorderColor: =RGBA(15, 98, 254, 1)
                              FocusedBorderThickness: =2
                              Font: ="IBM Plex Sans"
                              FontWeight: =FontWeight.Normal
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(184, 25, 34, 1)
                              OnSelect: |-
                                =Set(gbl_UI_Book_CancelConfirm, false);
                                Reset(tglRepeat);
                                Set(gblRecurFreq, "W");
                                Set(gblRecurInterval, 1);
                                Set(gblRecurWD, "");
                                Set(gblRecurMonthMode, "day");
                                Set(gblRecurEndMode, "count");
                                Set(gblRecurCount, 6);
                                Set(gblRecurUntil, DateAdd(Today(), 3, TimeUnit.Months));
                                Set(gblRecurMode, "");
                                Reset(tglPrivate);
                                Reset(tglInvite);
                                Reset(tglBookOnBehalf);
                                Reset(drpBookFor);
                                Set(varBookForEmail, "");
                                Set(varBookForName, "");
                                Reset(txtBookingTitle);
                                Set(varTitleTouched, false);
                                Set(gblEditingBookingID, 0);
                                // RESET-SITE[wizard-discard] full wizard-state clear on close (BUG-13)
                                Set(varTitle, Blank());
                                Set(varSelectedDate, Blank());
                                Set(varStartTime, Blank());
                                Set(varEndTime, Blank());
                                Set(varConflict, false);
                                Set(varConflictingBooking, Blank());
                                Set(varNextFreeSlot, Blank());
                                Set(varBookingError, false);
                                Set(varSubmitting, false);
                                Set(gbl_Book_SubmitResult, "");
                                Set(gbl_FixCycleSeriesID, "");
                                Set(gbl_UI_Book_Modal_Step, WizardStep1);
                                Set(gbl_UI_Book_Modal, false)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(155, 21, 28, 1)
                              RadiusBottomLeft: =2
                              RadiusBottomRight: =2
                              RadiusTopLeft: =2
                              RadiusTopRight: =2
                              Size: =11
                              Text: ="Discard booking"
