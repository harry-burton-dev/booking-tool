ComponentDefinitions:
  cpt_Modal_:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ModalTitleText:
        PropertyKind: Input
        DisplayName: Modal Title Text
        Description: A custom property
        DataType: Text
        Default: ="Add a new Role to the Database"
      OnSubmit:
        PropertyKind: Event
        DisplayName: OnSubmit
        Description: Submit Payload
        ReturnType: Text
        Default: =true
      OnSubmitEdit:
        PropertyKind: Event
        DisplayName: OnSubmitEdit
        Description: A custom property
        ReturnType: Text
        Default: ="Text"
      OptionalLabelText:
        PropertyKind: Input
        DisplayName: Optional Label Text
        Description: A custom property
        DataType: Text
        Default: =" "
      PatchPayload:
        PropertyKind: Output
        DisplayName: PatchPayload
        Description: A custom property
        DataType: Table
      ValidPayload:
        PropertyKind: Output
        DisplayName: ValidPayload
        Description: A custom property
        DataType: Boolean
    Properties:
      Height: =App.Height
      PatchPayload: |
        =/* Snapshot, not a live computation: colPayloadOut is materialized by
           btnConfirm.OnSelect before OnSubmit/OnSubmitEdit fires, so the host always
           reads a payload built before the wizard resets its controls. */
        colPayloadOut
      ValidPayload: |
        =!IsBlank(varSelectedRoom) &&
        !IsBlank(varStartTime) &&
        !IsBlank(varEndTime) &&
        varEndTime > varStartTime &&
        !IsBlank(varTitle) &&
        (!tglBookOnBehalf.Checked || !IsBlank(varBookForEmail)) &&
        (!tglRepeat.Checked || RecurAllowed)
      Width: =App.Width
    Children:
      - scrimBackdrop:
          Control: Rectangle
          Properties:
            Fill: =AppTheme.ModalScrim
            Height: =Parent.Height
            OnSelect: |-
              =If(
                  gbl_UI_Book_Modal_Step = WizardStep1,
                  Reset(tglRepeat);
                  Set(gblRecurFreq, "W");
                  Set(gblRecurInterval, 1);
                  Set(gblRecurWD, "");
                  Set(gblRecurMonthMode, "day");
                  Set(gblRecurEndMode, "count");
                  Set(gblRecurCount, 6);
                  Set(gblRecurUntil, DateAdd(Today(), 3, TimeUnit.Months));
                  Set(gblRecurMode, "");
                  Reset(tglPrivate);
                  Reset(tglInvite);
                  Reset(tglBookOnBehalf);
                  Reset(drpBookFor);
                  Set(varBookForEmail, "");
                  Set(varBookForName, "");
                  Reset(txtBookingTitle);
                  Set(varTitleTouched, false);
                  Set(gbl_UI_Book_CancelConfirm, false);
                  Set(gblEditingBookingID, 0);
                  // RESET-SITE[wizard-scrim-close] full wizard-state clear on close (BUG-13)
                  Set(varTitle, Blank());
                  Set(varSelectedDate, Blank());
                  Set(varStartTime, Blank());
                  Set(varEndTime, Blank());
                  Set(varConflict, false);
                  Set(varConflictingBooking, Blank());
                  Set(varNextFreeSlot, Blank());
                  Set(varBookingError, false);
                  Set(varSubmitting, false);
                  Set(gbl_Book_SubmitResult, "");
                  Set(gbl_FixCycleSeriesID, "");
                  Set(gbl_UI_Book_Modal_Step, WizardStep1);
                  Set(gbl_UI_Book_Modal, false),
                  Set(gbl_UI_Book_CancelConfirm, true)
              )
            Width: =Parent.Width
      - conRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =AppTheme.Border
            BorderThickness: =1
            DropShadow: =DropShadow.Regular
            Fill: =AppTheme.Surface
            Height: =Min(Parent.Height, 640)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Min(Parent.Width, 560)
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
          Children:
            - conHeaderRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =8
                Children:
                  - lblFormHeader:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =AppTheme.TextPrimary
                        FillPortions: =1
                        Font: ="IBM Plex Sans"
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: ="New booking"
                        Wrap: =false
                  - wzLblStepEyebrow:
                      Control: Label
                      Properties:
                        Align: =Align.Right
                        AlignInContainer: =AlignInContainer.Center
                        Color: =AppTheme.TextSecondary
                        Font: ="IBM Plex Sans"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =10
                        Text: |-
                          ="Step " & gbl_UI_Book_Modal_Step & " of 3 · " &
                          If(
                              gbl_UI_Book_Modal_Step = WizardStepRoom, "Room",
                              gbl_UI_Book_Modal_Step = WizardStepWhen, "When",
                              "Review"
                          )
                        Visible: =!gbl_UI_Book_CancelConfirm
                        Wrap: =false
            - conProgressBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =AppTheme.Border
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.Background
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =32
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =varSubmitting
                Children:
                  - lbl_textSubmittingProgress:
                      Control: Label
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =AppTheme.TextSecondary
                        Font: ="IBM Plex Sans"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: ="Booking your slot…"
                        Wrap: =false
            - conStepBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.Background
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  Visible: =!gbl_UI_Book_CancelConfirm
                Children:
                  - conStep1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =16 + htxStep1Title.Height + If(wzLblRouteHint.Visible, 8 + wzLblRouteHint.Height, 0) + 12 + galRooms.Height + 16
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =gbl_UI_Book_Modal_Step = WizardStepRoom
                      Children:
                        - htxStep1Title:
                            Control: HtmlViewer
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              DisplayMode: =DisplayMode.View
                              HtmlText: |-
                                =CarbonTextColored(CarbonHtmlType.HeadingCompact01 & " font-weight: 700;", "Choose a Room", AppThemeHex.SideNavText)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                        - wzLblRouteHint:
                            Control: Label
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =AppTheme.TextMuted
                              Font: ="IBM Plex Sans"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =11
                              Text: |-
                                =If(
                                    tglRepeat.Checked,
                                    "Only rooms free for your chosen time and every previewed occurrence are shown.",
                                    "Only rooms free for your chosen time are shown."
                                )
                              Visible: =gblBookRoute = "time" && !IsBlank(varStartTime) && !IsBlank(varEndTime)
                        - galRooms:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              DelayItemLoading: =false
                              Height: =RoundUp(Self.AllItemsCount / 3, 0) * Self.TemplateHeight
                              Items: |-
                                =/* Time-first route: only rooms with no clash for the chosen slot and,
                                     when Repeat is on, no clash on any previewed occurrence either.
                                     Room-first route: the full list, unchanged. Favourites sort first. */
                                SortByColumns(
                                    AddColumns(
                                        Filter(
                                            colRooms As _wzr,
                                            gblBookRoute <> "time"
                                                || IsBlank(varStartTime)
                                                || IsBlank(varEndTime)
                                                || (
                                                    IsEmpty(
                                                        Filter(
                                                            AllBookings,
                                                            Status = "Active",
                                                            RoomID.Id = _wzr.ID,
                                                            ID <> gblEditingBookingID,
                                                            fnOverlaps(StartDateTime, EndDateTime, varStartTime, varEndTime)
                                                        )
                                                    )
                                                    && (
                                                        !tglRepeat.Checked
                                                        || IsEmpty(
                                                            Filter(
                                                                RecurOccurrences As _wzo,
                                                                !IsEmpty(
                                                                    Filter(
                                                                        AllBookings,
                                                                        Status = "Active",
                                                                        RoomID.Id = _wzr.ID,
                                                                        ID <> gblEditingBookingID,
                                                                        fnOverlaps(StartDateTime, EndDateTime, _wzo.StartDateTime, _wzo.EndDateTime)
                                                                    )
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                        ) As _wzc,
                                        FavRank, If(fnIsFavourite(_wzc.ID), 0, 1),
                                        FreeOccCount,
                                            If(
                                                !tglRepeat.Checked,
                                                0,
                                                CountRows(
                                                    Filter(
                                                        RecurOccurrences As _wzo2,
                                                        IsEmpty(
                                                            Filter(
                                                                AllBookings,
                                                                Status = "Active",
                                                                RoomID.Id = _wzc.ID,
                                                                ID <> gblEditingBookingID,
                                                                fnOverlaps(StartDateTime, EndDateTime, _wzo2.StartDateTime, _wzo2.EndDateTime)
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                    ),
                                    "FavRank",
                                    SortOrder.Ascending
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =160
                              WrapCount: =3
                            Children:
                              - con_tile:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.TemplateHeight
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - lbl_textItemTitle:
                                        Control: Label
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Color: =AppTheme.layer01Bg
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: ="IBM Plex Sans"
                                          Text: =ThisItem.Title
                                          Visible: =false
                                          Width: =87.83333333333333
                                    - img_tile:
                                        Control: Image
                                        Properties:
                                          BorderColor: =AppTheme.FocusedBorder
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderColor: =Color.Transparent
                                          FocusedBorderThickness: =4
                                          Height: =Parent.Height
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverFill: =
                                          Image: |-
                                            =With(
                                                { 
                                                    _tileTitle: lbl_textItemTitle.Text,
                                                    _tileSubtitle: ThisItem.description,
                                                    _isActive: If(varSelectedRoom.RoomID = ThisItem.RoomID, true, false)
                                                },
                                                TileProperties(
                                                    "primary",
                                                    _tileTitle, 
                                                    _tileSubtitle,
                                                    Self.Width, 
                                                    Self.Height,
                                                    _isActive,
                                                    false, 
                                                    CarbonFontFamily,
                                                    false
                                                )
                                            )
                                          OnSelect: =Select(btn_tile)
                                          PressedBorderColor: =RGBA(0, 0, 0, 0)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          Width: =Parent.Width
                                    - wzLblClassBadge_rf:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: |-
                                            =With(
                                                {_lvl: LookUp(ClassificationLevels, Code = ThisItem.Classification)},
                                                Switch(_lvl.ColorToken, "StatusFree", AppTheme.StatusFreeText, "StatusBusy", AppTheme.StatusBusyText, AppTheme.TextSecondary)
                                            )
                                          Fill: |-
                                            =With(
                                                {_lvl: LookUp(ClassificationLevels, Code = ThisItem.Classification)},
                                                Switch(_lvl.ColorToken, "StatusFree", AppTheme.StatusFreeBg, "StatusBusy", AppTheme.StatusBusyBg, AppTheme.SurfaceAlt)
                                            )
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =9
                                          Text: =Coalesce(LookUp(ClassificationLevels, Code = ThisItem.Classification).Label, "")
                                          Visible: =!IsBlank(ThisItem.Classification) && ThisItem.Classification <> ""
                                          Width: =Parent.Width - 34
                                          Wrap: =false
                                          X: =8
                                          Y: =6
                                    - wzLblFavStar:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =ColorValue("#f1c21b")
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =11
                                          Text: ="★"
                                          Visible: =fnIsFavourite(ThisItem.ID)
                                          Width: =18
                                          X: =Parent.Width - 24
                                          Y: =6
                                    - wzLblFreeChip:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =AppTheme.StatusFreeText
                                          Fill: =AppTheme.StatusFreeBg
                                          Font: ="IBM Plex Sans"
                                          Height: =18
                                          Size: =9
                                          Text: ="Free for all " & Text(ThisItem.FreeOccCount, "[$-en-US]0") & " occurrences"
                                          Visible: =gblBookRoute = "time" && tglRepeat.Checked && ThisItem.FreeOccCount > 0
                                          Width: =Parent.Width - 16
                                          Wrap: =false
                                          X: =8
                                          Y: =Parent.Height - 26
                                    - btn_tile:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0, 0, 0, 0)
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(0, 0, 0, 0)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =Parent.Height
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(0, 0, 0, 0)
                                          HoverFill: =AppTheme.ButtonPrimaryHover
                                          OnSelect: |-
                                            =Set(varRebuilding, true);
                                            Set(varSelectedRoom, LookUp(colRooms, ID = ThisItem.ID));
                                            If(!IsBlank(varStartTime) && !IsBlank(varEndTime),
                                                ClearCollect(
                                                    colOverlappingBookings,
                                                    Filter(AllBookings, Status = "Active", fnOverlaps(StartDateTime, EndDateTime, varStartTime, varEndTime), ID <> gblEditingBookingID)
                                                );
                                                Set(varConflict, !IsEmpty(Filter(colOverlappingBookings, RoomID.Id = varSelectedRoom.ID)));
                                                Set(varConflictingBooking, LookUp(colOverlappingBookings, RoomID.Id = varSelectedRoom.ID));
                                                Set(
                                                    varNextFreeSlot,
                                                    LookUp(
                                                        Sort(
                                                            Filter(
                                                                AllBookings,
                                                                Status = "Active",
                                                                StartDateTime >= varStartTime,
                                                                StartDateTime < DateAdd(varSelectedDate, 1, TimeUnit.Days),
                                                                ID <> gblEditingBookingID
                                                            ),
                                                            StartDateTime
                                                        ),
                                                        RoomID.Id = varSelectedRoom.ID,
                                                        EndDateTime
                                                    )
                                                )
                                            );
                                            /* Advance to whatever follows the Room step: the When step in the
                                               room-first route, Review in the time-first route (When came first). */
                                            Set(gbl_UI_Book_Modal_Step, If(gblBookRoute = "time", WizardStep3, WizardStep2));
                                            Set(varRebuilding, false)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =RGBA(0, 69, 120, 1)
                                          PressedColor: =RGBA(0, 0, 0, 0)
                                          PressedFill: =AppTheme.ButtonPrimaryPressed
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: |-
                                            ="Choose room: " & ThisItem.Title
                                          Width: =Parent.Width
                  - conStep2:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: '=16 + lbl_textStep2_chooseDate.Height + 12 + con_DateRow.Height + conTimeRow.Height + 8 + lblStep2Hint.Height + If(varConflict, 12 + conConflictPanel.Height, 0) + 16 '
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =gbl_UI_Book_Modal_Step = WizardStepWhen
                      Children:
                        - lbl_textStep2_chooseDate:
                            Control: Label
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =AppTheme.SideNavText
                              Font: ="IBM Plex Sans"
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =14
                              Text: ="Choose a Date and Time"
                              Wrap: =false
                              X: =40
                              Y: =40
                        - lbl_textRebuilding:
                            Control: Label
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =AppTheme.TextMuted
                              Font: ="IBM Plex Sans"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =11
                              Text: ="Checking availability…"
                              Visible: =varRebuilding
                              Wrap: =false
                        - conTitleField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =lbl_textBookingTitleLabel.Height + 44 + 6 + If(varTitleTouched && IsBlank(varTitle), 6 + lbl_textTitleError.Height, 0)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =2
                              PaddingRight: =2
                            Children:
                              - lbl_textBookingTitleLabel:
                                  Control: Label
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =AppTheme.SideNavText
                                    Font: ="IBM Plex Sans"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: ="Booking title (required)"
                                    Wrap: =false
                              - txtBookingTitle:
                                  Control: Classic/TextInput
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Default: =varTitle
                                    DisabledBorderColor: =AppTheme.SurfaceAlt
                                    DisabledColor: =AppTheme.TextMuted
                                    DisabledFill: =AppTheme.SurfaceAlt
                                    Fill: =AppTheme.SurfaceAlt
                                    FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    HintText: ="Enter a title for this booking"
                                    HoverBorderColor: =AppTheme.TextSecondary
                                    HoverColor: =AppTheme.TextPrimary
                                    HoverFill: =AppTheme.SurfaceAlt
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Set(varTitle, txtBookingTitle.Text); Set(varTitleTouched, true)
                                    PressedColor: =AppTheme.TextPrimary
                                    PressedFill: =AppTheme.SurfaceAlt
                                    RadiusBottomLeft: =2
                                    RadiusBottomRight: =2
                                    RadiusTopLeft: =2
                                    RadiusTopRight: =2
                                    Size: =11
                              - lbl_textTitleError:
                                  Control: Label
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =AppTheme.StatusBusyText
                                    Font: ="IBM Plex Sans"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: ="Title is required."
                                    Visible: =varTitleTouched && IsBlank(varTitle)
                                    Wrap: =false
                        - con_DateRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40 + If(!IsBlank(varSelectedDate) && ((Weekday(varSelectedDate, StartOfWeek.Sunday) in [1,7] && WeekendPolicy <> "allow") || varSelectedDate < Today()), 6 + lbl_textDateError.Height, 0)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - dtpBookingDate:
                                  Control: Classic/DatePicker
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =0
                                    Color: =AppTheme.SideNavText
                                    DefaultDate: =varSelectedDate
                                    DisabledColor: =AppTheme.TextMuted
                                    DisabledFill: =AppTheme.SurfaceAlt
                                    Fill: =AppTheme.layer01Bg
                                    FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    IconBackground: =AppTheme.HeaderBackground
                                    IconFill: =AppTheme.HeaderAccent
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |
                                      =Set(varSelectedDate, dtpBookingDate.SelectedDate);
                                      Set(varStartTime, Blank());
                                      Set(varEndTime, Blank());
                                      Set(varConflict, false);
                                      Reset(drpStartTime); Reset(drpEndTime)
                                    Size: =11
                              - lbl_textDateError:
                                  Control: Label
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =AppTheme.StatusBusyText
                                    Font: ="IBM Plex Sans"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Text: =If(!IsBlank(varSelectedDate) && (Weekday(varSelectedDate, StartOfWeek.Sunday) in [1,7] && WeekendPolicy <> "allow"), "Bookings are only available Monday to Friday.", "Date cannot be in the past.")
                                    Visible: =!IsBlank(varSelectedDate) && ((Weekday(varSelectedDate, StartOfWeek.Sunday) in [1,7] && WeekendPolicy <> "allow") || varSelectedDate < Today())
                                    Wrap: =false
                        - conTimeRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =Max(conStartTimeField.Height, conEndTimeField.Height)
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conStartTimeField:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    Height: =lbl_textStartTimeLabel.Height + 44 + 6 + If(!IsBlank(varStartTime) && fnIsPast(varStartTime), 6 + lbl_textStartTimeError.Height, 0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                  Children:
                                    - lbl_textStartTimeLabel:
                                        Control: Label
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =AppTheme.SideNavText
                                          Font: ="IBM Plex Sans"
