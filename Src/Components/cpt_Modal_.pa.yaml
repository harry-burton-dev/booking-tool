                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              DisplayMode: =DisplayMode.View
                              HtmlText: |-
                                =/* Consolidates lbl_textSlotTakenError + lbl_textBookingFailedError +
                                   lbl_textConfirmDisabledReason. The If-chain reproduces the old three-label
                                   Visible logic 1:1 - including the intentional double-render when varConflict
                                   is true (red slot-taken error AND muted guidance shown simultaneously). */
                                If(
                                    varConflict || gbl_Book_SubmitResult = "conflict",
                                    CarbonTextColored(CarbonHtmlType.Label01, "This slot was just taken. Please go back and choose a different time.", AppThemeHex.StatusBusyText),
