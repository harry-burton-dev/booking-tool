                        DisabledColor: =AppTheme.TextMuted
                        DisabledFill: =AppTheme.SurfaceAlt
                        DisplayMode: =If(IsBlank(varSelectedRoom) || IsBlank(varStartTime) || IsBlank(varEndTime) || varEndTime <= varStartTime || IsBlank(varTitle) || (tglBookOnBehalf.Checked && IsBlank(varBookForEmail)) || varConflict || fnIsPast(varStartTime) || varSubmitting || (!IsBlank(varSelectedDate) && ((Weekday(varSelectedDate, StartOfWeek.Sunday) in [1,7] && WeekendPolicy <> "allow") || varSelectedDate < Today())) || DateDiff(varStartTime, varEndTime, TimeUnit.Minutes) > MaxBookingMinutes, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =ColorValue(AppTheme.ButtonPrimary)
                        FocusedBorderColor: =RGBA(15, 98, 254, 1)
                        FocusedBorderThickness: =2
                        Font: ="IBM Plex Sans"
                        FontWeight: =FontWeight.Normal
                        HoverBorderColor: =RGBA(13, 83, 217, 1)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(13, 83, 217, 1)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varSubmitting, true);
                          /* BUG-1: re-read the server, not the colBookings snapshot, so a slot
                             taken by ANOTHER user since screen entry is caught here. The edit-mode
                             self-exclusion happens collection-side: an ID <> predicate layered on
                             the server query draws a delegation warning that fails compile. */
                          /* Refresh BR masters first so the BRVirtual rows appended below expand
                             from server-fresh masters, not the OnStart snapshot (review-A 3a).
                             Known limit: an exception row created by another user since the
                             snapshot can appear both as its real row (server read) and as the
                             still-unsuppressed virtual occurrence - both block, so the conflict
                             verdict is unaffected; only the conflicting-booking label may lag. */
                          ClearCollect(colBRMasters,
                              Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active"));
                          ClearCollect(
                              colOverlappingBookings,
                              ForAll(
                                  Filter(
                                      Book_Bookings,
                                      Status = "Active",
                                      StartDateTime < varEndTime,
                                      EndDateTime > varStartTime
                                  ) As b,
                                  {
                                      ID: b.ID,
                                      Title: b.Title,
                                      RoomID: {Id: b.RoomID.Id, Value: b.RoomID.Value},
                                      BookedBy: b.BookedBy,
                                      BookedByEmail: Coalesce(b.BookedByEmail, ""),
                                      IsPrivate: b.IsPrivate,
                                      StartDateTime: b.StartDateTime,
                                      EndDateTime: b.EndDateTime,
                                      Status: b.Status,
                                      SeriesID: Coalesce(b.SeriesID, ""),
                                      RecurrenceType: Coalesce(b.RecurrenceType, ""),
                                      OccIndex: Coalesce(b.OccIndex, 0),
                                      IsException: Coalesce(b.IsException, false),
                                      IsVirtual: false
                                  }
                              )
                          );
                          /* BR masters are excluded from real-row conflicts only via their virtual expansion,
                             so append the expanded occurrences that overlap the requested slot. */
                          Collect(
                              colOverlappingBookings,
                              Filter(BRVirtual, fnOverlaps(StartDateTime, EndDateTime, varStartTime, varEndTime))
                          );
                          RemoveIf(colOverlappingBookings, fnIsBRRow(RecurrenceType) && !IsException && !IsVirtual);
                          RemoveIf(colOverlappingBookings, ID = gblEditingBookingID);
                          Set(varConflict, !IsEmpty(Filter(colOverlappingBookings, RoomID.Id = varSelectedRoom.ID)));
                          Set(varConflictingBooking, LookUp(colOverlappingBookings, RoomID.Id = varSelectedRoom.ID));
                          Set(
                              varNextFreeSlot,
                              LookUp(
                                  Sort(
                                      Filter(
                                          AllBookings,
                                          Status = "Active",
                                          StartDateTime >= varStartTime,
                                          StartDateTime < DateAdd(varSelectedDate, 1, TimeUnit.Days),
                                          ID <> gblEditingBookingID
                                      ),
                                      StartDateTime
                                  ),
                                  RoomID.Id = varSelectedRoom.ID,
                                  EndDateTime
                              )
                          );
                          If(!varConflict,
                              /* Snapshot the payload BEFORE raising OnSubmit/OnSubmitEdit: the
                                 resets below used to race the host's read of PatchPayload (it read
                                 after the resets and always saw a single occurrence). PatchPayload
                                 now just returns this collection. */
                              ClearCollect(
                                  colPayloadOut,
                                  With(
                                      {
                                          _repeating: tglRepeat.Checked,
                                          _anchorStart: varStartTime,
                                          _anchorEnd: varEndTime
                                      },
                                      With(
                                          {
                                              /* One master row per series: RecurrenceType carries the whole
                                                 rule and App-level fnOccStart/fnOccDate expand it at read
                                                 time. Occurrence 0 is the anchor. The BR-RULE string itself
                                                 is derived from the recurrence globals by the App-level
                                                 RecurRule named formula. */
                                              _rule: If(_repeating, RecurRule, "")
                                          },
                                              With(
                                                  {_kmax: If(_repeating, Min(fnRuleKmax(_rule), 51), 0)},
                                                  ForAll(
                                                      Filter(
                                                          Sequence(_kmax + 1, 0) As _k,
                                                          !_repeating || !IsBlank(fnOccStart(_anchorStart, _rule, _k.Value)),
                                                          /* Kept consistent with App.pa.yaml's RecurOccurrences named
                                                             formula: weekends only pass when the site policy allows them. */
                                                          !_repeating || (WeekendPolicy = "allow" || (Weekday(fnOccStart(_anchorStart, _rule, _k.Value)) >= 2 && Weekday(fnOccStart(_anchorStart, _rule, _k.Value)) <= 6)),
                                                          !_repeating || IsBlank(fnRuleUntil(_rule)) || fnOccDate(_anchorStart, _rule, _k.Value) <= fnRuleUntil(_rule)
                                                      ) As _kk,
                                                      {
                                                          OccIndex: _kk.Value,
                                                          Title: varTitle,
                                                          BookedByEmail: If(IsBlank(varBookForEmail), Lower(User().Email), varBookForEmail),
                                                          RoomIdNumber: Value(varSelectedRoom.ID),
                                                          RoomIdText: Text(varSelectedRoom.RoomID),
                                                          RoomTitle: varSelectedRoom.Title,
                                                          StartDateTime: If(_repeating, fnOccStart(_anchorStart, _rule, _kk.Value), _anchorStart),
                                                          EndDateTime: If(
                                                              _repeating,
                                                              DateAdd(fnOccStart(_anchorStart, _rule, _kk.Value), DateDiff(_anchorStart, _anchorEnd, TimeUnit.Minutes), TimeUnit.Minutes),
                                                              _anchorEnd
                                                          ),
                                                          IsPrivate: tglPrivate.Checked,
                                                          WantsInvite: tglInvite.Checked,
                                                          RecurrenceType: _rule
                                                      }
                                                  )
                                              )
                                          )
                                  )
                              );

                              /* Hand off to the host: the component validates and emits
                                 PatchPayload / ValidPayload, the host performs the write. */
                              If(gblEditingBookingID = 0, cpt_Modal_.OnSubmit(), cpt_Modal_.OnSubmitEdit());

                              /* Hosts close the modal on ALL outcomes (success and error), so reset
                                 unconditionally — a guarded reset would leave stale control state
                                 (on-behalf toggle, title, repeats) for the next open. BUG-14's
                                 "modal stays open on error" premise was disproven in review 2026-08-02. */
                              Reset(tglRepeat);
                              Set(gblRecurFreq, "W");
                              Set(gblRecurInterval, 1);
                              Set(gblRecurWD, "");
                              Set(gblRecurMonthMode, "day");
                              Set(gblRecurEndMode, "count");
                              Set(gblRecurCount, 6);
                              Set(gblRecurUntil, DateAdd(Today(), 3, TimeUnit.Months));
                              Set(gblRecurMode, "");
                              Reset(tglPrivate);
                              Reset(tglInvite);
                              Reset(tglBookOnBehalf);
                              Reset(drpBookFor);
                              Set(varBookForEmail, "");
                              Set(varBookForName, "");
                              Reset(txtBookingTitle);
                              Set(varTitleTouched, false);
                              Set(gbl_UI_Book_CancelConfirm, false)
                          );
                          Set(varSubmitting, false)
                        PressedBorderColor: =RGBA(11, 69, 182, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(11, 69, 182, 1)
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Size: =11
                        Text: =If(gblEditingBookingID > 0, "Save changes", If(varSubmitting, "Booking…", "Confirm"))
                        Visible: =gbl_UI_Book_Modal_Step = WizardStep3
                        Width: =120
            - conCancelConfirmPanel:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =AppTheme.Border
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.Background
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
