                                    PaddingTop: =0
                        - htxStep3Errors:
                            Control: HtmlViewer
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              DisplayMode: =DisplayMode.View
                              HtmlText: |-
                                =/* Consolidates lbl_textSlotTakenError + lbl_textBookingFailedError +
                                   lbl_textConfirmDisabledReason. The If-chain reproduces the old three-label
                                   Visible logic 1:1 - including the intentional double-render when varConflict
                                   is true (red slot-taken error AND muted guidance shown simultaneously). */
                                If(
                                    varConflict || gbl_Book_SubmitResult = "conflict",
                                    CarbonTextColored(CarbonHtmlType.Label01, "This slot was just taken. Please go back and choose a different time.", AppThemeHex.StatusBusyText),
                                    ""
                                ) &
                                If(
                                    varBookingError || gbl_Book_SubmitResult = "error",
                                    CarbonTextColored(CarbonHtmlType.Label01, "Booking failed. Please try again.", AppThemeHex.StatusBusyText),
                                    ""
                                ) &
                                /* Muted (not red) on purpose: the disabled-reason line is guidance,
                                   not an error - it replaces lbl_textConfirmDisabledReason. */
                                With(
                                    {
                                        _reason: If(varConflict, "Resolve the scheduling conflict above before confirming.",
                                            !IsBlank(varStartTime) && fnIsPast(varStartTime), "Start time is in the past — choose a new time.",
                                            !IsBlank(varStartTime) && !IsBlank(varEndTime) && varEndTime <= varStartTime, "End time must be after the start time.",
                                            IsBlank(varTitle), "Enter a booking title to continue.",
                                            tglBookOnBehalf.Checked && IsBlank(varBookForEmail), "Choose who the booking is for.",
                                            IsBlank(varSelectedRoom) || IsBlank(varStartTime) || IsBlank(varEndTime), "Choose a room, date and time to continue.",
                                            varSubmitting, "Submitting your booking…",
                                            ""
                                        )
                                    },
                                    If(_reason = "", "", CarbonTextColored(CarbonHtmlType.Label01, _reason, AppThemeHex.TextMuted))
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Visible: =Self.HtmlText <> ""
