                                If(
                                    varBookingError || gbl_Book_SubmitResult = "error",
                                    CarbonTextColored(CarbonHtmlType.Label01, "Booking failed. Please try again.", AppThemeHex.StatusBusyText),
                                    ""
                                ) &
                                /* Muted (not red) on purpose: the disabled-reason line is guidance,
                                   not an error - it replaces lbl_textConfirmDisabledReason. */
