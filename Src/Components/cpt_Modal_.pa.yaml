                              IsBlank(varStartTime) || IsBlank(varEndTime) || varEndTime <= varStartTime || IsBlank(varTitle) || fnIsPast(varStartTime) || (!IsBlank(varSelectedDate) && ((Weekday(varSelectedDate, StartOfWeek.Sunday) in [1,7] && WeekendPolicy <> "allow") || varSelectedDate < Today())) || DateDiff(varStartTime, varEndTime, TimeUnit.Minutes) > MaxBookingMinutes
