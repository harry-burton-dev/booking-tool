                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =With({_e: Lower(Trim(adSetInpAdminEmail_asm.Text))},
                                                If(!IsMatch(_e, Match.Email),
                                                    Notify("Enter a valid email address.", NotificationType.Error),
                                                    _e in AdminEmails || !IsBlank(LookUp(AdminEmailList, Lower(Value) = _e)),
                                                    Notify("That address is already an admin.", NotificationType.Warning),
                                                    Patch(Book_AppSettings, Defaults(Book_AppSettings), {Title: "AdminEmail", Value: _e});
                                                    ClearCollect(colAppSettings, Book_AppSettings);
                                                    Reset(adSetInpAdminEmail_asm);
                                                    Notify("Admin added", NotificationType.Success)
                                                )
