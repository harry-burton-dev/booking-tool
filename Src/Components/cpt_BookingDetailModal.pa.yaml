                                    RadiusTopRight: =0
                                    Size: =11
                                    Text: ="This and following"
                                    Visible: |-
                                      =/* Rule-driven series only: a legacy materialised series has no master
                                         row to re-rule, so it keeps the two-button prompt. */
                                      !IsBlank(LookUp(colBRMasters, SeriesID = gblSelectedBooking.SeriesID))
                                    Width: =170
                              - bdmBtnScopeSeries:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    BorderThickness: =1
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    Fill: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =// PROD-REVERT[booking-cancel] soft delete via Patch; Remove() retired per WS4
                                      /* Whole series: future, non-cancelled, OWNED members (exceptions included;
                                         past occurrences untouched). Server-filtered by SeriesID so the mutation
                                         set is immune to the data-row limit (BUG-2/BUG-3).
                                         (refinement runs on the materialized collection — predicates layered on the live query draw compile-failing delegation warnings) */
                                      With(
                                          {_sid: gblSelectedBooking.SeriesID},
                                          ClearCollect(colSeriesServerRows, Filter(Book_Bookings, SeriesID = _sid));
                                          // _targets captured once: the same rows drive the server loop and the mirror (one predicate, no Now() drift)
                                          // Master rows are excluded — the _endSeries block below owns them.
                                          With(
                                              {_master: LookUp(colBRMasters, SeriesID = _sid)},
                                          With(
                                              {
                                                  _endSeries: !IsBlank(_master) && (Lower(_master.BookedByEmail) = Lower(User().Email) || IsAdmin),
                                                  _targets: Filter(
                                                      colSeriesServerRows,
                                                      StartDateTime >= Now(),
                                                      Status <> "Cancelled",
                                                      BookedByEmail = Lower(User().Email),
                                                      !(fnIsBRRow(RecurrenceType) && !IsException)
                                                  )
                                              },
                                          /* Ending a rule-driven series: cancel the master (which stops every
                                             remaining virtual occurrence at once) plus its future exceptions. */
                                          If(
                                              _endSeries,
                                              Patch(Book_Bookings, {ID: _master.ID}, {Status: "Cancelled"});
                                              Patch(
                                                  Book_Bookings,
                                                  ForAll(
                                                      Filter(Book_Bookings, SeriesID = _sid, IsException = true, Status = "Active", StartDateTime > Now()) As _ex,
                                                      {ID: _ex.ID, Status: "Cancelled"}
                                                  )
                                              );
                                              UpdateIf(colBookings, SeriesID = _sid && IsException && Status = "Active" && StartDateTime > Now(), {Status: "Cancelled"});
                                              ClearCollect(colBRMasters, Filter(Book_Bookings, StartsWith(RecurrenceType, "BR-"), IsException = false, Status = "Active"))
                                          );
                                          With(
                                              {
                                                  _results: ForAll(
                                                      _targets As _m,
                                                      IfError(
                                                          Patch(Book_Bookings, LookUp(Book_Bookings, ID = _m.ID), {Status: "Cancelled"});
                                                          true,
                                                          false
                                                      )
                                                  )
                                              },
                                              Refresh(Book_Bookings);
                                              If(
                                                  CountRows(Filter(_results, !Value)) = 0,
                                                  // Mirror: same _targets rows the server loop wrote (blank-safe; UpdateIf is not supported inside ForAll)
                                                  ForAll(
                                                      _targets As _t,
                                                      With(
                                                          {_mirrorRow: LookUp(colBookings, ID = _t.ID)},
                                                          If(!IsBlank(_mirrorRow), Patch(colBookings, _mirrorRow, {Status: "Cancelled"}))
                                                      )
                                                  ),
                                                  // MIRROR-FALLBACK: partial series-cancel failure — local picture uncertain, re-pull the window
                                                  ClearCollect(colBookings, BookingsWindow)
                                              );
                                              Set(gblSelectedBooking, Blank());
                                              If(
                                                  _endSeries,
                                                  Notify("Series ended", NotificationType.Success),
                                                  CountRows(_results) = 0,
                                                  Notify("Nothing to cancel — no upcoming occurrences you own in this series.", NotificationType.Warning),
                                                  CountRows(Filter(_results, !Value)) = 0,
                                                  Notify("Series cancelled", NotificationType.Success),
                                                  Notify(
                                                      $"Couldn't cancel {CountRows(Filter(_results, !Value))} occurrence(s) — the series is only partially cancelled.",
                                                      NotificationType.Error
                                                  )
                                              );
                                              Set(gbl_FixCycleSeriesID, "");
                                              // RESET-SITE[detail-modal-close] cancel completed, dismiss the modal
                                              Set(gbl_UI_Detail_ConfirmMode, "");
                                              Set(gbl_UI_Detail_Modal, false)
                                          )
                                          )
                                          )
                                      )
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
                                    Text: ="Whole series"
                                    Width: =168
                              - bdmBtnScopeBack:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Fill: =AppTheme.Surface
                                    FocusedBorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =AppTheme.TextPrimary
                                    HoverFill: =AppTheme.SurfaceAlt
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(gbl_UI_Detail_ConfirmMode, "")
                                    PressedColor: =AppTheme.TextPrimary
                                    PressedFill: =AppTheme.Border
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
