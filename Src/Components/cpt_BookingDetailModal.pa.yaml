ComponentDefinitions:
  cpt_BookingDetailModal:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    Properties:
      Height: =App.Height
      Width: =App.Width
    Children:
      - bdmScrim:
          Control: Rectangle
          Properties:
            Fill: =AppTheme.ModalScrim
            Height: =Parent.Height
            OnSelect: |-
              =// RESET-SITE[detail-modal-close] scrim dismiss clears confirm state before hiding
              Set(gbl_UI_Detail_ConfirmMode, "");
              Set(gbl_UI_Detail_Modal, false)
            Width: =Parent.Width
      - bdmCard:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =AppTheme.Border
            BorderThickness: =1
            DropShadow: =DropShadow.Regular
            Fill: =AppTheme.Surface
            Height: =Min(Parent.Height - 64, 520)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Min(Parent.Width - 32, 640)
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
          Children:
            - bdmHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.Surface
                  FillPortions: =0
                  Height: =132
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =24
                  PaddingRight: =8
                  PaddingTop: =16
                Children:
                  - bdmHeaderText:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0,0,0,0) /* DS-EXEMPT transparent layout container, no painted surface */
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - htxBdmHeader:
                            Control: HtmlViewer
                            Properties:
                              AutoHeight: =true
                              DisplayMode: =DisplayMode.View
                              HtmlText: |-
                                =CarbonTextColored(CarbonHtmlType.Eyebrow, "BOOKING DETAIL", AppThemeHex.TextMuted) &
                                CarbonText(
                                    CarbonHtmlType.Heading03,
                                    If(
                                        IsBlank(gblSelectedBooking),
                                        "No booking selected",
                                        /* private bookings stay masked here as they are in the grids - owner and admin see the real title */
                                        gblSelectedBooking.IsPrivate && !fnIsMine(gblSelectedBooking.BookedByEmail) && !IsAdmin,
                                        "Busy",
                                        /* booking titles are user-entered - escape HTML metacharacters */
                                        fnHtmlEscape(gblSelectedBooking.Title)
                                    )
                                ) &
                                CarbonTextSecondary(
                                    CarbonHtmlType.Label01,
                                    With(
                                        {_room: LookUp(colRooms, ID = gblSelectedBooking.RoomID.Id)},
                                        fnHtmlEscape(gblSelectedBooking.'RoomID: Title'.Value) &
                                        If(IsBlank(_room) || IsBlank(_room.Capacity), "", " · seats " & _room.Capacity) &
                                        If(IsBlank(_room) || IsBlank(_room.Classification) || _room.Classification = "", "", " · " & fnHtmlEscape(LookUp(ClassificationLevels, Code = _room.Classification).Label))
                                    )
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                  - bdmBtnClose:
                      Control: Classic/Button
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        BorderColor: =AppTheme.Border
                        BorderThickness: =0
                        Color: =AppTheme.TextSecondary
                        Fill: =RGBA(0,0,0,0) /* DS-EXEMPT Carbon ghost icon button, no resting fill */
                        FocusedBorderColor: =ColorValue(AppTheme.ButtonPrimary)
                        FocusedBorderThickness: =2
                        Font: ="IBM Plex Sans"
                        FontWeight: =FontWeight.Normal
                        HoverColor: =AppTheme.TextPrimary
                        HoverFill: =AppTheme.SurfaceAlt
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =// RESET-SITE[detail-modal-close] X dismiss clears confirm state before hiding
                          Set(gbl_UI_Detail_ConfirmMode, "");
                          Set(gbl_UI_Detail_Modal, false)
                        PressedColor: =AppTheme.TextPrimary
                        PressedFill: =AppTheme.Border
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =14
                        Text: ="✕"
                        Width: =40
            - bdmStatusRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.Surface
                  FillPortions: =0
                  Height: =36
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                  Visible: =!IsBlank(gblSelectedBooking)
                Children:
                  - bdmTag:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(
                              fnIsPast(gblSelectedBooking.EndDateTime), AppTheme.TextMuted,
                              gblSelectedBooking.Status = "Clash", AppTheme.StatusWarnText,
                              ColorValue(AppTheme.PrimaryText)
                          )
                        Fill: |-
                          =If(
                              fnIsPast(gblSelectedBooking.EndDateTime), AppTheme.Border,
                              gblSelectedBooking.Status = "Clash", AppTheme.StatusWarnBg,
                              ColorValue(AppTheme.ButtonPrimary)
                          )
                        Font: ="IBM Plex Sans"
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =11
                        Text: |-
                          =If(
                              fnIsPast(gblSelectedBooking.EndDateTime), "Past",
                              gblSelectedBooking.Status = "Clash", "Clash",
                              gblSelectedBooking.IsPermanent, "Permanent",
                              "Upcoming"
                          )
                        Width: =88
                        Wrap: =false
                  - bdmStartsIn:
                      Control: Label
                      Properties:
                        Color: =AppTheme.TextMuted
                        FillPortions: =1
                        Font: ="IBM Plex Sans"
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =11
                        Text: |-
                          =With(
                              {_mins: DateDiff(varNowTick, gblSelectedBooking.StartDateTime, TimeUnit.Minutes)},
                              If(
                                  _mins <= 0,
                                  "",
                                  "Starts in " &
                                  If(_mins >= 60, Int(_mins / 60) & "h ", "") &
                                  Mod(_mins, 60) & "m"
                              )
                          )
                        Visible: =!fnIsPast(gblSelectedBooking.EndDateTime)
                        Wrap: =false
            - bdmGrid:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.Surface
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =12
                  Visible: =!IsBlank(gblSelectedBooking)
                Children:
                  - bdmGridRow1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0,0,0,0) /* DS-EXEMPT transparent layout container, no painted surface */
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - bdmCellDate:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - htxBdmCellDate:
                                  Control: HtmlViewer
                                  Properties:
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =CarbonTextColored(CarbonHtmlType.Label01, "Date", AppThemeHex.TextMuted) &
                                      CarbonText(CarbonHtmlType.HeadingCompact01, Text(gblSelectedBooking.StartDateTime, "dddd dd mmmm yyyy"))
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                        - bdmCellTime:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - htxBdmCellTime:
                                  Control: HtmlViewer
                                  Properties:
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =CarbonTextColored(CarbonHtmlType.Label01, "Time", AppThemeHex.TextMuted) &
                                      CarbonText(CarbonHtmlType.HeadingCompact01, Text(gblSelectedBooking.StartDateTime, "HH:mm") & " – " & Text(gblSelectedBooking.EndDateTime, "HH:mm"))
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                  - bdmGridRow2:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0,0,0,0) /* DS-EXEMPT transparent layout container, no painted surface */
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - bdmCellDuration:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - htxBdmCellDuration:
                                  Control: HtmlViewer
                                  Properties:
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =CarbonTextColored(CarbonHtmlType.Label01, "Duration", AppThemeHex.TextMuted) &
                                      CarbonText(
                                          CarbonHtmlType.HeadingCompact01,
                                          With(
                                              {_mins: DateDiff(gblSelectedBooking.StartDateTime, gblSelectedBooking.EndDateTime, TimeUnit.Minutes)},
                                              If(
                                                  Mod(_mins, 60) = 0,
                                                  _mins / 60 & If(_mins = 60, " hour", " hours"),
                                                  _mins & " min"
                                              )
                                          )
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                        - bdmCellBy:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - htxBdmCellBy:
                                  Control: HtmlViewer
                                  Properties:
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =CarbonTextColored(CarbonHtmlType.Label01, "Booked by", AppThemeHex.TextMuted) &
                                      CarbonText(
                                          CarbonHtmlType.HeadingCompact01,
                                          fnHtmlEscape(
                                              If(
                                                  gblSelectedBooking.IsPermanent,
                                                  "Permanent booking",
                                                  /* private bookings stay masked here as they are in the grids - owner and admin see the organiser */
                                                  gblSelectedBooking.IsPrivate && !fnIsMine(gblSelectedBooking.BookedByEmail) && !IsAdmin,
                                                  "Private booking",
                                                  gblSelectedBooking.BookedBy.DisplayName
                                              )
                                          )
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                  - bdmGridRow3:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0,0,0,0) /* DS-EXEMPT transparent layout container, no painted surface */
                        FillPortions: =0
                        Height: =72
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - bdmCellRoom:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - htxBdmCellRoom:
                                  Control: HtmlViewer
                                  Properties:
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =CarbonTextColored(CarbonHtmlType.Label01, "Room", AppThemeHex.TextMuted) &
                                      CarbonText(CarbonHtmlType.HeadingCompact01, fnHtmlEscape(gblSelectedBooking.'RoomID: Title'.Value))
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                        - bdmCellSeries:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =!IsBlank(gblSelectedBooking.SeriesID)
                            Children:
                              - htxBdmCellSeries:
                                  Control: HtmlViewer
                                  Properties:
                                    AutoHeight: =true
                                    DisplayMode: =DisplayMode.View
                                    HtmlText: |-
                                      =CarbonTextColored(CarbonHtmlType.Label01, "Series", AppThemeHex.TextMuted) &
                                      CarbonText(CarbonHtmlType.HeadingCompact01, If(IsBlank(gblSelectedBooking.RecurrenceType), "Repeats", fnHtmlEscape(fnRuleLabel(gblSelectedBooking.RecurrenceType, gblSelectedBooking.StartDateTime))))
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
            - bdmFooter:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =AppTheme.Border
                  DropShadow: =DropShadow.None
                  Fill: =AppTheme.SurfaceAlt
                  FillPortions: =0
                  Height: =If(gbl_UI_Detail_ConfirmMode = "", 64, 124)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  Visible: |-
                    =!IsBlank(gblSelectedBooking) && !fnIsPast(gblSelectedBooking.EndDateTime) &&
                    (!gblSelectedBooking.IsPermanent || IsAdmin) &&
                    (fnIsMine(gblSelectedBooking.BookedByEmail) || IsAdmin)
                Children:
                  - bdmFooterActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0,0,0,0) /* DS-EXEMPT transparent layout container, no painted surface */
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =gbl_UI_Detail_ConfirmMode = ""
                      Children:
                        - bdmFooterLeft:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0) /* DS-EXEMPT transparent layout container, no painted surface */
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - bdmBtnCancelStart:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =0
                                    Color: =ColorValue(AppTheme.ButtonDangerPrimary)
                                    Fill: =RGBA(0,0,0,0) /* DS-EXEMPT Carbon danger-ghost button, no resting fill */
                                    FocusedBorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =ColorValue(AppTheme.ButtonDangerPrimary)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(
                                          gbl_UI_Detail_ConfirmMode,
                                          If(IsBlank(gblSelectedBooking.SeriesID), "confirm", "scope")
                                      )
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =ColorValue(AppTheme.ButtonDangerActive)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
                                    Text: ="Cancel booking"
                        - bdmFooterRight:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0) /* DS-EXEMPT transparent layout container, no painted surface */
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - bdmBtnChangeTime:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    BorderThickness: =1
                                    Color: =ColorValue(AppTheme.PrimaryText)
                                    Fill: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =ColorValue(AppTheme.PrimaryText)
                                    HoverFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varConflict, false);
                                      // RESET-SITE[detail-modal-change-time] wizard state reset before opening step 2 (times-only) or the edit-scope prompt
                                      Set(varBookingError, false);
                                      Set(varSubmitting, false);
                                      Set(varTitleTouched, false);
                                      Set(gbl_UI_Book_CancelConfirm, false);
                                      Set(gbl_Book_SubmitResult, "");
                                      Set(varConflictingBooking, Blank());
                                      Set(varNextFreeSlot, Blank());

                                      /* Times-only edit: no series controls in this flow.
                                         tglRecurring/drpWeeks live inside cpt_Modal_ and cannot be
                                         Reset() from here; that component resets them on close. */

                                      If(
                                          IsBlank(gblSelectedBooking.SeriesID),
                                          // Standalone booking: prefill the wizard from the booking being edited and hand off immediately
                                          Set(gblEditingBookingID, gblSelectedBooking.ID);
                                          Set(varSelectedRoom, LookUp(colRooms, ID = gblSelectedBooking.RoomID.Id));
                                          Set(varSelectedDate, DateValue(Text(gblSelectedBooking.StartDateTime, "yyyy-mm-dd")));
                                          Set(varStartTime, gblSelectedBooking.StartDateTime);
                                          Set(varEndTime, gblSelectedBooking.EndDateTime);
                                          Set(varTitle, gblSelectedBooking.Title);

                                          // RESET-SITE[detail-modal-close] close this modal before handing off to the wizard
                                          Set(gbl_UI_Detail_ConfirmMode, "");
                                          Set(gbl_UI_Detail_Modal, false);

                                          Set(gbl_UI_Book_Modal_Step, WizardStepWhen);
                                          Set(gbl_UI_Book_Modal, true),
                                          // Series member: ask which occurrences the new time applies to before opening the wizard (bdmEditScopeRow)
                                          Set(gbl_UI_Detail_ConfirmMode, "edit-scope")
                                      )
                                    PressedColor: =ColorValue(AppTheme.PrimaryText)
                                    PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
                                    Text: ="Change time"
                  - bdmConfirmRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =AppTheme.StatusBusyText
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.StatusBusyBg
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =gbl_UI_Detail_ConfirmMode = "confirm"
                      Children:
                        - bdmLblConfirm:
                            Control: Label
                            Properties:
                              AutoHeight: =true
                              Color: =AppTheme.StatusBusyText
                              Font: ="IBM Plex Sans"
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: ="Cancel this booking? This can't be undone."
                        - bdmConfirmButtons:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0) /* DS-EXEMPT transparent layout container, no painted surface */
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - bdmBtnKeep:
                                  Control: Classic/Button
                                  Properties:
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Fill: =AppTheme.Surface
                                    FocusedBorderColor: =ColorValue(AppTheme.ButtonPrimary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =AppTheme.TextPrimary
                                    HoverFill: =AppTheme.SurfaceAlt
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(gbl_UI_Detail_ConfirmMode, "")
                                    PressedColor: =AppTheme.TextPrimary
                                    PressedFill: =AppTheme.Border
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =11
                                    Text: ="Keep booking"
                                    Width: =150
                              - bdmBtnYesCancel:
                                  Control: Classic/Button
                                  Properties:
