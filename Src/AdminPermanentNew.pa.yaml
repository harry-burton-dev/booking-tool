Screens:
  AdminPermanentNew:
    Properties:
      Fill: =AppTheme.Background
      LoadingSpinnerColor: =ColorValue(AppTheme.Primary)
      OnHidden: |-
        =/* BOOK-4: leaving via the app header skips the in-screen back button, so the
           permanent-mode globals have to be restored on every exit route, not just that
           one. Mode alone is not enough: App.pa.yaml reads Freq/Interval/MonthMode/WD
           unconditionally (not under a gblRecurMode branch), so a stale frequency leaks
           into the next wizard booking. Restore the wizard defaults rather than blanking -
           blank values would yield a malformed RecurRule. AnchorStart/AnchorEnd/RoomId are
           read only under gblRecurMode = "permanent", so clearing the mode covers them. */
        Set(gblRecurWD, "");
        Set(gblRecurMode, "");
        Set(gblRecurFreq, "W");
        Set(gblRecurInterval, 1);
        Set(gblRecurMonthMode, "day")
      OnVisible: |-
        =/* Navigate() is illegal in OnVisible - non-admins are gated by apnConPage.Visible
           plus the IsAdmin-hidden Admin nav link instead. */
        Set(gblRecurMode, "permanent");
        /* Seed the recurrence anchors from the form controls exactly as the
           old in-tab "+ New permanent booking" toggle did. */
        Set(gblRecurRoomId, adBRDrpRoom.Selected.ID);
        Set(gblRecurAnchorStart, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpStartHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpStartMin.Selected.Value), TimeUnit.Minutes));
        Set(gblRecurAnchorEnd, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpEndHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpEndMin.Selected.Value), TimeUnit.Minutes))
    Children:
      - apnConShell:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - apnCptHeader:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - apnConBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - apnHtxNoAccess:
                      Control: HtmlViewer
                      Properties:
                        AutoHeight: =true
                        DisplayMode: =DisplayMode.View
                        HtmlText: =CarbonTextSecondary(CarbonHtmlType.Body01, "You need administrator access to view this page.")
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Visible: =!IsAdmin
                        Width: =Parent.Width - 64
                  - apnConPage:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =IsAdmin
                        Width: =Parent.Width
                      Children:
                        - apnConPageHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =72
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - apnConTitleStack:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - apnConBreadcrumb:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =16
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - apnHtxBreadcrumb:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                DisplayMode: =DisplayMode.View
                                                Height: =16
                                                HtmlText: |-
                                                  ="<div style=""display: flex; align-items: center; gap: 4px;"">" &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Home", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "/", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "Admin", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "/", AppThemeHex.TextMuted) &
                                                  CarbonSpan(CarbonHtmlType.Label01, "New permanent booking", AppThemeHex.TextSecondary) &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Width: =320
                                    - apnHtxPageTitle:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: =CarbonText(CarbonHtmlType.Heading04, "New permanent booking")
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                              - apnBtnBack:
                                  Control: Classic/Button
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Fill: =Color.Transparent
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    FontWeight: =FontWeight.Normal
                                    HoverColor: =AppTheme.TextPrimary
                                    HoverFill: =AppTheme.Border
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(gblRecurWD, "");
                                      Set(gblRecurMode, "");
                                      Navigate(Admin, ScreenTransition.None)
                                    PressedColor: =AppTheme.TextPrimary
                                    PressedFill: =AppTheme.Border
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =12
                                    Text: ="Back to Admin"
                                    Width: =140
                        - adBRConCreate:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.SurfaceAlt
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - adBRInpTitle:
                                  Control: Classic/TextInput
                                  Properties:
                                    AccessibleLabel: ="Series title"
                                    BorderColor: =AppTheme.Border
                                    BorderThickness: =1
                                    Color: =AppTheme.TextPrimary
                                    Default: =""
                                    Fill: =AppTheme.layer01Bg
                                    FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                    FocusedBorderThickness: =2
                                    Font: ="IBM Plex Sans"
                                    Height: =48
                                    HintText: ="Series title"
                                    HoverBorderColor: =AppTheme.TextSecondary
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =11
                                    Width: =Parent.Width
                              - adBRConCreateRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                                  Children:
                                    - adBRDrpRoom:
                                        Control: Classic/DropDown
                                        Properties:
                                          AccessibleLabel: ="Room"
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: =""
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          Items: =SortByColumns(colRooms, "Title", SortOrder.Ascending)
                                          Items.Value: =Title
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(gblRecurAnchorStart, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpStartHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpStartMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurAnchorEnd, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpEndHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpEndMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurRoomId, adBRDrpRoom.Selected.ID)
                                          Size: =11
                                          Width: =220
                                    - adBRDteFirst:
                                        Control: Classic/DatePicker
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          Color: =AppTheme.TextPrimary
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          IconBackground: =AppTheme.HeaderBackground
                                          IconFill: =AppTheme.HeaderAccent
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(gblRecurAnchorStart, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpStartHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpStartMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurAnchorEnd, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpEndHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpEndMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurRoomId, adBRDrpRoom.Selected.ID)
                                          Size: =11
                                          Width: =160
                              - adBRConTimeRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =48
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                                  Children:
                                    - adBRDrpStartHour:
                                        Control: Classic/DropDown
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: ="08"
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          Items: |-
                                            =ForAll(Sequence(DayEndHour - DayStartHour + 1, DayStartHour), {Value: Text(Value, "00")})
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(gblRecurAnchorStart, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpStartHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpStartMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurAnchorEnd, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpEndHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpEndMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurRoomId, adBRDrpRoom.Selected.ID)
                                          Size: =11
                                          Width: =90
                                    - adBRDrpStartMin:
                                        Control: Classic/DropDown
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: ="00"
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          Items: =["00","15","30","45"]
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(gblRecurAnchorStart, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpStartHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpStartMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurAnchorEnd, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpEndHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpEndMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurRoomId, adBRDrpRoom.Selected.ID)
                                          Size: =11
                                          Width: =90
                                    - adBRDrpEndHour:
                                        Control: Classic/DropDown
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: ="09"
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          Items: |-
                                            =ForAll(Sequence(DayEndHour - DayStartHour + 1, DayStartHour), {Value: Text(Value, "00")})
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(gblRecurAnchorStart, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpStartHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpStartMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurAnchorEnd, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpEndHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpEndMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurRoomId, adBRDrpRoom.Selected.ID)
                                          Size: =11
                                          Width: =90
                                    - adBRDrpEndMin:
                                        Control: Classic/DropDown
                                        Properties:
                                          BorderColor: =AppTheme.Border
                                          BorderThickness: =1
                                          ChevronBackground: =AppTheme.layer01Bg
                                          ChevronFill: =AppTheme.TextPrimary
                                          Color: =AppTheme.TextPrimary
                                          Default: ="00"
                                          Fill: =AppTheme.layer01Bg
                                          FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                          FocusedBorderThickness: =2
                                          Font: ="IBM Plex Sans"
                                          Height: =48
                                          Items: =["00","15","30","45"]
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(gblRecurAnchorStart, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpStartHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpStartMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurAnchorEnd, DateAdd(DateAdd(DateValue(Text(adBRDteFirst.SelectedDate, "yyyy-mm-dd")), Value(adBRDrpEndHour.Selected.Value) * 60, TimeUnit.Minutes), Value(adBRDrpEndMin.Selected.Value), TimeUnit.Minutes));
                                            Set(gblRecurRoomId, adBRDrpRoom.Selected.ID)
                                          Size: =11
                                          Width: =90
                              - adRecConPanel:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =236 + If(gblRecurFreq = "W", adRecConDays.Height + 8, 0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                                  Children:
                                    - adRecConCadence:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =Parent.Width
                                        Children:
                                          - adRecBtnDaily:
                                              Control: Classic/Button
                                              Properties:
                                                BorderColor: =If(gblRecurFreq = "D", ColorValue(AppTheme.ButtonPrimary), AppTheme.Border)
                                                BorderThickness: =1
                                                Color: =If(gblRecurFreq = "D", ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                                Fill: =If(gblRecurFreq = "D", ColorValue(AppTheme.ButtonPrimary), Color.Transparent)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =If(gblRecurFreq = "D", ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                                HoverFill: =If(gblRecurFreq = "D", ColorValue(AppTheme.ButtonPrimaryActive), AppTheme.SurfaceAlt)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Set(gblRecurFreq, "D")
                                                PressedColor: =ColorValue(AppTheme.PrimaryText)
                                                PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="Daily"
                                                Width: =110
                                          - adRecBtnWeekly:
                                              Control: Classic/Button
                                              Properties:
                                                BorderColor: =If(gblRecurFreq = "W", ColorValue(AppTheme.ButtonPrimary), AppTheme.Border)
                                                BorderThickness: =1
                                                Color: =If(gblRecurFreq = "W", ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                                Fill: =If(gblRecurFreq = "W", ColorValue(AppTheme.ButtonPrimary), Color.Transparent)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =If(gblRecurFreq = "W", ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                                HoverFill: =If(gblRecurFreq = "W", ColorValue(AppTheme.ButtonPrimaryActive), AppTheme.SurfaceAlt)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Set(gblRecurFreq, "W")
                                                PressedColor: =ColorValue(AppTheme.PrimaryText)
                                                PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="Weekly"
                                                Width: =110
                                          - adRecBtnMonthly:
                                              Control: Classic/Button
                                              Properties:
                                                BorderColor: =If(gblRecurFreq = "M", ColorValue(AppTheme.ButtonPrimary), AppTheme.Border)
                                                BorderThickness: =1
                                                Color: =If(gblRecurFreq = "M", ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                                Fill: =If(gblRecurFreq = "M", ColorValue(AppTheme.ButtonPrimary), Color.Transparent)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                HoverColor: =If(gblRecurFreq = "M", ColorValue(AppTheme.PrimaryText), AppTheme.TextPrimary)
                                                HoverFill: =If(gblRecurFreq = "M", ColorValue(AppTheme.ButtonPrimaryActive), AppTheme.SurfaceAlt)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Set(gblRecurFreq, "M")
                                                PressedColor: =ColorValue(AppTheme.PrimaryText)
                                                PressedFill: =ColorValue(AppTheme.ButtonPrimaryActive)
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="Monthly"
                                                Width: =110
                                    - adRecConInterval:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =Parent.Width
                                        Children:
                                          - adRecLblEvery:
                                              Control: Label
                                              Properties:
                                                Color: =AppTheme.TextSecondary
                                                Font: ="IBM Plex Sans"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =11
                                                Text: ="Every"
                                                Width: =50
                                          - adRecDrpInterval:
                                              Control: Classic/DropDown
                                              Properties:
                                                AccessibleLabel: ="Repeat interval"
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =1
                                                ChevronBackground: =AppTheme.layer01Bg
                                                ChevronFill: =AppTheme.TextPrimary
                                                Color: =AppTheme.TextPrimary
                                                Default: =Text(gblRecurInterval)
                                                Fill: =AppTheme.layer01Bg
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                Items: |-
                                                  =ForAll(Sequence(12, 1), {Value: Text(Value)})
                                                Items.Value: =Value
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: =Set(gblRecurInterval, Value(Self.Selected.Value))
                                                Size: =11
                                                Width: =90
                                          - adRecLblUnit:
                                              Control: Label
                                              Properties:
                                                Color: =AppTheme.TextSecondary
                                                Font: ="IBM Plex Sans"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =11
                                                Text: |-
                                                  =Switch(gblRecurFreq,
                                                      "D", "day(s) · weekdays only",
                                                      "W", "week(s)" & If(Len(RecurWD) > 1, "", " on " & Text(adBRDteFirst.SelectedDate, "[$-en-US]dddd")),
                                                      "month(s)")
                                                Width: =280
                                    - adRecConDays:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
