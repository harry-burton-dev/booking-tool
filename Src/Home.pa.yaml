                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Navigate(myBookings, ScreenTransition.Fade)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                PressedBorderColor: =RGBA(0,0,0,0)
                                                PressedColor: =ColorValue("#0f62fe")
                                                PressedFill: =RGBA(0,0,0,0)
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =12
                                                Text: ="View all"
                                                Width: =64
                                    - conNextContent:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =88
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =!IsBlank(varNextBookingRecord)
                                        Children:
                                          - lblNextRoom:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =AppTheme.TextPrimary
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =15
                                                Text: |-
                                                  =varNextBookingRecord.'RoomID: Title'.Value
                                                Wrap: =false
                                          - lblNextTime:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =ColorValue("#0f62fe")
                                                Font: =Font.Lato
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =12
                                                Text: =Text(varNextBookingRecord.StartDateTime, "HH:mm") & " - " & Text(varNextBookingRecord.EndDateTime, "HH:mm") & If(Text(varNextBookingRecord.StartDateTime, "yyyymmdd") = Text(Today(), "yyyymmdd"), " today", Text(varNextBookingRecord.StartDateTime, "yyyymmdd") = Text(DateAdd(Today(), 1, TimeUnit.Days), "yyyymmdd"), " tomorrow", " " & Text(varNextBookingRecord.StartDateTime, "ddd dd mmm"))
                                                Wrap: =false
                                          - lblNextTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =AppTheme.TextMuted
                                                Font: =Font.Lato
                                                Height: =18
