                                              Control: Label
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =AppTheme.TextPrimary
                                                Fill: =RGBA(0,0,0,0)
                                                FillPortions: =1
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Semibold
                                                Height: =24
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
