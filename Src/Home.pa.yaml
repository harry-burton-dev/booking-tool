Screens:
  Home:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =Set(varNowTick, Now())
    Children:
      - con_shell:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Shell_Header_:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - con_body_home:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - conHomeBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - conHDHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0)
                              FillPortions: =0
                              Height: =84
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conHDHeaderText:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - htxHDHeader:
                                        Control: HtmlViewer
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          DisplayMode: =DisplayMode.View
                                          HtmlText: |-
                                            =CarbonTextColored(CarbonHtmlType.Eyebrow, "AUSTIN HQ", AppThemeHex.TextSecondary) &
                                            CarbonText(
                                                CarbonHtmlType.Heading04,
                                                With(
                                                    {_greet: If(Hour(varNowTick) < 12, "Good morning", Hour(varNowTick) < 18, "Good afternoon", "Good evening")},
                                                    _greet & ", " & fnHtmlEscape(First(Split(User().FullName, " ")).Value)
                                                )
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                              - lblHDStatLine:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =ColorValue(AppTheme.Primary)
                                    Font: ="IBM Plex Sans"
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: |-
                                      =With(
                                          {
                                              _freeCount: FreeNowCount,
                                              _totalCount: CountRows(colRooms),
                                              _pctBooked: Round(Average(RoomOccupancyToday, Pct) * 100, 0)
                                          },
                                          Text(_freeCount, "[$-en-US]0") & " of " & Text(_totalCount, "[$-en-US]0") & " rooms free · " & Text(_pctBooked, "[$-en-US]0") & "% booked today"
                                      )
                                    Width: =340
                                    Wrap: =false
                        - conHDNavTiles:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.Border
                              FillPortions: =0
                              Height: =130
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =1
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =1
                              PaddingLeft: =1
                              PaddingRight: =1
                              PaddingTop: =1
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - conHDTileBook:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =ColorValue(AppTheme.Primary)
                                    Height: =128
                                    LayoutMinHeight: =128
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conHDTileBookContent:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =Parent.Height
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          PaddingBottom: =16
                                          PaddingLeft: =16
                                          PaddingRight: =16
                                          PaddingTop: =16
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.Width
                                        Children:
                                          - htxHDTileBook:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                HtmlText: |-
                                                  =CarbonTextColored(CarbonHtmlType.Heading02, "Book a room", AppThemeHex.PrimaryText) &
                                                  CarbonTextColored(CarbonHtmlType.Label01, "Start a new booking", AppThemeHex.PrimaryText)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                          - conHDTileBookSpacer:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                          - htxHDTileBookRow:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                HtmlText: |-
                                                  ="<div style=""display: flex; justify-content: space-between; align-items: center;"">" &
                                                  "<span style=""" & CarbonHtmlType.Label01 & " color: " & AppThemeHex.PrimaryText & ";"">Step 1 of 3</span>" &
                                                  "<span style=""" & CarbonHtmlType.Heading02 & " color: " & AppThemeHex.PrimaryText & ";"">→</span>" &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                    - btnHDTileBook:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0,0,0,0)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          FocusedBorderColor: =RGBA(15,98,254,1)
                                          FocusedBorderThickness: =2
                                          Height: =Parent.Height
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0.08)
                                          OnSelect: |-
                                            =Set(gbl_UI_Book_Modal_Step, WizardStep1);
                                            // RESET-SITE[home-book-tile] wizard state reset before opening step 1
                                            Set(varSelectedRoom, Blank());
                                            Set(varSelectedDate, Today());
                                            Set(varStartTime, Blank());
                                            Set(varEndTime, Blank());
                                            Set(varTitle, Blank());
                                            Set(varConflict, false);
                                            Set(varBookingError, false);
                                            Set(varSubmitting, false);
                                            Set(varTitleTouched, false);
                                            Set(gbl_UI_Book_CancelConfirm, false);
                                            Set(gbl_Book_SubmitResult, "");
                                            Set(varConflictingBooking, Blank());
                                            Set(varNextFreeSlot, Blank());
                                            Set(gblEditingBookingID, 0);

                                            With(
                                                {
                                                    _now: Now(),
                                                    _todayStart: DateAdd(Today(), DayStartHour * 60, TimeUnit.Minutes)
                                                },
                                                With(
                                                    {
                                                        _next: DateAdd(
                                                            _now,
                                                            Mod(
                                                                15 - Mod(
                                                                    DateDiff(_todayStart, _now, TimeUnit.Minutes),
                                                                    15
                                                                ),
                                                                15
                                                            ),
                                                            TimeUnit.Minutes
                                                        )
                                                    },
                                                    With(
                                                        {
                                                            _start: If(
                                                                _next < _todayStart,
                                                                _todayStart,
                                                                _next
                                                            )
                                                        },
                                                        If(
                                                            _start <= DateAdd(_todayStart, 540, TimeUnit.Minutes),
                                                            Set(varStartTime, _start);
                                                            Set(varEndTime, DateAdd(_start, 60, TimeUnit.Minutes))
                                                        )
                                                    )
                                                )
                                            );

                                            Set(gbl_UI_Book_Modal, true);
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0.15)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: ="Book a room — start a new booking"
                                          Width: =Parent.Width
                              - conHDTileView:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.Surface
                                    Height: =128
                                    LayoutMinHeight: =128
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conHDTileViewContent:
