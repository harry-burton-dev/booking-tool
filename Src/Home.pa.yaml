                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                HtmlText: |-
                                                  =CarbonText(CarbonHtmlType.Heading02, "My bookings") &
                                                  /* pre-escaped literal: old Label displayed the raw entity; do not fnHtmlEscape */
                                                  CarbonTextSecondary(CarbonHtmlType.Label01, "Upcoming &amp; past")
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
