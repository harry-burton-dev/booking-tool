Screens:
  Home:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: =Set(varNowTick, Now())
    Children:
      - con_shell:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Shell_Header_:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: =ShellIconSet
                  Width: =App.Width
            - con_body_home:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - conHomeBody:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingRight: =24
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - conActions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0)
                              FillPortions: =0
                              Height: =94
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - con_TileBook:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =72
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =220
                                  Children:
                                    - lbl_TitleTileBook:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="Book a room"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lbl_SubTileBook:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="Start a new booking"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - img_TileBook:
                                        Control: Image
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =72
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0)
                                          Image: =TileProperties("primary", lbl_TitleTileBook.Text, lbl_SubTileBook.Text, Self.Width, Self.Height, false, false, CarbonFontFamily, false)
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0)
                                          Width: =Parent.Width
                                    - btn_TileBook:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0,0,0,0)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          FocusedBorderColor: =RGBA(15,98,254,1)
                                          FocusedBorderThickness: =2
                                          Height: =72
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0.08)
                                          OnSelect: |-
                                            =Set(gbl_UI_Book_Modal_Step, WizardStep1);
                                            // RESET-SITE[home-book-tile] wizard state reset before opening step 1
                                            Set(varSelectedRoom, Blank());
                                            Set(varSelectedDate, Today());
                                            Set(varStartTime, Blank());
                                            Set(varEndTime, Blank());
                                            Set(varTitle, Blank());
                                            Set(varConflict, false);
                                            Set(varBookingError, false);
                                            Set(varSubmitting, false);
                                            Set(varTitleTouched, false);
                                            Set(gbl_UI_Book_CancelConfirm, false);
                                            Set(gbl_Book_SubmitResult, "");
                                            Set(varConflictingBooking, Blank());
                                            Set(varNextFreeSlot, Blank());
                                            Set(gblEditingBookingID, 0);

                                            ClearCollect(
                                                varAlternativeRooms,
                                                Filter(colRooms, true = false)
                                            );

                                            With(
                                                {
                                                    _now: Now(),
                                                    _todayStart: DateAdd(Today(), DayStartHour * 60, TimeUnit.Minutes)
                                                },
                                                With(
                                                    {
                                                        _next: DateAdd(
                                                            _now,
                                                            Mod(
                                                                15 - Mod(
                                                                    DateDiff(_todayStart, _now, TimeUnit.Minutes),
                                                                    15
                                                                ),
                                                                15
                                                            ),
                                                            TimeUnit.Minutes
                                                        )
                                                    },
                                                    With(
                                                        {
                                                            _start: If(
                                                                _next < _todayStart,
                                                                _todayStart,
                                                                _next
                                                            )
                                                        },
                                                        If(
                                                            _start <= DateAdd(_todayStart, 540, TimeUnit.Minutes),
                                                            Set(varStartTime, _start);
                                                            Set(varEndTime, DateAdd(_start, 60, TimeUnit.Minutes))
                                                        )
                                                    )
                                                )
                                            );

                                            Set(gbl_UI_Book_Modal, true);
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0.15)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: ="Book a room — start a new booking"
                                          Width: =Parent.Width
                              - con_TileView:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =72
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =220
                                  Children:
                                    - lbl_TitleTileView:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="View rooms"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lbl_SubTileView:
