                                          - htxHDTileMyRow:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                HtmlText: |-
                                                  ="<div style=""display: flex; justify-content: space-between; align-items: center;"">" &
                                                  "<span style=""" & CarbonHtmlType.Label01 & " color: " & AppThemeHex.TextMuted & ";"">" &
                                                  fnHtmlEscape(Text(HomeMyUpcomingCount, "[$-en-US]0") & " upcoming") &
                                                  "</span>" &
                                                  "<span style=""" & CarbonHtmlType.Heading02 & " color: " & AppThemeHex.TextSecondary & ";"">→</span>" &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
