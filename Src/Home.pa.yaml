                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =!IsBlank(NextBookingRecord)
                                        Children:
                                          - lblNextRoom:
                                              Control: Label
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                Color: =AppTheme.TextPrimary
                                                Font: =Font.Lato
                                                FontWeight: =FontWeight.Semibold
                                                Height: =22
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =15
                                                Text: |-
                                                  =NextBookingRecord.'RoomID: Title'.Value
                                                Wrap: =false
                                          - lblNextTime:
                                              Control: Label
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =ColorValue(AppTheme.ButtonPrimary)
                                                Font: =Font.Lato
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =12
                                                Text: =Text(NextBookingRecord.StartDateTime, "HH:mm") & " - " & Text(NextBookingRecord.EndDateTime, "HH:mm") & If(Text(NextBookingRecord.StartDateTime, "yyyymmdd") = Text(Today(), "yyyymmdd"), " today", Text(NextBookingRecord.StartDateTime, "yyyymmdd") = Text(DateAdd(Today(), 1, TimeUnit.Days), "yyyymmdd"), " tomorrow", " " & Text(NextBookingRecord.StartDateTime, "ddd dd mmm"))
                                                Wrap: =false
                                          - lblNextTitle:
                                              Control: Label
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =AppTheme.TextMuted
                                                Font: =Font.Lato
                                                Height: =18
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
