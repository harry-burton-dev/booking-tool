Screens:
  Home:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varHomeLoaded, false);
        Select(btnLoadHomeData);
    Children:
      - con_shell:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - Shell_Header_:
                Control: CanvasComponent
                ComponentName: Shell_Header
                Properties:
                  HeaderNavTab: ="Text"
                  Height: =48
                  InstanceScreenName: =""
                  ShellIcons: |-
                    ={
                        ShellIconMenu: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect x='2' y='4' width='16' height='2' fill='%23f4f4f4'/><rect x='2' y='9' width='16' height='2' fill='%23f4f4f4'/><rect x='2' y='14' width='16' height='2' fill='%23f4f4f4'/></svg>",
                        ShellIconClose: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><line x1='3' y1='3' x2='17' y2='17' stroke='%23f4f4f4' stroke-width='2'/><line x1='17' y1='3' x2='3' y2='17' stroke='%23f4f4f4' stroke-width='2'/></svg>",
                        ShellIconSearch: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='9' cy='9' r='6' fill='none' stroke='%23f4f4f4' stroke-width='2'/><line x1='13.5' y1='13.5' x2='17' y2='17' stroke='%23f4f4f4' stroke-width='2' stroke-linecap='round'/></svg>",
                        ShellIconNotification: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><path d='M10 2C7.24 2 5 4.24 5 7v7l-2 2h14l-2-2V7c0-2.76-2.24-5-5-5z' fill='%23f4f4f4'/><rect x='8.5' y='16' width='3' height='2.5' rx='1.5' fill='%23f4f4f4'/></svg>",
                        ShellIconAppSwitcher: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect x='2' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='2' width='4' height='4' fill='%23f4f4f4'/><rect x='2' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='8' width='4' height='4' fill='%23f4f4f4'/><rect x='2' y='14' width='4' height='4' fill='%23f4f4f4'/><rect x='8' y='14' width='4' height='4' fill='%23f4f4f4'/><rect x='14' y='14' width='4' height='4' fill='%23f4f4f4'/></svg>"
                    }
                  Width: =App.Width
            - con_body_home:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  Y: =48
                Children:
                  - conHomeBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =AppTheme.Background
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =24
                        PaddingRight: =24
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - btnLoadHomeData:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderColor: =RGBA(0,0,0,0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0,0,0,0)
                              DisabledBorderColor: =RGBA(0,0,0,0)
                              DisabledColor: =RGBA(0,0,0,0)
                              DisabledFill: =RGBA(0,0,0,0)
                              Fill: =RGBA(0,0,0,0)
                              FocusedBorderColor: =RGBA(0,0,0,0)
                              FocusedBorderThickness: =0
                              Height: =0
                              HoverBorderColor: =RGBA(0,0,0,0)
                              HoverColor: =RGBA(0,0,0,0)
                              HoverFill: =RGBA(0,0,0,0)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =ClearCollect(colTodayBookings,
                                    Sort(
                                        Filter(colBookings,
                                            StartDateTime >= Today(),
                                            StartDateTime < DateAdd(Today(), 1, TimeUnit.Days)
                                        ),
                                        StartDateTime,
                                        SortOrder.Ascending
                                    )
                                );
                                Set(varNextBookingRecord,
                                    First(
                                        Sort(
                                            Filter(colBookings,
                                                BookedBy.Email = User().Email &&
                                                EndDateTime > Now()
                                            ),
                                            StartDateTime,
                                            SortOrder.Ascending
                                        )
                                    )
                                );
                                Set(varHomeLoaded, true)
                              PressedBorderColor: =RGBA(0,0,0,0)
                              PressedColor: =RGBA(0,0,0,0)
                              PressedFill: =RGBA(0,0,0,0)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Text: =""
                              Visible: =false
                              Width: =0
                        - conActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(0,0,0,0)
                              FillPortions: =0
                              Height: =94
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - con_TileBook:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =72
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =220
                                  Children:
                                    - lbl_TitleTileBook:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="Book a room"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lbl_SubTileBook:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="Start a new booking"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - img_TileBook:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =72
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0)
                                          Image: =TileProperties("primary", lbl_TitleTileBook.Text, lbl_SubTileBook.Text, Self.Width, Self.Height, false, false, CarbonFontFamily, false)
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0)
                                          Width: =Parent.Width
                                    - btn_TileBook:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0,0,0,0)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          FocusedBorderColor: =RGBA(15,98,254,1)
                                          FocusedBorderThickness: =2
                                          Height: =72
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0.08)
                                          OnSelect: |-
                                            =Set(gbl_UI_Book_Modal_Step, "1");
                                            Set(varSelectedRoom, Blank());
                                            Set(varSelectedDate, Today());
                                            Set(varStartTime, Blank());
                                            Set(varEndTime, Blank());
                                            Set(varTitle, Blank());
                                            Set(varNotes, Blank());
                                            Set(varConflict, false);
                                            Set(varBookingError, false);
                                            Set(varSubmitting, false);
                                            Set(varConflictingBooking, Blank());
                                            Set(varNextFreeSlot, Blank());

                                            ClearCollect(
                                                varAlternativeRooms,
                                                Filter(colRooms, true = false)
                                            );

                                            With(
                                                {
                                                    _now: Now(),
                                                    _todayStart: DateAdd(Today(), 8 * 60, TimeUnit.Minutes)
                                                },
                                                With(
                                                    {
                                                        _next: DateAdd(
                                                            _now,
                                                            Mod(
                                                                15 - Mod(
                                                                    DateDiff(_todayStart, _now, TimeUnit.Minutes),
                                                                    15
                                                                ),
                                                                15
                                                            ),
                                                            TimeUnit.Minutes
                                                        )
                                                    },
                                                    With(
                                                        {
                                                            _start: If(
                                                                _next < _todayStart,
                                                                _todayStart,
                                                                _next
                                                            )
                                                        },
                                                        If(
                                                            _start <= DateAdd(_todayStart, 540, TimeUnit.Minutes),
                                                            Set(varStartTime, _start);
                                                            Set(varEndTime, DateAdd(_start, 60, TimeUnit.Minutes))
                                                        )
                                                    )
                                                )
                                            );

                                            Set(gbl_UI_Book_Modal, true);
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0.15)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: =""
                                          Width: =Parent.Width
                              - con_TileView:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =72
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =220
                                  Children:
                                    - lbl_TitleTileView:
