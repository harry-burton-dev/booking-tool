                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="View rooms"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lbl_SubTileView:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="Timelines &amp; availability"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - img_TileView:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =72
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0)
                                          Image: =TileProperties("secondary", lbl_TitleTileView.Text, lbl_SubTileView.Text, Self.Width, Self.Height, false, false, CarbonFontFamily, false)
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0)
                                          Width: =Parent.Width
                                    - btn_TileView:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0,0,0,0)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          FocusedBorderColor: =RGBA(15,98,254,1)
                                          FocusedBorderThickness: =2
                                          Height: =72
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0.04)
                                          OnSelect: =Navigate(Rooms, ScreenTransition.Fade)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0.08)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: =""
                                          Width: =Parent.Width
                              - con_TileMyBook:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(0,0,0,0)
                                    FillPortions: =0
                                    Height: =72
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =220
                                  Children:
                                    - lbl_TitleTileMyBook:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: ="My bookings"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lbl_SubTileMyBook:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Font: =Font.Lato
                                          Height: =Parent.Height
                                          Size: =12
                                          Text: =Text(CountRows(Filter(colBookings, BookedBy.Email = User().Email, EndDateTime >= Now())), "[$-en-US]0") & " upcoming"
                                          Visible: =false
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - img_TileMyBook:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =72
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0)
                                          Image: =TileProperties("secondary", lbl_TitleTileMyBook.Text, lbl_SubTileMyBook.Text, Self.Width, Self.Height, false, false, CarbonFontFamily, false)
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0)
                                          Width: =Parent.Width
                                    - btn_TileMyBook:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0,0,0,0)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          FocusedBorderColor: =RGBA(15,98,254,1)
                                          FocusedBorderThickness: =2
                                          Height: =72
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0.04)
