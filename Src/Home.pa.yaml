                                                BorderColor: =RGBA(0,0,0,0)
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =0
                                                Color: =ColorValue(AppTheme.ButtonPrimary)
                                                DisabledBorderColor: =RGBA(0,0,0,0)
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =RGBA(0,0,0,0)
                                                Fill: =RGBA(0,0,0,0)
                                                FocusedBorderColor: =ColorValue(AppTheme.Primary)
                                                FocusedBorderThickness: =2
                                                Font: ="IBM Plex Sans"
                                                FontWeight: =FontWeight.Normal
                                                Height: =24
                                                HoverBorderColor: =RGBA(0,0,0,0)
                                                HoverColor: =ColorValue("#0043ce")
                                                HoverFill: =RGBA(0,0,0,0)
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Set(gblUI_Nav_currentTab, "Bookings"); Navigate(myBookings, ScreenTransition.Fade)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                PressedBorderColor: =RGBA(0,0,0,0)
                                                PressedColor: =ColorValue(AppTheme.ButtonPrimary)
                                                PressedFill: =RGBA(0,0,0,0)
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =14
                                                Text: ="View all"
                                                Width: =64
                                    - conHDNextBody:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0,0,0,0)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =6
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =!IsBlank(NextBookingRecord)
                                        Children:
                                          - htxHDNextStatus:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                HtmlText: |-
                                                  =/* Dot + status share the old labels' conditional color logic 1:1:
                                                     dot Primary/TextMuted, text Primary/TextSecondary on in-progress. */
                                                  With(
                                                      {_active: NextBookingRecord.StartDateTime <= varNowTick && NextBookingRecord.EndDateTime > varNowTick},
                                                      "<div style=""display: flex; align-items: center; gap: 4px;"">" &
                                                      "<span style=""display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: " &
                                                      If(_active, AppThemeHex.Primary, AppThemeHex.TextMuted) &
                                                      ";""></span>" &
                                                      "<span style=""" & CarbonHtmlType.Label01 & " color: " &
                                                      If(_active, AppThemeHex.Primary, AppThemeHex.TextSecondary) &
                                                      ";"">" &
                                                      fnHtmlEscape(
                                                          If(
                                                              _active,
                                                              "In progress",
                                                              With(
                                                                  {_m: DateDiff(varNowTick, NextBookingRecord.StartDateTime, TimeUnit.Minutes)},
                                                                  If(
                                                                      _m <= 0,
                                                                      "Starting now",
                                                                      _m < 60,
                                                                      "In " & _m & "m",
                                                                      _m < 1440,
                                                                      "In " & RoundDown(_m / 60, 0) & "h " & Mod(_m, 60) & "m",
                                                                      "In " & RoundDown(_m / 1440, 0) & " days"
                                                                  )
