                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.Width
                                        Children:
                                          - htxHDTileView:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                HtmlText: |-
                                                  =CarbonText(CarbonHtmlType.Heading02, "View rooms") &
                                                  /* pre-escaped literal: old Label displayed the raw entity; do not fnHtmlEscape */
                                                  CarbonTextSecondary(CarbonHtmlType.Label01, "Timelines &amp; availability")
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                          - conHDTileViewSpacer:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                          - htxHDTileViewRow:
                                              Control: HtmlViewer
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                DisplayMode: =DisplayMode.View
                                                HtmlText: |-
                                                  ="<div style=""display: flex; justify-content: space-between; align-items: center;"">" &
                                                  "<span style=""" & CarbonHtmlType.Label01 & " color: " & AppThemeHex.TextMuted & ";"">" &
                                                  fnHtmlEscape(Text(FreeNowCount, "[$-en-US]0") & " free now") &
                                                  "</span>" &
                                                  "<span style=""" & CarbonHtmlType.Heading02 & " color: " & AppThemeHex.TextSecondary & ";"">→</span>" &
                                                  "</div>"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                    - btnHDTileView:
                                        Control: Classic/Button
                                        Properties:
                                          BorderColor: =RGBA(0,0,0,0)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =0
                                          Color: =RGBA(0,0,0,0)
                                          DisabledBorderColor: =RGBA(0,0,0,0)
                                          DisabledColor: =RGBA(0,0,0,0)
                                          DisabledFill: =RGBA(0,0,0,0)
                                          Fill: =RGBA(0,0,0,0)
                                          FocusedBorderColor: =RGBA(15,98,254,1)
                                          FocusedBorderThickness: =2
                                          Height: =Parent.Height
                                          HoverBorderColor: =RGBA(0,0,0,0)
                                          HoverColor: =RGBA(0,0,0,0)
                                          HoverFill: =RGBA(0,0,0,0.04)
                                          OnSelect: =Set(gblUI_Nav_currentTab, "Rooms"); Navigate(Rooms, ScreenTransition.Fade)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          PressedBorderColor: =RGBA(0,0,0,0)
                                          PressedColor: =RGBA(0,0,0,0)
                                          PressedFill: =RGBA(0,0,0,0.08)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: ="View rooms — timelines and availability"
                                          Width: =Parent.Width
                              - conHDTileMy:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.Surface
                                    Height: =128
                                    LayoutMinHeight: =128
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - conHDTileMyContent:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(0,0,0,0)
                                          Height: =Parent.Height
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          PaddingBottom: =16
                                          PaddingLeft: =16
                                          PaddingRight: =16
                                          PaddingTop: =16
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.Width
                                        Children:
