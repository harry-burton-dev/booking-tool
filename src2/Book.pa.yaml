Screens:
  Book:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =UpdateContext({
            varStep: 1,
            varSelectedRoom: Blank(),
            varSelectedDate: Today(),
            varStartTime: Blank(),
            varEndTime: Blank(),
            varTitle: Blank(),
            varNotes: Blank(),
            varConflict: false,
            varBookingError: false,
            varSubmitting: false,
            varConflictingBooking: Blank(),
            varNextFreeSlot: Blank()
        });
        ClearCollect(varAlternativeRooms, Filter(colRooms, 1 = 0));
        With(
            { _now: Now(), _todayStart: DateAdd(Today(), 8 * 60, TimeUnit.Minutes) },
            With(
                { _next: DateAdd(_now, Mod(15 - Mod(DateDiff(_todayStart, _now, TimeUnit.Minutes), 15), 15), TimeUnit.Minutes) },
                With(
                    { _start: If(_next < _todayStart, _todayStart, _next) },
                    If(_start <= DateAdd(_todayStart, 540, TimeUnit.Minutes),
                        UpdateContext({ varStartTime: _start, varEndTime: DateAdd(_start, 60, TimeUnit.Minutes) })
                    )
                )
            )
        )
    Children:
      - con_shell_book:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_body_book:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =Parent.Height - 48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =32
                  Width: =Parent.Width
                  X: =0
                  Y: =48
                Children:
                  - conRoot:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =AppTheme.Border
                        BorderThickness: =1
                        DropShadow: =DropShadow.Regular
                        Fill: =AppTheme.Surface
                        Height: =Min(Parent.Height, 640)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Width: =Min(Parent.Width, 560)
                      Children:
                        - lblFormHeader:
                            Control: Label
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =AppTheme.TextPrimary
                              Font: =Font.Lato
                              FontWeight: =FontWeight.Semibold
                              Height: =48
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =16
                              PaddingTop: =14
                              Size: =18
                              Text: ="New booking"
                              Wrap: =false
                        - conProgressBar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =AppTheme.Border
                              DropShadow: =DropShadow.None
                              Fill: =AppTheme.Background
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =32
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =false
                            Children:
                              - galStepPills_1:
                                  Control: Gallery
                                  Variant: Horizontal
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DelayItemLoading: =false
                                    FillPortions: =0
                                    Height: =56
                                    Items: |-
                                      =Table(
                                          {StepNum: 1, StepLabel: "Room", StepID: 1},
                                          {StepNum: 2, StepLabel: "Date and Time", StepID: 2},
                                          {StepNum: 3, StepLabel: "Confirm", StepID: 3}
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TemplatePadding: =0
                                    TemplateSize: =160
                                  Children:
                                    - conPillTemplate_1:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =Parent.TemplateHeight
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - lblStepLabel:
                                              Control: Label
                                              Properties:
                                                Color: =If(varStep = ThisItem.StepID, AppTheme.TextPrimary, AppTheme.TextMuted)
                                                Font: =Font.Lato
                                                FontWeight: =If(varStep = ThisItem.StepID, FontWeight.Semibold, FontWeight.Normal)
                                                Height: =24
                                                Size: =10
                                                Text: =ThisItem.StepLabel
                                                Width: =136
                                                X: =24
                                                Y: =10
                                          - Rectangle2:
                                              Control: Rectangle
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =2
                                                DisabledFill: =RGBA(161, 159, 157, 1)
                                                Fill: |-
                                                  =If(varStep >= ThisItem.StepID, 
                                                        RGBA(15, 98, 254, 1), 
                                                        ColorValue(AppTheme.ButtonDisabled))
                                                FocusedBorderThickness: =4
                                                Height: =2
                                                HoverFill: =RGBA(0, 120, 212, 1)
                                                PressedFill: =RGBA(0, 120, 212, 1)
                                                Width: =160
                                                Y: =2
                                          - Image1:
                                              Control: Image
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =2
                                                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                DisabledFill: =RGBA(0, 0, 0, 0)
                                                FocusedBorderThickness: =4
                                                Height: =24
                                                HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                Image: "=\"data:image/svg+xml;utf8, \" & EncodeUrl(\r\n    If(\r\n        varStep > ThisItem.StepID,\r\n        /* COMPLETED: Filled Blue with Checkmark */\r\n        \"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>\r\n            <circle cx='16' cy='16' r='14' fill='#0f62fe' />\r\n            <path d='M14 21.4l-5.4-5.4 1.4-1.4 4 4 8.6-8.6 1.4 1.4z' fill='white'/>\r\n        </svg>\",\r\n        \r\n        varStep = ThisItem.StepID,\r\n        /* IN PROGRESS: Half-filled / Focused Circle */\r\n        \"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>\r\n            <circle cx='16' cy='16' r='14' stroke='#0f62fe' stroke-width='3' fill='none' />\r\n            <circle cx='16' cy='16' r='8' fill='#0f62fe' />\r\n        </svg>\",\r\n        \r\n        /* TO GO: Empty Grey Circle */\r\n        \"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>\r\n            <circle cx='16' cy='16' r='14' stroke='#8d8d8d' stroke-width='2' fill='none' />\r\n        </svg>\"\r\n    )\r\n)"
                                                PressedBorderColor: =RGBA(0, 0, 0, 0)
                                                PressedFill: =RGBA(0, 0, 0, 0)
                                                Width: =24
                                                Y: =10
                        - conStepBody:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =1
                              Fill: =AppTheme.Background
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowY: =LayoutOverflow.Scroll
                            Children:
                              - conStep1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =AppTheme.Background
                                    Height: =16 + lbl_textStep1_chooseRoom.Height + 12 + galRooms.Height + 16
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    Visible: =true
                                  Children:
                                    - lbl_textStep1_chooseRoom:
                                        Control: Label
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =AppTheme.SideNavText
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Bold
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =14
                                          Text: ="Choose a Room"
                                          Wrap: =false
                                    - galRooms:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          DelayItemLoading: =false
                                          Height: =Self.AllItemsCount * Self.TemplateHeight
                                          Items: =colRooms
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          ShowScrollbar: =false
                                          TemplatePadding: =0
                                          TemplateSize: =160
                                          WrapCount: =6
                                        Children:
                                          - con_tile:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =Parent.TemplateHeight
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - lbl_textItemTitle:
                                                    Control: Label
                                                    Properties:
                                                      BorderColor: =RGBA(0, 0, 0, 0)
                                                      BorderStyle: =BorderStyle.None
                                                      BorderThickness: =2
                                                      Color: =AppTheme.layer01Bg
                                                      DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                      DisabledColor: =RGBA(161, 159, 157, 1)
                                                      FocusedBorderThickness: =4
                                                      Font: =Font.Lato
                                                      Text: =ThisItem.Title
                                                      Visible: =false
                                                      Width: =200
                                                - img_tile:
                                                    Control: Image
                                                    Properties:
                                                      BorderColor: =AppTheme.FocusedBorder
                                                      DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                      DisabledFill: =RGBA(0, 0, 0, 0)
                                                      FocusedBorderColor: =Color.Transparent
                                                      FocusedBorderThickness: =4
                                                      Height: =Parent.Height
                                                      HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                      HoverFill: =
                                                      Image: |-
                                                        =With(
                                                            { 
                                                                _tileTitle: lbl_textItemTitle.Text,
                                                                _tileSubtitle: "Description text here", 
                                                                _isActive: If(varSelectedRoom.RoomID = ThisItem.RoomID, true, false)
                                                            },
                                                            TileProperties(
                                                                "primary",
                                                                _tileTitle, 
                                                                _tileSubtitle,
                                                                Self.Width, 
                                                                Self.Height,
                                                                _isActive,
                                                                false, 
                                                                CarbonFontFamily,
                                                                false
                                                            )
                                                        )
                                                      OnSelect: =Set(glbPressed, !glbPressed)
                                                      PressedBorderColor: =RGBA(0, 0, 0, 0)
                                                      PressedFill: =RGBA(0, 0, 0, 0)
                                                      TabIndex: =0
                                                      Width: =Parent.Width
                                                - btn_tile:
                                                    Control: Classic/Button
                                                    Properties:
                                                      BorderColor: =RGBA(0, 0, 0, 0)
                                                      BorderStyle: =BorderStyle.None
                                                      BorderThickness: =0
                                                      Color: =RGBA(255, 255, 255, 1)
                                                      DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                      DisabledColor: =RGBA(161, 159, 157, 1)
                                                      DisabledFill: =RGBA(242, 242, 241, 0)
                                                      Fill: =RGBA(0, 0, 0, 0)
                                                      FocusedBorderColor: =Color.Red
                                                      Font: =Font.Lato
                                                      Height: =Parent.Height
                                                      HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                      HoverColor: =RGBA(255, 255, 255, 1)
                                                      HoverFill: =AppTheme.ButtonPrimaryHover
                                                      OnSelect: |-
                                                        =UpdateContext({varSelectedRoom: ThisItem})
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      PressedBorderColor: =RGBA(0, 69, 120, 1)
                                                      PressedColor: =RGBA(255, 255, 255, 1)
                                                      PressedFill: =AppTheme.ButtonPrimaryPressed
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      TabIndex: =-1
                                                      Text: =""
                                                      Width: =Parent.Width
                              - conStep2:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: '=16 + lbl_textStep2_chooseDate.Height + 12 + con_DateRow.Height + conTimeRow.Height + 8 + lblStep2Hint.Height + If(varConflict, 12 + conConflictPanel.Height, 0) + 16 '
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    Visible: =true
                                  Children:
                                    - lbl_textStep2_chooseDate:
                                        Control: Label
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =AppTheme.SideNavText
                                          Font: =Font.Lato
                                          FontWeight: =FontWeight.Bold
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =14
                                          Text: ="Choose a Date and Time"
                                          Wrap: =false
                                          X: =40
                                          Y: =40
                                    - con_DateRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =16
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - dtpBookingDate:
                                              Control: Classic/DatePicker
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =AppTheme.Border
                                                BorderThickness: =0
                                                Color: =AppTheme.SideNavText
                                                DefaultDate: =varSelectedDate
                                                DisabledColor: =AppTheme.TextMuted
                                                DisabledFill: =AppTheme.SurfaceAlt
                                                Fill: =AppTheme.layer01Bg
                                                FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                                FocusedBorderThickness: =2
                                                Font: =Font.Lato
                                                IconBackground: =AppTheme.HeaderBackground
                                                IconFill: =AppTheme.HeaderAccent
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: |-
                                                  =UpdateContext({varSelectedDate: dtpBookingDate.SelectedDate, varStartTime: Blank(), varEndTime: Blank(), varConflict: false})
                                                Size: =11
                                    - conTimeRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =lbl_textStartTimeLabel.Height + 44 + 6
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =16
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - conStartTimeField:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =lbl_textStartTimeLabel.Height + 44 + 6
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =6
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingLeft: =2
                                                PaddingRight: =2
                                              Children:
                                                - lbl_textStartTimeLabel:
                                                    Control: Label
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =AppTheme.SideNavText
                                                      Font: =Font.Lato
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =11
                                                      Text: ="Start time"
                                                      Wrap: =false
                                                - drpStartTime:
                                                    Control: Classic/DropDown
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      BorderColor: =AppTheme.Border
                                                      BorderThickness: =0
                                                      ChevronBackground: =AppTheme.HeaderBackground
                                                      ChevronFill: =AppTheme.HeaderAccent
                                                      Color: =AppTheme.SideNavText
                                                      DisabledBorderColor: =AppTheme.SurfaceAlt
                                                      DisabledColor: =AppTheme.TextMuted
                                                      DisabledFill: =AppTheme.SurfaceAlt
                                                      Fill: =AppTheme.layer01Bg
                                                      FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                                      FocusedBorderThickness: =2
                                                      Font: =Font.Lato
                                                      HoverBorderColor: =AppTheme.TextSecondary
                                                      HoverColor: =AppTheme.TextPrimary
                                                      HoverFill: =AppTheme.SurfaceAlt
                                                      Items: |-
                                                        =Filter(
                                                            ForAll(
                                                                Sequence(41),
                                                                {
                                                                    display: Text(DateAdd(DateTimeValue("1900-01-01 08:00:00"), (Value - 1) * 15, TimeUnit.Minutes), "HH:mm"),
                                                                    value: DateAdd(DateTime(Year(varSelectedDate), Month(varSelectedDate), Day(varSelectedDate), 8, 0, 0), (Value - 1) * 15, TimeUnit.Minutes)
                                                                }
                                                            ),
                                                            value > Now()
                                                        )
                                                      Default: =If(IsBlank(varStartTime), "", Text(varStartTime, "HH:mm"))
                                                      Items.Value: =display
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnChange: |-
                                                        =UpdateContext({varStartTime: drpStartTime.Selected.value});
                                                        UpdateContext({
                                                            varConflict: !IsEmpty(Filter(RoomBookings, RoomID.Value = varSelectedRoom.RoomID, StartDateTime < varEndTime, EndDateTime > varStartTime)),
                                                            varConflictingBooking: LookUp(RoomBookings, RoomID.Value = varSelectedRoom.RoomID && StartDateTime < varEndTime && EndDateTime > varStartTime),
                                                            varNextFreeSlot: LookUp(RoomBookings, RoomID.Value = varSelectedRoom.RoomID && StartDateTime >= varStartTime, EndDateTime)
                                                        });
                                                        ClearCollect(colOverlappingBookings,
                                                            Filter(RoomBookings, StartDateTime < varEndTime && EndDateTime > varStartTime)
                                                        );
                                                        ClearCollect(varAlternativeRooms,
                                                            Filter(colRooms,
                                                                RoomID <> varSelectedRoom.RoomID &&
                                                                IsEmpty(Filter(colOverlappingBookings, RoomID.Id = ThisRecord.ID))
                                                            )
                                                        );
                                                      PressedColor: =AppTheme.TextPrimary
                                                      PressedFill: =AppTheme.SurfaceAlt
                                                      Size: =11
                                          - conEndTimeField:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =lbl_textEndTimeLabel.Height + 44 + 6
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =6
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingLeft: =2
                                                PaddingRight: =2
                                              Children:
                                                - lbl_textEndTimeLabel:
                                                    Control: Label
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      AutoHeight: =true
                                                      Color: =AppTheme.SideNavText
                                                      Font: =Font.Lato
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =11
                                                      Text: ="End time"
                                                      Wrap: =false
                                                - drpEndTime:
                                                    Control: Classic/DropDown
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      BorderColor: =AppTheme.Border
                                                      BorderThickness: =0
                                                      ChevronBackground: =AppTheme.HeaderBackground
                                                      ChevronFill: =AppTheme.HeaderAccent
                                                      Color: =AppTheme.SideNavText
                                                      DisabledBorderColor: =AppTheme.SurfaceAlt
                                                      DisabledColor: =AppTheme.TextMuted
                                                      DisabledFill: =AppTheme.SurfaceAlt
                                                      Fill: =AppTheme.layer01Bg
                                                      FocusedBorderColor: =RGBA(15, 98, 254, 1)
                                                      FocusedBorderThickness: =2
                                                      Font: =Font.Lato
                                                      HoverBorderColor: =AppTheme.TextSecondary
                                                      HoverColor: =AppTheme.TextPrimary
                                                      HoverFill: =AppTheme.SurfaceAlt
                                                      Items: |-
                                                        =Filter(
                                                            ForAll(
                                                                Sequence(41),
                                                                {
                                                                    display: Text(DateAdd(DateTimeValue("1900-01-01 08:00:00"), (Value - 1) * 15, TimeUnit.Minutes), "HH:mm"),
                                                                    value: DateAdd(DateTime(Year(varSelectedDate), Month(varSelectedDate), Day(varSelectedDate), 8, 0, 0), (Value - 1) * 15, TimeUnit.Minutes)
                                                                }
                                                            ),
                                                            value > varStartTime
                                                        )
                                                      Default: =If(IsBlank(varEndTime), "", Text(varEndTime, "HH:mm"))
                                                      Items.Value: =display
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnChange: |-
                                                        =UpdateContext({varEndTime: drpEndTime.Selected.value});
                                                        UpdateContext({
                                                            varConflict: !IsEmpty(Filter(RoomBookings, RoomID.Value = varSelectedRoom.RoomID, StartDateTime < varEndTime, EndDateTime > varStartTime)),
                                                            varConflictingBooking: LookUp(RoomBookings, RoomID.Value = varSelectedRoom.RoomID && StartDateTime < varEndTime && EndDateTime > varStartTime),
                                                            varNextFreeSlot: LookUp(RoomBookings, RoomID.Value = varSelectedRoom.RoomID && StartDateTime >= varStartTime, EndDateTime)
                                                        });
                                                        ClearCollect(colOverlappingBookings,
                                                            Filter(RoomBookings, StartDateTime < varEndTime && EndDateTime > varStartTime)
                                                        );
                                                        ClearCollect(varAlternativeRooms,
                                                            Filter(colRooms,
                                                                RoomID <> varSelectedRoom.RoomID &&
                                                                IsEmpty(Filter(colOverlappingBookings, RoomID.Id = ThisRecord.ID))
                                                            )
                                                        );
                                                      PressedColor: =AppTheme.TextPrimary
                                                      PressedFill: =AppTheme.SurfaceAlt
                                                      Size: =11
                                    - lblStep2Hint:
                                        Control: Label
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =AppTheme.TextMuted
                                          Font: =Font.Lato
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =11
                                          Text: =If(IsBlank(varStartTime) || IsBlank(varEndTime), "Select a start and end time to continue.", "")
                                          Wrap: =false
                                    - conConflictPanel:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =RGBA(250, 77, 86, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =AppTheme.Background
                                          FillPortions: =0
                                          Height: =16 + conConflictHeader.Height + 12 + lbl_textTimelineLabel.Height + 12 + galConflictTimeline.Height + 12 + lbl_textAlternativeRoomsTime.Height + 12 + If(IsEmpty(varAlternativeRooms), lbl_textNoRoomsAvailable.Height, galAlternativeRooms.Height) + 12 + conConflictActions.Height + 16
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =12
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =16
                                          PaddingLeft: =16
                                          PaddingRight: =16
                                          PaddingTop: =16
                                          RadiusBottomLeft: =2
                                          RadiusBottomRight: =2
                                          RadiusTopLeft: =2
                                          RadiusTopRight: =2
                                          Visible: =varConflict
                                        Children:
                                          - conConflictHeader:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =64
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =10
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                              Children:
                                                - icoAlert:
                                                    Control: Image
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      Height: =32
                                                      Image: ="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23FA4D56' d='M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z'/%3E%3C/svg%3E"
